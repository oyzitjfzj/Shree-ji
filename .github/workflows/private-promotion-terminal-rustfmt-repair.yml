name: Private promotion terminal rustfmt repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-terminal-rustfmt-repair.yml"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 50b0506237036c5098f9b032347c2c4dc379de23b488526d7e1b9ddd3e9ecb77

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1024 origin '+refs/heads/*:refs/remotes/origin/*'
          resolved=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git rev-list --all --max-count=16384 | sort -u)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth resolved
          echo "LAS_PROMOTION_TERMINAL_FMT_RECOVERY=PASS"

      - name: Install pinned rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup component add --toolchain 1.98.1-x86_64-unknown-linux-gnu rustfmt >/dev/null
          cargo +1.98.1 fmt --version >/dev/null
          echo "LAS_PROMOTION_TERMINAL_FMT_RUSTFMT=PASS"

      - name: Produce encrypted rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          cargo +1.98.1 fmt --all
          git diff --binary --no-ext-diff > "$RUNNER_TEMP/repair.patch"
          test -s "$RUNNER_TEMP/repair.patch"
          echo "LAS_PROMOTION_TERMINAL_FMT_PATCH_SHA256=$(sha256sum "$RUNNER_TEMP/repair.patch" | awk '{print $1}')"

          cat > "$RUNNER_TEMP/repair-public.pem" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApR3lp3RPQ3xZI2omh8l0
          WGfbOZfcKMbHChQp+Q+WGk/ui7hG6tc8ttG30/3Q+z0K3xnJw1+/kF8Sqd2lO9UQ
          MblLPnmyr/VHgM2qxSjgV5liroIgdo7rrrXI7zXu2oDHO0v+bEb54eM/S8mL2nbM
          xuUcfuFFfhKt2jwQ0jfdu/2na+vdDfoufFfRyfK17k4a7L9kbqOX1C8V16uCGPi/
          tNgRjfkOLLsKArG2qG46ObT0SSFn3uDcRa20mY0NOXBp7XUnsmFsa/tgXFUKNkE0
          ZjmpzNagk/9T16jVR+7ie2nMcOFxKAs3ea/okDU6uKVfka6TBd/ptHayTOeZxEm5
          l9oZuIZMHgkX8aCUR5RyBByzZ0UnVvkyDt5w9pYfhlaFeXcsaG5R4wEjywZ9eGVv
          Mjcq+OALLl8arIIRFo/O+4aS04Ds+vviBmmvPfwNMtB+eWB6OWylFiCkuPypb1Y4
          4oyzRdoOodkIo7O6CiDYzr9GoqKFX8TmiZhEFwIfLmKfAgMBAAE=
          -----END PUBLIC KEY-----
          EOF

          openssl rand -hex 32 > "$RUNNER_TEMP/repair-key.hex"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/repair.patch" \
            -out "$RUNNER_TEMP/repair.patch.enc" \
            -pass file:"$RUNNER_TEMP/repair-key.hex"
          openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/repair-public.pem" \
            -in "$RUNNER_TEMP/repair-key.hex" \
            -out "$RUNNER_TEMP/repair-key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          rm -f "$RUNNER_TEMP/repair.patch" "$RUNNER_TEMP/repair-key.hex" "$RUNNER_TEMP/repair-public.pem"
          echo "LAS_PROMOTION_TERMINAL_FMT_ENCRYPTED=PASS"

      - name: Upload encrypted repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: promotion-terminal-rustfmt-repair-encrypted
          path: |
            ${{ runner.temp }}/repair.patch.enc
            ${{ runner.temp }}/repair-key.enc
          if-no-files-found: error
          retention-days: 1
