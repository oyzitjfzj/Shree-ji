name: Private ephemeral format export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ephemeral-format-export.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: c865ed2a85f2265cdac67a6910ac74a6864bd89564ae523318fa22adaff6a625
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: e4d82dc87717da010906520f766a2e2d58c846b5097cf6e87c25f66daf454eac
  EPHEMERAL_CERT_B64: 

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_EPHEMERAL_FORMAT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth matched_ref matched_sha actual
      - name: Format exact private source and encrypt changed files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          changed="$RUNNER_TEMP/changed"
          git diff --name-only > "$changed"
          test -s "$changed"
          while IFS= read -r path; do
            case "$path" in *.rs) ;; *) exit 2 ;; esac
            path_hash="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            blob_hash="$(git hash-object "$path")"
            echo "LAS_EPHEMERAL_FORMAT_BLOB=$path_hash:$blob_hash"
          done < "$changed"
          tar -czf "$RUNNER_TEMP/formatted-private.tar.gz" -T "$changed"
          printf '%s' "$EPHEMERAL_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$RUNNER_TEMP/formatted-private.tar.gz"             -out "$RUNNER_TEMP/formatted-private.cms"             "$RUNNER_TEMP/cert.pem"
          echo "LAS_EPHEMERAL_FORMAT_CHANGED_COUNT=$(wc -l < "$changed" | tr -d ' ')"
          echo "LAS_EPHEMERAL_FORMAT_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted-private.cms" | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/formatted-private.tar.gz" "$RUNNER_TEMP/cert.pem" "$changed"
      - name: Upload encrypted formatted private source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-ephemeral-formatted-private
          path: ${{ runner.temp }}/formatted-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
