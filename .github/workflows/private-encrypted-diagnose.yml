name: Encrypted private diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RUN_ENCRYPTED_DIAG"

permissions:
  contents: read

concurrency:
  group: encrypted-private-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin refs/heads/work/assurance-core >"$checkout_log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 0
          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          git checkout -q -B verify-target "$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          echo "LAS_EXACT_RUST_READY=YES"

      - name: Build encrypted diagnostic bundle
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bundle="$RUNNER_TEMP/private-diagnostic-bundle"
          mkdir -p "$bundle"

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          rm -rf "$ALR_PREFIX"
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-workspace"
          rm -rf "$ALR_WS"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null
            alr with gnatprove=16.1.0 >/dev/null
          )

          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec alr exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"

          PROOF_DIR="$RUNNER_TEMP/root-authority-instances"
          mkdir -p "$PROOF_DIR/obj"
          cat > "$PROOF_DIR/root_authority_proof_instances.ads" <<'EOF_PROOF'
          pragma SPARK_Mode (On);
          with Root_Authority;

          package Root_Authority_Proof_Instances is
             package Capacity_1   is new Root_Authority (Max_Grants => 1);
             package Capacity_2   is new Root_Authority (Max_Grants => 2);
             package Capacity_16  is new Root_Authority (Max_Grants => 16);
             package Capacity_256 is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Proof_Instances;
          EOF_PROOF
          cat > "$PROOF_DIR/root_authority_proof.gpr" <<EOF_PROOF_GPR
          project Root_Authority_Proof is
             for Source_Dirs use
               ("$GITHUB_WORKSPACE/target/src/root_authority", "$PROOF_DIR");
             for Object_Dir use "$PROOF_DIR/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Root_Authority_Proof;
          EOF_PROOF_GPR

          set +e
          RUSTFLAGS="-Dwarnings" GPRBUILD="$GPRBUILD_WRAPPER" \
            cargo +1.98.1 check --locked --features root-ffi --all-targets >"$bundle/root-ffi-check.log" 2>&1
          root_ffi_rc=$?
          (
            cd "$ALR_WS"
            alr exec -- gnatprove \
              -P"$PROOF_DIR/root_authority_proof.gpr" \
              -U --mode=all --level=4 --proof=progressive:all \
              --checks-as-errors=on --proof-warnings=on --report=statistics \
              --warnings=error --pedantic -j2
          ) >"$bundle/spark.log" 2>&1
          spark_rc=$?
          ffi_dir="$RUNNER_TEMP/root-authority-ffi"
          mkdir -p "$ffi_dir"
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p \
              -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
              -XROOT_FFI_BUILD_DIR="$ffi_dir"
          ) >"$bundle/abi-build.log" 2>&1
          abi_rc=$?

          ffi_o0_dir="$RUNNER_TEMP/root-authority-ffi-o0"
          ffi_o1_dir="$RUNNER_TEMP/root-authority-ffi-o1"
          ffi_o2_dir="$RUNNER_TEMP/root-authority-ffi-o2"
          mkdir -p "$ffi_o0_dir" "$ffi_o1_dir" "$ffi_o2_dir"
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p \
              -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
              -XROOT_FFI_BUILD_DIR="$ffi_o0_dir" \
              -cargs:Ada -O0
          ) >"$bundle/abi-o0.log" 2>&1
          abi_o0_rc=$?
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p \
              -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
              -XROOT_FFI_BUILD_DIR="$ffi_o1_dir" \
              -cargs:Ada -O1
          ) >"$bundle/abi-o1.log" 2>&1
          abi_o1_rc=$?
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p \
              -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
              -XROOT_FFI_BUILD_DIR="$ffi_o2_dir" \
              -cargs:Ada -O2
          ) >"$bundle/abi-o2.log" 2>&1
          abi_o2_rc=$?

          alt15_select_rc=0
          alt15_init_rc=125
          alt15_rc=125
          alr -n toolchain --select gnat_native=15.2.1 gprbuild=25.0.1 >"$bundle/alt15-select.log" 2>&1
          alt15_select_rc=$?
          if [[ "$alt15_select_rc" -eq 0 ]]; then
            ALT15_WS="$RUNNER_TEMP/alire-alt15-workspace"
            rm -rf "$ALT15_WS"
            mkdir -p "$ALT15_WS"
            (
              cd "$ALT15_WS"
              alr -n init --in-place --no-skel --lib las_alt15_toolchain >/dev/null
            ) >"$bundle/alt15-init.log" 2>&1
            alt15_init_rc=$?
            if [[ "$alt15_init_rc" -eq 0 ]]; then
              (
                cd "$ALT15_WS"
                alr exec -- gcc -dumpfullversion
              ) >"$bundle/alt15-version.log" 2>&1
              ffi_alt15_dir="$RUNNER_TEMP/root-authority-ffi-alt15"
              mkdir -p "$ffi_alt15_dir"
              (
                cd "$ALT15_WS"
                alr exec -- gprbuild -p \
                  -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
                  -XROOT_FFI_BUILD_DIR="$ffi_alt15_dir"
              ) >"$bundle/abi-alt15.log" 2>&1
              alt15_rc=$?
            fi
          fi
          set -e

          printf '%s\n' "$root_ffi_rc" > "$bundle/root-ffi-check.rc"
          printf '%s\n' "$spark_rc" > "$bundle/spark.rc"
          printf '%s\n' "$abi_rc" > "$bundle/abi-build.rc"
          printf '%s\n' "$abi_o0_rc" > "$bundle/abi-o0.rc"
          printf '%s\n' "$abi_o1_rc" > "$bundle/abi-o1.rc"
          printf '%s\n' "$abi_o2_rc" > "$bundle/abi-o2.rc"
          printf '%s\n' "$alt15_select_rc" > "$bundle/alt15-select.rc"
          printf '%s\n' "$alt15_init_rc" > "$bundle/alt15-init.rc"
          printf '%s\n' "$alt15_rc" > "$bundle/abi-alt15.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_DIAG_ROOT_FFI_RC=$root_ffi_rc"
          echo "LAS_DIAG_SPARK_RC=$spark_rc"
          echo "LAS_DIAG_ABI_RC=$abi_rc"
          echo "LAS_DIAG_ABI_O0_RC=$abi_o0_rc"
          echo "LAS_DIAG_ABI_O1_RC=$abi_o1_rc"
          echo "LAS_DIAG_ABI_O2_RC=$abi_o2_rc"
          echo "LAS_DIAG_ALT15_SELECT_RC=$alt15_select_rc"
          echo "LAS_DIAG_ALT15_INIT_RC=$alt15_init_rc"
          echo "LAS_DIAG_ABI_ALT15_RC=$alt15_rc"
          if [[ -f "$bundle/alt15-version.log" ]]; then
            echo "LAS_DIAG_ALT15_VERSION=$(tr -d '\r\n' < "$bundle/alt15-version.log")"
          fi
          if [[ -f "$bundle/abi-alt15.log" ]] && grep -q "GNAT BUG DETECTED" "$bundle/abi-alt15.log"; then
            echo "LAS_DIAG_ABI_ALT15_ICE=YES"
          else
            echo "LAS_DIAG_ABI_ALT15_ICE=NO"
          fi
          for opt in o0 o1 o2; do
            if grep -q "GNAT BUG DETECTED" "$bundle/abi-$opt.log"; then
              echo "LAS_DIAG_ABI_${opt^^}_ICE=YES"
            else
              echo "LAS_DIAG_ABI_${opt^^}_ICE=NO"
            fi
          done

          tar -C "$bundle" -czf "$RUNNER_TEMP/private-diagnostic.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEYTCCAsmgAwIBAgIUV6Vm/i5plHfEjXm4TQ+ZoJMi88UwDQYJKoZIhvcNAQEL
          BQAwQDE+MDwGA1UEAww1TEFTIGVwaGVtZXJhbCBkaWFnbm9zdGljIHJlY2lwaWVu
          dCAyMDI2LTA5LTIwIHJlZnJlc2gwHhcNMjYwOTIwMDA1NjEzWhcNMjYwOTIyMDA1
          NjEzWjBAMT4wPAYDVQQDDDVMQVMgZXBoZW1lcmFsIGRpYWdub3N0aWMgcmVjaXBp
          ZW50IDIwMjYtMDktMjAgcmVmcmVzaDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCC
          AYoCggGBANR7j+GAM2f+PsvymYVSmg0F6/A820PVJUu7gG8Z3U7tVOiEe0+/qYRr
          qU6YoYrsNtfD3fqRDMgaU1hC3Eu5xP/4XIdsijqWV9FFWbEH0ryHgU3wI5dCaypG
          Y45h76G5F1vSgGmfc4zZGJMNwHyfJ5cWZvKQ8ueOaX0TseFz25URxvRQZFh+9SIr
          s9O9n1RQnPQkY/yP/oAQKyFyUeEnUaFxEczGyFcTLBTR3eizK9pnewCTORuaMIFL
          8na8uM8XQv+xefQdz5qkbHoVjlptjGzMHDOX14NN83AnzFgEu4b/mD7ksqacEIaL
          WIlD+vX+nC/t1AmC65kwC87M8KwOJhOlG6JAIWGYqsQzfNLhTqi2mBG7tazg+pZr
          fxfyrVpd1fKmAE9GPWPYgqD9+tVDEKi3WPqAkuORWd9DkJPlNydUaILHY55aFe4x
          +b932vDT/+jw6TAuZ3YZSCXcAgUOH39gAvIRsnIDuLLqNYUSfZyRFFbtEDKNms3s
          KyceYEqtDwIDAQABo1MwUTAdBgNVHQ4EFgQU7bo/JzZUtmSLG6yxHyADOb8Y2ZYw
          HwYDVR0jBBgwFoAU7bo/JzZUtmSLG6yxHyADOb8Y2ZYwDwYDVR0TAQH/BAUwAwEB
          /zANBgkqhkiG9w0BAQsFAAOCAYEAnSW1gyizzI5L61m7FD+2CgAxn3H31yeBLG/J
          O9Ya0gTEcy9qro3sdNJgx+yJy7c7BpKG5m68NkcQ+PHXLsI0+dCBFZHQIFEl6Z++
          C0RzBlmfq5jIHuxrFxGqz4Xj0zaXyHltxz/rCdIQ0p2wqaeso4+ZOEWZ20JqEOAV
          Yo5fuk0qvJkhbIRHU/AfvVfWeQuSZyhpM3tHdh9kIduIFVF0NFqxRZMhEuFRHoTS
          1wL3Wm5Q7Dia6PGbRks8A1J9rC5ywvRLmjlpVXwKS0VbQl50dV4fJqtIqGpKjxmt
          0rRTDAcHucUDXTDe2+mowRgGbYovjUHi92iDOvLVw8eUUOdnNsYU91BB9y+TTZH7
          Uo6bL9eUnHlhZ1MJlplIUgMwLzA4xcXuyQy6hNcl57E9ajNYcopQLjAfP7zUwYrE
          4QPBqs3khXHOj4CbiXba9RS9eeZW/lAXQHJh9VhuWoHFhmu59GRPTydwFB5XD88s
          Qu8XPWUVTVuVMuK8xrK7Za/WIWzV
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "32:C4:61:D9:B9:83:3A:16:CE:BB:DB:C1:1C:F3:8D:E9:D4:3E:30:E5:5C:18:E9:7B:FC:DA:35:CA:82:47:F5:9C"
          echo "LAS_DIAG_CERT_FINGERPRINT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -in "$RUNNER_TEMP/private-diagnostic.tgz" \
            -out "$RUNNER_TEMP/encrypted.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"

          rm -rf "$bundle" "$RUNNER_TEMP/private-diagnostic.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_ENCRYPTED_DIAGNOSTIC_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-diagnostic
          path: ${{ runner.temp }}/encrypted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
