-----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "C6:8F:16:BB:32:47:3D:2C:B7:9B:75:20:1F:F0:C4:8A:18:54:CC:70:94:0E:9D:05:3F:70:D5:99:BD:A0:7D:57"
          echo "LAS_DIAG_CERT_FINGERPRINT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -in "$RUNNER_TEMP/private-diagnostic.tgz" \
            -out "$RUNNER_TEMP/encrypted.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"

          rm -rf "$bundle" "$RUNNER_TEMP/private-diagnostic.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_ENCRYPTED_DIAGNOSTIC_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-diagnostic
          path: ${{ runner.temp }}/encrypted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
