name: Private promotion guarded terminal handoff Clippy repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-guarded-terminal-handoff-clippy-repair.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: d87ef3a547b8b8557a03701294477f54e3693775914299cf622c1896f68c1823
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 63595c6b67e63f83ff8612b7d7223f00c69061883c6f352337279b7527528297

jobs:
  repair-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Recover exact private branch
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          test -z "$(git status --porcelain)"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/matched-ref"
          printf '%s' "$start_sha" >"$RUNNER_TEMP/start-sha"
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_RECOVERY=PASS"

      - name: Apply ownership-preserving Clippy contract
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/effect_fabric/root_guarded_reconciliation_evidence.rs')
          text = path.read_text()
          marker = 'pub(crate) fn classify_guarded_terminal_handoff<const RECOVERIES: usize, const CONSUMED: usize>(\n'
          assert text.count(marker) == 1, 'classification function marker must be unique'
          attribute = '''#[expect(\n    clippy::result_large_err,\n    reason = "bounded failure preserves the unique Armed transaction and terminal handoff without heap indirection"\n)]\n'''
          assert attribute not in text, 'repair attribute already present unexpectedly'
          path.write_text(text.replace(marker, attribute + marker, 1))
          PY
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/effect_fabric/root_guarded_reconciliation_evidence.rs"
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_ALLOWLIST=PASS"

      - name: Install pinned Rust quality tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

      - name: Require formatting clean
        shell: bash
        run: |
          set -euo pipefail
          cd target
          cargo +1.98.1 fmt --all -- --check
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_FORMAT=PASS"

      - name: Require targeted terminal handoff semantics
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd target
          cargo +1.98.1 test --locked --lib promotion_activation_guarded_terminal_handoff_tests -- --test-threads=1
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_TARGETED=PASS"

      - name: Require full library regression
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd target
          cargo +1.98.1 test --locked --lib -- --test-threads=1
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_FULL_LIB=PASS"

      - name: Require strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd target
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_CLIPPY=PASS"

      - name: Commit and guarded fast-forward push
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd target
          matched_ref="$(cat "$RUNNER_TEMP/matched-ref")"
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/effect_fabric/root_guarded_reconciliation_evidence.rs"
          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git add -- src/effect_fabric/root_guarded_reconciliation_evidence.rs
          git diff --cached --quiet && exit 1
          git commit -q -m "Document bounded guarded terminal handoff failure ownership"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$write_auth"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"
          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$post_sha" = "$new_sha"
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_PUSH=PASS"
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_NEW_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_GUARDED_TERMINAL_CLIPPY_REPAIR_NEW_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
