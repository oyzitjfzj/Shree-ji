name: Private promotion journal genesis format baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-journal-genesis-format-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 0fbcb3544f51ec9835c5dfeb0deb6aef9e69478bc31d94e952faf939df308b78
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 3234660d7e9150da4927257eface0caac4e5f331f73453faaf4568e45ed0ea33

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add rustfmt --toolchain 1.98.1

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_JOURNAL_GENESIS_FORMAT_BASELINE_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"

      - name: Check exact Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1; then
            echo 'LAS_PROMOTION_JOURNAL_GENESIS_FORMAT_BASELINE=PASS'
          else
            echo 'LAS_PROMOTION_JOURNAL_GENESIS_FORMAT_BASELINE=DRIFT'
            exit 1
          fi
