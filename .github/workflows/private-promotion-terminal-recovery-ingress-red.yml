name: Private promotion terminal recovery ingress RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-terminal-recovery-ingress-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 74614352c9630c2dad269313ac30d5654c5ebad56d404eae9456a006d2f08a9a
  EXPECTED_HEAD_PROOF: db6ba56dacf40ea76163c9657dc9e74db056d0fc5cd0d72c7b6464dc9cbef1f8
  EXPECTED_TREE_PROOF: 0221bd96dd092e0952bbea0bdd754810beb24144d1255073e139568eb8ce1084
  EXPECTED_ERROR_PATH_HASH: 30a6a63e0689d64474c34d390f356563e50d08767a98d40cb7fcc842d13a4026
  EXPECTED_SYMBOL: recover_guarded_terminal_stable_acknowledgement

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null

      - name: Recover exact private RED revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref start_sha tree
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_INGRESS_RED_RECOVERY=PASS"

      - name: Require exact recovery-authority RED
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/target"
          cd "$root"
          cargo_json="$RUNNER_TEMP/promotion-terminal-recovery-ingress-red.jsonl"
          set +e
          cargo +1.98.1 check --locked --lib --tests --message-format=json >"$cargo_json" 2>/dev/null
          rc=$?
          set -e
          test "$rc" -ne 0

          python3 - "$cargo_json" "$root" <<'PY'
          import hashlib, json, os, sys

          log_path, root = sys.argv[1], os.path.realpath(sys.argv[2])
          errors = []
          for raw in open(log_path, encoding="utf-8", errors="replace"):
              try:
                  obj = json.loads(raw)
              except Exception:
                  continue
              if obj.get("reason") != "compiler-message":
                  continue
              msg = obj.get("message") or {}
              if msg.get("level") != "error":
                  continue
              code = (msg.get("code") or {}).get("code") or "NO_CODE"
              text = f"{msg.get('message') or ''}\n{msg.get('rendered') or ''}"
              spans = [s for s in (msg.get("spans") or []) if s.get("is_primary")]
              for span in spans or [{}]:
                  filename = str(span.get("file_name") or "")
                  absolute = os.path.realpath(os.path.join(root, filename)) if filename else ""
                  rel = os.path.relpath(absolute, root).replace(os.sep, "/") if absolute else "NO_SPAN"
                  errors.append((
                      code,
                      hashlib.sha256(rel.encode()).hexdigest(),
                      os.environ["EXPECTED_SYMBOL"] in text,
                  ))

          expected = ("E0061", os.environ["EXPECTED_ERROR_PATH_HASH"], True)
          if errors != [expected]:
              raise SystemExit(f"unexpected sanitized RED diagnostics: {sorted(set(errors))}; count={len(errors)}")
          print("LAS_PROMOTION_TERMINAL_RECOVERY_WITHOUT_LIVE_INGRESS_EXPECTED_RED=OBSERVED")
          PY
          rm -f "$cargo_json"
