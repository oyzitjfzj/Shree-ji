name: Private Root FFI Linux delta classify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-root-ffi-linux-delta-classify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust and Ada build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Classify exact patched warning delta
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root" && cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "1f3f0bc4884665569948224427b6ba42ce02d4e447b4e099e044202a9133a111" ]]; then
              matched_ref="$ref"; start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "19cef6692548f861bc149dec46450018aa46fce917be5ae5f9aced837e64ef0b"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          python3 tools/tmp_apply_root_ffi_production_backend.py
          rm tools/tmp_apply_root_ffi_production_backend.py
          cargo +1.98.1 fmt --all
          json="$RUNNER_TEMP/patched.jsonl"
          set +e
          RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --lib --features root-ffi,linux-peer-credentials --message-format=json >"$json" 2>/dev/null
          rc=$?
          set -e
          test "$rc" -ne 0
          python3 - "$json" <<'PY'
          import json, sys
          candidates = [
              "RootFfiControlBackend",
              "AuthenticatedRootBoundary",
              "BoundarySeal",
              "RawGrantReference",
              "RawDispatch",
              "RootGrant",
              "RootAdapter",
              "RequirementTag",
              "Ingress",
              "from_authenticated_root",
              "from_authenticated_root_with_liveness",
              "build",
          ]
          hits={name:0 for name in candidates}
          errors=0
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try: obj=json.loads(raw)
              except Exception: continue
              if obj.get("reason")!="compiler-message": continue
              msg=obj.get("message") or {}
              if msg.get("level")!="error": continue
              errors += 1
              text=f"{msg.get('message') or ''}\n{msg.get('rendered') or ''}"
              for name in candidates:
                  if name in text:
                      hits[name]+=1
          print(f"LAS_ROOT_FFI_PATCHED_DEAD_ERROR_COUNT={errors}")
          print(f"LAS_ROOT_FFI_PATCHED_CANDIDATE_HITS={hits}")
          PY
          rm -f "$json"
