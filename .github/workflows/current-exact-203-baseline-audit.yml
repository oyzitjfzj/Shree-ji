name: Current exact 203 baseline audit

on:
  push:
    branches:
      - hardening/resumable-runner-identity-20261007
    paths:
      - "tools/audit_current_exact_203_baseline.py"
      - ".github/workflows/current-exact-203-baseline-audit.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Audit exact canonical 203 baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/audit_current_exact_203_baseline.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
