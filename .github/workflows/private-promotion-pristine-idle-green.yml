name: Private promotion pristine Idle durability GREEN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-pristine-idle-green.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 20b4967e64d331ea8849725b4b038cbbdf41671c49e3cfc9d13d7471d839385e
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 3eaddf9caab3e1f9f3d0c93c1c8969b16f36fec71eb5dc300563a44521ebd9c7
  EXPECTED_VERIFIER_BLOB: 1db6896e9b5b29e124b222eb958b1cb1274606e5
  VERIFIER: tools/verify_promotion_transaction_pristine_idle_green.sh

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object "$VERIFIER")" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_PRISTINE_IDLE_GREEN_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Execute exact private GREEN verifier and publish only sanitized result
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          out="$RUNNER_TEMP/promotion-pristine-idle-green.out"
          set +e
          bash "$VERIFIER" >"$out" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            stage="$(grep -E '^LAS_PROMOTION_PRISTINE_IDLE_GREEN_STAGE=(FORMAT|TEST)$' "$out" | head -n 1 || true)"
            if [[ -n "$stage" ]]; then echo "$stage"; fi
            if [[ "$stage" == 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_STAGE=FORMAT' ]]; then
              grep -E '^LAS_PROMOTION_PRISTINE_IDLE_FORMAT_(IMPLEMENTATION|TEST)_(CHANGED=[01]|HUNKS=(NONE|[0-9:,>]+))$' "$out" || true
            fi
            rm -f "$out"
            echo 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_BRIDGE=VERIFIER_FAILED'
            exit 1
          fi
          grep -Fxq 'LAS_PROMOTION_PRISTINE_IDLE_GREEN=OBSERVED' "$out"
          grep -Fxq 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_TESTS=5' "$out"
          grep -Fxq 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_ZERO_IDENTITY_GUARD=OBSERVED' "$out"
          rm -f "$out"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_PROMOTION_PRISTINE_IDLE_GREEN=OBSERVED'
          echo 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_TESTS=5'
          echo 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_ZERO_IDENTITY_GUARD=OBSERVED'
          echo 'LAS_PROMOTION_PRISTINE_IDLE_GREEN_BRIDGE=PASS'
