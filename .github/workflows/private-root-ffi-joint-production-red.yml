name: Private Root FFI joint production composition RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-root-ffi-joint-production-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 0a64d318b3f3a175381c45f559bebbd168cc98d9343fae298890a4f3c4017e5c
  EXPECTED_HEAD_PROOF: 55d9c883e0d4492e7006c3f2c5f28b4729411b9ce2c89ae8d7b9f26153b3414f
  EXPECTED_TREE_PROOF: 60954fdf22fb4b94e53587c1c760f6edaac64d353660a69a85201a4124d8edf7
  EXPECTED_ERROR_PATH_HASH: 5dfcf85b09a9f80cfa38872c2ab5ae0288dce2d66ad648dde249c4bc71965745

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private RED opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$start_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"; git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref start_sha tree
          echo "LAS_ROOT_FFI_JOINT_PRODUCTION_RED_RECOVERY=PASS"

      - name: Require exact production-reachability RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          json="$RUNNER_TEMP/root-ffi-joint-red.jsonl"
          set +e
          RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --lib --features root-ffi,linux-peer-credentials --message-format=json >"$json" 2>/dev/null
          rc=$?
          set -e
          test "$rc" -ne 0
          python3 - "$json" "$GITHUB_WORKSPACE/target" <<'PY'
          import hashlib, json, os, sys
          log_path, root = sys.argv[1], os.path.realpath(sys.argv[2])
          errors=[]
          for raw in open(log_path, encoding='utf-8', errors='replace'):
              try: obj=json.loads(raw)
              except Exception: continue
              if obj.get('reason')!='compiler-message': continue
              msg=obj.get('message') or {}
              if msg.get('level')!='error': continue
              code=(msg.get('code') or {}).get('code') or 'NO_CODE'
              text=f"{msg.get('message') or ''}\n{msg.get('rendered') or ''}"
              spans=[s for s in (msg.get('spans') or []) if s.get('is_primary')]
              for span in spans or [{}]:
                  filename=str(span.get('file_name') or '')
                  absolute=os.path.realpath(os.path.join(root, filename)) if filename else ''
                  rel=os.path.relpath(absolute, root).replace(os.sep,'/') if absolute else 'NO_SPAN'
                  errors.append((code, hashlib.sha256(rel.encode()).hexdigest(), 'RootFfiControlBackend' in text))
          expected=('E0432', os.environ['EXPECTED_ERROR_PATH_HASH'], True)
          if errors != [expected]:
              raise SystemExit(f'unexpected sanitized RED diagnostics: {errors}')
          print('LAS_ROOT_FFI_JOINT_PRODUCTION_BACKEND_EXPECTED_RED=OBSERVED')
          PY
          rm -f "$json"
