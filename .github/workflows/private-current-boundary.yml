name: Private current-boundary verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_CURRENT_BOUNDARY"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Load opaque verification request
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_CURRENT_BOUNDARY
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_CURRENT_BOUNDARY)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_CURRENT_BOUNDARY)"
          expect="$(awk -F= '$1=="EXPECT"{print $2}' RUN_CURRENT_BOUNDARY)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expect" == "PASS" || "$expect" == "FAIL" ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"
          echo "EXPECTED_OUTCOME=$expect" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          actual_proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$actual_proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_BOUNDARY_SNAPSHOT_PROOF=$actual_proof"
          unset PRIVATE_TOKEN auth matched_sha matched_ref actual

      - name: Run exact private boundary verifier
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/private-boundary.log"
          set +e
          bash tools/verify_current_boundary.sh >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_BOUNDARY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_BOUNDARY_RC=$rc"
          stage="$(grep '^LAS_CURRENT_BOUNDARY_STAGE=' "$log" | tail -n 1 | cut -d= -f2 || true)"
          case "$stage" in
            rustfmt|cargo_check|session_tests|plan_tests|auth_test|system_f_tests|formal|clean_tree) ;;
            *) stage="unknown" ;;
          esac
          echo "LAS_BOUNDARY_LAST_STAGE=$stage"
          if [[ "$stage" == "rustfmt" && "$rc" -ne 0 ]]; then
            while IFS= read -r fmt_line; do
              spec="${fmt_line#Diff in }"
              spec="${spec%:}"
              line_no="${spec##*:}"
              abs_path="${spec%:*}"
              rel_path="${abs_path#"$RUNNER_TEMP/private-target/"}"
              path_hash="$(printf '%s' "$rel_path" | sha256sum | awk '{print $1}')"
              echo "LAS_BOUNDARY_FMT_LOC=$path_hash:$line_no"
            done < <(grep -E '^Diff in .*:[0-9]+:$' "$log" || true)
          fi

          if [[ "$EXPECTED_OUTCOME" == "FAIL" ]]; then
            if [[ "$rc" -eq 0 ]]; then
              echo "LAS_BOUNDARY_EXPECTED_RED=NOT_OBSERVED"
              rm -f "$log"
              exit 1
            fi
            echo "LAS_BOUNDARY_EXPECTED_RED=OBSERVED"
            rm -f "$log"
            exit 0
          fi

          if [[ "$rc" -ne 0 ]]; then
            echo "LAS_BOUNDARY_RESULT=FAIL"
            rm -f "$log"
            exit 1
          fi
          echo "LAS_BOUNDARY_RESULT=PASS"
          rm -f "$log"
