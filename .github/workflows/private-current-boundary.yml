name: Private current boundary verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_CURRENT_BOUNDARY"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4b61125df9c7f746eb8465644c659d4c1e0819a35550dd642a076251ced364ae
  DIAG_CERT_PEM_B64: 
  RECIPIENT_CERT_FINGERPRINT: "55:16:6C:62:2D:06:4E:A7:CA:32:01:85:4B:11:7A:FA:35:39:4F:38:8C:1C:DD:BD:28:46:71:39:E8:2D:67:AC"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact private engineering snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth"             fetch -q --depth=1 origin refs/heads/tmp/selector-execution-20260924
          git checkout -q --detach FETCH_HEAD

          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CURRENT_BOUNDARY_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run exact private current-boundary verifier
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          LOG="$RUNNER_TEMP/current-boundary-private.log"
          : > "$LOG"

          set +e
          (
            cd "$ROOT"
            bash tools/verify_current_boundary.sh
          ) >"$LOG" 2>&1
          rc=$?
          set -e

          printf '%s\n' "$rc" > "$RUNNER_TEMP/current-boundary.rc"
          echo "LAS_CURRENT_BOUNDARY_LOG_SHA256=$(sha256sum "$LOG" | awk '{print $1}')"
          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_CURRENT_BOUNDARY_RESULT=PASS$' "$LOG"; then
            echo "LAS_CURRENT_BOUNDARY_RESULT=PASS"
          else
            echo "LAS_CURRENT_BOUNDARY_RESULT=FAIL"
            exit 1
          fi

      - name: Encrypt private verification log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/current-boundary-private.log"
          test -s "$log"
          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/recipient-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$RECIPIENT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log"             -out "$RUNNER_TEMP/current-boundary-private.cms"             "$RUNNER_TEMP/recipient-cert.pem"

      - name: Upload encrypted verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-boundary
          path: ${{ runner.temp }}/current-boundary-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
