name: Private opaque boundary formal scan

on:
  push:
    branches: [main]
    paths:
      - "RUN_OPAQUE_BOUNDARY_FORMAL_SCAN"

permissions:
  contents: read

env:
  TARGET_REF_HASH: c865ed2a85f2265cdac67a6910ac74a6864bd89564ae523318fa22adaff6a625
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 8314f886753aa9bdcae84ee6776d55632109f68135102fa7e41a196e7c13472b
  EXPECTED_TLC_PROFILE_COUNT: "155"

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: [11, 30, 33, 44, 45, 57, 59, 60, 65, 66, 67, 68]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          while read -r _ ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              resolved="$candidate"
              break
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$resolved"
          actual_proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$actual_proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_OPAQUE_SCAN_SNAPSHOT_PROOF=$actual_proof"
          unset PRIVATE_TOKEN auth matched_ref resolved actual candidate candidate_proof

      - name: Run isolated opaque formal profile
        shell: bash
        env:
          TARGET_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{', src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          count="$(wc -l < "$map" | tr -d ' ')"
          test "$count" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$TARGET_INDEX" -ge 0
          test "$TARGET_INDEX" -lt "$count"
          record="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla _deadlock _expectation <<< "$record"
          test -n "$cfg"
          test -n "$tla"
          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/opaque-formal-$TARGET_INDEX.log"

          set +e
          (
            cd "$cfg_dir"
            java -XX:+UseParallelGC -jar "$TLA_JAR"               -workers auto -lncheck final -fp 0               -config "$cfg_base" "$tla_base"
          ) >"$log" 2>&1
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text=open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches=re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue', text)
          if matches:
              g,d,q=matches[-1]
              print(g.replace(",",""), d.replace(",",""), q.replace(",",""))
          else:
              print("0 0 0")
          PY
          )"
          read -r generated distinct queued <<< "$metrics"
          echo "LAS_OPAQUE_SCAN_INDEX=$TARGET_INDEX"
          echo "LAS_OPAQUE_SCAN_GENERATED=$generated"
          echo "LAS_OPAQUE_SCAN_DISTINCT=$distinct"
          echo "LAS_OPAQUE_SCAN_QUEUE=$queued"
          echo "LAS_OPAQUE_SCAN_RC=$rc"
          rm -f "$log" "$map" "$RUNNER_TEMP/map.py"

          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_OPAQUE_SCAN_RESULT=PASS"
            exit 0
          fi
          echo "LAS_OPAQUE_SCAN_RESULT=FAIL"
          exit 1

  aggregate:
    if: always()
    needs: [scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate opaque scan
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_OPAQUE_SCAN_PROFILE_COUNT=12"
          if [[ "${{ needs.scan.result }}" == "success" ]]; then
            echo "LAS_OPAQUE_SCAN_AGGREGATE=PASS"
          else
            echo "LAS_OPAQUE_SCAN_AGGREGATE=FAIL"
            exit 1
          fi
