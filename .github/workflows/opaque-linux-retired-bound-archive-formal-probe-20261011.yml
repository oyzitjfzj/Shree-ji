name: Opaque Linux retired bound archive formal probe

on:
  pull_request:
    paths:
      - ".github/workflows/opaque-linux-retired-bound-archive-formal-probe-20261011.yml"
      - "verification-requests/linux-retired-bound-archive-formal-probe-20261011.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 796fcd5332e4e54fde6aca1fe8943840f55e4289c8cf44aba13138cd796cf13d
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 366a09f913f2dfaff527a90c1b0e3b65c980b6382ca0216f7d74d5e4c17a8abe
  EXPECTED_PRIVATE_TREE_PROOF: 3da2b051922a9d349f8a11128c28c5cb6bb73c8465de55a1d7057e68594a6759

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_BOUND_PROBE_EXACT_RECOVERY=PASS"

      - name: Install pinned TLA tools
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $RUNNER_TEMP/tla2tools.jar" | sha1sum --check --strict >/dev/null
          echo "OPAQUE_BOUND_PROBE_TOOLCHAIN=PASS"

      - name: Parse and model-check bound archive composition only
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          sany_log="$RUNNER_TEMP/bound-sany.private.log"
          tlc_log="$RUNNER_TEMP/bound-tlc.private.log"
          metadir="$RUNNER_TEMP/bound-tlc.states"
          set +e
          java -cp "$RUNNER_TEMP/tla2tools.jar" tla2sany.SANY \
            spec/root_authority/RootSupervisorLinuxRetiredBoundArchive.tla >"$sany_log" 2>&1
          sany_rc=$?
          set -e
          printf 'OPAQUE_BOUND_PROBE_SANY_LOG_SHA256=%s\n' "$(sha256sum "$sany_log" | awk '{print $1}')"
          printf 'OPAQUE_BOUND_PROBE_SANY_RC=%s\n' "$sany_rc"
          rm -f "$sany_log"
          test "$sany_rc" -eq 0
          set +e
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -workers 2 -fp 0 -deadlock -metadir "$metadir" \
            -config spec/root_authority/RootSupervisorLinuxRetiredBoundArchive.cfg \
            spec/root_authority/RootSupervisorLinuxRetiredBoundArchive.tla >"$tlc_log" 2>&1
          tlc_rc=$?
          set -e
          printf 'OPAQUE_BOUND_PROBE_TLC_LOG_SHA256=%s\n' "$(sha256sum "$tlc_log" | awk '{print $1}')"
          printf 'OPAQUE_BOUND_PROBE_TLC_RC=%s\n' "$tlc_rc"
          rm -rf "$tlc_log" "$metadir"
          test "$tlc_rc" -eq 0
          echo "OPAQUE_BOUND_PROBE_TLC=PASS"
