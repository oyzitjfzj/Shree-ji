name: Opaque current Rust strict gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-rust-strict.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD_PROOF: a591dc8e0c24d747d74f60892ccc8cf2d9f26a578597fa74301351d12a9ceaa1

jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin '+refs/heads/*:refs/remotes/origin/*'
          resolved=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_HEAD_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git rev-list --all --max-count=4096 | sort -u)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          unset PRIVATE_TOKEN auth resolved
          echo "LAS_STRICT_RECOVERY=PASS"

      - name: Strict cargo check
        shell: bash
        run: |
          set -euo pipefail
          cd target
          log="$RUNNER_TEMP/check.private.log"
          set +e
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --message-format=json >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_STRICT_CHECK_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_STRICT_CHECK_RC=$rc"
          echo "LAS_STRICT_CHECK_DEAD_CODE_COUNT=$(grep -ci 'dead_code' "$log" || true)"
          echo "LAS_STRICT_CHECK_UNUSED_COUNT=$(grep -ci 'unused' "$log" || true)"
          echo "LAS_STRICT_CHECK_ERROR_CODES=$(grep -Eo 'error\[E[0-9]{4}\]' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          diag="$(grep -m1 '"code":{"code":"dead_code"' "$log" || true)"
          if [[ -n "$diag" ]]; then
            file="$(printf '%s' "$diag" | jq -r '.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].file_name')"
            line="$(printf '%s' "$diag" | jq -r '.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].line_start')"
            echo "LAS_STRICT_DEAD_PATH_HASH=$(printf '%s' "$file" | sha256sum | awk '{print $1}')"
            echo "LAS_STRICT_DEAD_LINE=$line"
          fi
          jq -Rr 'fromjson?
            | select(.reason=="compiler-message" and .message.level=="error")
            | [(.message.code.code // "NONE"), (.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].file_name // ""), (.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].line_start // 0)]
            | @tsv' "$log" | head -n 1 > "$RUNNER_TEMP/check-first-error.tsv"
          while IFS="$(printf '\011')" read -r code file line; do
            [[ -n "$code" ]] || continue
            if [[ -n "$file" ]]; then
              path_hash="$(printf '%s' "$file" | sha256sum | awk '{print $1}')"
            else
              path_hash="NONE"
            fi
            echo "LAS_STRICT_CHECK_FIRST_DIAG=$code:$path_hash:$line"
          done < "$RUNNER_TEMP/check-first-error.tsv"
          [[ "$rc" -eq 0 ]]

      - name: Strict clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup component add clippy --toolchain 1.98.1 >/dev/null
          cd target
          log="$RUNNER_TEMP/clippy.private.log"
          set +e
          cargo +1.98.1 clippy --locked --all-targets --message-format=json -- -D warnings >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_STRICT_CLIPPY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_STRICT_CLIPPY_RC=$rc"
          echo "LAS_STRICT_CLIPPY_ERROR_CODES=$(grep -Eo 'error\[E[0-9]{4}\]' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          echo "LAS_STRICT_CLIPPY_WARNING_COUNT=$(grep -c '^error:' "$log" || true)"
          echo "LAS_STRICT_CLIPPY_LINT_CODES=$(grep -Eo 'clippy::[a-z0-9_]+' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          component_missing=0
          grep -Eiq 'cargo-clippy.*not installed|clippy.*not installed|component.*clippy.*unavailable' "$log" && component_missing=1
          echo "LAS_STRICT_CLIPPY_COMPONENT_MISSING=$component_missing"
          jq -Rr 'fromjson?
            | select(.reason=="compiler-message" and .message.code.code!=null and (.message.level=="error" or .message.level=="warning"))
            | [.message.code.code, (.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].file_name), (.message.spans as $s | (($s | map(select(.is_primary))) + $s)[0].line_start)]
            | @tsv' "$log" > "$RUNNER_TEMP/clippy-diags.tsv"
          while IFS="$(printf '\011')" read -r lint file line; do
            [[ -n "$lint" && -n "$file" && -n "$line" ]] || continue
            path_hash="$(printf '%s' "$file" | sha256sum | awk '{print $1}')"
            echo "LAS_STRICT_CLIPPY_DIAG=$lint:$path_hash:$line"
          done < "$RUNNER_TEMP/clippy-diags.tsv"
          [[ "$rc" -eq 0 ]]
