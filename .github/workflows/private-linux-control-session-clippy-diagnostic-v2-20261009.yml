name: Private Linux control session Clippy diagnostic v2 20261009

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-control-session-clippy-diagnostic-v2-20261009.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 0a4ab6a3e88e38a1c01a2d421dcd2c0e782f9674a0174ea21dc63242f4c222cd
  EXPECTED_HEAD_PROOF: 939f31647b479559af640395465861387839e7d6446647330ab3680bb805b811
  EXPECTED_TREE_PROOF: 719e1738c65733d612094457bb96c08b2ae8d4fe9ae1bbf00a670b02ea462e6f
  EXPECTED_HELPER_BLOB: a483998b551f318d086ae37540a4fc72fb671a55

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

      - name: Reproduce candidate and emit only lint metadata
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          target_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              target_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$target_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$target_sha"
          git checkout -q --detach "$target_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:tools/tmp_apply_linux_control_session_poll.py)" = "$EXPECTED_HELPER_BLOB"

          python3 tools/tmp_apply_linux_control_session_poll.py >/dev/null 2>&1
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          git diff --check >/dev/null

          log="$RUNNER_TEMP/clippy.private.log"
          set +e
          cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings >"$log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0

          lint_ids="$(grep -oE 'clippy::[a-zA-Z0-9_]+' "$log" | sort -u | paste -sd, -)"
          test -n "$lint_ids"
          echo "LAS_CONTROL_SESSION_V2_CLIPPY_RC=$rc"
          echo "LAS_CONTROL_SESSION_V2_CLIPPY_LINTS=$lint_ids"
          grep -E '^error:|^  --> src/[A-Za-z0-9_./-]+:[0-9]+:[0-9]+' "$log" \
            | sed 's/^/LAS_CONTROL_SESSION_V2_CLIPPY_META=/'
          echo "LAS_CONTROL_SESSION_V2_CLIPPY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          rm -f "$log"
