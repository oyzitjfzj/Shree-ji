name: Canonical Python-cache mutation proof

on:
  push:
    branches: [verify/canonical-pycache-mutation-proof-20261008]
    paths:
      - ".github/workflows/canonical-pre-tlc-mutation-diagnostic.yml"
      - ".verification/canonical-pre-tlc-mutation-diagnostic.trigger"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 225f7f8cf916fc40eb48f0ff2ab83ac99423ac2e146f733279e1a77d7bdd774b
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: d893f63ec5c6e07f1541691204a7e701ea7e435df45c3877ba4ffe1fbebb994f
  EXPECTED_PRIVATE_TREE_PROOF: 217826cd728dfe665a6aa3b3f53d961c7a56963ad44e9b1f5a966e1bc9975b1b
  EXPECTED_VERIFIER_BLOB: 8ea6dbe77db10592baf8f56c9719626c36687f9a
  EXPECTED_HARDENED_WRAPPER_BLOB: 91b59a0bd6471b4c62ab5b0a63541e03a7ce9792

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recover exact private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$RUNNER_TEMP/private-target"
          mkdir -p "$ROOT"; cd "$ROOT"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q -B verify-target "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" == "$EXPECTED_VERIFIER_BLOB"
          test "$(git hash-object tools/verification/run_canonical_verifier_hardened.sh)" == "$EXPECTED_HARDENED_WRAPPER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_PYCACHE_PROOF_EXACT_RECOVERY=PASS"

      - name: Prove Python bytecode cache relocation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-target"
          cd "$ROOT"
          CACHE="$RUNNER_TEMP/canonical-python-cache-proof"
          mkdir -p "$CACHE"
          root_real="$(realpath "$ROOT")"
          cache_real="$(realpath "$CACHE")"
          case "$cache_real/" in
            "$root_real/"*) echo "LAS_PYCACHE_PROOF_ISOLATION=FAIL"; exit 2 ;;
          esac

          PY_LIST="$RUNNER_TEMP/workflow-python.txt"
          python3 - "$ROOT" > "$PY_LIST" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          found = set()
          for wf in (root / ".github" / "workflows").glob("*.yml"):
              text = wf.read_text(encoding="utf-8")
              found.update(re.findall(r'python(?:3)?\s+(tools/verification/[A-Za-z0-9_./-]+\.py)', text))
          for item in sorted(found):
              print(item)
          PY

          count=0
          log="$RUNNER_TEMP/python.private.log"
          while IFS= read -r py; do
            [[ -n "$py" ]] || continue
            set +e
            PYTHONPYCACHEPREFIX="$CACHE" python3 "$py" >"$log" 2>&1
            rc=$?
            set -e
            echo "LAS_PYCACHE_PROOF_SCRIPT_RC=$rc"
            [[ "$rc" -eq 0 ]] || { echo "LAS_PYCACHE_PROOF_SCRIPT=FAIL"; exit 1; }
            test -z "$(git status --porcelain --untracked-files=all)"
            count=$((count + 1))
          done < "$PY_LIST"

          pyc_count="$(find "$CACHE" -type f -name '*.pyc' | wc -l | tr -d ' ')"
          [[ "$count" -gt 0 ]]
          [[ "$pyc_count" -gt 0 ]]
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_PYCACHE_PROOF_SCRIPT_COUNT=$count"
          echo "LAS_PYCACHE_PROOF_EXTERNAL_PYC_COUNT=$pyc_count"
          echo "LAS_PYCACHE_PROOF_REPO_CLEAN=PASS"
          echo "LAS_PYCACHE_PROOF_RELOCATION=PASS"
