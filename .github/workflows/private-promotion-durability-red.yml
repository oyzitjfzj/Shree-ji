name: Private promotion durability GREEN

on:
  push:
    branches:
      - tmp/promotion-transaction-durability-red-verify-20261003
    paths:
      - ".github/workflows/private-promotion-durability-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 8ab68fe7f21c61e0d2bb0e45f6323b3d98031aed072bb0734c848e35a2652a44
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 06378837cc1d7df2e5b517aca5ee4d6d4e0d36da6c9fd6c94d5ac3b906cb40f4
  EXPECTED_VERIFIER_BLOB: d9c54e63b6f09ffb60e012d38b01250744fb3938

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private quarantined head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object tools/verify_promotion_transaction_durability_green.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash sha ref

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add rustfmt --toolchain 1.98.1 >/dev/null
          echo "LAS_RUST_TOOLCHAIN=1.98.1"

      - name: Observe sanitized GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          set +e
          output="$(bash tools/verify_promotion_transaction_durability_green.sh)"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            grep -E '^LAS_PROMOTION_DURABILITY_GREEN=NOT_OBSERVED$|^LAS_PROMOTION_DURABILITY_GREEN_STAGE=(FORMAT|TEST)$' <<<"$output" || true
            exit 1
          fi
          grep -qx 'LAS_PROMOTION_DURABILITY_GREEN=OBSERVED' <<<"$output"
          grep -qx 'LAS_PROMOTION_DURABILITY_GREEN_TESTS=1' <<<"$output"
          printf '%s\n' "$output"
