name: Opaque exact Rust RED gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-exact-rust-red.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD_PROOF: a1e38cad31e119c07c7f5f0968b34ba4f6f77914af914f657c2d8aecf1d440f0

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin '+refs/heads/*:refs/remotes/origin/*'
          resolved=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_HEAD_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth resolved
          echo "LAS_RUST_RED_RECOVERY=PASS"

      - name: Require expected compile RED
        shell: bash
        run: |
          set -euo pipefail
          cd target
          log="$RUNNER_TEMP/rust-red.private.log"
          set +e
          cargo test --lib --no-run >"$log" 2>&1
          rc=$?
          set -e

          digest="$(sha256sum "$log" | awk '{print $1}')"
          error_codes="$(grep -Eo 'error\\[E[0-9]{4}\\]' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          unexpected_codes="$(awk 'match($0,/error\\[E[0-9]{4}\\]/){code=substr($0,RSTART+6,5); if(code!="E0412" && code!="E0432" && code!="E0433" && code!="E0599") seen[code]=1} END{print length(seen)}' "$log")"
          generic_error_count="$(grep -c '^error:' "$log" || true)"
          compile_marker=0
          grep -q 'could not compile' "$log" && compile_marker=1
          resource_marker=0
          grep -Eiq 'OutOfMemoryError|Killed|Cannot allocate memory|signal: 9|exit code 137' "$log" && resource_marker=1
          network_marker=0
          grep -Eiq 'failed to get|network failure|Could not resolve host|timed out.*download' "$log" && network_marker=1

          echo "LAS_RUST_RED_LOG_SHA256=$digest"
          echo "LAS_RUST_RED_ERROR_CODES=$error_codes"
          echo "LAS_RUST_RED_UNEXPECTED_CODE_COUNT=$unexpected_codes"
          echo "LAS_RUST_RED_GENERIC_ERROR_COUNT=$generic_error_count"
          echo "LAS_RUST_RED_COMPILE_MARKER=$compile_marker"
          echo "LAS_RUST_RED_RESOURCE_MARKER=$resource_marker"
          echo "LAS_RUST_RED_NETWORK_MARKER=$network_marker"

          if [[ "$rc" -ne 0 && "$compile_marker" -eq 1 && "$unexpected_codes" -eq 0 && "$resource_marker" -eq 0 && "$network_marker" -eq 0 ]]; then
            echo "LAS_RUST_RED_RESULT=EXPECTED_RED"
            exit 0
          fi
          echo "LAS_RUST_RED_RESULT=UNEXPECTED"
          exit 1
