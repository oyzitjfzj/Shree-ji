name: Map current Clippy owners to private blobs opaquely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-clippy-owner-blob-map.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 2df69cb8a4bb6483271cad9822de8a4a7f09b30ed6c591040398170e851c9305
  CURRENT_PROOF: 65306c5200b96bbc17d1a85b0eb042196d3c1f2a1d1630542aaddfc8134ca854
  CURRENT_TREE_PROOF: a5bff9ef779be5f28fd84780411b1bbd36dbb3bcd729d76dc89cf4032013730d
  EXPECTED_DEFAULT_PATH_HASHES: 30a6ff8f9aadaa52c71e4206829139108a51f2c23a01215402ee1b6fb3c1809d,4f4b50da8df4efa50ac6aa4829f050f9b91edc5bbf69ba897e5a3f1cf845f7de
  EXPECTED_LINUX_PATH_HASHES: 30a6ff8f9aadaa52c71e4206829139108a51f2c23a01215402ee1b6fb3c1809d,4f4b50da8df4efa50ac6aa4829f050f9b91edc5bbf69ba897e5a3f1cf845f7de,ba75192afe7ea5fbd72e730278165a8cc58ca9c6ade11c5a668454cd2a3b1b8d

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy >/dev/null

      - name: Recover exact private materialized revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$CURRENT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$CURRENT_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth matched_ref actual tree
          echo "LAS_OWNER_MAP_RECOVERY=PASS"

      - name: Map failing diagnostics to private blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd target

          run_mode() {
            mode="$1"; expected="$2"; feature="$3"
            out="$RUNNER_TEMP/${mode}.jsonl"
            err="$RUNNER_TEMP/${mode}.stderr"
            set +e
            if [[ "$feature" = none ]]; then
              cargo +1.98.1 clippy --locked --all-targets --message-format=json -- -D warnings >"$out" 2>"$err"
            else
              cargo +1.98.1 clippy --locked --features "$feature" --all-targets --message-format=json -- -D warnings >"$out" 2>"$err"
            fi
            rc=$?
            set -e
            echo "LAS_OWNER_MAP_${mode}_RC=$rc"
            test "$rc" -ne 0

            python3 - "$mode" "$expected" "$out" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          mode, expected_raw, jsonl = sys.argv[1:]
          expected=set(expected_raw.split(','))
          root=pathlib.Path.cwd().resolve()
          findings=[]
          with open(jsonl, encoding='utf-8', errors='replace') as f:
              for line in f:
                  try: obj=json.loads(line)
                  except Exception: continue
                  if obj.get('reason') != 'compiler-message': continue
                  msg=obj.get('message') or {}
                  if msg.get('level') != 'error': continue
                  code=((msg.get('code') or {}).get('code') or '')
                  norm=code.replace('_','-')
                  if norm not in {'clippy::assertions-on-constants','clippy::drop-non-drop'}:
                      continue
                  primary=next((s for s in (msg.get('spans') or []) if s.get('is_primary')), None)
                  if not primary: continue
                  raw=primary.get('file_name') or ''
                  p=pathlib.Path(raw)
                  if p.is_absolute():
                      try: rel=p.resolve().relative_to(root).as_posix()
                      except Exception: raise SystemExit('diagnostic path escaped repository')
                  else:
                      rel=p.as_posix()
                  subprocess.run(['git','ls-files','--error-unmatch','--',rel],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  ph=hashlib.sha256(rel.encode()).hexdigest()
                  blob=subprocess.check_output(['git','hash-object','--',rel],text=True).strip()
                  findings.append((ph,blob,int(primary.get('line_start') or 0),int(primary.get('column_start') or 0),norm))
          findings=sorted(set(findings))
          actual={x[0] for x in findings}
          print('LAS_OWNER_MAP_'+mode+'_FINDING_COUNT='+str(len(findings)))
          for i,(ph,blob,line,col,lint) in enumerate(findings,1):
              print(f'LAS_OWNER_MAP_{mode}_{i}_PATH_HASH={ph}')
              print(f'LAS_OWNER_MAP_{mode}_{i}_BLOB={blob}')
              print(f'LAS_OWNER_MAP_{mode}_{i}_LINE={line}')
              print(f'LAS_OWNER_MAP_{mode}_{i}_COLUMN={col}')
              print(f'LAS_OWNER_MAP_{mode}_{i}_LINT={lint}')
          if actual != expected:
              print('LAS_OWNER_MAP_'+mode+'_EXPECTED_SET_MATCH=0')
              print('LAS_OWNER_MAP_'+mode+'_ACTUAL_SET_DIGEST='+hashlib.sha256('\n'.join(sorted(actual)).encode()).hexdigest())
              raise SystemExit(1)
          print('LAS_OWNER_MAP_'+mode+'_EXPECTED_SET_MATCH=1')
          PY
            rm -f "$out" "$err"
          }

          run_mode DEFAULT "$EXPECTED_DEFAULT_PATH_HASHES" none
          run_mode LINUX "$EXPECTED_LINUX_PATH_HASHES" linux-peer-credentials
          echo "LAS_OWNER_MAP_RESULT=PASS"
