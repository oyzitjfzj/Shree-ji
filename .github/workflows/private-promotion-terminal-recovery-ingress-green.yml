name: Private promotion terminal recovery ingress GREEN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-terminal-recovery-ingress-green.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: c382c1b702b9f5450e6b7d77c322fe3ae6d2ada5d8f609c498c8187ff34d7fcd
  EXPECTED_HEAD_PROOF: ee29e7b434af5819f4701a740d6990ad5dce6907921bad22c342d2fa564210c5
  EXPECTED_TREE_PROOF: c71b87bf572a45008413c4789f682f39e892974b1bb8732072313cbff06c94cf

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

      - name: Recover exact private candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref start_sha tree
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_RECOVERY=PASS"

      - name: Compile ingress-free process-loss recovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 check --locked --lib --tests
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_COMPILE=PASS"

      - name: Run exact recovery-ingress discriminator
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked terminal_restart_recovery_surface_does_not_require_live_promotion_mutation_authority -- --nocapture
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_DISCRIMINATOR=PASS"

      - name: Run retained-terminal recovery tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked promotion_activation_guarded_terminal_retirement_tests -- --nocapture
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_RELATED_TESTS=PASS"

      - name: Require canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all -- --check
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_FMT=PASS"
