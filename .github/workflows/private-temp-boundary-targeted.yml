name: Private temp boundary targeted check

on:
  push:
    branches: [main]
    paths:
      - "RUN_TEMP_BOUNDARY_CHECK"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: b3bdf91e674ae63f2403eb6535c96de09163fe3cdc2f8d0f813e0b8f2dac15da
  DIAG_CERT_PEM_B64: 

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact private temp head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/tmp/selector-execution-20260924
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TEMP_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run private targeted checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

          log="$RUNNER_TEMP/private-temp-boundary.log"
          : > "$log"
          failed=0

          run_stage() {
            local name="$1"
            shift
            set +e
            "$@" >>"$log" 2>&1
            local rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "LAS_TEMP_STAGE_${name}=PASS"
            else
              echo "LAS_TEMP_STAGE_${name}=FAIL"
              failed=1
            fi
          }

          run_stage RUSTFMT cargo +1.98.1 fmt --all -- --check
          run_stage CHECK env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_stage MATERIAL env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked historical_case_use_is_revalidated_at_material_composition_time -- --exact --test-threads=1
          run_stage SYSTEM_F env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked defence_evolution -- --test-threads=1
          run_stage CLEAN bash -c 'test -z "$(git status --porcelain --untracked-files=no)"'

          printf '%s' "$failed" > "$RUNNER_TEMP/private-temp-boundary.rc"

          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/recipient-cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/private-temp-boundary.cms"             "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_TEMP_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"

      - name: Upload encrypted private evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-temp-boundary
          path: ${{ runner.temp }}/private-temp-boundary.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce targeted result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/private-temp-boundary.rc"
          test "$(cat "$RUNNER_TEMP/private-temp-boundary.rc")" = "0"
          echo "LAS_TEMP_BOUNDARY_TARGETED=PASS"
