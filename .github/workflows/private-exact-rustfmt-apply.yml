name: Private exact rustfmt apply

on:
  push:
    branches: [main]
    paths:
      - RUN_PRIVATE_RUSTFMT

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Load opaque formatting request
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_PRIVATE_RUSTFMT
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_PRIVATE_RUSTFMT)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_PRIVATE_RUSTFMT)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          actual_proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$actual_proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_RUSTFMT_INPUT_PROOF=$actual_proof"

          printf '%s' "$matched_ref" > "$RUNNER_TEMP/private-ref"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          unset PRIVATE_TOKEN matched_sha actual

      - name: Apply pinned rustfmt with hashed-path fence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt
          cargo +1.98.1 fmt --all

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          test "${#changed[@]}" -le 2
          allowed_a="c944b4da1285a31cfa519a5021fd97bdd4bf9bf9fc04419302c5c1f83cc05cef"
          allowed_b="5948eadf2e14af20d519720de6c5d6f070bfd7f559d073410f3096b53341863c"
          for path in "${changed[@]}"; do
            h="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            [[ "$h" == "$allowed_a" || "$h" == "$allowed_b" ]]
          done
          git diff --check
          cargo +1.98.1 fmt --all -- --check

          git config user.name "LAS verification formatter"
          git config user.email "las-verification-formatter@users.noreply.github.com"
          git add -u
          git commit -q -m "Apply exact pinned Rust formatting"

          auth="$(cat "$RUNNER_TEMP/private-auth")"
          matched_ref="$(cat "$RUNNER_TEMP/private-ref")"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin "HEAD:$matched_ref"

          new_head="$(git rev-parse HEAD)"
          echo "::add-mask::$new_head"
          new_proof="$(printf '%s' "$new_head" | sha256sum | awk '{print $1}')"
          echo "LAS_RUSTFMT_RESULT=PASS"
          echo "LAS_RUSTFMT_NEW_SNAPSHOT_PROOF=$new_proof"
          rm -f "$RUNNER_TEMP/private-auth" "$RUNNER_TEMP/private-ref"
