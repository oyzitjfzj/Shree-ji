name: Private verification runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-verify.yml"
      - "RUN_VERIFY"

permissions:
  contents: read

concurrency:
  group: private-verification-runner
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate and mask private input bundle
        shell: bash
        env:
          LAS_VERIFY_INPUTS: ${{ secrets.LAS_VERIFY_INPUTS }}
        run: |
          set -euo pipefail
          test -n "$LAS_VERIFY_INPUTS"

          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(os.environ["LAS_VERIFY_INPUTS"])
          required = ("repository", "sha", "token")
          for key in required:
              value = data.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"missing private verification input: {key}")
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "las-private-inputs"
          p.write_text(
              data["repository"].strip() + "\n" +
              data["sha"].strip() + "\n" +
              data["token"].strip() + "\n",
              encoding="utf-8",
          )
          p.chmod(0o600)
          PY

          mapfile -t vals < "$RUNNER_TEMP/las-private-inputs"
          for value in "${vals[@]}"; do
            echo "::add-mask::$value"
          done

      - name: Checkout exact private revision without public source logs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t vals < "$RUNNER_TEMP/las-private-inputs"
          private_repo="${vals[0]}"
          expected_sha="${vals[1]}"
          private_token="${vals[2]}"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${private_repo}.git"

          auth="$(printf 'x-access-token:%s' "$private_token" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/las-private-checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin "$expected_sha" >"$checkout_log" 2>&1
          fetch_rc=$?
          set -e
          if [[ "$fetch_rc" -ne 0 ]]; then
            echo "LAS_PRIVATE_CHECKOUT=FAIL"
            echo "Private checkout diagnostic output intentionally suppressed."
            exit 1
          fi

          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1

          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected_sha" ]]; then
            echo "LAS_PRIVATE_CHECKOUT=FAIL"
            echo "Reason: exact revision mismatch"
            exit 2
          fi

          git checkout -q -B verify-target "$actual"
          unset private_token auth
          echo "LAS_PRIVATE_CHECKOUT_EXACT=YES"

      - name: Run canonical verifier with private output suppressed
        shell: bash
        run: |
          set -u -o pipefail
          cd target

          log="$RUNNER_TEMP/las-private-verification.log"
          set +e
          LAS_VERIFY_EXPECTED_BRANCH=verify-target             bash tools/verify_codespaces_all.sh >"$log" 2>&1
          rc=$?
          set -e

          # Never print or upload the private verifier log from this public repo.
          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_VERIFY_ALL_RESULT=PASS$' "$log"; then
            echo "LAS_PUBLIC_RUNNER_RESULT=PASS"
            exit 0
          fi

          echo "LAS_PUBLIC_RUNNER_RESULT=FAIL"
          echo "Private diagnostic output intentionally suppressed."
          exit 1
