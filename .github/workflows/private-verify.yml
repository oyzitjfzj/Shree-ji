name: Private verification runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RUN_VERIFY"

permissions:
  contents: read

concurrency:
  group: private-verification-runner
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate and mask private inputs
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_SHA: ${{ secrets.LAS_PRIVATE_SHA }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_SHA"
          test -n "$PRIVATE_TOKEN"

          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_SHA"
          echo "::add-mask::$PRIVATE_TOKEN"

          printf '%s\n%s\n%s\n' \
            "$PRIVATE_REPOSITORY" "$PRIVATE_SHA" "$PRIVATE_TOKEN" \
            > "$RUNNER_TEMP/las-private-inputs"
          chmod 600 "$RUNNER_TEMP/las-private-inputs"

      - name: Checkout exact private revision without public source logs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t vals < "$RUNNER_TEMP/las-private-inputs"
          private_repo="${vals[0]}"
          expected_sha="${vals[1]}"
          private_token="${vals[2]}"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${private_repo}.git"

          auth="$(printf 'x-access-token:%s' "$private_token" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/las-private-checkout.log"

          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin "$expected_sha" >"$checkout_log" 2>&1
          fetch_rc=$?
          set -e

          if [[ "$fetch_rc" -ne 0 ]]; then
            echo "LAS_PRIVATE_CHECKOUT=FAIL"
            echo "Private checkout diagnostic output intentionally suppressed."
            exit 1
          fi

          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1
          actual="$(git rev-parse HEAD)"

          if [[ "$actual" != "$expected_sha" ]]; then
            echo "LAS_PRIVATE_CHECKOUT=FAIL"
            echo "Reason: exact revision mismatch"
            exit 2
          fi

          git checkout -q -B verify-target "$actual"
          unset private_token auth
          echo "LAS_PRIVATE_CHECKOUT_EXACT=YES"

      - name: Run canonical verifier with private output suppressed
        shell: bash
        run: |
          set -u -o pipefail
          cd target

          log="$RUNNER_TEMP/las-private-verification.log"
          set +e
          LAS_VERIFY_EXPECTED_BRANCH=verify-target \
            bash tools/verify_codespaces_all.sh >"$log" 2>&1
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_VERIFY_ALL_RESULT=PASS "$log"; then
            echo "LAS_PUBLIC_RUNNER_RESULT=PASS"
            exit 0
          fi

          echo "LAS_PUBLIC_RUNNER_RESULT=FAIL"
          if grep -q '^========== PRE-TLC VERIFICATION BLOCKED ========== "$log"; then
            echo "LAS_DIAG_PRE_TLC_BLOCKED=YES"
          else
            echo "LAS_DIAG_PRE_TLC_BLOCKED=NO"
          fi
          if grep -q '^========== LAS VERIFICATION SUMMARY ========== "$log"; then
            echo "LAS_DIAG_FINAL_SUMMARY=YES"
          else
            echo "LAS_DIAG_FINAL_SUMMARY=NO"
          fi
          if grep -q '^TLC_NOT_STARTED=' "$log"; then
            echo "LAS_DIAG_TLC_STARTED=NO"
          elif grep -q '^========== TLC:' "$log"; then
            echo "LAS_DIAG_TLC_STARTED=YES"
          else
            echo "LAS_DIAG_TLC_STARTED=UNKNOWN"
          fi

          failed_count=0
          while IFS= read -r line; do
            name="${line#FAILED_CHECK=}"
            hash="$(printf '%s' "$name" | sha256sum | awk '{print $1}')"
            echo "LAS_DIAG_FAILED_HASH=$hash"
            failed_count=$((failed_count + 1))
          done < <(grep '^FAILED_CHECK=' "$log" || true)
          echo "LAS_DIAG_FAILED_COUNT=$failed_count"

          last_section="$(grep '^========== .* ========== "$log" | tail -n 1 || true)"
          if [[ -n "$last_section" ]]; then
            section_hash="$(printf '%s' "$last_section" | sha256sum | awk '{print $1}')"
            echo "LAS_DIAG_LAST_SECTION_HASH=$section_hash"
          fi

          echo "Private diagnostic output intentionally suppressed."
          exit 1
