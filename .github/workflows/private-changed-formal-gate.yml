name: Private changed formal gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-changed-formal-gate.yml"

permissions:
  contents: read

env:
  EXPECTED_BASE_PROOF: cca04877fdf7006b16f3a6ddcacf5bcd9fcd1fd92336efad65a6e04cd24ee89e
  EXPECTED_HEAD_PROOF: 1876b36d6b87372d242b39c3b8a7c4d55a1bf6aafc79b2334c3d24860fd7c4e6
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      recovered: ${{ steps.recover.outputs.recovered }}
      profile_count: ${{ steps.run_formal.outputs.profile_count }}
      pass_count: ${{ steps.run_formal.outputs.pass_count }}
      fail_count: ${{ steps.run_formal.outputs.fail_count }}
      failed_ordinals: ${{ steps.run_formal.outputs.failed_ordinals }}
      private_log_sha256: ${{ steps.run_formal.outputs.private_log_sha256 }}
    steps:
      - name: Recover exact private revisions opaquely
        id: recover
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth"             fetch -q --depth=1024 origin '+refs/heads/*:refs/remotes/origin/*'

          find_by_proof() {
            local expected="$1"
            local found=""
            while IFS= read -r oid; do
              [[ -n "$oid" ]] || continue
              proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
              if [[ "$proof" = "$expected" ]]; then
                found="$oid"
                break
              fi
            done < <(git rev-list --all --max-count=8192 | sort -u)
            test -n "$found"
            printf '%s' "$found"
          }

          base="$(find_by_proof "$EXPECTED_BASE_PROOF")"
          head="$(find_by_proof "$EXPECTED_HEAD_PROOF")"
          echo "::add-mask::$base"
          echo "::add-mask::$head"
          git merge-base --is-ancestor "$base" "$head"
          git checkout -q --detach "$head"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s' "$base" > "$RUNNER_TEMP/base"
          printf '%s' "$head" > "$RUNNER_TEMP/head"
          echo "LAS_PRIVATE_FORMAL_BASE_PROOF=$EXPECTED_BASE_PROOF"
          echo "LAS_PRIVATE_FORMAL_HEAD_PROOF=$EXPECTED_HEAD_PROOF"
          echo "recovered=1" >> "$GITHUB_OUTPUT"
          unset PRIVATE_TOKEN auth

      - name: Run exact changed canonical formal profiles
        id: run_formal
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          base="$(cat "$RUNNER_TEMP/base")"
          head="$(cat "$RUNNER_TEMP/head")"
          log="$RUNNER_TEMP/private-formal.log"
          : > "$log"

          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"             >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR"             | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" "$RUNNER_TEMP/run-fn.sh" <<'PY'
          from pathlib import Path
          import re, sys
          src=Path(sys.argv[1]).read_text(encoding="utf-8")
          mm=re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src,re.S)
          if not mm:
              raise SystemExit("canonical map generator unavailable")
          Path(sys.argv[2]).write_text(mm.group(1)+"\n",encoding="utf-8")
          fm=re.search(
              r'(run_tlc_profile\(\) \{.*?\n\})\n\nwhile IFS=\$\'\\t\' read -r cfg tla deadlock expectation; do',
              src,re.S)
          if not fm:
              raise SystemExit("canonical TLC runner unavailable")
          Path(sys.argv[3]).write_text(fm.group(1)+"\n",encoding="utf-8")
          PY

          map="$RUNNER_TEMP/map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"

          changed="$RUNNER_TEMP/changed-spec-paths"
          git diff --name-only "$base" "$head" -- ':(glob)spec/**/*.cfg' ':(glob)spec/**/*.tla'             | sort -u > "$changed"

          selected="$RUNNER_TEMP/selected.tsv"
          python3 - "$map" "$changed" > "$selected" <<'PY'
          import sys
          changed={line.strip() for line in open(sys.argv[2],encoding="utf-8") if line.strip()}
          rows=[]
          with open(sys.argv[1],encoding="utf-8") as f:
              for raw in f:
                  row=raw.rstrip("\n").split("\t")
                  if len(row) < 4:
                      row += [""]*(4-len(row))
                  cfg,tla,deadlock,expectation=row[:4]
                  if cfg in changed or tla in changed:
                      rows.append((cfg,tla,deadlock,expectation))
          for row in rows:
              print("\t".join(row))
          PY

          count="$(wc -l < "$selected" | tr -d ' ')"
          test "$count" -gt 0
          echo "LAS_PRIVATE_FORMAL_PROFILE_COUNT=$count"

          TMP="$RUNNER_TEMP/tlc-private"
          mkdir -p "$TMP"
          PASS=0
          FAIL=0
          FAILED=()
          source "$RUNNER_TEMP/run-fn.sh"

          failed_ordinals=""
          ordinal=0
          set +e
          while IFS=$'\t' read -r cfg tla deadlock expectation; do
            [[ -n "$cfg" && -n "$tla" ]] || continue
            before_fail="$FAIL"
            run_tlc_profile "$cfg" "$tla" "$deadlock" "$expectation"
            if (( FAIL > before_fail )); then
              if [[ -n "$failed_ordinals" ]]; then
                failed_ordinals+=","
              fi
              failed_ordinals+="$ordinal"
            fi
            ordinal=$((ordinal + 1))
          done < "$selected" >"$log" 2>&1
          loop_rc=$?
          set -e

          private_log_sha256="$(sha256sum "$log" | awk '{print $1}')"
          echo "profile_count=$count" >> "$GITHUB_OUTPUT"
          echo "pass_count=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"
          echo "failed_ordinals=$failed_ordinals" >> "$GITHUB_OUTPUT"
          echo "private_log_sha256=$private_log_sha256" >> "$GITHUB_OUTPUT"

          echo "LAS_PRIVATE_FORMAL_LOG_SHA256=$private_log_sha256"
          echo "LAS_PRIVATE_FORMAL_PASS_COUNT=$PASS"
          echo "LAS_PRIVATE_FORMAL_FAIL_COUNT=$FAIL"
          echo "LAS_PRIVATE_FORMAL_FAILED_ORDINALS=$failed_ordinals"
          if [[ "$loop_rc" -eq 0 && "$FAIL" -eq 0 && "$PASS" -eq "$count" ]]; then
            echo "LAS_PRIVATE_CHANGED_FORMAL_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PRIVATE_CHANGED_FORMAL_RESULT=FAIL"
          exit 1

  report:
    if: always()
    needs: [formal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record non-sensitive changed-formal result
        shell: bash
        env:
          FORMAL_RESULT: ${{ needs.formal.result }}
          RECOVERED: ${{ needs.formal.outputs.recovered }}
          PROFILE_COUNT: ${{ needs.formal.outputs.profile_count }}
          PASS_COUNT: ${{ needs.formal.outputs.pass_count }}
          FAIL_COUNT: ${{ needs.formal.outputs.fail_count }}
          FAILED_ORDINALS: ${{ needs.formal.outputs.failed_ordinals }}
          PRIVATE_LOG_SHA256: ${{ needs.formal.outputs.private_log_sha256 }}
        run: |
          set -euo pipefail

          result=FAIL
          if [[ "$FORMAL_RESULT" == "success" ]]; then
            result=PASS
          fi

          phase="unknown"
          if [[ "$RECOVERED" != "1" ]]; then
            phase="recovery"
          elif [[ -z "$PROFILE_COUNT" ]]; then
            phase="pre_profile"
          elif [[ -n "$FAIL_COUNT" && "$FAIL_COUNT" != "0" ]]; then
            phase="formal_profile"
          elif [[ "$FORMAL_RESULT" == "success" ]]; then
            phase="complete"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          write_result() {
            cat > LAS_CHANGED_FORMAL_RESULT.json <<EOF
          {
            "schema": "las-public-changed-formal-verification-v1",
            "base_snapshot_proof": "$EXPECTED_BASE_PROOF",
            "head_snapshot_proof": "$EXPECTED_HEAD_PROOF",
            "formal_job": "$FORMAL_RESULT",
            "phase": "$phase",
            "profile_count": "$PROFILE_COUNT",
            "pass_count": "$PASS_COUNT",
            "fail_count": "$FAIL_COUNT",
            "failed_ordinals": "$FAILED_ORDINALS",
            "private_log_sha256": "$PRIVATE_LOG_SHA256",
            "result": "$result"
          }
          EOF
            git add LAS_CHANGED_FORMAL_RESULT.json
          }

          published=0
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard origin/main >/dev/null
            write_result
            if git diff --cached --quiet; then
              published=1
              break
            fi
            git commit -q -m "Record changed formal verification result"
            if git push -q origin HEAD:main; then
              published=1
              break
            fi
          done
          [[ "$published" -eq 1 ]]

          echo "LAS_CHANGED_FORMAL_RESULT=$result"
          [[ "$result" == "PASS" ]]
