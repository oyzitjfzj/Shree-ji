name: Private promotion genesis Clippy repair export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-genesis-clippy-repair-export.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 36e21d1f34a51e92cdfdfce07e673abea6ea954f6e181312fce4ffe2858018a9
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 416c44c77a26671b77cfb906f769a6c52c266076e7eb71443761ec45f7c338b3

jobs:
  prove-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          repair_key="$(printf 'LAS_PRIVATE_CLIPPY_REPAIR_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$repair_key"
          printf '%s' "$repair_key" >"$RUNNER_TEMP/repair-key"
          chmod 600 "$RUNNER_TEMP/repair-key"
          echo "LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash tree repair_key

      - name: Apply exact internal error-taxonomy rename
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          from pathlib import Path
          edits = {
              Path('src/defence_evolution/promotion_transaction_journal_physical_record.rs'): {
                  'MissingProviderId': 'ProviderId',
                  'MissingProtocolVersion': 'ProtocolVersion',
                  'MissingKeyEpoch': 'KeyEpoch',
              },
              Path('src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs'): {
                  'MissingProviderId': 'ProviderId',
                  'MissingProtocolVersion': 'ProtocolVersion',
                  'MissingKeyEpoch': 'KeyEpoch',
              },
              Path('src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs'): {
                  'MissingProviderIdentity': 'ProviderIdentity',
                  'MissingProviderGeneration': 'ProviderGeneration',
                  'MissingDigestProfile': 'DigestProfile',
              },
          }
          expected_counts = {
              ('src/defence_evolution/promotion_transaction_journal_physical_record.rs', 'MissingProviderId'): 2,
              ('src/defence_evolution/promotion_transaction_journal_physical_record.rs', 'MissingProtocolVersion'): 2,
              ('src/defence_evolution/promotion_transaction_journal_physical_record.rs', 'MissingKeyEpoch'): 2,
              ('src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs', 'MissingProviderId'): 1,
              ('src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs', 'MissingProtocolVersion'): 1,
              ('src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs', 'MissingKeyEpoch'): 1,
              ('src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs', 'MissingProviderIdentity'): 3,
              ('src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs', 'MissingProviderGeneration'): 3,
              ('src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs', 'MissingDigestProfile'): 3,
          }
          for path, replacements in edits.items():
              text = path.read_text()
              for old, new in replacements.items():
                  actual = text.count(old)
                  expected = expected_counts[(str(path), old)]
                  if actual != expected:
                      raise SystemExit(f'unexpected replacement count for {path}: {old}: {actual} != {expected}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          expected="$RUNNER_TEMP/expected-paths"
          cat >"$expected" <<'EOF'
          src/defence_evolution/promotion_transaction_journal_physical_record.rs
          src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs
          src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs
          EOF
          sed -i 's/^[[:space:]]*//' "$expected"
          git diff --name-only | sort >"$RUNNER_TEMP/actual-paths"
          sort "$expected" >"$RUNNER_TEMP/expected-paths-sorted"
          diff -u "$RUNNER_TEMP/expected-paths-sorted" "$RUNNER_TEMP/actual-paths" >/dev/null
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_SCOPE=PASS'

      - name: Prove strict compile and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_CHECK=PASS'
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_CLIPPY=PASS'

      - name: Prove serialized default library regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_LIB_TESTS=PASS'

      - name: Encrypt exact repaired files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          plain="$RUNNER_TEMP/promotion-genesis-clippy-repair.tar.gz"
          tar -czf "$plain" \
            src/defence_evolution/promotion_transaction_journal_physical_record.rs \
            src/defence_evolution/promotion_transaction_journal_physical_record_red_tests.rs \
            src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs
          export LAS_REPAIR_KEY="$(cat "$RUNNER_TEMP/repair-key")"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass env:LAS_REPAIR_KEY -in "$plain" -out "$RUNNER_TEMP/promotion-genesis-clippy-repair.enc"
          unset LAS_REPAIR_KEY
          test -s "$RUNNER_TEMP/promotion-genesis-clippy-repair.enc"
          rm -f "$plain" "$RUNNER_TEMP/repair-key"
          echo "LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/promotion-genesis-clippy-repair.enc" | awk '{print $1}')"
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_REPAIR_EXPORT=PASS'

      - name: Upload encrypted repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-promotion-genesis-clippy-repair
          path: ${{ runner.temp }}/promotion-genesis-clippy-repair.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
