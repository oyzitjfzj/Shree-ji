          FlWNq8yiUZ/LWcgLf3KzTTzZjto81Y2gvOfa8PiSlBPLQyNAtSvOVn49hjfdrQ17
          dHF2HYk0ZJj7VR78jt7IZo6+KYDFIGXWaMQ6txZ4dqtHc7m5M7KrHC1XeA==
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "C6:8F:16:BB:32:47:3D:2C:B7:9B:75:20:1F:F0:C4:8A:18:54:CC:70:94:0E:9D:05:3F:70:D5:99:BD:A0:7D:57"
          echo "LAS_CURRENT_ROOT_CERT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc             -outform DER             -in "$RUNNER_TEMP/current-root-targeted.tgz"             -out "$RUNNER_TEMP/current-root-targeted.cms"             "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/current-root-targeted.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_CURRENT_ROOT_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-root-targeted
          path: ${{ runner.temp }}/current-root-targeted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
