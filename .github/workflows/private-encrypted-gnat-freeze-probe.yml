name: Encrypted GNAT fail-closed-projection probe

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_FREEZE_PROBE"

permissions:
  contents: read

concurrency:
  group: encrypted-gnat-freeze-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Probe fixed-layout fail-closed projection with ABI and SPARK
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bundle="$RUNNER_TEMP/gnat-predicate-probe"
          mkdir -p "$bundle"

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-predicate-probe"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_predicate_probe >/dev/null
            alr with gnatprove=16.1.0 >/dev/null
          )

          python3 - <<'PY'
          from pathlib import Path
          import re

          ads = Path("src/root_authority/root_authority.ads")
          text = ads.read_text(encoding="utf-8")
          pattern = re.compile(
              r"""   type Grant_Handle is record\n"""
              r"""      Domain : Domain_Epoch := 0;\n"""
              r"""      Slot   : Natural := 0;\n"""
              r"""   end record\n"""
              r"""     with Type_Invariant => Grant_Handle\.Slot <= Max_Grants;"""
          )
          new = """   type Grant_Handle is record
              Domain : Domain_Epoch := 0;
              Slot   : Natural := 0;
           end record;"""
          text2, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one current Grant_Handle shape, found {count}")
          ads.write_text(text2, encoding="utf-8")

          adb = Path("src/root_authority/root_authority.adb")
          body = adb.read_text(encoding="utf-8")
          old_valid = """       return Machine.Initialized
                 and then Grant.Domain = Machine.Domain_Id
                 and then Grant.Slot /= 0
                 and then Grant.Slot <= Machine.Issued_Count
                 and then Machine.Grants (Slot_Index (Grant.Slot)).Issued;"""
          new_valid = """       return Machine.Initialized
                 and then Grant.Domain = Machine.Domain_Id
                 and then Grant.Slot /= 0
                 and then Grant.Slot <= Max_Grants
                 and then Grant.Slot <= Machine.Issued_Count
                 and then Machine.Grants (Slot_Index (Grant.Slot)).Issued;"""
          if old_valid not in body:
              raise SystemExit("Handle_Is_Valid shape not found")
          body = body.replace(old_valid, new_valid, 1)

          old_slot = """      function Handle_Slot (Grant : Grant_Handle) return Natural is
                (Grant.Slot);"""
          new_slot = """      function Handle_Slot (Grant : Grant_Handle) return Natural is
                (if Grant.Slot <= Max_Grants then Grant.Slot else 0);"""
          if old_slot not in body:
              raise SystemExit("Handle_Slot shape not found")
          body = body.replace(old_slot, new_slot, 1)
          adb.write_text(body, encoding="utf-8")
          PY

          ffi_dir="$RUNNER_TEMP/root-authority-predicate-abi"
          mkdir -p "$ffi_dir"
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p \
              -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr" \
              -XROOT_FFI_BUILD_DIR="$ffi_dir"
          ) >"$bundle/abi.log" 2>&1
          abi_rc=$?

          PROOF_DIR="$RUNNER_TEMP/root-authority-predicate-proof"
          mkdir -p "$PROOF_DIR/obj"
          cat > "$PROOF_DIR/root_authority_proof_instances.ads" <<'EOF_PROOF'
          pragma SPARK_Mode (On);
          with Root_Authority;

          package Root_Authority_Proof_Instances is
             package Capacity_1   is new Root_Authority (Max_Grants => 1);
             package Capacity_2   is new Root_Authority (Max_Grants => 2);
             package Capacity_16  is new Root_Authority (Max_Grants => 16);
             package Capacity_256 is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Proof_Instances;
          EOF_PROOF
          cat > "$PROOF_DIR/root_authority_proof.gpr" <<EOF_GPR
          project Root_Authority_Proof is
             for Source_Dirs use
               ("$GITHUB_WORKSPACE/target/src/root_authority", "$PROOF_DIR");
             for Object_Dir use "$PROOF_DIR/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Root_Authority_Proof;
          EOF_GPR

          (
            cd "$ALR_WS"
            alr exec -- gnatprove \
              -P"$PROOF_DIR/root_authority_proof.gpr" \
              -U --mode=all --level=4 --proof=progressive:all \
              --checks-as-errors=on --proof-warnings=on --report=statistics \
              --warnings=error --pedantic -j2
          ) >"$bundle/spark.log" 2>&1
          spark_rc=$?
          set -e

          printf '%s\n' "$abi_rc" > "$bundle/abi.rc"
          printf '%s\n' "$spark_rc" > "$bundle/spark.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_PROJECTION_ABI_RC=$abi_rc"
          echo "LAS_PROJECTION_SPARK_RC=$spark_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/abi.log"; then
            echo "LAS_PROJECTION_ABI_ICE=YES"
          else
            echo "LAS_PROJECTION_ABI_ICE=NO"
          fi
          if grep -q "GNAT BUG DETECTED" "$bundle/spark.log"; then
            echo "LAS_PROJECTION_SPARK_ICE=YES"
          else
            echo "LAS_PROJECTION_SPARK_ICE=NO"
          fi

          tar -C "$bundle" -czf "$RUNNER_TEMP/private-diagnostic.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEWTCCAsGgAwIBAgIUOgA2nlNJjkHGCl+Sx9O5YBYYo6swDQYJKoZIhvcNAQEL
          BQAwPDE6MDgGA1UEAwwxTEFTIGVwaGVtZXJhbCBkaWFnbm9zdGljIHJlY2lwaWVu
          dCBhY3RpdmUgc2Vzc2lvbjAeFw0yNjA5MjAwODM4MzJaFw0yNjA5MjIwODM4MzJa
          MDwxOjA4BgNVBAMMMUxBUyBlcGhlbWVyYWwgZGlhZ25vc3RpYyByZWNpcGllbnQg
          YWN0aXZlIHNlc3Npb24wggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQCg
          ssQSCH20SyQIsNN8F0trJiLaCA9sXD9ySI6wK7lmfVmWXojEyRldwWAl9U9E/ztE
          JE3uNypB5IY30/ft2fw5wZl2TN0O3hDvejb2jw2r/dwN5PgKr7Gq6xQANJHWGwzD
          pwxQiIC9B0pvfHwGAKfQ+778kDxUhXxb07hQia7N4SfLx9VG+jpHU17v4EvkyTvp
          +zh+Tsrc3131+GSzlRy9Yu4yFx+Hm81opdW7t+8mSHXOS/GqfBoC6k8d4kHehrt4
          A2UHOvX/s3Xr1ckUPkCzI8utCTyMJyGIIye+kFZ/RoGpZYaeSGOMdYBzfuzexhhS
          KugF/5TdXknhlxO+Uv4wCF69I0B3LXRtnJC2i08OSXxVdGt7H4X4cS874S7wY42P
          G6gxzoIR3YzXcvEf0LkIQM3mYTC/hPU9xLL+VfR3El5Qmh9uaq0maYZ8ygUXT8pQ
          s0Aq2jELcr4llPN2teT+38AUfvAjLtjVaSk7N16mYZxpVYhmqIf/wW2GG+CXAm0C
          AwEAAaNTMFEwHQYDVR0OBBYEFNkghbfroyAwahTUlDZ16ltj8U9xMB8GA1UdIwQY
          MBaAFNkghbfroyAwahTUlDZ16ltj8U9xMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZI
          hvcNAQELBQADggGBAGV9MNhDBqCFfX07EyP7xx4tqZzwZ23cBHOiN51ijVOjHVaW
          mwnV7MTXIli7RQH5iEQAO6RG47mqOEcDuTTM82suWWiFC/t5BsNIaCCyr79TyeJs
          J0oFLRmc6H48TTKh9AgVM71ZDPj7twlzOOKIO0DFG7yvkgd8CkexcepYeAC2Vw/m
          R84i/iR8Wl1EThxIh1UEchIb0BgGnVa2PP+ANqpf7KMGc+2SQwkuu4IQu3zwpC0l
          vb/8CXJ1W5LbJNKCD38r8s4dAZmvAHHnBOS8W5q5UnIPENb0l+sMaSpfk7s+N5Wr
          K0XmkIMe/+VnwapKuZZe1Ri2eFs63yMUtpvx0WKL2zxFsJQDUmGC2zCodqrze3o4
          k3cpq8sHDUZJ1NiCzJ4OeoMR8d7/MJiYXEhYtxSY44qolB4n5B5dDbF+Mi+E4ajv
          xhYzTx0AelaqsbHlu/TWkGHjAeWCm4oHacoPVjejP94ayjZUKV8EX/6j+rT6KQJ3
          U7Kf/xZeaIlb8JQAXA==
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "59:FB:B5:50:A8:E1:27:9C:7E:EB:36:C8:01:B1:7F:20:25:0E:69:08:0A:AE:2E:CE:75:F0:95:EA:EC:87:33:2C"
          openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -in "$RUNNER_TEMP/private-diagnostic.tgz" \
            -out "$RUNNER_TEMP/encrypted.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/private-diagnostic.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_PROJECTION_PROBE_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-gnat-predicate-probe
          path: ${{ runner.temp }}/encrypted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
