name: Encrypted current Root targeted verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_FREEZE_PROBE"

permissions:
  contents: read

concurrency:
  group: encrypted-current-root-targeted
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Verify current Root ABI and SPARK
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bundle="$RUNNER_TEMP/current-root-targeted"
          mkdir -p "$bundle"

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-current-root"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_current_root >/dev/null
            alr with gnatprove=16.1.0 >/dev/null
          )

          ffi_dir="$RUNNER_TEMP/root-authority-current-abi"
          mkdir -p "$ffi_dir"
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p               -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr"               -XROOT_FFI_BUILD_DIR="$ffi_dir"
          ) >"$bundle/abi.log" 2>&1
          abi_rc=$?

          PROOF_DIR="$RUNNER_TEMP/root-authority-current-proof"
          mkdir -p "$PROOF_DIR/obj"
          cat > "$PROOF_DIR/root_authority_proof_instances.ads" <<'EOF_PROOF'
          pragma SPARK_Mode (On);
          with Root_Authority;

          package Root_Authority_Proof_Instances is
             package Capacity_1   is new Root_Authority (Max_Grants => 1);
             package Capacity_2   is new Root_Authority (Max_Grants => 2);
             package Capacity_16  is new Root_Authority (Max_Grants => 16);
             package Capacity_256 is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Proof_Instances;
          EOF_PROOF
          cat > "$PROOF_DIR/root_authority_proof.gpr" <<EOF_GPR
          project Root_Authority_Proof is
             for Source_Dirs use
               ("$GITHUB_WORKSPACE/target/src/root_authority", "$PROOF_DIR");
             for Object_Dir use "$PROOF_DIR/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Root_Authority_Proof;
          EOF_GPR

          (
            cd "$ALR_WS"
            alr exec -- gnatprove               -P"$PROOF_DIR/root_authority_proof.gpr"               -U --mode=all --level=4 --proof=progressive:all               --checks-as-errors=on --proof-warnings=on --report=statistics               --warnings=error --pedantic -j2
          ) >"$bundle/spark.log" 2>&1
          spark_rc=$?
          set -e

          printf '%s\n' "$abi_rc" > "$bundle/abi.rc"
          printf '%s\n' "$spark_rc" > "$bundle/spark.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_CURRENT_ROOT_ABI_RC=$abi_rc"
          echo "LAS_CURRENT_ROOT_SPARK_RC=$spark_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/abi.log"; then
            echo "LAS_CURRENT_ROOT_ABI_ICE=YES"
          else
            echo "LAS_CURRENT_ROOT_ABI_ICE=NO"
          fi
          if grep -q "GNAT BUG DETECTED" "$bundle/spark.log"; then
            echo "LAS_CURRENT_ROOT_SPARK_ICE=YES"
          else
            echo "LAS_CURRENT_ROOT_SPARK_ICE=NO"
          fi

          tar -C "$bundle" -czf "$RUNNER_TEMP/current-root-targeted.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIUNWV2eDuNGO2OT1s15iRpWE6ZBbMwDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwoTEFTIGVwaGVtZXJhbCBkaWFnbm9zdGljIGN1cnJlbnQg
          c2Vzc2lvbjAeFw0yNjA5MjAwODQ5MjhaFw0yNjA5MjIwODQ5MjhaMDMxMTAvBgNV
          BAMMKExBUyBlcGhlbWVyYWwgZGlhZ25vc3RpYyBjdXJyZW50IHNlc3Npb24wggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQCpbB85J7veU/NiZUzmocgujD8w
          FYzjBqtakB65F28vT/9WAsIxxwbrzS3wnVo2vznAGoid7LeU5vgSuyd9j93nnm4z
          lzARHT8ekFsWi1QxN9N93xCujjtPiemFgxk6IPq1XbpcFJ+lu/P678PFbnsYScnJ
          tzfhYVRJBAVpJcTanUY5tGvwjQxeyE7zKYFbXFpg9/aKccZ7L5qQCRlHg/Vk/24S
          poNZLaB0tMOfsUp1pdzsFsw4F4ayCs7gbRr3kphkF8BEncnaRt70L6fHjb68j1C9
