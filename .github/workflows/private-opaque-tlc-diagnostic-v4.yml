name: Private opaque TLC diagnostic v4

on:
  push:
    branches: [main]
    paths:
      - "RUN_OPAQUE_TLC_DIAG_V4"

permissions:
  contents: read

concurrency:
  group: opaque-tlc-diag-v4-fresh-20260923-94-107-109-123
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1f0ff8762cb0a5a6acd64fef6be848c7fdb8dd982636074515fe27c7543584c8
  EXPECTED_VERIFIER_BLOB: 9f4b3b02c936d5af877f0cfe7c1ebc46f4bb5774
  EXPECTED_TLC_PROFILE_COUNT: "129"
  DIAG_CERT_PEM_B64: 
  RECIPIENT_CERT_FINGERPRINT: "71:1E:78:C2:17:58:42:7A:6D:15:12:69:15:74:3C:70:ED:A1:08:8C:51:69:8A:79:61:6A:A7:5E:4E:D8:66:8C"

jobs:
  tlc:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [94, 107, 109, 123]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          unset PRIVATE_TOKEN auth
          echo "LAS_OPAQUE_TLC_SNAPSHOT_PROOF=$proof"

      - name: Run isolated TLC profile
        shell: bash
        env:
          PROFILE_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{', src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          test "$(wc -l < "$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          record="$(sed -n "$((PROFILE_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$record"
          test -n "$cfg" && test -n "$tla"

          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/tlc-private.log"
          metadir="$RUNNER_TEMP/tlc-state"
          mkdir -p "$metadir"
          args=(-workers auto -lncheck final -fp 0 -metadir "$metadir")
          [[ "$deadlock" == "1" ]] && args+=(-deadlock)
          args+=(-config "$cfg_base" "$tla_base")

          set +e
          (cd "$cfg_dir" && java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1
          rc=$?
          set -e

          ok=0
          if [[ -n "$expectation" ]]; then
            (( rc != 0 )) && grep -Eiq "$expectation" "$log" && ok=1
          elif (( rc == 0 )); then
            ok=1
          fi

          echo "LAS_OPAQUE_TLC_INDEX=$PROFILE_INDEX"
          if (( ok )); then
            echo "LAS_OPAQUE_TLC_RESULT=PASS"
            exit 0
          fi
          echo "LAS_OPAQUE_TLC_RESULT=FAIL"
          exit 1

      - name: Encrypt private diagnostic
        if: always()
        shell: bash
        env:
          PROFILE_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tlc-private.log"
          test -f "$log" || printf '%s\n' "profile ended before TLC log creation" > "$log"
          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/recipient-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$RECIPIENT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/tlc-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_OPAQUE_TLC_INDEX=$PROFILE_INDEX"
          echo "LAS_OPAQUE_TLC_EVIDENCE_SHA256=$(sha256sum "$RUNNER_TEMP/tlc-private.cms" | awk '{print $1}')"

      - name: Upload encrypted diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-tlc-v4-${{ matrix.index }}
          path: ${{ runner.temp }}/tlc-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
