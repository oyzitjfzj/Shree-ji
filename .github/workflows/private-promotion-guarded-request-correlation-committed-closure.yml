name: Private promotion guarded-request correlation committed closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-guarded-request-correlation-committed-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: b773b1e8c6c1cbdfd3733d3029c1bf79473040b81131ffd4ac1ae055812ed196
  EXPECTED_COMMIT_PROOF: 0fabd00fb4c8ded9c7c28dbd5f5012b2dd655a1d24bdfc3656abc5de9533419e
  EXPECTED_PARENT_PROOF: 5777048e713789410c1ee699ce22be1b0fead4f93849afa2d1835cbace545ef4

jobs:
  verify-committed-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Verify exact committed private bytes read-only
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_COMMIT_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          parent="$(git rev-parse HEAD^)"
          echo "::add-mask::$parent"
          test "$(printf '%s' "$parent" | sha256sum | awk '{print $1}')" = "$EXPECTED_PARENT_PROOF"

          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          expected=(
            "src/defence_evolution/promotion_activation_durable_arm_red_tests.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --check "$parent" HEAD
          if git diff "$parent" HEAD -- src | grep -E '^\+.*unsafe[[:space:]]*\{' >/dev/null; then exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          needles = {
              "CTOR": ("PromotionActivationDurableBinding::from_test_parts(", 7),
              "METHOD": (".activation_durable_binding(", 1),
          }
          def nargs(text, start):
              depth = 1; i = start; commas = 0; seen = False
              in_str = False; quote = ''; esc = False
              while i < len(text):
                  c = text[i]
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: in_str = False
                      i += 1; continue
                  if c in ('"', "'"):
                      in_str = True; quote = c; seen = True
                  elif c == '(':
                      depth += 1; seen = True
                  elif c == ')':
                      depth -= 1
                      if depth == 0: return 0 if not seen else commas + 1
                  elif c == ',' and depth == 1:
                      commas += 1
                  elif not c.isspace():
                      seen = True
                  i += 1
              return -1
          counts = {"CTOR": 0, "METHOD": 0}
          bad = []
          for path in Path("src").rglob("*.rs"):
              text = path.read_text(encoding="utf-8")
              for kind, (needle, expected) in needles.items():
                  off = 0
                  while True:
                      pos = text.find(needle, off)
                      if pos < 0: break
                      argc = nargs(text, pos + len(needle))
                      counts[kind] += 1
                      if argc != expected: bad.append((kind, argc))
                      off = pos + len(needle)
          if bad or counts["CTOR"] < 5 or counts["METHOD"] < 2:
              raise SystemExit(f"committed guarded correlation invariant failed: counts={counts}, bad={bad}")
          print(f"LAS_CORRELATION_CLOSURE_CONSTRUCTORS={counts['CTOR']}")
          print(f"LAS_CORRELATION_CLOSURE_METHOD_CALLS={counts['METHOD']}")
          PY
          echo "LAS_CORRELATION_CLOSURE_SCOPE=PASS"

          cargo +1.98.1 fmt --all -- --check
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"

          export RUSTFLAGS=-Dwarnings
          run_quiet() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/${label}.log"
            if ! "$@" >"$log" 2>&1; then
              echo "LAS_CORRELATION_CLOSURE_${label^^}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          run_quiet check cargo +1.98.1 check --locked --all-targets
          run_quiet clippy cargo +1.98.1 clippy --locked --all-targets -- -D warnings

          run_test() {
            local label="$1"; local filter="$2"; local out="$RUNNER_TEMP/${label}.txt"
            if ! cargo +1.98.1 test --locked --lib "$filter" -- --test-threads=1 >"$out" 2>&1; then
              echo "LAS_CORRELATION_CLOSURE_${label^^}_LOG_SHA256=$(sha256sum "$out" | awk '{print $1}')"
              rm -f "$out"
              exit 1
            fi
            python3 - "$out" "$label" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          counts = [int(x) for x in re.findall(r"test result: ok\. (\d+) passed;", text)]
          if not counts or max(counts) <= 0:
              raise SystemExit(f"{sys.argv[2]} executed zero tests")
          print(f"LAS_CORRELATION_CLOSURE_{sys.argv[2].upper()}_COUNT={max(counts)}")
          PY
            rm -f "$out"
          }
          run_test arm promotion_activation_durable_arm_red_tests::
          run_test artifact promotion_artifact_protection_tests::
          run_test bridge effect_fabric::dispatch_commit::promotion_root_effect_bridge::tests::
          run_test durability promotion_transaction_durability_red_tests::
          run_test journal promotion_transaction_journal_
          run_test linux_journal promotion_transaction_linux_journal_

          full="$RUNNER_TEMP/full.txt"
          if ! cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$full" 2>&1; then
            echo "LAS_CORRELATION_CLOSURE_FULL_LOG_SHA256=$(sha256sum "$full" | awk '{print $1}')"
            rm -f "$full"
            exit 1
          fi
          python3 - "$full" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          counts = [int(x) for x in re.findall(r"test result: ok\. (\d+) passed;", text)]
          if not counts or max(counts) < 1264:
              raise SystemExit(f"unexpected committed full-library count: {counts}")
          print(f"LAS_CORRELATION_CLOSURE_FULL_COUNT={max(counts)}")
          PY
          rm -f "$full"
          echo "LAS_CORRELATION_COMMITTED_CLOSURE=PASS"
          echo "LAS_CORRELATION_COMMITTED_PROOF=$EXPECTED_COMMIT_PROOF"
