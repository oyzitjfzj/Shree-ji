name: Private assurance TLC39 exact quotient diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_EXACT_QUOTIENT_DIAGNOSTIC"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  TARGET_REF_HASH: cfea257f56be059e1f6565654924f01a5dfec581efba0bb7672a59c550ca03c1
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: f4a53f879c80e4f68d0939b54ce2570f1ab87629b0b8678ded75303eab2d7934
  EXPECTED_PRIVATE_TREE_PROOF: f6c57af5671f8e0ce6c5a3b0d44f303520eeee2569cf7fe312f709688a52a067
  EXPECTED_TLC_PROFILE_COUNT: "203"
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  PROFILE_CFG_HASH: 186ddf4cbea68ae055b349ed7bb808aad5ed0146b3618b99754efa46c735e092
  REFINEMENT_CFG_HASH: 07deae307210aa4cd01cdf62d13a181345bb525783dd877e1d15c27c9a9abab0

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Reclaim runner storage
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/az /opt/hostedtoolcache/CodeQL; do
            [[ ! -e "$path" ]] || sudo rm -rf "$path"
          done
          sudo apt-get clean
          docker system prune --all --force >/dev/null 2>&1 || true
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_TLC39_EXACT_Q_FREE_KB_START=$free_kb"
          test "$free_kb" -ge 31457280

      - name: Recover exact bounded quotient candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"; mkdir "$ROOT"; cd "$ROOT"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; refs="$RUNNER_TEMP/heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched=""
          while read -r sha ref; do [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" != "$TARGET_REF_HASH" ]] || { test -z "$matched"; matched="$ref"; }; done <"$refs"
          rm -f "$refs"; test -n "$matched"; echo "::add-mask::$matched"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=32 origin "$matched"
          resolved=""
          while read -r c; do [[ "$(printf '%s' "$c" | sha256sum | awk '{print $1}')" != "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]] || { test -z "$resolved"; resolved="$c"; }; done < <(git rev-list --max-count=32 FETCH_HEAD)
          test -n "$resolved"; git checkout -q --detach "$resolved"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_TLC39_EXACT_Q_RECOVERY=PASS"; unset PRIVATE_TOKEN auth matched resolved c tree

      - name: Run exact canonical quotient profile and refinement proof
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"; cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null
          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8'); m=re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',s,re.S)
          if not m: raise SystemExit(2)
          Path(sys.argv[2]).write_text(m.group(1)+'\n',encoding='utf-8')
          PY
          map="$RUNNER_TEMP/map.tsv"; python3 "$RUNNER_TEMP/map.py" "$ROOT" >"$map"; test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          python3 - "$map" "$PROFILE_CFG_HASH" "$REFINEMENT_CFG_HASH" "$RUNNER_TEMP/targets.tsv" <<'PY'
          import hashlib,pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(); wanted={sys.argv[2]:'PROFILE',sys.argv[3]:'REFINEMENT'}; out=[]
          for i,l in enumerate(lines):
              cols=l.split('\t'); cols += ['']*(4-len(cols)); h=hashlib.sha256(cols[0].encode()).hexdigest()
              if h in wanted: out.append((wanted[h],i,*cols[:4]))
          if sorted(x[0] for x in out)!=['PROFILE','REFINEMENT']: raise SystemExit(3)
          pathlib.Path(sys.argv[4]).write_text('\n'.join('\t'.join(map(str,x)) for x in out)+'\n',encoding='utf-8')
          for label,i,*_ in sorted(out): print(f'LAS_TLC39_EXACT_Q_{label}_INDEX={i}')
          PY
          run_one() {
            local label="$1" cfg="$2" tla="$3" deadlock="$4" expectation="$5" log rc
            test -z "$expectation"; log="$RUNNER_TEMP/${label}.private.log"
            args=(-workers auto -lncheck final -fp 0); [[ "$deadlock" == "1" ]] && args+=(-deadlock); args+=(-config "$(basename "$cfg")" "$(basename "$tla")")
            set +e; (cd "$(dirname "$cfg")"; java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1; rc=$?; set -e
            echo "LAS_TLC39_EXACT_Q_${label}_RC=$rc"
            python3 - "$log" "$label" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read(); label=sys.argv[2]; m=re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',t)
          if m:
              g,d,q=m[-1]; print(f'LAS_TLC39_EXACT_Q_{label}_GENERATED='+g.replace(',','')); print(f'LAS_TLC39_EXACT_Q_{label}_DISTINCT='+d.replace(',','')); print(f'LAS_TLC39_EXACT_Q_{label}_QUEUE='+q.replace(',',''))
          depth=re.findall(r'Search depth of complete state graph is ([0-9]+)',t)
          if depth: print(f'LAS_TLC39_EXACT_Q_{label}_DEPTH='+depth[-1])
          PY
            if [[ "$rc" -ne 0 ]] || grep -Eiq 'Invariant .* is violated|Property .* is violated|Deadlock reached|Parsing or semantic analysis failed|TLC threw an unexpected exception|TLC Bug|AssertionError|OutOfMemoryError|No space left on device' "$log"; then
              echo "LAS_TLC39_EXACT_Q_${label}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"; return 1
            fi
            rm -f "$log"; echo "LAS_TLC39_EXACT_Q_${label}_RESULT=PASS"
          }
          while IFS=$'\t' read -r label index cfg tla deadlock expectation; do run_one "$label" "$cfg" "$tla" "$deadlock" "$expectation"; done <"$RUNNER_TEMP/targets.tsv"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_TLC39_EXACT_Q_RESULT=PASS"
