name: Opaque exact Rust slice gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-exact-rust-slice.yml"

permissions:
  contents: read

concurrency:
  group: private-rust-slice-current
  cancel-in-progress: true

env:
  EXPECTED_HEAD_PROOF: 58b9cf98b736a64d6074f1211b9dc9d983f9cd11e82e49fa331c4382363d955a

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin '+refs/heads/*:refs/remotes/origin/*'
          resolved=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_HEAD_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git rev-list --all --max-count=4096 | sort -u)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth resolved
          echo "LAS_RUST_SLICE_RECOVERY=PASS"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cd target
          log="$RUNNER_TEMP/rustfmt.private.log"
          set +e
          cargo fmt --all -- --check >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_RUST_SLICE_FMT_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_RUST_SLICE_FMT_RC=$rc"
          if [[ "$rc" -ne 0 ]]; then
            cargo fmt --all
            while IFS= read -r -d '' path; do
              path_hash="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
              echo "LAS_RUST_SLICE_FMT_PATH_HASH=$path_hash"
              while IFS= read -r range; do
                [[ -n "$range" ]] || continue
                echo "LAS_RUST_SLICE_FMT_RANGE=$path_hash:$range"
              done < <(
                git diff --unified=0 --no-color -- "$path"                   | sed -nE 's/^@@ -([0-9]+(,[0-9]+)?) \+([0-9]+(,[0-9]+)?) @@.*$/\1:\3/p'                   | head -n 8
              )
            done < <(git diff --name-only -z)
          fi
          [[ "$rc" -eq 0 ]]
          echo "LAS_RUST_SLICE_FMT=PASS"

      - name: Run library tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          log="$RUNNER_TEMP/rust-test.private.log"
          set +e
          cargo test --lib >"$log" 2>&1
          rc=$?
          set -e

          digest="$(sha256sum "$log" | awk '{print $1}')"
          error_codes="$(grep -Eo 'error\\[E[0-9]{4}\\]' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          error_code_count="$(grep -Eo 'error\\[E[0-9]{4}\\]' "$log" | sort -u | wc -l | tr -d ' ' || true)"
          class="OTHER"
          if grep -q 'could not compile' "$log"; then
            class="COMPILE"
          elif grep -q 'test result: FAILED' "$log"; then
            class="TEST"
          elif [[ "$rc" -eq 0 ]]; then
            class="PASS"
          fi

          echo "LAS_RUST_SLICE_TEST_LOG_SHA256=$digest"
          echo "LAS_RUST_SLICE_TEST_CLASS=$class"
          echo "LAS_RUST_SLICE_TEST_ERROR_CODE_COUNT=$error_code_count"
          echo "LAS_RUST_SLICE_TEST_ERROR_CODES=$error_codes"

          if [[ "$class" == "TEST" ]]; then
            while IFS= read -r failed_name; do
              [[ -n "$failed_name" ]] || continue
              echo "LAS_RUST_SLICE_FAILED_TEST_HASH=$(printf '%s' "$failed_name" | sha256sum | awk '{print $1}')"
            done < <(
              awk '
                /^failures:$/ {capture=1; next}
                capture && /^test result:/ {capture=0}
                capture && /^    [A-Za-z0-9_]+(::[A-Za-z0-9_]+)+$/ {
                  sub(/^    /, "")
                  print
                }
              ' "$log" | sort -u
            )
          fi

          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_RUST_SLICE_TEST=PASS"
            exit 0
          fi
          echo "LAS_RUST_SLICE_TEST=FAIL"
          exit 1

# BASELINE_TRIGGER_SLICE_1F6F
