name: Canonical slow-12 chain audit

on:
  push:
    branches: [verify/canonical-slow12-chain-audit-20261008]
    paths:
      - ".verification/canonical-slow12-chain-audit.trigger"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BOOTSTRAP_RUN_ID: "37572378728"
      CONTINUATION_WORKFLOW_ID: "372166115"
      FROZEN_BRANCH: verify/current-exact-resumable-24244fc8
    steps:
      - name: Collect public resumable-chain evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/slow12-audit"
          mkdir -p "$ROOT/logs" "$ROOT/jobs"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"

          api_get() {
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail-with-body --retry 3 \
              --silent --show-error --oauth2-bearer "$GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }

          : >"$ROOT/runs.tsv"
          page=1
          while :; do
            page_json="$ROOT/page-$page.json"
            api_get "$api/actions/workflows/$CONTINUATION_WORKFLOW_ID/runs?branch=$FROZEN_BRANCH&per_page=100&page=$page" >"$page_json"
            count="$(python3 - "$page_json" "$ROOT/runs.tsv" <<'PY'
          import json, sys
          src, out = sys.argv[1:]
          data=json.load(open(src,encoding='utf-8'))
          runs=data.get('workflow_runs',[])
          with open(out,'a',encoding='utf-8') as f:
              for r in runs:
                  f.write(f"{r['id']}\t{r['status']}\t{r.get('conclusion') or ''}\t{r.get('run_number') or ''}\n")
          print(len(runs))
          PY
            )"
            [[ "$count" -eq 100 ]] || break
            page=$((page + 1))
            test "$page" -le 20
          done

          while IFS=$'\t' read -r run_id status conclusion run_number; do
            [[ "$status" == "completed" && "$conclusion" == "success" ]] || continue
            jobs="$ROOT/jobs/$run_id.json"
            api_get "$api/actions/runs/$run_id/jobs?per_page=100" >"$jobs"
            job_id="$(python3 - "$jobs" <<'PY'
          import json, sys
          jobs=json.load(open(sys.argv[1],encoding='utf-8')).get('jobs',[])
          hits=[j for j in jobs if j.get('name') == 'continuation / slice']
          if len(hits)!=1:
              raise SystemExit(f"expected one continuation slice job, got {len(hits)}")
          print(hits[0]['id'])
          PY
            )"
            api_get "$api/actions/jobs/$job_id/logs" >"$ROOT/logs/cont-$run_id.log"
          done <"$ROOT/runs.tsv"

          bootstrap_jobs="$ROOT/bootstrap-jobs.json"
          api_get "$api/actions/runs/$BOOTSTRAP_RUN_ID/jobs?per_page=100" >"$bootstrap_jobs"
          python3 - "$bootstrap_jobs" "$ROOT/bootstrap-job-ids.tsv" <<'PY'
          import json, re, sys
          jobs=json.load(open(sys.argv[1],encoding='utf-8')).get('jobs',[])
          rows=[]
          for j in jobs:
              m=re.fullmatch(r'bootstrap \((\d+)\) / slice', j.get('name',''))
              if m:
                  if j.get('status')!='completed' or j.get('conclusion')!='success':
                      raise SystemExit(f"bootstrap job not successful: {j.get('name')}")
                  rows.append((int(m.group(1)),j['id']))
          targets={2,28,29,36,110,115,133,145,156,157,168,172}
          if {i for i,_ in rows} != targets:
              raise SystemExit(f"bootstrap target mismatch: {sorted(i for i,_ in rows)}")
          with open(sys.argv[2],'w',encoding='utf-8') as f:
              for idx,jid in sorted(rows): f.write(f"{idx}\t{jid}\n")
          PY
          while IFS=$'\t' read -r idx job_id; do
            api_get "$api/actions/jobs/$job_id/logs" >"$ROOT/logs/bootstrap-$idx.log"
          done <"$ROOT/bootstrap-job-ids.tsv"

          echo "LAS_SLOW12_CHAIN_EVIDENCE_COLLECTION=PASS"

      - name: Reconstruct and validate all 12 checkpoint chains
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/slow12-audit"
          python3 - "$ROOT" "$BOOTSTRAP_RUN_ID" <<'PY'
          from pathlib import Path
          import re, sys

          root=Path(sys.argv[1]); bootstrap_run=int(sys.argv[2])
          targets=(2,28,29,36,110,115,133,145,156,157,168,172)

          def one(pattern,text,label,required=True):
              vals=re.findall(pattern,text,re.M)
              if not vals:
                  if required: raise SystemExit(f"missing {label}")
                  return ''
              vals=list(dict.fromkeys(vals))
              if len(vals)!=1: raise SystemExit(f"ambiguous {label}: {vals!r}")
              return vals[0]

          def parse(path,run_id,expected_idx=None):
              text=path.read_text(encoding='utf-8',errors='replace')
              idx=int(one(r'^.*Z   index: ([0-9]+)$',text,'index'))
              seg=int(one(r'^.*Z   segment: ([0-9]+)$',text,'segment'))
              resume=one(r'^.*Z   resume_run_id: *([0-9]*)$',text,'resume_run_id',False)
              artifact=one(r'^.*Z   resume_artifact: *(.*)$',text,'resume_artifact',False).strip()
              result=one(r'^.*Z LAS_CURRENT_RESUME_RESULT=(PASS|SLICE_CHECKPOINT|FAIL_CLOSED|FAIL)$',text,'result')
              if expected_idx is not None and idx != expected_idx:
                  raise SystemExit(f"bootstrap index mismatch expected={expected_idx} actual={idx}")
              if not re.search(r'^.*Z LAS_CURRENT_RESUME_EXACT_RECOVERY=PASS$',text,re.M):
                  raise SystemExit(f"missing exact recovery idx={idx} seg={seg}")
              if seg > 1 and not re.search(r'^.*Z LAS_CURRENT_RESUME_CHECKPOINT_AUTH=PASS$',text,re.M):
                  raise SystemExit(f"missing checkpoint auth idx={idx} seg={seg}")
              nxt=one(r'^.*Z LAS_CURRENT_RESUME_NEXT_SEGMENT=([0-9]+)$',text,'next_segment',False)
              if result=='SLICE_CHECKPOINT':
                  if not nxt or int(nxt)!=seg+1:
                      raise SystemExit(f"bad next segment idx={idx} seg={seg} next={nxt!r}")
              elif nxt:
                  raise SystemExit(f"terminal result dispatched child idx={idx} seg={seg}")
              if result in {'FAIL_CLOSED','FAIL'}:
                  raise SystemExit(f"successful workflow carried failing result idx={idx} seg={seg}")
              return {'idx':idx,'seg':seg,'run':run_id,'resume':int(resume) if resume else None,
                      'artifact':artifact,'result':result}

          records=[]
          for idx in targets:
              records.append(parse(root/'logs'/f'bootstrap-{idx}.log',bootstrap_run,idx))
          for p in sorted((root/'logs').glob('cont-*.log')):
              run=int(p.stem.split('-',1)[1])
              rec=parse(p,run)
              if rec['idx'] not in targets:
                  raise SystemExit(f"unexpected continuation index {rec['idx']}")
              records.append(rec)

          by_key={}
          for r in records:
              by_key.setdefault((r['idx'],r['seg']),[]).append(r)

          terminal=[]; unresolved=[]; reachable=set()
          for idx in targets:
              starts=[r for r in by_key.get((idx,1),[]) if r['run']==bootstrap_run]
              if len(starts)!=1:
                  raise SystemExit(f"bad bootstrap record count idx={idx}: {len(starts)}")
              cur=starts[0]; reachable.add((cur['run'],idx,cur['seg']))
              while cur['result']=='SLICE_CHECKPOINT':
                  next_seg=cur['seg']+1
                  expected_artifact=f"tlc-state-{idx}-{cur['seg']}"
                  children=[r for r in by_key.get((idx,next_seg),[])
                            if r['resume']==cur['run'] and r['artifact']==expected_artifact]
                  if len(children)==0:
                      unresolved.append((idx,cur['seg'],cur['run']))
                      break
                  if len(children)>1:
                      raise SystemExit(f"ambiguous child idx={idx} seg={next_seg}: {len(children)}")
                  cur=children[0]; reachable.add((cur['run'],idx,cur['seg']))
              else:
                  if cur['result']!='PASS':
                      raise SystemExit(f"unexpected terminal result idx={idx}: {cur['result']}")
                  terminal.append((idx,cur['seg'],cur['run']))

          if len(terminal)+len(unresolved) != len(targets):
              raise SystemExit('chain partition mismatch')

          completed_success=sum(1 for line in (root/'runs.tsv').read_text().splitlines()
                                if '\tcompleted\tsuccess\t' in line)
          all_cont=[r for r in records if r['seg']>1]
          orphan=[r for r in all_cont if (r['run'],r['idx'],r['seg']) not in reachable]

          for idx,seg,run in terminal:
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}=PASS")
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}_TERMINAL_SEGMENT={seg}")
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}_TERMINAL_RUN={run}")
          for idx,seg,run in unresolved:
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}=ACTIVE_OR_PENDING")
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}_LAST_SEALED_SEGMENT={seg}")
              print(f"LAS_SLOW12_CHAIN_INDEX_{idx}_LAST_SEALED_RUN={run}")
          print(f"LAS_SLOW12_CHAIN_TERMINAL_PASS_COUNT={len(terminal)}")
          print(f"LAS_SLOW12_CHAIN_ACTIVE_OR_PENDING_COUNT={len(unresolved)}")
          print(f"LAS_SLOW12_CHAIN_COMPLETED_SUCCESS_RUNS={completed_success}")
          print(f"LAS_SLOW12_CHAIN_SUPERSEDED_OR_ORPHAN_SUCCESS_RUNS={len(orphan)}")
          print("LAS_SLOW12_CHAIN_INTEGRITY=PASS")
          PY

      - name: Seal audit
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_SLOW12_CHAIN_AUDIT=PASS"
