name: Opaque private joint Clippy repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-private-joint-clippy-repair-20261010.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 937e43eb7e37dbf1cd43ef2dbde987413754f7ff0d8629bf83d9c6d477cf455a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 9708995fe5af73e0690be957659d0796f7271e3cbdb1c823ea44e5402032e9b4
  EXPECTED_PRIVATE_TREE_PROOF: 56eb5486d2937ea1c64bce65ba6337c05584f93f130a9bf857a8722c86978959
  ROTATION_PATH_HASH: 97de66527aa7c62e3e352be9b0c92f91a6247e3ba24df6c487af38ebb090e3bf
  BOOTSTRAP_PATH_HASH: c15cf7675e335a60094930aa900817c6e04f28af7eb382ae40a4b30d9b63822a
  ENTRYPOINT_PATH_HASH: 6fcfdd444bd7c33a937feac7eac033539badf3901c5a9a1d8fd51f6f1096b12c

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install exact formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

      - name: Recover exact private revision with write lease
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q -B repair-target "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/private-ref"
          printf '%s' "$private_head" >"$RUNNER_TEMP/private-start-sha"
          printf '%s' "$auth" >"$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/private-ref" "$RUNNER_TEMP/private-start-sha" "$RUNNER_TEMP/private-auth"
          echo "OPAQUE_CLIPPY_REPAIR_RECOVERY=PASS"

      - name: Apply exact diagnosed lint repairs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          resolve_path() {
            wanted="$1"; found=""
            while IFS= read -r -d '' path; do
              if [[ "$(printf '%s' "$path" | sha256sum | awk '{print $1}')" = "$wanted" ]]; then
                test -z "$found"; found="$path"
              fi
            done < <(git ls-files -z)
            test -n "$found"; printf '%s' "$found"
          }
          rotation="$(resolve_path "$ROTATION_PATH_HASH")"
          bootstrap="$(resolve_path "$BOOTSTRAP_PATH_HASH")"
          entrypoint="$(resolve_path "$ENTRYPOINT_PATH_HASH")"
          echo "::add-mask::$rotation"; echo "::add-mask::$bootstrap"; echo "::add-mask::$entrypoint"
          python3 - "$rotation" "$bootstrap" "$entrypoint" <<'PY'
          from pathlib import Path
          import sys
          rotation, bootstrap, entrypoint = map(Path, sys.argv[1:4])

          text = rotation.read_text(encoding='utf-8')
          renames = [
              ('MissingPreActionPolicyEpoch', 'ZeroPreActionPolicyEpoch', 2),
              ('MissingRetirementCommitment', 'EmptyRetirementCommitment', 3),
              ('MissingArchiveGeneration', 'ZeroArchiveGeneration', 2),
              ('MissingArchiveHead', 'EmptyArchiveHead', 2),
              ('MissingProvenanceCommitment', 'EmptyProvenanceCommitment', 2),
          ]
          for old, new, expected in renames:
              if text.count(old) != expected:
                  raise SystemExit(f'rotation anchor count changed: {old}')
              text = text.replace(old, new)
          rotation.write_text(text, encoding='utf-8')

          text = bootstrap.read_text(encoding='utf-8')
          old = '''#[expect(\n    clippy::type_complexity,\n    clippy::result_large_err,\n    reason = "reprepare failure returns the exact bounded Open epoch owner without heap indirection"\n)]'''
          new = '''#[expect(\n    clippy::result_large_err,\n    reason = "reprepare failure returns the exact bounded Open epoch owner without heap indirection"\n)]'''
          if text.count(old) != 1:
              raise SystemExit('bootstrap lint anchor changed')
          bootstrap.write_text(text.replace(old, new), encoding='utf-8')

          text = entrypoint.read_text(encoding='utf-8')
          old = '''#[expect(\n    clippy::large_enum_variant,\n    reason = "reprovision failure keeps exact bounded authority, ingress, evidence and verifier ownership inline"\n)]\n'''
          if text.count(old) != 1:
              raise SystemExit('entrypoint enum lint anchor changed')
          text = text.replace(old, '', 1)
          reasons = [
              'rotation failure/success keeps exact bounded authority, evidence, listener and verifier ownership visible',
              'every rejection preserves exact Open-epoch, ingress, evidence and verifier ownership',
              'activation success/failure keeps both current authority and previous retirement ownership explicit',
          ]
          for reason in reasons:
              old = f'''#[expect(\n    clippy::result_large_err,\n    clippy::type_complexity,\n    reason = "{reason}"\n)]'''
              new = f'''#[expect(\n    clippy::result_large_err,\n    reason = "{reason}"\n)]'''
              if text.count(old) != 1:
                  raise SystemExit('entrypoint type-complexity anchor changed')
              text = text.replace(old, new, 1)
          anchor = '    pub(super) fn reclaim_archived_previous_epoch(\n'
          if text.count(anchor) != 1:
              raise SystemExit('reclaim method anchor changed')
          replacement = '''    #[expect(\n        clippy::result_large_err,\n        reason = "failure preserves complete rotated ownership and receipt without heap indirection"\n    )]\n    pub(super) fn reclaim_archived_previous_epoch(\n'''
          text = text.replace(anchor, replacement, 1)
          entrypoint.write_text(text, encoding='utf-8')
          PY
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            hash="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            [[ "$hash" = "$ROTATION_PATH_HASH" || "$hash" = "$BOOTSTRAP_PATH_HASH" || "$hash" = "$ENTRYPOINT_PATH_HASH" ]]
          done
          git diff --check
          echo "OPAQUE_CLIPPY_REPAIR_SCOPE=PASS"

      - name: Commit and fast-forward exact private ref
        shell: bash
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          ref="$(cat "$RUNNER_TEMP/private-ref")"; start="$(cat "$RUNNER_TEMP/private-start-sha")"; auth="$(cat "$RUNNER_TEMP/private-auth")"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"; echo "::add-mask::$auth"; echo "::add-mask::$start"
          remote="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | awk '{print $1}')"; echo "::add-mask::$remote"
          test "$remote" = "$start"
          git config user.name "LAS Verification Repair"
          git config user.email "las-verification@users.noreply.github.com"
          git add -u
          git commit -q -m "Satisfy strict joint production Clippy"
          new_sha="$(git rev-parse HEAD)"; echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$ref"
          echo "OPAQUE_CLIPPY_REPAIR_RESULT=PASS"
          echo "OPAQUE_CLIPPY_REPAIR_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
