name: Private current source alert audit

on:
  push:
    branches: [main]
    paths:
      - "RUN_SOURCE_ALERT_AUDIT"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: ea6eb2444c6431c8d6c5e1ea4b3518331431332e4090cb560f45d8032151710e

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_ALERT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Build encrypted alert-mode report
        shell: bash
        run: |
          set -euo pipefail
          cd target
          report="$RUNNER_TEMP/source-alert-private.txt"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "== tracked-tree =="
            git status --short
            echo "== diff-check =="
            git diff --check
            echo "== todo-unimplemented =="
            git grep -nE 'todo!\(|unimplemented!\(' -- 'src/**/*.rs' ':!src/**/tests/**' || true
            echo "== panic-unwrap-expect =="
            git grep -nE 'panic!\(|\.unwrap\(\)|\.expect\(' -- 'src/**/*.rs' || true
            echo "== unsafe =="
            git grep -nE '\bunsafe\b' -- 'src/**/*.rs' || true
            echo "== lint-suppressions =="
            git grep -nE '#!?\[(allow|expect)\(' -- 'src/**/*.rs' || true
            echo "== cfg-test =="
            git grep -nE '#\[cfg\(test\)\]' -- 'src/**/*.rs' || true
            echo "== deadlock-disabled =="
            git grep -nF 'CHECK_DEADLOCK FALSE' -- 'spec/**/*.cfg' || true
            echo "== secret-like literals =="
            git grep -nEi '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})' -- . ':!.git' || true
          } >"$report" 2>&1

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIENzCCAp+gAwIBAgIUMZoJyq5ThJ44Qra8QzQWKSdCI7kwDQYJKoZIhvcNAQEL
          BQAwKzEpMCcGA1UEAwwgTEFTIGN1cnJlbnQgVExDIGV4YWN0IGRpYWdub3N0aWMw
          HhcNMjYwOTIxMjIyMzMwWhcNMjYwOTIzMjIyMzMwWjArMSkwJwYDVQQDDCBMQVMg
          Y3VycmVudCBUTEMgZXhhY3QgZGlhZ25vc3RpYzCCAaIwDQYJKoZIhvcNAQEBBQAD
          ggGPADCCAYoCggGBANLDvNf2mVNjyxr0AHyKmAQ4e21Pbqb7ckHdATjHlE7DiOpR
          Lb+thbXVVweHFBZPObQvXuTQRO5rld8C38wOop6WYUfFpvJOUlIntvE3+nAHk7iZ
          zHUjjFFi6eaRtY3X6LiECDyQbX6caos7SY4O4TL+UUbRpVgQAXCDZwSmKECaYkHe
          9tfATWULXnQAbNEUXDZnMK/jAMfWvuFT4F/luyOu9XgWXMOp7AmiJyabecPSNnaD
          qkjXjXxW87jR8l3/8xTx12/maWifkuV47/JD7hNSrlYj9TIN1tnpLqWwOSGy1zSo
          uaMZ3jDub1pv5lTa4dtOnghzFcj71dPG3rMxG6usZeOpaJ3GNJEIwge+iea8GlKS
          t+YtddN2ZP4+lf/L6FwFVYji+mnTpyArcjJB/3xJKU8FU/EypQQPcl1ymy5URV6c
          k9eMejHXCNNPdaTYgY3Qp8qNSZSKpwn+DfNOyMJJG98mbug2hBtqP2D+iiOtLeVp
          rwTVo078annsxz9WTwIDAQABo1MwUTAdBgNVHQ4EFgQUJTWHDdH0Ey70im8dUCz0
          8KrRsrMwHwYDVR0jBBgwFoAUJTWHDdH0Ey70im8dUCz08KrRsrMwDwYDVR0TAQH/
          BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEAmtuHXlvVMAcSqXDqEUxijMsix0aJ
          JvnLC1SuhAyOYUbhq/35oL2/UVgobJrJ6t8LHweBjRAsVIiuSr5dD9ViHJAPP0m1
          6Gy2zCZpSjbGX88eynwgO0sOn3/glbjoPRjbAfU6XTPEv3y1JksKdF2xRVYCNndQ
          2hPBWxUuj3GtsDivgwugE803xF9z9UnRrBIrvfD+LteueSWpHmpIhwqFDoTk1bj2
          O2whlvhM6wKpRTS/sneLXQcH+IHbl/GZ21pxz3gtxy2JOHxPV4aXFdEGZCOTQ0au
          MraGpbKsK9sr2bjGD1ICoDruBDf61WTf9QiriizkRXGGMLEKuNKxO+4UkiHoXMiU
          kLQR3V2+Bx/18U1caaohfzruJsjpFiLbXNF+E8JgIfkmuqf9XqN8NVm9j7UzY4/G
          8zlgCONxjVK9ZrcuQTsHNzN+F8SSg3ogxhdE0WTGTsB0zEAm0nEH9lUSF9n8sbv4
          S9fA0WvpAgBYVV1MEq/MwCTsXUtEjhzxsb3f
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "6C:A4:00:21:2D:D5:D9:51:69:3B:AE:01:73:B5:95:5A:C3:77:CB:20:5B:2B:0E:3A:35:74:C8:FA:27:44:D8:43"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$report" -out "$RUNNER_TEMP/source-alert-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_ALERT_REPORT_SHA256=$(sha256sum "$report" | awk '{print $1}')"
          echo "LAS_ALERT_AUDIT_READY=YES"

      - name: Upload encrypted alert report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-source-alert
          path: ${{ runner.temp }}/source-alert-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
