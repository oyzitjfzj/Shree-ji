name: Private TLC94 canonical exact verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_TLC94_CANONICAL"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: b615bb5129b28292b237ff2bcf1bae3dbecfffac81f99bb6ea44e281272a57e6
  EXPECTED_TLC_PROFILE_COUNT: "129"
  TARGET_INDEX: "94"
  DIAG_CERT_PEM_B64: 
  RECIPIENT_CERT_FINGERPRINT: "30:62:25:1D:BA:92:DE:9E:FE:BB:07:BC:95:C4:D3:4B:FB:F3:FD:31:57:09:01:C1:32:A6:A5:E5:2D:20:B1:39"

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD

          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_TLC94_CANONICAL_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run exact canonical TLC94
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"

          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" \
            | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          test "$(wc -l < "$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"

          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -n "$cfg"
          test -n "$tla"
          test -z "$expectation"

          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/tlc94-canonical-private.log"

          args=(-workers auto -lncheck final -fp 0)
          if [[ "$deadlock" == "1" ]]; then
            args+=(-deadlock)
          fi
          args+=(-config "$cfg_base" "$tla_base")

          set +e
          (
            cd "$cfg_dir"
            timeout --signal=TERM --kill-after=15s 20700s \
              java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"
          ) >"$log" 2>&1
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches = re.findall(
              r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',
              text)
          if matches:
              g, d, q = matches[-1]
              print(g.replace(",", ""), d.replace(",", ""), q.replace(",", ""))
          else:
              print("0 0 0")
          PY
          )"
          read -r generated distinct queued <<< "$metrics"

          printf '%s\n' "$rc" > "$RUNNER_TEMP/tlc94-canonical.rc"
          echo "LAS_TLC94_CANONICAL_INDEX=$TARGET_INDEX"
          echo "LAS_TLC94_CANONICAL_GENERATED=$generated"
          echo "LAS_TLC94_CANONICAL_DISTINCT=$distinct"
          echo "LAS_TLC94_CANONICAL_QUEUE=$queued"
          echo "LAS_TLC94_CANONICAL_RC=$rc"

          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_TLC94_CANONICAL_RESULT=PASS"
          elif [[ "$rc" -eq 124 || "$rc" -eq 137 || "$rc" -eq 143 ]]; then
            echo "LAS_TLC94_CANONICAL_RESULT=UNVERIFIED_TIMEOUT"
          else
            echo "LAS_TLC94_CANONICAL_RESULT=FAIL"
          fi

      - name: Encrypt private TLC log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tlc94-canonical-private.log"
          test -s "$log"
          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/recipient-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$RECIPIENT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$log" \
            -out "$RUNNER_TEMP/tlc94-canonical-private.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"

      - name: Upload encrypted TLC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tlc94-canonical
          path: ${{ runner.temp }}/tlc94-canonical-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce exact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc_file="$RUNNER_TEMP/tlc94-canonical.rc"
          test -s "$rc_file"
          rc="$(cat "$rc_file")"
          test "$rc" -eq 0
