name: Private promotion transaction durability RED GREEN bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-transaction-durability-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 8ab68fe7f21c61e0d2bb0e45f6323b3d98031aed072bb0734c848e35a2652a44

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: red
            expected_snapshot_proof: 757b0d434cd694b5280c1f0f4ca0f35bde3046af74524d0020abd54406cddc75
            expected_verifier_blob: 962956190f31ac0c83d1e7ce55410ceeaa2ea2ad
            verifier: tools/verify_promotion_transaction_durability_red.sh
            expected_line_1: LAS_PROMOTION_DURABILITY_RED=OBSERVED
            expected_line_2: LAS_PROMOTION_DURABILITY_RED_ERROR_COUNT=2
          - mode: green
            expected_snapshot_proof: 8b617a8f8514bab00a9882d50bf721f0676b246e9cbd3d6ca63e28060f39abfb
            expected_verifier_blob: dd84ff741d2f4c56551d8ffaba7953a0837fe991
            verifier: tools/verify_promotion_transaction_durability_green.sh
            expected_line_1: LAS_PROMOTION_DURABILITY_GREEN=OBSERVED
            expected_line_2: LAS_PROMOTION_DURABILITY_GREEN_TESTS=1
          - mode: prepared_red
            expected_snapshot_proof: b8312c5d4c7cc3b71cd68862171852f005a1b408ff599c804038978e446eea1c
            expected_verifier_blob: 84db9c29fb0ec0f93bc9de141f47ef8be5aa8f1b
            verifier: tools/verify_promotion_transaction_prepared_restart_red.sh
            expected_line_1: LAS_PROMOTION_DURABILITY_PREPARED_RESTART_RED=OBSERVED
            expected_line_2: LAS_PROMOTION_DURABILITY_PREPARED_RESTART_RED_TESTS=1
          - mode: prepared_green
            expected_snapshot_proof: 36dc98a2b84353b73f57f357b4b2a601eb3412f3275606693cd1a4cc93c606c0
            expected_verifier_blob: d356135098ca3ca95a8c3193ac455b50a8ccc05d
            verifier: tools/verify_promotion_transaction_prepared_restart_green.sh
            expected_line_1: LAS_PROMOTION_DURABILITY_PREPARED_RESTART_GREEN=OBSERVED
            expected_line_2: LAS_PROMOTION_DURABILITY_PREPARED_RESTART_GREEN_TESTS=1
          - mode: journal_red
            expected_snapshot_proof: 2471fcc210fe0a715b102cbb83e73366e853cd365c22e6e9b05f57c410fae2c8
            expected_verifier_blob: 178d4f0e6e0909f8d6b910c667beacc9741e3c2f
            verifier: tools/verify_promotion_journal_recovery_red.sh
            expected_line_1: LAS_PROMOTION_JOURNAL_RECOVERY_RED=OBSERVED
            expected_line_2: LAS_PROMOTION_JOURNAL_RECOVERY_RED_ERROR_COUNT=1
          - mode: journal_green
            expected_snapshot_proof: a207e978bd4c0cbe5beed1c465bd48fa5fda4660ecbb96d2421617971ec20aea
            expected_verifier_blob: e5443ce11d6b964a04cd5226c81ec2ed3e5e6a55
            verifier: tools/verify_promotion_journal_recovery_green.sh
            expected_line_1: LAS_PROMOTION_JOURNAL_RECOVERY_GREEN=OBSERVED
            expected_line_2: LAS_PROMOTION_JOURNAL_RECOVERY_GREEN_TESTS=4
    env:
      MODE: ${{ matrix.mode }}
      EXPECTED_PRIVATE_SNAPSHOT_PROOF: ${{ matrix.expected_snapshot_proof }}
      EXPECTED_VERIFIER_BLOB: ${{ matrix.expected_verifier_blob }}
      VERIFIER: ${{ matrix.verifier }}
      EXPECTED_LINE_1: ${{ matrix.expected_line_1 }}
      EXPECTED_LINE_2: ${{ matrix.expected_line_2 }}

    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object "$VERIFIER")" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_DURABILITY_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Execute private verifier and publish only sanitized result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          out="$RUNNER_TEMP/promotion-durability-${MODE}.out"
          set +e
          bash "$VERIFIER" >"$out" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "LAS_PROMOTION_DURABILITY_BRIDGE_MODE=$MODE"
            if [[ "$MODE" == "green" ]]; then
              stage="$(grep -E '^LAS_PROMOTION_DURABILITY_GREEN_STAGE=(FORMAT|TEST)$' "$out" | head -n 1 || true)"
              if [[ -n "$stage" ]]; then echo "$stage"; fi
              if [[ "$stage" == 'LAS_PROMOTION_DURABILITY_GREEN_STAGE=FORMAT' ]]; then
                grep -E '^LAS_PROMOTION_DURABILITY_FORMAT_(IMPLEMENTATION|TEST)_(CHANGED=[01]|HUNKS=(NONE|[0-9:,>]+))$' "$out"
              fi
            elif [[ "$MODE" == "prepared_green" ]]; then
              stage="$(grep -E '^LAS_PROMOTION_DURABILITY_PREPARED_RESTART_GREEN_STAGE=(FORMAT|TEST)$' "$out" | head -n 1 || true)"
              if [[ -n "$stage" ]]; then echo "$stage"; fi
              if [[ "$stage" == 'LAS_PROMOTION_DURABILITY_PREPARED_RESTART_GREEN_STAGE=FORMAT' ]]; then
                grep -E '^LAS_PROMOTION_DURABILITY_PREPARED_FORMAT_(IMPLEMENTATION|TEST)_(CHANGED=[01]|HUNKS=(NONE|[0-9:,>]+))$' "$out"
              fi
            elif [[ "$MODE" == "journal_green" ]]; then
              stage="$(grep -E '^LAS_PROMOTION_JOURNAL_RECOVERY_GREEN_STAGE=(FORMAT|TEST)$' "$out" | head -n 1 || true)"
              if [[ -n "$stage" ]]; then echo "$stage"; fi
              if [[ "$stage" == 'LAS_PROMOTION_JOURNAL_RECOVERY_GREEN_STAGE=FORMAT' ]]; then
                module='src/defence_evolution/promotion_transaction_journal.rs'
                test_file='src/defence_evolution/promotion_journal_recovery_red_tests.rs'
                registry='src/defence_evolution/mod.rs'
                rustfmt +1.98.1 --edition 2024 "$module" "$test_file" >/dev/null 2>&1 || true
                rustfmt +1.98.1 --edition 2024 --config skip_children=true "$registry" >/dev/null 2>&1 || true
                for spec in "MODULE:$module" "TEST:$test_file" "REGISTRY:$registry"; do
                  label="${spec%%:*}"
                  path="${spec#*:}"
                  changed=0
                  if ! git diff --quiet -- "$path"; then changed=1; fi
                  hunks="$(git diff --unified=0 -- "$path" | python3 -c 'import re,sys; ms=[re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", line) for line in sys.stdin]; xs=["%s:%s>%s:%s" % (m.group(1), m.group(2) or "1", m.group(3), m.group(4) or "1") for m in ms if m]; print(",".join(xs) if xs else "NONE")')"
                  echo "LAS_PROMOTION_JOURNAL_FORMAT_${label}_CHANGED=$changed"
                  echo "LAS_PROMOTION_JOURNAL_FORMAT_${label}_HUNKS=$hunks"
                done
              fi
            fi
            rm -f "$out"
            echo 'LAS_PROMOTION_DURABILITY_BRIDGE=VERIFIER_FAILED'
            exit 1
          fi
          grep -Fxq "$EXPECTED_LINE_1" "$out"
          grep -Fxq "$EXPECTED_LINE_2" "$out"
          rm -f "$out"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_DURABILITY_BRIDGE_MODE=$MODE"
          echo "$EXPECTED_LINE_1"
          echo "$EXPECTED_LINE_2"
          echo 'LAS_PROMOTION_DURABILITY_BRIDGE=PASS'
