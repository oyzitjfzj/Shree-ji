name: Export pinned rustfmt 1.98.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-rustfmt-1-98-1.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install and pack pinned rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          toolchain="$(rustup +1.98.1 which rustfmt)"
          rustfmt +1.98.1 --version
          root="$RUNNER_TEMP/rustfmt-root"
          mkdir -p "$root/lib"
          cp "$toolchain" "$root/rustfmt"
          driver="$(ldd "$toolchain" | awk '/librustc_driver-/{print $3; exit}')"
          llvm="$(ldd "$toolchain" | awk '/libLLVM\.so/{print $3; exit}')"
          test -f "$driver"
          test -f "$llvm"
          cp "$driver" "$root/lib/"
          cp "$llvm" "$root/lib/"
          ldd "$toolchain" > "$root/ldd.txt"
          sha256sum "$toolchain" "$driver" "$llvm" > "$root/sha256.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/rustfmt-1.98.1-linux-x64.tar.gz" rustfmt-root
          echo "LAS_RUSTFMT_BUNDLE_SIZE=$(stat -c%s "$RUNNER_TEMP/rustfmt-1.98.1-linux-x64.tar.gz")"
          echo "LAS_RUSTFMT_BUNDLE_SHA256=$(sha256sum "$RUNNER_TEMP/rustfmt-1.98.1-linux-x64.tar.gz" | awk '{print $1}')"
      - name: Upload packed rustfmt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustfmt-1.98.1-linux-x64-packed
          path: ${{ runner.temp }}/rustfmt-1.98.1-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
