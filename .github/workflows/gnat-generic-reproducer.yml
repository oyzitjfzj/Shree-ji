name: GNAT generic field reproducer

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_REPRO"

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact Ada toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            -o "$RUNNER_TEMP/alr.zip" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $RUNNER_TEMP/alr.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/alr"
          unzip -q "$RUNNER_TEMP/alr.zip" -d "$RUNNER_TEMP/alr"
          export PATH="$RUNNER_TEMP/alr/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          echo "$RUNNER_TEMP/alr/bin" >> "$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/alr-ws"
          (cd "$RUNNER_TEMP/alr-ws" && alr -n init --in-place --no-skel --lib gnat_repro_toolchain >/dev/null)

      - name: Compile minimal variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/repro"
          mkdir -p "$root"

          run_case() {
            local name="$1"
            local slot_decl="$2"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro is
          private
             $slot_decl
             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              head -80 "$dir/build.log" || true
            fi
          }

          run_case subtype "subtype Slot_Reference is Natural range 0 .. Max_Items;"
          run_case bounded_type "type Slot_Reference is range 0 .. Max_Items;"
          run_case derived_type "type Slot_Reference is new Natural range 0 .. Max_Items;"

          run_visible_case() {
            local name="$1"
            local slot_decl="$2"
            local slot_field="$3"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro is
             type Handle is private;
          private
             $slot_decl
             type Handle is record
                Domain : Natural := 0;
                Slot   : $slot_field := 0;
             end record;
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              head -80 "$dir/build.log" || true
            fi
          }

          run_visible_case visible_private_subtype "subtype Slot_Reference is Natural range 0 .. Max_Items;" "Slot_Reference"
          run_visible_case visible_private_derived "type Slot_Reference is new Natural range 0 .. Max_Items;" "Slot_Reference"
          run_visible_case visible_private_direct "" "Natural range 0 .. Max_Items"
          run_private_view_case() {
            local name="$1"
            local slot_decl="$2"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro is
             type Handle is private;
          private
             $slot_decl
             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              grep -E "GNAT BUG DETECTED|Error detected at|error:" "$dir/build.log" | head -40 || true
            fi
          }

          run_private_view_case private_view_subtype "subtype Slot_Reference is Natural range 0 .. Max_Items;"
          run_private_view_case private_view_derived "type Slot_Reference is new Natural range 0 .. Max_Items;"

          run_body_case() {
            local name="$1"
            local mode="$2"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            local visible_extra=""
            local model_decl=""
            local model_body=""
            if [[ "$mode" == "constant" || "$mode" == "ghost" ]]; then
              visible_extra="No_Handle : constant Handle;"
            fi
            if [[ "$mode" == "ghost" ]]; then
              model_decl='package Model with Ghost is
             function Slot (Value : Handle) return Natural
               with Global => null;
          end Model;'
              model_body='package body Model is
             function Slot (Value : Handle) return Natural is
               (Natural (Value.Slot));
          end Model;'
            fi
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro is
             type Handle is private;
             $visible_extra
             function Slot_Of (Value : Handle) return Natural
               with Post => Slot_Of'Result <= Max_Items;
             $model_decl
          private
             type Slot_Reference is new Natural range 0 .. Max_Items;
             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;
             No_Handle_Private : constant Handle := (Domain => 0, Slot => 0);
          end Repro;
          EOF
            if [[ "$mode" == "constant" || "$mode" == "ghost" ]]; then
              python3 - "$dir/repro.ads" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
              "No_Handle_Private : constant Handle := (Domain => 0, Slot => 0);",
              "No_Handle : constant Handle := (Domain => 0, Slot => 0);"
          )
          p.write_text(s)
          PY
            fi
            cat > "$dir/repro.adb" <<EOF
          package body Repro is
             function Slot_Of (Value : Handle) return Natural is
               (Natural (Value.Slot));
             $model_body
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              grep -E "GNAT BUG DETECTED|Error detected at|error:" "$dir/build.log" | head -50 || true
            fi
          }

          run_body_case body_derived plain
          run_body_case body_deferred_constant constant
          run_body_case body_ghost ghost

          run_extended_case() {
            local name="$1"
            local mode="$2"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            local pkg_aspects=""
            local machine_visible=""
            local machine_private=""
            if [[ "$mode" == "spark" || "$mode" == "machine" ]]; then
              pkg_aspects=" with SPARK_Mode, Always_Terminates"
            fi
            if [[ "$mode" == "machine" ]]; then
              machine_visible="type Machine is limited private;"
              machine_private='type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Last  : Handle := No_Handle;
             end record;'
            fi
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro$pkg_aspects is
             type Handle is private;
             No_Handle : constant Handle;
             $machine_visible
             function Slot_Of (Value : Handle) return Natural
               with Post => Slot_Of'Result <= Max_Items;
             package Model with Ghost is
                function Slot (Value : Handle) return Natural
                  with Global => null;
             end Model;
          private
             type Slot_Reference is new Natural range 0 .. Max_Items;
             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             $machine_private
          end Repro;
          EOF
            cat > "$dir/repro.adb" <<'EOF'
          package body Repro is
             function Slot_Of (Value : Handle) return Natural is
               (Natural (Value.Slot));
             package body Model is
                function Slot (Value : Handle) return Natural is
                  (Natural (Value.Slot));
             end Model;
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              grep -E "GNAT BUG DETECTED|Error detected at|error:" "$dir/build.log" | head -60 || true
            fi
          }

          run_extended_case extended_plain plain
          run_extended_case extended_spark spark
          run_extended_case extended_machine machine

          run_array_case() {
            local name="$1"
            local with_model="$2"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            local model_decl=""
            local model_body=""
            if [[ "$with_model" == "yes" ]]; then
              model_decl='package Model with Ghost is
                subtype Model_Index is Positive range 1 .. Max_Items;
                subtype Parent_Ref is Natural range 0 .. Max_Items;
                type Item_Model is record
                   Parent : Parent_Ref := 0;
                end record;
                type Item_Model_Array is array (Model_Index) of Item_Model;
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                   Items : Item_Model_Array;
                end record;
                function Slot (Value : Handle) return Natural with Global => null;
             end Model;'
              model_body='package body Model is
                function Slot (Value : Handle) return Natural is
                  (Natural (Value.Slot));
             end Model;'
            fi
            cat > "$dir/repro.ads" <<EOF
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             No_Handle : constant Handle;
             type Machine is limited private;
             $model_decl
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             type Slot_Reference is new Natural range 0 .. Max_Items;
             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Item_Record is record
                Parent : Slot_Reference := 0;
             end record;
             type Item_Array is array (Slot_Index) of Item_Record;
             type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Items : Item_Array;
             end record;
          end Repro;
          EOF
            cat > "$dir/repro.adb" <<EOF
          package body Repro is
             $model_body
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              grep -E "GNAT BUG DETECTED|Error detected at|error:" "$dir/build.log" | head -80 || true
            fi
          }

          run_array_case array_machine no
          run_array_case array_machine_ghost yes

          run_contract_case() {
            local name="$1"
            local dir="$root/$name"
            mkdir -p "$dir/obj"
            cat > "$dir/repro.ads" <<'EOF'
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             No_Handle : constant Handle;
             type Machine is limited private;

             package Model with Ghost is
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                end record;

                function Snapshot (Value : Machine) return Machine_Model
                  with Global => null;

                function Transition
                  (Before : Machine_Model;
                   After  : Machine_Model;
                   Item   : Handle) return Boolean
                  with Global => null;
             end Model;

             procedure Install
               (State : in out Machine;
                Item  : out Handle)
               with Global => null,
                    Post =>
                      Model.Transition
                        (Model.Snapshot (State)'Old,
                         Model.Snapshot (State),
                         Item);
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             type Slot_Reference is new Natural range 0 .. Max_Items;

             type Handle is record
                Domain : Natural := 0;
                Slot   : Slot_Reference := 0;
             end record;

             No_Handle : constant Handle := (Domain => 0, Slot => 0);

             type Item_Record is record
                Parent : Slot_Reference := 0;
             end record;

             type Item_Array is array (Slot_Index) of Item_Record;

             type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Items : Item_Array;
             end record;
          end Repro;
          EOF
            cat > "$dir/repro.adb" <<'EOF'
          package body Repro is
             package body Model is
                function Snapshot (Value : Machine) return Machine_Model is
                  (Count => Value.Count);

                function Transition
                  (Before : Machine_Model;
                   After  : Machine_Model;
                   Item   : Handle) return Boolean
                is
                  (After.Count >= Before.Count
                   and then Natural (Item.Slot) <= Max_Items);
             end Model;

             procedure Install
               (State : in out Machine;
                Item  : out Handle)
             is
             begin
                Item := No_Handle;
             end Install;
          end Repro;
          EOF
            cat > "$dir/instance.ads" <<'EOF'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF
            cat > "$dir/repro.gpr" <<EOF
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022", "-gnatf", "-gnatwa", "-gnatwe", "-O2");
             end Compiler;
          end Repro_Project;
          EOF
            set +e
            (cd "$RUNNER_TEMP/alr-ws" && alr exec -- gprbuild -p -P "$dir/repro.gpr") >"$dir/build.log" 2>&1
            rc=$?
            set -e
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "GNAT_REPRO_"$upper"_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "GNAT_REPRO_"$upper"_ICE=YES"
            else
              echo "GNAT_REPRO_"$upper"_ICE=NO"
            fi
            if [[ "$rc" -ne 0 ]]; then
              grep -E "GNAT BUG DETECTED|Error detected at|error:" "$dir/build.log" | head -100 || true
            fi
          }

          run_contract_case contract_machine





