name: Temporary policy appraisal formal classifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-temp-policy-appraisal-classifier.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 89a4144b3ae57768e73379175432792165aff1526ffef09cc2c8824ba15c76a9
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 74eb6a52e32d65e61f59a0fefe891742cced74ce89294b1b1c177a500797e798

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/refs"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved=""
          while read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved"
          git checkout -q --detach "$resolved"
          actual="$(git rev-parse HEAD)"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_POLICY_CLASSIFIER_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth matched_ref resolved actual oid proof

      - name: Classify SANY and TLC failure safely
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT/spec/defence_evolution"
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             -o "$jar" "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $jar" | sha1sum --check --strict >/dev/null
          sany="$RUNNER_TEMP/sany.log"
          set +e
          java -cp "$jar" tla2sany.SANY FormalProofPolicyAppraisal.tla >"$sany" 2>&1
          sany_rc=$?
          set -e
          echo "LAS_POLICY_CLASSIFIER_SANY_RC=$sany_rc"
          python3 - "$sany" <<'PY'
          import hashlib,re,sys
          text=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          locs=re.findall(r'(?:line|Line)\s+([0-9]+)(?:,\s*(?:col|column)\s+([0-9]+))?',text)
          if locs:
              print("LAS_POLICY_CLASSIFIER_SANY_LINE="+locs[-1][0])
              print("LAS_POLICY_CLASSIFIER_SANY_COL="+(locs[-1][1] or "0"))
          categories=[]
          low=text.lower()
          for key,needle in [
              ("PARSE","parse error"),("SEMANTIC","semantic error"),
              ("UNKNOWN_OPERATOR","unknown operator"),("LEVEL","level error"),
              ("MODULE","module"),("EXPECTING","expecting")]:
              if needle in low: categories.append(key)
          print("LAS_POLICY_CLASSIFIER_SANY_CATEGORIES="+(",".join(categories) or "NONE"))
          errors=[ln.strip() for ln in text.splitlines() if "error" in ln.lower()]
          if errors:
              norm=re.sub(r'\s+',' ',errors[-1])
              norm=re.sub(r'[^A-Za-z0-9_ :,.()\[\]{}<>+=*/\\-]','?',norm)
              print("LAS_POLICY_CLASSIFIER_SANY_ERROR_SHA256="+hashlib.sha256(norm.encode()).hexdigest())
          PY
          if [[ "$sany_rc" -ne 0 ]]; then
            exit 0
          fi
          tlc="$RUNNER_TEMP/tlc.log"
          set +e
          java -XX:+UseParallelGC -jar "$jar" -workers auto -lncheck final -fp 0             -config FormalProofPolicyAppraisal.cfg FormalProofPolicyAppraisal.tla >"$tlc" 2>&1
          tlc_rc=$?
          set -e
          echo "LAS_POLICY_CLASSIFIER_TLC_RC=$tlc_rc"
          python3 - "$tlc" <<'PY'
          import hashlib,re,sys
          text=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          m=re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',text)
          if m:
              g,d,q=m[-1]
              print("LAS_POLICY_CLASSIFIER_GENERATED="+g.replace(",",""))
              print("LAS_POLICY_CLASSIFIER_DISTINCT="+d.replace(",",""))
              print("LAS_POLICY_CLASSIFIER_QUEUE="+q.replace(",",""))
          inv=re.findall(r'Invariant ([^\n]+?) is violated',text)
          if inv:
              print("LAS_POLICY_CLASSIFIER_INVARIANT_SHA256="+hashlib.sha256(inv[-1].strip().encode()).hexdigest())
          locs=re.findall(r'(?:line|Line)\s+([0-9]+)(?:,\s*(?:col|column)\s+([0-9]+))?',text)
          if locs:
              print("LAS_POLICY_CLASSIFIER_TLC_LINE="+locs[-1][0])
              print("LAS_POLICY_CLASSIFIER_TLC_COL="+(locs[-1][1] or "0"))
          PY
          exit 0
