name: Private ephemeral rustfmt patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ephemeral-rustfmt-patch.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact hidden private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          EXPECTED_PRIVATE_SNAPSHOT_PROOF: 68d5a4cd034dcfa280334426ea7c61295c8ff48cb8a97cef8b970a5f32ac03bb
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=250 origin '+refs/heads/*:refs/remotes/origin/*'
          actual=""
          while IFS= read -r oid; do
            [[ -n "$oid" ]] || continue
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              actual="$oid"
              break
            fi
          done < <(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u)
          test -n "$actual"
          echo "::add-mask::$actual"
          git checkout -q --detach "$actual"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FMT_SOURCE_PROOF=$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          unset PRIVATE_TOKEN auth actual

      - name: Apply exact pinned rustfmt and encrypt patch
        shell: bash
        env:
          RECIPIENT_CERT_B64: 
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          git diff --no-ext-diff --binary --             src/defence_evolution/evaluation_material_bundle.rs             src/defence_evolution/historical_incident_material.rs             > "$RUNNER_TEMP/rustfmt.patch"
          test -s "$RUNNER_TEMP/rustfmt.patch"
          printf '%s' "$RECIPIENT_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$RUNNER_TEMP/rustfmt.patch"             -out "$RUNNER_TEMP/rustfmt.patch.cms"             "$RUNNER_TEMP/cert.pem"
          echo "LAS_FMT_PATCH_SHA256=$(sha256sum "$RUNNER_TEMP/rustfmt.patch" | awk '{print $1}')"

      - name: Upload encrypted patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
