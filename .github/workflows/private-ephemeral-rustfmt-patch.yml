name: Private ephemeral rustfmt patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ephemeral-rustfmt-patch.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact hidden private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          EXPECTED_PRIVATE_SNAPSHOT_PROOF: de601594a9664154dfdc9b90effab6f3144b3506dd9a2c41fe454f5f02c38d40
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=250 origin '+refs/heads/*:refs/remotes/origin/*'
          actual=""
          while IFS= read -r oid; do
            [[ -n "$oid" ]] || continue
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              actual="$oid"
              break
            fi
          done < <(git rev-list --all --max-count=4096 | sort -u)
          test -n "$actual"
          echo "::add-mask::$actual"
          git checkout -q --detach "$actual"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FMT_SOURCE_PROOF=$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          unset PRIVATE_TOKEN auth actual

      - name: Apply exact pinned rustfmt and encrypt patch
        shell: bash
        env:
          RECIPIENT_CERT_B64: 
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          git diff --unified=0 --no-ext-diff -- '*.rs' \
            | grep '^@@' | cut -d' ' -f2-3 | sed 's/^/LAS_FMT_HUNK=/'
          git diff --no-ext-diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.patch"
          test -s "$RUNNER_TEMP/rustfmt.patch"
          cat > "$RUNNER_TEMP/cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDNTCCAh2gAwIBAgIULVSrAWYAvY3CeInmUx2xkX3J8SIwDQYJKoZIhvcNAQEL
          BQAwKjEoMCYGA1UEAwwfTEFTIGVwaGVtZXJhbCBydXN0Zm10IHJlY2lwaWVudDAe
          Fw0yNjEwMDIwMDE1MDJaFw0yNjEwMDMwMDE1MDJaMCoxKDAmBgNVBAMMH0xBUyBl
          cGhlbWVyYWwgcnVzdGZtdCByZWNpcGllbnQwggEiMA0GCSqGSIb3DQEBAQUAA4IB
          DwAwggEKAoIBAQC18YJArofPB7AbPuqt7261evj6w7If+pwnB3NbYf/g69URW0L2
          S8zagoYD07A1g8QAL7U49wudMQQpYNydUpKONx+5NFrcKVVaVk3DHvWbuJRA0qv0
          b02LZRxjg8zoUp5h0gzioYAHAQTrZosAU2jGB1D6VsriA7FaSui3ze30GCBQcq2H
          KTAvM/zW5vIJlFKQC2LMhGvZRfOjwu2onH9nu0+7Oyrn6D5Idna2tukB8GwjXktw
          Nuu3g49OlaBAVYDd8WCbFAOftcD4dWGEXSjddMfawdWANApJrzbc1RoTjP3L1ViK
          4zFn+oBz0xb1AlLxgAu35F2CPHyPO96FwEoFAgMBAAGjUzBRMB0GA1UdDgQWBBTf
          NYrVXD5C6jUVcjjptq/KaNex3DAfBgNVHSMEGDAWgBTfNYrVXD5C6jUVcjjptq/K
          aNex3DAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQAk9txiya/A
          jYbOYYM9MHmor0tfEY5BX/0rTyBPVmFSTRyxs5eURj0eLof0x+AtOwrlFU/mCN3R
          VgLBR4drZv44R1nFA4FauZpT16mJOa67SDvubsqbwQE6uR/fs57F8yaO1U7K7yqp
          3trtZu7J9iB/gyB9SRtj5Qx6CrhCXR4PrPnx9FftU27ptOEAelalZ65T/lCZYo3S
          H7WAiQGyRpXOf9RiJSxwSAAJRpby/8ZPMzSS0s4l6EfvvARIBVgMmPvIUnmMGq0J
          sQ8SmTSPtHamHPw9mjKKpY/8wq70nSlfv8Jf2shQ2zSf1spb09HqXG99/wVgnGKp
          qpeYtvMZD9kI
          -----END CERTIFICATE-----
          CERT
          sed -i 's/^          //' "$RUNNER_TEMP/cert.pem"
          openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout >/dev/null
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$RUNNER_TEMP/rustfmt.patch"             -out "$RUNNER_TEMP/rustfmt.patch.cms"             "$RUNNER_TEMP/cert.pem"
          echo "LAS_FMT_PATCH_SHA256=$(sha256sum "$RUNNER_TEMP/rustfmt.patch" | awk '{print $1}')"

      - name: Diagnose formatted private compile and encrypt log
        shell: bash
        env:
          RECIPIENT_CERT_B64: 
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/formatted-compile.log"
          set +e
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --no-run --message-format=json >"$log" 2>&1
          rc=$?
          set -e
          cp "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/compile-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/compile-cert.pem" -noout >/dev/null
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$log" \
            -out "$RUNNER_TEMP/formatted-compile.cms" \
            "$RUNNER_TEMP/compile-cert.pem"
          echo "LAS_FMT_COMPILE_RC=$rc"
          echo "LAS_FMT_COMPILE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/compile-cert.pem" "$log"

      - name: Upload encrypted formatted compile diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-formatted-compile
          path: ${{ runner.temp }}/formatted-compile.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
