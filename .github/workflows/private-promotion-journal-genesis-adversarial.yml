name: Private promotion journal genesis adversarial

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-journal-genesis-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 36e21d1f34a51e92cdfdfce07e673abea6ea954f6e181312fce4ffe2858018a9
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 416c44c77a26671b77cfb906f769a6c52c266076e7eb71443761ec45f7c338b3
  EXPECTED_VERIFIER_BLOB: 5e70b975dd68cfa087546357378b5b38566e58f9
  VERIFIER: tools/verify_promotion_journal_genesis_adversarial.sh

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add rustfmt --toolchain 1.98.1
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object "$VERIFIER")" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Verify exact adversarial closure and publish sanitized result
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          out="$RUNNER_TEMP/promotion-journal-genesis-adversarial.out"
          set +e
          bash "$VERIFIER" >"$out" 2>&1
          rc=$?
          set -e
          surface="$(grep -E '^LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_SURFACE=' "$out" | tail -n 1 || true)"
          format="$(grep -E '^LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_FORMAT=' "$out" | tail -n 1 || true)"
          tests="$(grep -E '^LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_TESTS=' "$out" | tail -n 1 || true)"
          count_line="$(grep -E '^LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_TEST_COUNT=[1-9][0-9]*$' "$out" | tail -n 1 || true)"
          rm -f "$out"
          test -n "$surface"
          test -n "$format"
          echo "$surface"
          echo "$format"
          if [[ "$rc" -ne 0 ]]; then
            test -n "$tests" && echo "$tests"
            echo 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_BRIDGE=FAILED'
            exit 1
          fi
          test "$surface" = 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_SURFACE=PASS'
          test "$tests" = 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_TESTS=PASS'
          test -n "$count_line"
          echo "$tests"
          echo "$count_line"
          if [[ "$format" != 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_FORMAT=PASS' ]]; then
            echo 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_BRIDGE=FAILED'
            exit 1
          fi
          echo 'LAS_PROMOTION_JOURNAL_GENESIS_ADVERSARIAL_BRIDGE=PASS'
