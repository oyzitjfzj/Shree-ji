name: Private formal scratch verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_FORMAL_SCRATCH"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 8c5d89395dce99d7ca67ae038c060b347347a0e966a48858974a61765f5019fb
  DIAG_CERT_PEM_B64: 

jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact isolated private scratch head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth"             fetch -q --depth=1 origin refs/heads/scratch/replay-selection-session-formal-20260924
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FORMAL_SCRATCH_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run isolated exact TLC model
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          cd "$ROOT/spec/adaptive_defence"
          log="$RUNNER_TEMP/formal-scratch-private.log"
          set +e
          java -XX:+UseParallelGC -jar "$TLA_JAR"             -workers auto -lncheck final -fp 0             -config PredictionErrorReplaySelectionSession.cfg             PredictionErrorReplaySelectionSession.tla >"$log" 2>&1
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches = re.findall(
              r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',
              text)
          if matches:
              g, d, q = matches[-1]
              print(g.replace(",", ""), d.replace(",", ""), q.replace(",", ""))
          else:
              print("0 0 0")
          PY
          )"
          read -r generated distinct queued <<< "$metrics"
          printf '%s\n' "$rc" > "$RUNNER_TEMP/formal-scratch.rc"
          echo "LAS_FORMAL_SCRATCH_GENERATED=$generated"
          echo "LAS_FORMAL_SCRATCH_DISTINCT=$distinct"
          echo "LAS_FORMAL_SCRATCH_QUEUE=$queued"
          echo "LAS_FORMAL_SCRATCH_RC=$rc"
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_FORMAL_SCRATCH_RESULT=PASS"
          else
            echo "LAS_FORMAL_SCRATCH_RESULT=FAIL"
          fi

      - name: Encrypt private TLC log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/formal-scratch-private.log"
          test -s "$log"
          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/recipient-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "55:16:6C:62:2D:06:4E:A7:CA:32:01:85:4B:11:7A:FA:35:39:4F:38:8C:1C:DD:BD:28:46:71:39:E8:2D:67:AC"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/formal-scratch-private.cms"             "$RUNNER_TEMP/recipient-cert.pem"

      - name: Upload encrypted formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-formal-scratch
          path: ${{ runner.temp }}/formal-scratch-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce exact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/formal-scratch.rc"
          test "$(cat "$RUNNER_TEMP/formal-scratch.rc")" -eq 0
