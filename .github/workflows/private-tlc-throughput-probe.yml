name: Private TLC throughput probe

on:
  push:
    branches: [main]
    paths:
      - "RUN_TLC_THROUGHPUT_PROBE"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4ce57d8da614ff1e60f229533bdaf145097db28a4549f4e937234edf6220e3a8
  EXPECTED_TLC_PROFILE_COUNT: "129"

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        index: [2]
        mode: [baseline, optimized]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TLC_PROBE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run bounded throughput probe
        shell: bash
        env:
          TARGET_INDEX: ${{ matrix.index }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          count="$(wc -l < "$map" | tr -d ' ')"
          test "$count" = "$EXPECTED_TLC_PROFILE_COUNT"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -z "$expectation"
          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"

          args=(-fp 0 -coverage 1)
          if [[ "$deadlock" == "1" ]]; then args+=(-deadlock); fi
          if [[ "$MODE" == "baseline" ]]; then
            java_args=(-XX:+UseParallelGC)
            args=(-workers 2 "${args[@]}" -config "$cfg_base" "$tla_base")
          else
            java_args=(-XX:+UseParallelGC)
            args=(-workers auto -lncheck final "${args[@]}" -config "$cfg_base" "$tla_base")
          fi

          log="$RUNNER_TEMP/tlc-probe-private.log"
          set +e
          (
            cd "$cfg_dir"
            timeout --signal=TERM --kill-after=15s 600s java "${java_args[@]}" -jar "$TLA_JAR" "${args[@]}"
          ) >"$log" 2>&1
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text=open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches=re.findall(r'([0-9,]+) states generated, ([0-9,]+) distinct states found, ([0-9,]+) states left on queue', text)
          if matches:
              g,d,q=matches[-1]
              print(g.replace(",",""), d.replace(",",""), q.replace(",",""))
          else:
              print("0 0 0")
          PY
          )"
          read -r generated distinct queued <<< "$metrics"
          echo "LAS_TLC_PROBE_INDEX=$TARGET_INDEX"
          echo "LAS_TLC_PROBE_MODE=$MODE"
          echo "LAS_TLC_PROBE_GENERATED=$generated"
          echo "LAS_TLC_PROBE_DISTINCT=$distinct"
          echo "LAS_TLC_PROBE_QUEUE=$queued"
          echo "LAS_TLC_PROBE_RC=$rc"

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUPT0qPUiwTHFEESuOPcX2gevAHx8wDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkTEFTIGN1cnJlbnQgc291cmNlIGFsZXJ0IGRpYWdub3N0
          aWNzMB4XDTI2MDkyMTIwMzM1NVoXDTI2MDkyMzIwMzM1NVowLzEtMCsGA1UEAwwk
          TEFTIGN1cnJlbnQgc291cmNlIGFsZXJ0IGRpYWdub3N0aWNzMIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEAoHjbiRixRY+QvrnOZMvyh5PmhdxArmMGcplR
          B4qNA+H6NWL0GCzvwecwrH0tYqybMP+C5b8a/UOPTOkEO77Ylw5hzAGpfR2l5Jda
          YLWh0ICXCutTeob1B13PAIkoMNxE9BAsRJ6ZlAaPQn6jT6B9zxas36I0ya9utwyV
          81Bex4HmvRnjg1Ef8iB34mGDIeLic3jUMlBnmw/E7l1OmkNvhY2eJk975fae/5GH
          gei0QCW0TR/t9yE0gWk64g/sW8BBjnmh9cH9qaNiOXkxW9qp4WO4af2DC3Ab9Jun
          PlzoIlxLJg6anl7K7mJKuMOZtMqFF2oLLB7jB3k8BIeVoe+33EWayciCyRzX1VDB
          0ngQXivwLIlQhvjboRfmInoXpJQ+/cb5287MJifX6OrUWUVJEv0lrHjc0Lo4u12/
          W/5/fpFHhr0jwNBwlmv9OHpcAO3eglajkO/hshaw1IWn+wVN/v3NFxC16y+UtblY
          Pgx4rLqQX5w3e5XJoYUU3y1/rWLPAgMBAAGjUzBRMB0GA1UdDgQWBBSni9T6WjU4
          3pVAGKy3/i63QGvRzzAfBgNVHSMEGDAWgBSni9T6WjU43pVAGKy3/i63QGvRzzAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQBS6fil31zun5PC9ORa
          CtDuWTXNEEmJ2TRaWexoTjv7yoNqc8NTy3ROn8XlPegH7yGgPd6WiuVIogFeQ3FS
          W3D+BPypKz9HwxpGFfiW/mFHGMaoScos8kwmjFdKyUJ3Pelq8SCxWF7zqdpXcDpx
          lL8XzzStXaKXYkNEwlko3q2DLl1xhOd8QyvtvM4J2rGcX8uc2w7XMFOFpGmk8hGs
          UweZGjMWVB/hrvSqnAhjTu9AAQae6Vvhb7rklAAnzY17foguTvfZZN1grRF7KXdx
          ZxM7mOOfnY4Sjsufqzoph7lqbJl5OMyb2WwKfxwfxvG5hHuBTrNChmxIok1K1CEc
          qQY4r5+6eXRpzoGUgPOX513LGX3ie4fS1sytan2ZgUkj8fQA8P/5bVXrehPZHQSz
          7YR1F310oKf0BHezjy0VhF69qgyDLc6ERyjxw+kEfThwyDcuCVdYqyRMKWOg/fpf
          1LV1TE8GpO9n69BpZlm3zIJgd8fBuMnYHZe4Dh0hC95lE6k=
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "7E:B3:01:3C:1F:34:6C:4B:33:9C:9B:BD:9B:22:9E:84:D1:10:22:A9:9D:E6:F4:15:C9:8A:0E:06:41:64:37:0C"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/tlc-probe-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          # rc 124/143 is expected for a time-boxed benchmark; 0 means the full profile even completed.
          if [[ "$rc" -eq 0 || "$rc" -eq 124 || "$rc" -eq 143 ]]; then
            exit 0
          fi
          exit "$rc"

      - name: Upload encrypted probe log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tlc-probe-${{ matrix.index }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/tlc-probe-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
