name: Private canonical wrapper preflight

on:
  push:
    branches: [verify/canonical-wrapper-preflight-20261008-v2]
    paths:
      - "RUN_CANONICAL_WRAPPER_PREFLIGHT"

permissions:
  contents: read

env:
  TARGET_REF_HASH: d4f273aa4f1b15eb90d6d3c97bf2c997a00952ea469e25c7fc06b059188e12dc
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 316922a1db7c7d8d8ddaf2c39e7bfd7a2e1a191a6eb8b59617fd306e2e1cde19
  EXPECTED_PRIVATE_TREE_PROOF: 1caa66138859a18a91a8ebe95132392af367221b9d5767eb5de7fa19b7ecd40d
  EXPECTED_BASE_VERIFIER_BLOB: 8ea6dbe77db10592baf8f56c9719626c36687f9a
  EXPECTED_HARDENED_WRAPPER_BLOB: ee5ec8b384547cf594aea3338e51b4dfae99e347

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recover exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" == "$EXPECTED_BASE_VERIFIER_BLOB"
          test "$(git hash-object tools/verification/run_canonical_verifier_hardened.sh)" == "$EXPECTED_HARDENED_WRAPPER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          git checkout -q -B verify-target "$actual"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CANONICAL_WRAPPER_EXACT_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Run hardened wrapper preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/canonical-wrapper-preflight.private.log"
          set +e
          /usr/bin/bash tools/verification/run_canonical_verifier_hardened.sh --preflight-only >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_CANONICAL_WRAPPER_PREFLIGHT_RC=$rc"
          echo "LAS_CANONICAL_WRAPPER_PREFLIGHT_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          if [[ "$rc" -ne 0 ]]; then
            rm -f "$log"
            echo "LAS_CANONICAL_WRAPPER_PREFLIGHT_RESULT=FAIL"
            exit 1
          fi
          grep -qx 'LAS_CANONICAL_VERIFIER_ENGINE_PIN=PASS' "$log"
          grep -qx 'LAS_CANONICAL_VERIFIER_ENGINE_SHA256_PIN=PASS' "$log"
          grep -qx 'LAS_CANONICAL_UNIQUE_WORKSPACE=PASS' "$log"
          grep -qx 'LAS_CANONICAL_TLA_SHA256_PIN=PASS' "$log"
          grep -qx 'LAS_CANONICAL_VERIFIER_HARDENING_PREFLIGHT=PASS' "$log"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -f "$log"
          echo "LAS_CANONICAL_WRAPPER_PREFLIGHT_RESULT=PASS"

      - name: Run fail-closed adversarial controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          wrapper="tools/verification/run_canonical_verifier_hardened.sh"
          base="tools/verify_codespaces_all.sh"

          expect_reject() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/${label}.private.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            echo "LAS_CANONICAL_CONTROL_${label}_RC=$rc"
            echo "LAS_CANONICAL_CONTROL_${label}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            if [[ "$rc" -eq 0 ]] || grep -q '^LAS_CANONICAL_VERIFIER_HARDENED=PASS$' "$log" || grep -q '^LAS_CANONICAL_VERIFIER_HARDENING_PREFLIGHT=PASS$' "$log"; then
              rm -f "$log"
              echo "LAS_CANONICAL_CONTROL_${label}=FAIL_OPEN"
              exit 1
            fi
            rm -f "$log"
            echo "LAS_CANONICAL_CONTROL_${label}=PASS"
          }

          cp "$base" "$RUNNER_TEMP/base-verifier.backup"
          printf '\n# adversarial verifier drift probe\n' >> "$base"
          expect_reject BASE_DRIFT /usr/bin/bash "$wrapper" --preflight-only
          cp "$RUNNER_TEMP/base-verifier.backup" "$base"
          test "$(git hash-object "$base")" == "$EXPECTED_BASE_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"

          touch .canonical-wrapper-untracked-probe
          expect_reject DIRTY_TREE /usr/bin/bash "$wrapper" --preflight-only
          rm -f .canonical-wrapper-untracked-probe
          test -z "$(git status --porcelain --untracked-files=all)"

          inside_tmp="$PWD/.canonical-wrapper-inside-tmp"
          expect_reject REPO_LOCAL_SCRATCH env RUNNER_TEMP="$inside_tmp" /usr/bin/bash "$wrapper" --preflight-only
          rm -rf "$inside_tmp"
          test -z "$(git status --porcelain --untracked-files=all)"

          fake_bin="$RUNNER_TEMP/canonical-wrapper-fake-bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out=""
          args=("$@")
          for ((i=0; i<${#args[@]}; i++)); do
            case "${args[$i]}" in
              -o|--output)
                (( i + 1 < ${#args[@]} )) || exit 2
                out="${args[$((i + 1))]}"
                ((i += 1))
                ;;
              --output=*) out="${args[$i]#--output=}" ;;
            esac
          done
          test -n "$out"
          printf 'corrupted-tla-artifact\n' > "$out"
          SH
          chmod 0700 "$fake_bin/curl"
          expect_reject CORRUPTED_TLA env PATH="$fake_bin:$PATH" /usr/bin/bash "$wrapper" --preflight-only
          rm -rf "$fake_bin"
          test -z "$(git status --porcelain --untracked-files=all)"

          expect_reject WRONG_BRANCH env LAS_VERIFY_EXPECTED_BRANCH=definitely-not-verify-target /usr/bin/bash "$wrapper"
          test -z "$(git status --porcelain --untracked-files=all)"

          echo "LAS_CANONICAL_WRAPPER_FAIL_CLOSED_CONTROLS=PASS"
