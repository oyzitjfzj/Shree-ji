name: Private assurance TLC39 quotient candidate diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_QUOTIENT_CANDIDATE_DIAGNOSTIC"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  TARGET_REF_HASH: cfea257f56be059e1f6565654924f01a5dfec581efba0bb7672a59c550ca03c1
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4d3899116e8d3d3e18e8d32f7e5b7aa64e450a7260dc4ead84a4fdb7304c18c8
  EXPECTED_TLC_PROFILE_COUNT: "203"
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  PROFILE_CFG_HASH: 186ddf4cbea68ae055b349ed7bb808aad5ed0146b3618b99754efa46c735e092
  REFINEMENT_CFG_HASH: 07deae307210aa4cd01cdf62d13a181345bb525783dd877e1d15c27c9a9abab0

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Reclaim runner storage
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/az /opt/hostedtoolcache/CodeQL; do
            [[ ! -e "$path" ]] || sudo rm -rf "$path"
          done
          sudo apt-get clean
          docker system prune --all --force >/dev/null 2>&1 || true
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_TLC39_QC_FREE_KB_START=$free_kb"
          test "$free_kb" -ge 31457280

      - name: Recover exact current quotient candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=64 FETCH_HEAD)
          test -n "$resolved"
          git checkout -q --detach "$resolved"
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$resolved"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_TLC39_QC_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash actual

      - name: Resolve canonical targets and run SANY
        id: map
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null
          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{', src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator unavailable")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY
          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" >"$map"
          count="$(wc -l <"$map" | tr -d ' ')"
          test "$count" = "$EXPECTED_TLC_PROFILE_COUNT"
          python3 - "$map" "$PROFILE_CFG_HASH" "$REFINEMENT_CFG_HASH" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, pathlib, sys
          map_path, h1, h2, out = sys.argv[1:]
          wanted = {h1: "profile", h2: "refinement"}
          found = {}
          lines = pathlib.Path(map_path).read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              cols = line.split("\t")
              if len(cols) < 4:
                  cols += [""] * (4-len(cols))
              cfg, tla, deadlock, expectation = cols[:4]
              digest = hashlib.sha256(cfg.encode()).hexdigest()
              if digest in wanted:
                  key = wanted[digest]
                  if key in found:
                      raise SystemExit("target resolved more than once")
                  found[key] = (i, cfg, tla, deadlock, expectation)
          if set(found) != {"profile", "refinement"}:
              raise SystemExit("canonical target missing")
          with open(out, "a", encoding="utf-8") as f:
              for key in ("profile", "refinement"):
                  i, cfg, tla, deadlock, expectation = found[key]
                  if expectation:
                      raise SystemExit("unexpected negative-control mapping")
                  f.write(f"{key}_index={i}\n")
                  f.write(f"{key}_line={i+1}\n")
          print("LAS_TLC39_QC_MAP_COUNT=" + str(len(lines)))
          print("LAS_TLC39_QC_PROFILE_INDEX=" + str(found["profile"][0]))
          print("LAS_TLC39_QC_REFINEMENT_INDEX=" + str(found["refinement"][0]))
          PY
          while IFS= read -r tla; do
            dir="$(dirname "$tla")"
            base="$(basename "$tla")"
            (cd "$dir"; java -cp "$TLA_JAR" tla2sany.SANY "$base" >/dev/null 2>&1)
          done < <(python3 - "$map" "$PROFILE_CFG_HASH" "$REFINEMENT_CFG_HASH" <<'PY'
          import hashlib, pathlib, sys
          path, *hashes = sys.argv[1:]
          wanted=set(hashes)
          seen=set()
          for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
              cols=line.split("\t")
              if len(cols) >= 2 and hashlib.sha256(cols[0].encode()).hexdigest() in wanted:
                  if cols[1] not in seen:
                      print(cols[1]); seen.add(cols[1])
          PY
          )
          echo "LAS_TLC39_QC_SANY=PASS"

      - name: Run exact quotient profile and refinement probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          map="$RUNNER_TEMP/tlc-map.tsv"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          run_one() {
            local label="$1" line_no="$2"
            local line cfg tla deadlock expectation cfg_dir cfg_base tla_base log rc
            line="$(sed -n "${line_no}p" "$map")"
            IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
            test -n "$cfg"; test -n "$tla"; test -z "$expectation"
            cfg_dir="$(dirname "$cfg")"; cfg_base="$(basename "$cfg")"; tla_base="$(basename "$tla")"
            log="$RUNNER_TEMP/${label}.log"
            args=(-workers auto -lncheck final -fp 0)
            [[ "$deadlock" == "1" ]] && args+=(-deadlock)
            args+=(-config "$cfg_base" "$tla_base")
            set +e
            (cd "$cfg_dir"; java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1
            rc=$?
            set -e
            echo "LAS_TLC39_QC_${label}_RC=$rc"
            python3 - "$log" "$label" <<'PY'
          import re, sys
          text=open(sys.argv[1],encoding="utf-8",errors="replace").read(); label=sys.argv[2]
          m=re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',text)
          if m:
              g,d,q=m[-1]
              print(f"LAS_TLC39_QC_{label}_GENERATED="+g.replace(",",""))
              print(f"LAS_TLC39_QC_{label}_DISTINCT="+d.replace(",",""))
              print(f"LAS_TLC39_QC_{label}_QUEUE="+q.replace(",",""))
          depth=re.findall(r'Search depth of complete state graph is ([0-9]+)',text)
          if depth: print(f"LAS_TLC39_QC_{label}_DEPTH="+depth[-1])
          PY
            test "$rc" -eq 0
            ! grep -Eiq 'Invariant .* is violated|Property .* is violated|Deadlock reached|Parsing or semantic analysis failed|SANY|parse error|semantic error|OutOfMemoryError|No space left on device|TLC threw an unexpected exception|TLC Bug|AssertionError' "$log"
            echo "LAS_TLC39_QC_${label}_RESULT=PASS"
          }
          run_one PROFILE "${{ steps.map.outputs.profile_line }}"
          run_one REFINEMENT "${{ steps.map.outputs.refinement_line }}"
          test -z "$(cd "$ROOT" && git status --porcelain --untracked-files=no)"
          echo "LAS_TLC39_QC_RESULT=PASS"
