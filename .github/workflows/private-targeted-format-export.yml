name: Private targeted format export

on:
  push:
    branches: [main]
    paths:
      - "RUN_TARGETED_FORMAT_EXPORT"

permissions:
  contents: read

env:
  FORMAT_CERT_B64: 
  FORMAT_CERT_FINGERPRINT: "6D:C5:BB:57:F6:E8:12:8A:7E:0B:65:FF:34:24:96:F7:7F:C8:02:2F:15:45:FC:BC:7F:BB:74:54:04:DB:DB:18"

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Load opaque target
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_TARGETED_FORMAT_EXPORT
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_TARGETED_FORMAT_EXPORT)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_TARGETED_FORMAT_EXPORT)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TARGETED_FORMAT_EXPORT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth matched_ref matched_sha actual

      - name: Run pinned formatter and seal changed Rust files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustc +1.98.1 --version --verbose
          cargo +1.98.1 --version
          rustup component list --toolchain 1.98.1 --installed | grep -q '^rustfmt-'
          rustup run 1.98.1 rustfmt --version
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          changed="$RUNNER_TEMP/format-paths"
          git diff --name-only > "$changed"
          test -s "$changed"
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) echo "LAS_TARGETED_FORMAT_EXPORT_SCOPE=FAIL"; exit 2 ;;
            esac
          done < "$changed"
          git diff --check
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.diff"
          test -s "$RUNNER_TEMP/rustfmt.diff"
          tar -czf "$RUNNER_TEMP/formatted.tar.gz" -T "$changed"
          printf '%s' "$FORMAT_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$FORMAT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/formatted.tar.gz" \
            -out "$RUNNER_TEMP/formatted.cms" "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/rustfmt.diff" \
            -out "$RUNNER_TEMP/rustfmt-diff.cms" "$RUNNER_TEMP/cert.pem"
          echo "LAS_TARGETED_FORMAT_EXPORT_FILES=$(wc -l < "$changed" | tr -d ' ')"
          echo "LAS_TARGETED_FORMAT_EXPORT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted.cms" | awk '{print $1}')"
          echo "LAS_TARGETED_FORMAT_DIFF_SHA256=$(sha256sum "$RUNNER_TEMP/rustfmt-diff.cms" | awk '{print $1}')"

      - name: Emit source-free rustfmt hunk coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          while IFS= read -r path; do
            path_hash="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            echo "LAS_FMT_HUNK_FILE=$path_hash"
            git diff --unified=0 -- "$path" \
              | grep '^@@' \
              | sed -E "s#^@@ ([^@]+) @@.*#LAS_FMT_HUNK_COORD=$path_hash:\1#" || true
          done < "$RUNNER_TEMP/format-paths"

      - name: Emit source-free rustfmt safe edit metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess

          SAFE = set(b" \t\r\n\v\f,;(){}[]")

          def decompose(data: bytes):
              anchors = bytearray()
              gaps = {}
              i = 0
              while i < len(data):
                  if data[i] in SAFE:
                      start = i
                      pos = len(anchors)
                      while i < len(data) and data[i] in SAFE:
                          i += 1
                      gaps[pos] = (start, i, data[start:i])
                  else:
                      anchors.append(data[i])
                      i += 1
              return bytes(anchors), gaps

          def insertion_offset(original: bytes, logical_pos: int, anchor_len: int) -> int:
              if logical_pos == anchor_len:
                  return len(original)
              seen = 0
              for idx, byte in enumerate(original):
                  if byte not in SAFE:
                      if seen == logical_pos:
                          return idx
                      seen += 1
              raise RuntimeError("logical anchor position not found")

          changed = pathlib.Path(os.environ["RUNNER_TEMP"]) / "format-paths"
          total_files = 0
          total_edits = 0

          for path in filter(None, (x.strip() for x in changed.read_text().splitlines())):
              original = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              formatted = pathlib.Path(path).read_bytes()
              orig_anchor, orig_gaps = decompose(original)
              fmt_anchor, fmt_gaps = decompose(formatted)
              path_hash = hashlib.sha256(path.encode()).hexdigest()

              if orig_anchor != fmt_anchor:
                  print(f"LAS_FMT_SAFE_ONLY_FILE={path_hash}:NO")
                  print(f"LAS_FMT_SAFE_ORIG_ANCHOR_SHA256={hashlib.sha256(orig_anchor).hexdigest()}")
                  print(f"LAS_FMT_SAFE_FMT_ANCHOR_SHA256={hashlib.sha256(fmt_anchor).hexdigest()}")
                  raise SystemExit(41)

              edits = []
              for pos in sorted(set(orig_gaps) | set(fmt_gaps)):
                  if pos in orig_gaps:
                      start, end, old_gap = orig_gaps[pos]
                  else:
                      start = end = insertion_offset(original, pos, len(orig_anchor))
                      old_gap = b""
                  new_gap = fmt_gaps.get(pos, (0, 0, b""))[2]
                  if old_gap != new_gap:
                      edits.append((start, end, new_gap))

              rebuilt = bytearray(original)
              for start, end, new_gap in sorted(edits, reverse=True):
                  rebuilt[start:end] = new_gap
              if bytes(rebuilt) != formatted:
                  print(f"LAS_FMT_SAFE_REBUILD={path_hash}:FAIL")
                  raise SystemExit(42)

              print(f"LAS_FMT_SAFE_FILE={path_hash}:{len(edits)}")
              for start, end, new_gap in edits:
                  print(
                      "LAS_FMT_SAFE_EDIT="
                      + path_hash
                      + f":{start}:{end}:"
                      + base64.b64encode(new_gap).decode()
                  )
              total_files += 1
              total_edits += len(edits)

          print("LAS_FMT_SAFE_ONLY=YES")
          print(f"LAS_FMT_SAFE_FILES={total_files}")
          print(f"LAS_FMT_SAFE_EDITS={total_edits}")
          PY

      - name: Diagnose formatted private compile without accepting formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/formatted-check.log"
          set +e
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --message-format=json >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_FORMATTED_CHECK_RC=$rc"
          python3 - "$log" <<'PY'
          import hashlib, json, sys
          seen = set()
          with open(sys.argv[1], "r", encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get("reason") != "compiler-message":
                      continue
                  message = obj.get("message") or {}
                  if message.get("level") != "error":
                      continue
                  code = ((message.get("code") or {}).get("code") or "NO_CODE")
                  spans = [s for s in (message.get("spans") or []) if s.get("is_primary")]
                  if not spans:
                      key = (code, "NO_SPAN", 0, 0)
                  else:
                      span = spans[0]
                      name = span.get("file_name") or ""
                      path_hash = hashlib.sha256(name.encode()).hexdigest()
                      key = (code, path_hash, span.get("line_start") or 0, span.get("column_start") or 0)
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f"LAS_FORMATTED_DIAG={key[0]}:{key[1]}:{key[2]}:{key[3]}")
          print(f"LAS_FORMATTED_DIAG_COUNT={len(seen)}")
          PY
          grep -oE 'error\[E[0-9]+\]' "$log" | sort -u | sed -E 's/error\[([^]]+)\]/LAS_FORMATTED_RUST_CODE_SAFE=\1/' || true
          grep -oE 'error\\[E[0-9]+\\]' "$log" \
            | sort -u \
            | sed -E 's/error\\[([^]]+)\\]/LAS_FORMATTED_RUST_ERROR_CODE=\\1/' || true
          first_error="$(grep -m1 -E '^error(\\[[^]]+\\])?:' "$log" || true)"
          if [[ -n "$first_error" ]]; then
            normalized="$(printf '%s' "$first_error" | sed -E 's#(/[^ ]+)+#<PATH>#g')"
            echo "LAS_FORMATTED_FIRST_ERROR_HASH=$(printf '%s' "$normalized" | sha256sum | awk '{print $1}')"
            safe_template="$(printf '%s' "$first_error" | python3 -c 'import re,sys; s=sys.stdin.read(); s=re.sub(r"\x1b\\[[0-9;]*m","",s); s=re.sub(r"(/[^ :]+)+","<PATH>",s); s=re.sub(r"\x60[^\x60]+\x60","<ID>",s); s=re.sub(r"\x27[^\x27]+\x27","<ID>",s); s=re.sub(r"\x22[^\x22]+\x22","<STR>",s); s=re.sub(r"\\b[0-9a-fA-F]{8,}\\b","<HEX>",s); s=re.sub(r"\\b[0-9]+\\b","<N>",s); s=re.sub(r"\\s+"," ",s).strip(); print(s)')"
            echo "LAS_FORMATTED_FIRST_ERROR_TEMPLATE=$safe_template"
          fi
          if grep -Fqi 'failed to run custom build command' "$log"; then echo "LAS_FORMATTED_CATEGORY_CUSTOM_BUILD=YES"; fi
          if grep -Fqi 'failed to select a version' "$log"; then echo "LAS_FORMATTED_CATEGORY_VERSION_SELECT=YES"; fi
          if grep -Fqi 'requires rustc' "$log"; then echo "LAS_FORMATTED_CATEGORY_RUST_VERSION=YES"; fi
          if grep -Fqi 'linking with' "$log"; then echo "LAS_FORMATTED_CATEGORY_LINKER=YES"; fi
          if grep -Fqi 'never used' "$log"; then echo "LAS_FORMATTED_CATEGORY_NEVER_USED=YES"; fi
          if grep -Fqi 'never read' "$log"; then echo "LAS_FORMATTED_CATEGORY_NEVER_READ=YES"; fi
          if grep -Fqi 'unused variable' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_VARIABLE=YES"; fi
          if grep -Fqi 'does not need to be mutable' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_MUT=YES"; fi
          if grep -Fqi 'this lint expectation is unfulfilled' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNFULFILLED_LINT=YES"; fi
          if grep -Fqi 'unresolved import' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNRESOLVED_IMPORT=YES"; fi
          if grep -Fqi 'cannot find' "$log"; then echo "LAS_FORMATTED_CATEGORY_CANNOT_FIND=YES"; fi
          if grep -Fqi 'could not compile' "$log"; then echo "LAS_FORMATTED_CATEGORY_COULD_NOT_COMPILE=YES"; fi
          if grep -Fqi 'expected' "$log"; then echo "LAS_FORMATTED_CATEGORY_EXPECTED=YES"; fi
          if grep -Fqi 'unclosed delimiter' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNCLOSED_DELIMITER=YES"; fi
          if grep -Fqi 'unexpected closing delimiter' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNEXPECTED_DELIMITER=YES"; fi
          if grep -Fqi 'unused import' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_IMPORT=YES"; fi
          if grep -Fqi 'no method named' "$log"; then echo "LAS_FORMATTED_CATEGORY_NO_METHOD=YES"; fi
          if grep -Fqi 'mismatched types' "$log"; then echo "LAS_FORMATTED_CATEGORY_MISMATCHED_TYPES=YES"; fi
          if grep -Fqi 'trait bound' "$log"; then echo "LAS_FORMATTED_CATEGORY_TRAIT_BOUND=YES"; fi
          if grep -Fqi 'cannot infer' "$log"; then echo "LAS_FORMATTED_CATEGORY_CANNOT_INFER=YES"; fi
          if grep -Fqi 'is private' "$log"; then echo "LAS_FORMATTED_CATEGORY_PRIVATE=YES"; fi
          printf '%s' "$FORMAT_CERT_B64" | base64 -d > "$RUNNER_TEMP/formatted-check-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/formatted-check-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$FORMAT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$log" \
            -out "$RUNNER_TEMP/formatted-check.cms" \
            "$RUNNER_TEMP/formatted-check-cert.pem"
          echo "LAS_FORMATTED_CHECK_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted-check.cms" | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/formatted-check-cert.pem" "$log"
          exit 0

      - name: Emit opaque formatted compile locations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/formatted-check-json.log"
          set +e
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --message-format=json >"$log" 2>/dev/null
          rc=$?
          set -e
          echo "LAS_FORMATTED_JSON_RC=$rc"
          python3 - "$log" <<'PY'
          import hashlib, json, pathlib, sys
          seen=set()
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              try:
                  obj=json.loads(line)
              except Exception:
                  continue
              if obj.get("reason") != "compiler-message":
                  continue
              msg=obj.get("message") or {}
              level=msg.get("level")
              if level != "error":
                  continue
              code=((msg.get("code") or {}).get("code")) or "NO_CODE"
              spans=[s for s in (msg.get("spans") or []) if s.get("is_primary")]
              if not spans:
                  key=(code,"NO_SPAN",0,0)
                  if key not in seen:
                      seen.add(key)
                      print(f"LAS_FORMATTED_DIAG={code}:NO_SPAN:0:0")
                  continue
              for s in spans:
                  path=s.get("file_name") or ""
                  path_hash=hashlib.sha256(path.encode()).hexdigest()
                  key=(code,path_hash,s.get("line_start") or 0,s.get("column_start") or 0)
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f"LAS_FORMATTED_DIAG={key[0]}:{key[1]}:{key[2]}:{key[3]}")
          print(f"LAS_FORMATTED_DIAG_COUNT={len(seen)}")
          PY
          rm -f "$log"

      - name: Upload encrypted formatted compile diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-formatted-check
          path: ${{ runner.temp }}/formatted-check.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted rustfmt diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-targeted-format-diff
          path: ${{ runner.temp }}/rustfmt-diff.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted formatted output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-targeted-format
          path: ${{ runner.temp }}/formatted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
