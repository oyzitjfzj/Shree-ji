name: Private targeted format export

on:
  push:
    branches: [main]
    paths:
      - "RUN_TARGETED_FORMAT_EXPORT"

permissions:
  contents: read

env:
  FORMAT_CERT_B64: 
  FORMAT_CERT_FINGERPRINT: "D6:E9:3A:1F:9E:FE:DC:1C:EE:64:EA:30:65:83:B5:5E:00:CC:59:25:9E:B0:0F:6B:02:02:FA:6E:93:A1:58:C1"

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Load opaque target
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_TARGETED_FORMAT_EXPORT
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_TARGETED_FORMAT_EXPORT)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_TARGETED_FORMAT_EXPORT)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TARGETED_FORMAT_EXPORT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth matched_ref matched_sha actual

      - name: Run pinned formatter and seal changed Rust files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          changed="$RUNNER_TEMP/format-paths"
          git diff --name-only > "$changed"
          test -s "$changed"
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) echo "LAS_TARGETED_FORMAT_EXPORT_SCOPE=FAIL"; exit 2 ;;
            esac
          done < "$changed"
          git diff --check
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.diff"
          test -s "$RUNNER_TEMP/rustfmt.diff"
          tar -czf "$RUNNER_TEMP/formatted.tar.gz" -T "$changed"
          printf '%s' "$FORMAT_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$FORMAT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/formatted.tar.gz" \
            -out "$RUNNER_TEMP/formatted.cms" "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/rustfmt.diff" \
            -out "$RUNNER_TEMP/rustfmt-diff.cms" "$RUNNER_TEMP/cert.pem"
          echo "LAS_TARGETED_FORMAT_EXPORT_FILES=$(wc -l < "$changed" | tr -d ' ')"
          echo "LAS_TARGETED_FORMAT_EXPORT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted.cms" | awk '{print $1}')"
          echo "LAS_TARGETED_FORMAT_DIFF_SHA256=$(sha256sum "$RUNNER_TEMP/rustfmt-diff.cms" | awk '{print $1}')"

      - name: Diagnose formatted private compile without accepting formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/formatted-check.log"
          set +e
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_FORMATTED_CHECK_RC=$rc"
          grep -oE 'error\[E[0-9]+\]' "$log" | sort -u | sed -E 's/error\[([^]]+)\]/LAS_FORMATTED_RUST_CODE_SAFE=\1/' || true
          grep -oE 'error\\[E[0-9]+\\]' "$log" \
            | sort -u \
            | sed -E 's/error\\[([^]]+)\\]/LAS_FORMATTED_RUST_ERROR_CODE=\\1/' || true
          first_error="$(grep -m1 -E '^error(\\[[^]]+\\])?:' "$log" || true)"
          if [[ -n "$first_error" ]]; then
            normalized="$(printf '%s' "$first_error" | sed -E 's#(/[^ ]+)+#<PATH>#g')"
            echo "LAS_FORMATTED_FIRST_ERROR_HASH=$(printf '%s' "$normalized" | sha256sum | awk '{print $1}')"
            safe_template="$(printf '%s' "$first_error" | python3 -c 'import re,sys; s=sys.stdin.read(); s=re.sub(r"\x1b\\[[0-9;]*m","",s); s=re.sub(r"(/[^ :]+)+","<PATH>",s); s=re.sub(r"\x60[^\x60]+\x60","<ID>",s); s=re.sub(r"\x27[^\x27]+\x27","<ID>",s); s=re.sub(r"\x22[^\x22]+\x22","<STR>",s); s=re.sub(r"\\b[0-9a-fA-F]{8,}\\b","<HEX>",s); s=re.sub(r"\\b[0-9]+\\b","<N>",s); s=re.sub(r"\\s+"," ",s).strip(); print(s)')"
            echo "LAS_FORMATTED_FIRST_ERROR_TEMPLATE=$safe_template"
          fi
          if grep -Fqi 'failed to run custom build command' "$log"; then echo "LAS_FORMATTED_CATEGORY_CUSTOM_BUILD=YES"; fi
          if grep -Fqi 'failed to select a version' "$log"; then echo "LAS_FORMATTED_CATEGORY_VERSION_SELECT=YES"; fi
          if grep -Fqi 'requires rustc' "$log"; then echo "LAS_FORMATTED_CATEGORY_RUST_VERSION=YES"; fi
          if grep -Fqi 'linking with' "$log"; then echo "LAS_FORMATTED_CATEGORY_LINKER=YES"; fi
          if grep -Fqi 'never used' "$log"; then echo "LAS_FORMATTED_CATEGORY_NEVER_USED=YES"; fi
          if grep -Fqi 'never read' "$log"; then echo "LAS_FORMATTED_CATEGORY_NEVER_READ=YES"; fi
          if grep -Fqi 'unused variable' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_VARIABLE=YES"; fi
          if grep -Fqi 'does not need to be mutable' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_MUT=YES"; fi
          if grep -Fqi 'this lint expectation is unfulfilled' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNFULFILLED_LINT=YES"; fi
          if grep -Fqi 'unresolved import' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNRESOLVED_IMPORT=YES"; fi
          if grep -Fqi 'cannot find' "$log"; then echo "LAS_FORMATTED_CATEGORY_CANNOT_FIND=YES"; fi
          if grep -Fqi 'could not compile' "$log"; then echo "LAS_FORMATTED_CATEGORY_COULD_NOT_COMPILE=YES"; fi
          if grep -Fqi 'expected' "$log"; then echo "LAS_FORMATTED_CATEGORY_EXPECTED=YES"; fi
          if grep -Fqi 'unclosed delimiter' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNCLOSED_DELIMITER=YES"; fi
          if grep -Fqi 'unexpected closing delimiter' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNEXPECTED_DELIMITER=YES"; fi
          if grep -Fqi 'unused import' "$log"; then echo "LAS_FORMATTED_CATEGORY_UNUSED_IMPORT=YES"; fi
          if grep -Fqi 'no method named' "$log"; then echo "LAS_FORMATTED_CATEGORY_NO_METHOD=YES"; fi
          if grep -Fqi 'mismatched types' "$log"; then echo "LAS_FORMATTED_CATEGORY_MISMATCHED_TYPES=YES"; fi
          if grep -Fqi 'trait bound' "$log"; then echo "LAS_FORMATTED_CATEGORY_TRAIT_BOUND=YES"; fi
          if grep -Fqi 'cannot infer' "$log"; then echo "LAS_FORMATTED_CATEGORY_CANNOT_INFER=YES"; fi
          if grep -Fqi 'is private' "$log"; then echo "LAS_FORMATTED_CATEGORY_PRIVATE=YES"; fi
          printf '%s' "$FORMAT_CERT_B64" | base64 -d > "$RUNNER_TEMP/formatted-check-cert.pem"
          fp="$(openssl x509 -in "$RUNNER_TEMP/formatted-check-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$FORMAT_CERT_FINGERPRINT"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$log" \
            -out "$RUNNER_TEMP/formatted-check.cms" \
            "$RUNNER_TEMP/formatted-check-cert.pem"
          echo "LAS_FORMATTED_CHECK_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted-check.cms" | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/formatted-check-cert.pem" "$log"
          exit 0

      - name: Upload encrypted formatted compile diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-formatted-check
          path: ${{ runner.temp }}/formatted-check.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted rustfmt diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-targeted-format-diff
          path: ${{ runner.temp }}/rustfmt-diff.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted formatted output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-targeted-format
          path: ${{ runner.temp }}/formatted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
