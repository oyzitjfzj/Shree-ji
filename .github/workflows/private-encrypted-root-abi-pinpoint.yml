          xMt0cahBO6AsWnWesh25UQ1GOniGiPRjHbvjXfNOkETcV2H0GTuujKAW24zIRjsE
          Dt9H/ssJv7ok46382G3CHhvWx222+TIk4yvvoeo3ic0Cm2qPHJmULMvEHDqLIg01
          XHQaSXykmt2je5AAj8o+iPPrBLP4izi7lkfIfRKmJrkFPDOm7FEPMwwNnlQIEWwS
          tH1MLSLOe2ub4fEnve/lj5V6hD9TLYUhAXdjwhr5do33m5QOI8Fj33pSyYX776dt
          GrE+q1c/mFOeuGfnRH1f2eilLmj1XFFVJXc2XllC0Sh/3/7lnFQM0LQkPfUsMovl
          mTa/n3ii7xNGQgI2kno1petSzLbYMEr1Ofr4ooGy8cjxnI2njZ+iE2ufsA==
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "A2:02:7F:5B:25:FE:CD:0A:8B:7D:2A:FA:39:DF:0A:0D:F8:27:A4:CA:54:17:69:68:74:E0:83:2A:F0:FF:75:02"
          echo "LAS_ABI_PINPOINT_CERT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc             -outform DER             -in "$RUNNER_TEMP/abi-pinpoint.tgz"             -out "$RUNNER_TEMP/abi-pinpoint.cms"             "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/abi-pinpoint.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_ABI_PINPOINT_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-root-abi-pinpoint
          path: ${{ runner.temp }}/abi-pinpoint.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
