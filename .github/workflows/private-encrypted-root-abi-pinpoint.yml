name: Encrypted Root ABI pinpoint

on:
  push:
    branches: [main]
    paths:
      - "RUN_ROOT_ABI_PINPOINT"

permissions:
  contents: read

concurrency:
  group: encrypted-root-abi-pinpoint
  cancel-in-progress: false

jobs:
  pinpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/root-history-e664-probe >"$checkout_log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 0
          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Build ABI and encrypt exact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-abi-pinpoint"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_abi_pinpoint >/dev/null
          )

          synth_root="$RUNNER_TEMP/gnat-synthetic-matrix"
          mkdir -p "$synth_root"

          run_synth_case() {
            local name="$1"
            local body="$2"
            local dir="$synth_root/$name"
            mkdir -p "$dir/obj"
            printf '%s\n' "$body" > "$dir/repro.ads"
            cat > "$dir/instance.ads" <<'EOF_INSTANCE'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF_INSTANCE
            cat > "$dir/repro.gpr" <<EOF_GPR
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Repro_Project;
          EOF_GPR
            set +e
            (cd "$ALR_WS" && alr exec -- gprbuild -p -P"$dir/repro.gpr") >"$dir/build.log" 2>&1
            local rc=$?
            set -e
            local upper
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "LAS_SYNTH_${upper}_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "LAS_SYNTH_${upper}_ICE=YES"
            else
              echo "LAS_SYNTH_${upper}_ICE=NO"
            fi
          }

          run_synth_case domain_plain 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Epoch is new U64;
             type Handle is private;
          private
             type Handle is record
                Domain : Domain_Epoch := 0;
                Slot   : Natural := 0;
             end record;
          end Repro;'

          run_synth_case domain_deferred 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Epoch is new U64;
             type Handle is private;
             No_Handle : constant Handle;
          private
             type Handle is record
                Domain : Domain_Epoch := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
          end Repro;'

          run_synth_case domain_ghost 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Epoch is new U64;
             type Handle is private;
             No_Handle : constant Handle;
             package Model with Ghost is
                function Domain_Of (Value : Handle) return Domain_Epoch with Global => null;
                function Slot_Of (Value : Handle) return Natural with Global => null;
             end Model;
          private
             type Handle is record
                Domain : Domain_Epoch := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
          end Repro;'

          run_synth_case domain_invariant 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Epoch is new U64;
             type Handle is private;
             No_Handle : constant Handle;
          private
             type Handle is record
                Domain : Domain_Epoch := 0;
                Slot   : Natural := 0;
             end record
               with Type_Invariant => Handle.Slot <= Max_Items;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
          end Repro;'

          run_synth_case effect_nested 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             subtype U32 is Interfaces.Unsigned_32;
             type Domain_Id is new U64;
             type Resource_Id is new U64;
             type Operation_Id is new U32;
             type Epoch_Id is new U64;
             type Word_Index is range 0 .. 3;
             type Digest is array (Word_Index) of U64;
             Zero_Digest : constant Digest := (others => 0);
             type Effect is record
                Resource : Resource_Id := 0;
                Operation : Operation_Id := 0;
                Request : Digest := Zero_Digest;
                Epoch : Epoch_Id := 0;
             end record;
             Null_Effect : constant Effect := (Resource => 0, Operation => 0, Request => Zero_Digest, Epoch => 0);
             type Handle is private;
             No_Handle : constant Handle;
             type Token is limited private;
          private
             type Handle is record
                Domain : Domain_Id := 0;
                Slot : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Token is limited record
                Valid : Boolean := False;
                Domain : Domain_Id := 0;
                Item : Handle := No_Handle;
                Frozen : Effect := Null_Effect;
             end record;
          end Repro;'

          run_synth_case machine_effect 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             subtype U32 is Interfaces.Unsigned_32;
             type Domain_Id is new U64;
             type Principal_Id is new U64;
             type Resource_Id is new U64;
             type Operation_Id is new U32;
             type Epoch_Id is new U64;
             type Budget is new U32;
             type Word_Index is range 0 .. 3;
             type Digest is array (Word_Index) of U64;
             Zero_Digest : constant Digest := (others => 0);
             type Effect is record
                Resource : Resource_Id := 0;
                Operation : Operation_Id := 0;
                Request : Digest := Zero_Digest;
                Epoch : Epoch_Id := 0;
             end record;
             Null_Effect : constant Effect := (Resource => 0, Operation => 0, Request => Zero_Digest, Epoch => 0);
             type Handle is private;
             No_Handle : constant Handle;
             type Machine is limited private;
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             subtype Slot_Ref is Natural range 0 .. Max_Items;
             type Handle is record
                Domain : Domain_Id := 0;
                Slot : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Item is record
                Parent : Slot_Ref := 0;
                Subject : Principal_Id := 0;
                Frozen : Effect := Null_Effect;
                Remaining : Budget := 0;
             end record;
             type Items is array (Slot_Index) of Item;
             type Machine is limited record
                Ready : Boolean := False;
                Domain : Domain_Id := 0;
                Count : Natural range 0 .. Max_Items := 0;
                Data : Items;
             end record;
          end Repro;'

          run_synth_case runtime_graph 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             subtype U32 is Interfaces.Unsigned_32;
             type Domain_Id is new U64;
             type Principal_Id is new U64;
             type Resource_Id is new U64;
             type Operation_Id is new U32;
             type Epoch_Id is new U64;
             type Budget is new U32;
             type Sequence is new U64;
             type Word_Index is range 0 .. 3;
             type Digest is array (Word_Index) of U64;
             Zero_Digest : constant Digest := (others => 0);
             type Effect is record
                Resource : Resource_Id := 0;
                Operation : Operation_Id := 0;
                Request : Digest := Zero_Digest;
                Epoch : Epoch_Id := 0;
             end record;
             Null_Effect : constant Effect := (Resource => 0, Operation => 0, Request => Zero_Digest, Epoch => 0);
             type Requirement is (Base, Strong);
             type Handle is private;
             No_Handle : constant Handle;
             type Token is limited private;
             type Machine is limited private;
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             subtype Slot_Ref is Natural range 0 .. Max_Items;
             type Handle is record
                Domain : Domain_Id := 0;
                Slot : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Token is limited record
                Valid : Boolean := False;
                Domain : Domain_Id := 0;
                Seq : Sequence := 0;
                Item : Handle := No_Handle;
                Frozen : Effect := Null_Effect;
                Need : Requirement := Base;
             end record;
             type Item_Record is record
                Parent : Slot_Ref := 0;
                Subject : Principal_Id := 0;
                Frozen : Effect := Null_Effect;
                Need : Requirement := Base;
                Remaining : Budget := 0;
             end record;
             type Item_Array is array (Slot_Index) of Item_Record;
             type Machine is limited record
                Ready : Boolean := False;
                Domain : Domain_Id := 0;
                Count : Natural range 0 .. Max_Items := 0;
                Seq : Sequence := 0;
                Data : Item_Array;
             end record;
          end Repro;'


          run_synth_body_case() {
            local name="$1"
            local spec="$2"
            local body="$3"
            local dir="$synth_root/$name"
            mkdir -p "$dir/obj"
            printf '%s\n' "$spec" > "$dir/repro.ads"
            printf '%s\n' "$body" > "$dir/repro.adb"
            cat > "$dir/instance.ads" <<'EOF_INSTANCE_BODY'
          with Repro;
          package Instance is new Repro (Max_Items => 256);
          EOF_INSTANCE_BODY
            cat > "$dir/repro.gpr" <<EOF_GPR_BODY
          project Repro_Project is
             for Source_Dirs use ("$dir");
             for Object_Dir use "$dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Repro_Project;
          EOF_GPR_BODY
            set +e
            (cd "$ALR_WS" && alr exec -- gprbuild -p -P"$dir/repro.gpr") >"$dir/build.log" 2>&1
            local rc=$?
            set -e
            local upper
            upper="$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')"
            echo "LAS_SYNTH_${upper}_RC=$rc"
            if grep -q "GNAT BUG DETECTED" "$dir/build.log"; then
              echo "LAS_SYNTH_${upper}_ICE=YES"
            else
              echo "LAS_SYNTH_${upper}_ICE=NO"
            fi
          }

          run_synth_body_case ghost_post 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             package Model with Ghost is
                function Slot_Of (Value : Handle) return Natural
                  with Global => null,
                       Post => Slot_Of'\''Result <= Max_Items;
             end Model;
          private
             type Handle is record
                Domain : Natural := 0;
                Slot   : Natural := 0;
             end record;
          end Repro;' 'package body Repro is
             package body Model is
                function Slot_Of (Value : Handle) return Natural is (Value.Slot);
             end Model;
          end Repro;'

          run_synth_body_case ghost_post_domain 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Epoch is new U64;
             type Handle is private;
             package Model with Ghost is
                function Slot_Of (Value : Handle) return Natural
                  with Global => null,
                       Post => Slot_Of'\''Result <= Max_Items;
             end Model;
          private
             type Handle is record
                Domain : Domain_Epoch := 0;
                Slot   : Natural := 0;
             end record;
          end Repro;' 'package body Repro is
             package body Model is
                function Slot_Of (Value : Handle) return Natural is (Value.Slot);
             end Model;
          end Repro;'

          run_synth_body_case nested_handle 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             No_Handle : constant Handle;
             type Token is limited private;
          private
             type Handle is record
                Domain : Natural := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Token is limited record
                Valid : Boolean := False;
                Item  : Handle := No_Handle;
             end record;
          end Repro;' 'package body Repro is
          end Repro;'

          run_synth_body_case ghost_post_nested 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             No_Handle : constant Handle;
             type Token is limited private;
             package Model with Ghost is
                function Slot_Of (Value : Handle) return Natural
                  with Global => null,
                       Post => Slot_Of'\''Result <= Max_Items;
             end Model;
          private
             type Handle is record
                Domain : Natural := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Token is limited record
                Valid : Boolean := False;
                Item  : Handle := No_Handle;
             end record;
          end Repro;' 'package body Repro is
             package body Model is
                function Slot_Of (Value : Handle) return Natural is (Value.Slot);
             end Model;
          end Repro;'


          run_synth_body_case contract_graph 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             No_Handle : constant Handle;
             type Machine is limited private;
             package Model with Ghost is
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                end record;
                function Snapshot (Value : Machine) return Machine_Model
                  with Global => null;
                function Slot_Of (Value : Handle) return Natural
                  with Global => null,
                       Post => Slot_Of'\''Result <= Max_Items;
                function Transition
                  (Before : Machine_Model;
                   After  : Machine_Model;
                   Item   : Handle) return Boolean
                  with Global => null;
             end Model;
             procedure Install
               (State : in out Machine;
                Item  : out Handle)
               with Global => null,
                    Post => Model.Transition
                              (Model.Snapshot (State)'\''Old,
                               Model.Snapshot (State),
                               Item);
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             type Handle is record
                Domain : Natural := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Item_Record is record
                Used : Boolean := False;
             end record;
             type Item_Array is array (Slot_Index) of Item_Record;
             type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Data  : Item_Array;
             end record;
          end Repro;' 'package body Repro is
             package body Model is
                function Snapshot (Value : Machine) return Machine_Model is
                  (Count => Value.Count);
                function Slot_Of (Value : Handle) return Natural is
                  (Value.Slot);
                function Transition
                  (Before : Machine_Model;
                   After  : Machine_Model;
                   Item   : Handle) return Boolean is
                  (After.Count >= Before.Count
                   and then Slot_Of (Item) <= Max_Items);
             end Model;
             procedure Install
               (State : in out Machine;
                Item  : out Handle)
             is
             begin
                if State.Count < Max_Items then
                   State.Count := State.Count + 1;
                   State.Data (Slot_Index (State.Count)).Used := True;
                   Item := (Domain => 1, Slot => State.Count);
                else
                   Item := No_Handle;
                end if;
             end Install;
          end Repro;'


          run_synth_body_case private_accessor_graph 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Id is new U64;
             type Handle is private;
             No_Handle : constant Handle;
             type Control is limited private;
             type Token is limited private;
             type Machine is limited private;

             function Token_Valid (Value : Token) return Boolean
               with Global => null;
             function Token_Domain (Value : Token) return Domain_Id
               with Global => null,
                    Pre => Token_Valid (Value);
             function Token_Item (Value : Token) return Handle
               with Global => null,
                    Pre => Token_Valid (Value);

             package Model with Ghost is
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                end record;
                function Snapshot (Value : Machine) return Machine_Model
                  with Global => null;
                function Handle_Slot (Value : Handle) return Natural
                  with Global => null,
                       Post => Handle_Slot'\''Result <= Max_Items;
                function Control_Domain (Value : Control) return Domain_Id
                  with Global => null;
             end Model;

          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             type Handle is record
                Domain : Domain_Id := 0;
                Slot   : Natural := 0;
             end record;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Control is limited record
                Domain : Domain_Id := 0;
                Armed  : Boolean := False;
             end record;
             type Token is limited record
                Valid  : Boolean := False;
                Domain : Domain_Id := 0;
                Item   : Handle := No_Handle;
             end record;
             type Item_Record is record
                Used : Boolean := False;
             end record;
             type Item_Array is array (Slot_Index) of Item_Record;
             type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Data  : Item_Array;
             end record;
          end Repro;' 'package body Repro is
             function Token_Valid (Value : Token) return Boolean is (Value.Valid);
             function Token_Domain (Value : Token) return Domain_Id is (Value.Domain);
             function Token_Item (Value : Token) return Handle is (Value.Item);
             package body Model is
                function Snapshot (Value : Machine) return Machine_Model is
                  (Count => Value.Count);
                function Handle_Slot (Value : Handle) return Natural is
                  (Value.Slot);
                function Control_Domain (Value : Control) return Domain_Id is
                  (Value.Domain);
             end Model;
          end Repro;'

          run_synth_body_case private_accessor_invariant_graph 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Id is new U64;
             type Handle is private;
             No_Handle : constant Handle;
             type Control is limited private;
             type Token is limited private;
             type Machine is limited private;
             function Token_Valid (Value : Token) return Boolean with Global => null;
             function Token_Domain (Value : Token) return Domain_Id
               with Global => null, Pre => Token_Valid (Value);
             package Model with Ghost is
                function Handle_Slot (Value : Handle) return Natural
                  with Global => null,
                       Post => Handle_Slot'\''Result <= Max_Items;
                function Control_Domain (Value : Control) return Domain_Id with Global => null;
             end Model;
          private
             subtype Slot_Index is Positive range 1 .. Max_Items;
             type Handle is record
                Domain : Domain_Id := 0;
                Slot   : Natural := 0;
             end record
               with Type_Invariant => Handle.Slot <= Max_Items;
             No_Handle : constant Handle := (Domain => 0, Slot => 0);
             type Control is limited record
                Domain : Domain_Id := 0;
                Armed  : Boolean := False;
             end record;
             type Token is limited record
                Valid  : Boolean := False;
                Domain : Domain_Id := 0;
                Item   : Handle := No_Handle;
             end record;
             type Item_Array is array (Slot_Index) of Boolean;
             type Machine is limited record
                Count : Natural range 0 .. Max_Items := 0;
                Data  : Item_Array;
             end record;
          end Repro;' 'package body Repro is
             function Token_Valid (Value : Token) return Boolean is (Value.Valid);
             function Token_Domain (Value : Token) return Domain_Id is (Value.Domain);
             package body Model is
                function Handle_Slot (Value : Handle) return Natural is (Value.Slot);
                function Control_Domain (Value : Control) return Domain_Id is (Value.Domain);
             end Model;
          end Repro;'


          run_synth_body_case ghost_delta 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             package Model with Ghost is
                subtype Model_Index is Positive range 1 .. Max_Items;
                type Item_Model is record
                   Used : Boolean := False;
                   Count : Natural := 0;
                end record;
                type Item_Array is array (Model_Index) of Item_Model;
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                   Data : Item_Array;
                end record;
                function Update
                  (Before : Machine_Model;
                   Index  : Model_Index) return Machine_Model
                  with Global => null;
             end Model;
          end Repro;' 'package body Repro is
             package body Model is
                function Update
                  (Before : Machine_Model;
                   Index  : Model_Index) return Machine_Model is
                  (Before with delta
                     Data =>
                       (Before.Data with delta
                          Index =>
                            (Before.Data (Index) with delta
                               Used => True,
                               Count => Before.Data (Index).Count + 1)));
             end Model;
          end Repro;'

          run_synth_body_case ghost_delta_handle 'generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             type Handle is private;
             package Model with Ghost is
                subtype Model_Index is Positive range 1 .. Max_Items;
                type Item_Model is record
                   Used : Boolean := False;
                end record;
                type Item_Array is array (Model_Index) of Item_Model;
                type Machine_Model is record
                   Count : Natural range 0 .. Max_Items := 0;
                   Data : Item_Array;
                end record;
                function Handle_Slot (Value : Handle) return Natural
                  with Global => null,
                       Post => Handle_Slot'\''Result <= Max_Items;
                function Update
                  (Before : Machine_Model;
                   Item   : Handle) return Machine_Model
                  with Global => null;
             end Model;
          private
             type Handle is record
                Slot : Natural := 0;
             end record;
          end Repro;' 'package body Repro is
             package body Model is
                function Handle_Slot (Value : Handle) return Natural is (Value.Slot);
                function Update
                  (Before : Machine_Model;
                   Item   : Handle) return Machine_Model is
                  (if Handle_Slot (Item) in Model_Index then
                      (Before with delta
                         Data =>
                           (Before.Data with delta
                              Model_Index (Handle_Slot (Item)) =>
                                (Before.Data (Model_Index (Handle_Slot (Item))) with delta
                                   Used => True)))
                   else Before);
             end Model;
          end Repro;'



          run_synth_body_case scalar_u128_private 'with Interfaces;
          generic
             Max_Items : Positive;
          package Repro with SPARK_Mode, Always_Terminates is
             subtype U64 is Interfaces.Unsigned_64;
             type Domain_Id is new U64;
             type Handle is private;
             No_Handle : constant Handle;
             package Model with Ghost is
                function Domain_Of (Value : Handle) return Domain_Id with Global => null;
                function Slot_Of (Value : Handle) return Natural
                  with Global => null,
                       Post => Slot_Of'\''Result <= Max_Items;
             end Model;
          private
             type Handle_Word is range 0 .. (2 ** 95) - 1 with Size => 128;
             type Handle is new Handle_Word;
             No_Handle : constant Handle := 0;
          end Repro;' 'package body Repro is
             Factor : constant Handle_Word := Handle_Word (Max_Items) + 1;
             package body Model is
                function Domain_Of (Value : Handle) return Domain_Id is
                  (Domain_Id (Handle_Word (Value) / Factor));
                function Slot_Of (Value : Handle) return Natural is
                  (Natural (Handle_Word (Value) mod Factor));
             end Model;
          end Repro;'

          bundle="$RUNNER_TEMP/abi-pinpoint-bundle"
          ffi_dir="$RUNNER_TEMP/root-authority-abi-pinpoint"
          mkdir -p "$bundle" "$ffi_dir"

          core_probe="$RUNNER_TEMP/root-core-only-probe"
          mkdir -p "$core_probe/obj"
          cat > "$core_probe/root_authority_core_probe.ads" <<'EOF_CORE'
          with Root_Authority;
          package Root_Authority_Core_Probe is
             package Core is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Core_Probe;
          EOF_CORE
          cat > "$core_probe/core_probe.gpr" <<EOF_GPR
          project Core_Probe is
             for Source_Dirs use ("$GITHUB_WORKSPACE/target/src/root_authority", "$core_probe");
             for Object_Dir use "$core_probe/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Core_Probe;
          EOF_GPR
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p -P"$core_probe/core_probe.gpr"
          ) >"$bundle/core-only.log" 2>&1
          core_rc=$?
          set -e
          echo "LAS_CORE_ONLY_RC=$core_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/core-only.log"; then
            echo "LAS_CORE_ONLY_ICE=YES"
          else
            echo "LAS_CORE_ONLY_ICE=NO"
          fi
          echo "LAS_CORE_ONLY_LOG_SHA256=$(sha256sum "$bundle/core-only.log" | awk '{print $1}')"

          # Encrypted-only compiler-expansion diagnostic.  Nothing from this
          # log is printed publicly; only its hash is exposed.
          set +e
          (
            cd "$core_probe"
            "$ALR_WS"/alire.toml >/dev/null 2>&1
          )
          set -e
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -f -p -P"$core_probe/core_probe.gpr" \
              -cargs:Ada -gnatG -gnatd.n
          ) >"$bundle/core-debug.log" 2>&1
          core_debug_rc=$?
          set -e
          echo "LAS_CORE_DEBUG_RC=$core_debug_rc"
          echo "LAS_CORE_DEBUG_LOG_SHA256=$(sha256sum "$bundle/core-debug.log" | awk '{print $1}')"

          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -f -p -P"$core_probe/core_probe.gpr" \
              -cargs:Ada -gnatp
          ) >"$bundle/core-noassert.log" 2>&1
          core_noassert_rc=$?
          set -e
          echo "LAS_CORE_NOASSERT_RC=$core_noassert_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/core-noassert.log"; then
            echo "LAS_CORE_NOASSERT_ICE=YES"
          else
            echo "LAS_CORE_NOASSERT_ICE=NO"
          fi
          echo "LAS_CORE_NOASSERT_LOG_SHA256=$(sha256sum "$bundle/core-noassert.log" | awk '{print $1}')"
          core_locations="$(grep -Eo '[A-Za-z0-9_-]*root_authority[A-Za-z0-9_-]*\.(ads|adb):[0-9]+(:[0-9]+)?' "$bundle/core-only.log" | awk '!seen[$0]++' | paste -sd, - || true)"
          if [[ -n "$core_locations" ]]; then
            echo "LAS_CORE_ONLY_LOCATIONS=$core_locations"
          else
            echo "LAS_CORE_ONLY_LOCATIONS=NONE"
          fi
          core_internal="$(grep -A20 -B2 'GNAT BUG DETECTED' "$bundle/core-only.log" | grep -Eo '[A-Za-z][A-Za-z0-9_-]+\.(adb|ads):[0-9]+(:[0-9]+)?' | awk '!/root_authority/ {print}' | tail -n5 | paste -sd, - || true)"
          if [[ -n "$core_internal" ]]; then
            echo "LAS_CORE_ONLY_INTERNAL=$core_internal"
          else
            echo "LAS_CORE_ONLY_INTERNAL=NONE"
          fi

          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p               -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr"               -XROOT_FFI_BUILD_DIR="$ffi_dir"
          ) >"$bundle/abi.log" 2>&1
          abi_rc=$?
          set -e
          printf '%s\n' "$abi_rc" > "$bundle/abi.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_ABI_PINPOINT_RC=$abi_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/abi.log"; then
            echo "LAS_ABI_PINPOINT_ICE=YES"
          else
            echo "LAS_ABI_PINPOINT_ICE=NO"
          fi
          echo "LAS_ABI_LOG_SHA256=$(sha256sum "$bundle/abi.log" | awk '{print $1}')"
          ice_exception="$(grep -Eo 'raised [A-Z][A-Z0-9_]*' "$bundle/abi.log" | tail -n1 | awk '{print $2}' || true)"
          if [[ -n "$ice_exception" ]]; then
            echo "LAS_ABI_ICE_EXCEPTION=$ice_exception"
          else
            echo "LAS_ABI_ICE_EXCEPTION=NONE"
          fi
          ice_internal="$(grep -Eo '[A-Za-z][A-Za-z0-9_/-]*\.(adb|ads):[0-9]+(:[0-9]+)?' "$bundle/abi.log" | tail -n1 || true)"
          if [[ -n "$ice_internal" ]]; then
            ice_internal="$(basename "$ice_internal")"
            echo "LAS_ABI_ICE_INTERNAL=$ice_internal"
          else
            echo "LAS_ABI_ICE_INTERNAL=NONE"
          fi

          tar -C "$bundle" -czf "$RUNNER_TEMP/abi-pinpoint.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIUP0NnoabcnDo0z8FiItT41xvVCpEwDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwoTEFTIGVwaGVtZXJhbCBkaWFnbm9zdGljIGN1cnJlbnQg
          c2Vzc2lvbjAeFw0yNjA5MjAxMzA3MDJaFw0yNjA5MjIxMzA3MDJaMDMxMTAvBgNV
          BAMMKExBUyBlcGhlbWVyYWwgZGlhZ25vc3RpYyBjdXJyZW50IHNlc3Npb24wggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQCTY0C2lCRVDd/vTnFUSqNGbMCb
          FMS667ONIyojblHYd1rJh+HbzSNJW4Gz7acHAwm/LIlpD0YTNlpNpRQ+42ow5Iwk
          gAYA0Tk7Qy/WI05kBYdAOLVsFcGnXft1GKwp7iC1c9hTjvsHliYiDFjMgQe5TCjK
          LMVZLVuQMXdvGIPusQMK5EtXRgqEqKaGvmcmNEPv9T4mP04idnSzd3fR/wbHad8s
          wDSGVK3TRS6OekibqkdSaejowUC+1ff/FxTxcB245uFttU7Z2CTT9SOzjnlSByWd
