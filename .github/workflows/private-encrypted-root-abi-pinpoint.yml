name: Encrypted Root ABI pinpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-encrypted-root-abi-pinpoint.yml"
      - "RUN_ROOT_ABI_PINPOINT"

permissions:
  contents: read

concurrency:
  group: encrypted-root-abi-pinpoint
  cancel-in-progress: false

jobs:
  pinpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/verify/root-handle-visible-probe-20260920 >"$checkout_log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 0
          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Build ABI and encrypt exact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-abi-pinpoint"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_abi_pinpoint >/dev/null
          )

          bundle="$RUNNER_TEMP/abi-pinpoint-bundle"
          ffi_dir="$RUNNER_TEMP/root-authority-abi-pinpoint"
          mkdir -p "$bundle" "$ffi_dir"
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -p               -P"$GITHUB_WORKSPACE/target/src/root_authority/root_authority_ffi.gpr"               -XROOT_FFI_BUILD_DIR="$ffi_dir"
          ) >"$bundle/abi.log" 2>&1
          abi_rc=$?
          set -e
          printf '%s\n' "$abi_rc" > "$bundle/abi.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_ABI_PINPOINT_RC=$abi_rc"
          if grep -q "GNAT BUG DETECTED" "$bundle/abi.log"; then
            echo "LAS_ABI_PINPOINT_ICE=YES"
          else
            echo "LAS_ABI_PINPOINT_ICE=NO"
          fi

          tar -C "$bundle" -czf "$RUNNER_TEMP/abi-pinpoint.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEWzCCAsOgAwIBAgIUY9y8OTlLAj9FJMqTUClVuGYMN/YwDQYJKoZIhvcNAQEL
          BQAwPTE7MDkGA1UEAwwyTEFTIGVwaGVtZXJhbCBkaWFnbm9zdGljIHJlY2lwaWVu
          dCBjdXJyZW50IHNlc3Npb24wHhcNMjYwOTIwMDExNzM2WhcNMjYwOTIyMDExNzM2
          WjA9MTswOQYDVQQDDDJMQVMgZXBoZW1lcmFsIGRpYWdub3N0aWMgcmVjaXBpZW50
          IGN1cnJlbnQgc2Vzc2lvbjCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGB
          AJd2Po8q2WoeS0j84uRc0bbnkkRuTGfdQfx007GLSY7lTgshjDaEK0xj8nI+R2UP
          QCjaOVikUGiXiL91HUM1z+dLn/CkGmbFYCXE79mTxh0y1qwTdUFWM4Zc4+WquhjC
          lF3dXHz/xQaWdMivcbyiDX7WO/c/GXVuOoH2HVGO03fLIQi2zoQhKCgUqedDwbt3
          yybxA3SS0NmZfoBwaR4tuHXXbeMJ3b49oaOP6QQZxCYmuvYZn5JnbnVce6/jB4Hr
          Kx2DiNvkir7ls/TBfBeXK/nxLoT6zN5lcbmAGff5Rm4VmMQiwgQPdJ1QwQr1iJfh
          TK3/z3Lm5ZiP0KNklMgFPvaCOvdzHTc32nNe7XIZO3HlNHL9+6MoL1QyQPcjyBbI
          P8M1oIEd/I8hJuNRjYpERSqVieHJoltb3DbUJMbN9bd0GFqWBLzHdftrKEcdl5nG
          gfZxvKyegJ37GylQZ4klU7lTB62/lpXzjZME91Ypf2anvmy1H8/+Y7v2K0mh5ofb
          bQIDAQABo1MwUTAdBgNVHQ4EFgQU9SCsuP10Dkf34Ku1lHQmC7BZbiwwHwYDVR0j
          BBgwFoAU9SCsuP10Dkf34Ku1lHQmC7BZbiwwDwYDVR0TAQH/BAUwAwEB/zANBgkq
          hkiG9w0BAQsFAAOCAYEAKI4fEeirfEVU7WI6VVSZ+dBdOa3pbLnvjLEoOm6P99jr
          4pozD3blRZQ1NkyWN/yExkabc+VuBf8q6YT7rPBP8T/cDSEeyYuLSxxoLXW3flTG
          bmMhZdu8cbmONNV66dLblw7b3qKzE1SRprKiYA0XyVQF1uwvVrc4xBCmo3r1qHYN
          VIGTwj8pPbDvJU47IBsyjF3LfeIXWrGH+eNYezl+/Ma61oJUCanEtq35thNvl8EM
