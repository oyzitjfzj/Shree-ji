name: Temporary private Rust failure hash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-rust-failure-hash.yml"
      - "RUN_PRIVATE_RUST_FAILURE_HASH"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4b75e5f3606c847f83d66831328dd996fe8f4603a5af2eab9c7af00edb1be001

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private working head
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          token: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          ref: tmp/selector-execution-20260924
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd target
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_FAILURE_HASH_SNAPSHOT_PROOF=$proof"

      - name: Run tests and emit only failing-name hashes
        shell: bash
        run: |
          set -euo pipefail
          cd target
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          log="$RUNNER_TEMP/private-tests.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          while IFS= read -r line; do
            name="${line#test }"
            name="${name% ... FAILED}"
            hash="$(printf '%s' "$name" | sha256sum | awk '{print $1}')"
            echo "LAS_PRIVATE_FAILED_TEST_HASH=$hash"
          done < <(grep -E '^test .* \.\.\. FAILED$' "$log" || true)
          echo "LAS_PRIVATE_TEST_RC=$rc"
          test "$rc" -eq 0
