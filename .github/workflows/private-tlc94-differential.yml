name: Private TLC94 semantic differential

on:
  push:
    branches: [main]
    paths:
      - "RUN_TLC94_DIFF"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  EXPECTED_BASE_PROOF: 15e538457f89710bb17abfbdf9ec5f03f3a9392ba55167f350677b72c96fafb7
  EXPECTED_CANDIDATE_PROOF: b615bb5129b28292b237ff2bcf1bae3dbecfffac81f99bb6ea44e281272a57e6
  EXPECTED_TLC_PROFILE_COUNT: "129"
  TARGET_INDEX: "94"

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout two exact private revisions
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          ROOT="$RUNNER_TEMP/private-target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=2 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD

          candidate="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          echo "::add-mask::$candidate"
          echo "::add-mask::$base"

          candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
          base_proof="$(printf '%s' "$base" | sha256sum | awk '{print $1}')"
          test "$candidate_proof" = "$EXPECTED_CANDIDATE_PROOF"
          test "$base_proof" = "$EXPECTED_BASE_PROOF"

          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
          echo "LAS_DIFF_BASE_PROOF=$base_proof"
          echo "LAS_DIFF_CANDIDATE_PROOF=$candidate_proof"
          unset PRIVATE_TOKEN auth

      - name: Exhaust reduced state graphs and compare transition relation
        shell: bash
        run: |
          set -euo pipefail
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" \
            | sha1sum --check --strict >/dev/null

          prepare_profile() {
            local root="$1"
            local side="$2"
            local map_py="$RUNNER_TEMP/map-${side}.py"
            local map="$RUNNER_TEMP/map-${side}.tsv"

            python3 - "$root/tools/verify_codespaces_all.sh" "$map_py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY
            python3 "$map_py" "$root" > "$map"
            test "$(wc -l < "$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"

            local line cfg tla deadlock expectation
            line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
            IFS=
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("    HotSlots = {Slot_A, Slot_B, Slot_C}",
               "    HotSlots = {Slot_A, Slot_B}"),
              ("    ArchiveHeads = {ArchiveHead_0, ArchiveHead_1, ArchiveHead_2, ArchiveHead_3}",
               "    ArchiveHeads = {ArchiveHead_0, ArchiveHead_1}"),
              ("    MaxGeneration = 2", "    MaxGeneration = 1"),
              ("    MaxArchiveSequence = 3", "    MaxArchiveSequence = 1"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("reduced-profile substitution mismatch")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

            printf '%s\t%s\t%s\n' "$cfg" "$tla" "$deadlock" > "$RUNNER_TEMP/profile-${side}.tsv"
          }

          run_graph() {
            local root="$1"
            local side="$2"
            local cfg tla deadlock
            IFS=$'\t' read -r cfg tla deadlock < "$RUNNER_TEMP/profile-${side}.tsv"
            local cfg_dir cfg_base tla_base dot log
            cfg_dir="$(dirname "$cfg")"
            cfg_base="$(basename "$cfg")"
            tla_base="$(basename "$tla")"
            dot="$RUNNER_TEMP/${side}.dot"
            log="$RUNNER_TEMP/${side}.log"

            local args=(-workers 1 -lncheck final -fp 0 -dump dot "$dot")
            if [[ "$deadlock" == "1" ]]; then
              args+=(-deadlock)
            fi
            args+=(-config "$cfg_base" "$tla_base")

            set +e
            (
              cd "$cfg_dir"
              java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"
            ) >"$log" 2>&1
            local rc=$?
            set -e
            echo "LAS_DIFF_${side^^}_TLC_RC=$rc"
            test "$rc" -eq 0
            test -s "$dot"
          }

          CANDIDATE_ROOT="$RUNNER_TEMP/private-target"
          BASE_ROOT="$RUNNER_TEMP/base"
          prepare_profile "$BASE_ROOT" base
          prepare_profile "$CANDIDATE_ROOT" candidate
          run_graph "$BASE_ROOT" base
          run_graph "$CANDIDATE_ROOT" candidate

          python3 - "$RUNNER_TEMP/base.dot" "$RUNNER_TEMP/candidate.dot" <<'PY'
          import re, sys
          from pathlib import Path

          def graph(path):
              text = Path(path).read_text(encoding="utf-8", errors="strict")
              nodes = set(re.findall(r'(?m)^\s*(-?\d+)\s+\[label=', text))
              edges = set(re.findall(r'(?m)^\s*(-?\d+)\s*->\s*(-?\d+)', text))
              if not nodes:
                  raise SystemExit("no state nodes parsed from TLC dot graph")
              return nodes, edges

          base_nodes, base_edges = graph(sys.argv[1])
          cand_nodes, cand_edges = graph(sys.argv[2])

          state_match = base_nodes == cand_nodes
          graph_match = state_match and base_edges == cand_edges

          print(f"LAS_DIFF_BASE_STATES={len(base_nodes)}")
          print(f"LAS_DIFF_CANDIDATE_STATES={len(cand_nodes)}")
          print(f"LAS_DIFF_BASE_EDGES={len(base_edges)}")
          print(f"LAS_DIFF_CANDIDATE_EDGES={len(cand_edges)}")
          print(f"LAS_DIFF_STATESET_MATCH={'PASS' if state_match else 'FAIL'}")
          print(f"LAS_DIFF_GRAPH_MATCH={'PASS' if graph_match else 'FAIL'}")

          if not graph_match:
              print(f"LAS_DIFF_ONLY_BASE_STATES={len(base_nodes - cand_nodes)}")
              print(f"LAS_DIFF_ONLY_CANDIDATE_STATES={len(cand_nodes - base_nodes)}")
              print(f"LAS_DIFF_ONLY_BASE_EDGES={len(base_edges - cand_edges)}")
              print(f"LAS_DIFF_ONLY_CANDIDATE_EDGES={len(cand_edges - base_edges)}")
              raise SystemExit(1)
          PY
\t' read -r cfg tla deadlock expectation <<< "$line"
            test -n "$cfg"
            test -n "$tla"
            test -z "$expectation"
            cfg="$root/$cfg"
            tla="$root/$tla"

            python3 - "$cfg" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("    HotSlots = {Slot_A, Slot_B, Slot_C}",
               "    HotSlots = {Slot_A, Slot_B}"),
              ("    ArchiveHeads = {ArchiveHead_0, ArchiveHead_1, ArchiveHead_2, ArchiveHead_3}",
               "    ArchiveHeads = {ArchiveHead_0, ArchiveHead_1}"),
              ("    MaxGeneration = 2", "    MaxGeneration = 1"),
              ("    MaxArchiveSequence = 3", "    MaxArchiveSequence = 1"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("reduced-profile substitution mismatch")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

            printf '%s\t%s\t%s\n' "$cfg" "$tla" "$deadlock" > "$RUNNER_TEMP/profile-${side}.tsv"
          }

          run_graph() {
            local root="$1"
            local side="$2"
            local cfg tla deadlock
            IFS=$'\t' read -r cfg tla deadlock < "$RUNNER_TEMP/profile-${side}.tsv"
            local cfg_dir cfg_base tla_base dot log
            cfg_dir="$(dirname "$cfg")"
            cfg_base="$(basename "$cfg")"
            tla_base="$(basename "$tla")"
            dot="$RUNNER_TEMP/${side}.dot"
            log="$RUNNER_TEMP/${side}.log"

            local args=(-workers 1 -lncheck final -fp 0 -dump dot "$dot")
            if [[ "$deadlock" == "1" ]]; then
              args+=(-deadlock)
            fi
            args+=(-config "$cfg_base" "$tla_base")

            set +e
            (
              cd "$cfg_dir"
              java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"
            ) >"$log" 2>&1
            local rc=$?
            set -e
            echo "LAS_DIFF_${side^^}_TLC_RC=$rc"
            test "$rc" -eq 0
            test -s "$dot"
          }

          CANDIDATE_ROOT="$RUNNER_TEMP/private-target"
          BASE_ROOT="$RUNNER_TEMP/base"
          prepare_profile "$BASE_ROOT" base
          prepare_profile "$CANDIDATE_ROOT" candidate
          run_graph "$BASE_ROOT" base
          run_graph "$CANDIDATE_ROOT" candidate

          python3 - "$RUNNER_TEMP/base.dot" "$RUNNER_TEMP/candidate.dot" <<'PY'
          import re, sys
          from pathlib import Path

          def graph(path):
              text = Path(path).read_text(encoding="utf-8", errors="strict")
              nodes = set(re.findall(r'(?m)^\s*(-?\d+)\s+\[label=', text))
              edges = set(re.findall(r'(?m)^\s*(-?\d+)\s*->\s*(-?\d+)', text))
              if not nodes:
                  raise SystemExit("no state nodes parsed from TLC dot graph")
              return nodes, edges

          base_nodes, base_edges = graph(sys.argv[1])
          cand_nodes, cand_edges = graph(sys.argv[2])

          state_match = base_nodes == cand_nodes
          graph_match = state_match and base_edges == cand_edges

          print(f"LAS_DIFF_BASE_STATES={len(base_nodes)}")
          print(f"LAS_DIFF_CANDIDATE_STATES={len(cand_nodes)}")
          print(f"LAS_DIFF_BASE_EDGES={len(base_edges)}")
          print(f"LAS_DIFF_CANDIDATE_EDGES={len(cand_edges)}")
          print(f"LAS_DIFF_STATESET_MATCH={'PASS' if state_match else 'FAIL'}")
          print(f"LAS_DIFF_GRAPH_MATCH={'PASS' if graph_match else 'FAIL'}")

          if not graph_match:
              print(f"LAS_DIFF_ONLY_BASE_STATES={len(base_nodes - cand_nodes)}")
              print(f"LAS_DIFF_ONLY_CANDIDATE_STATES={len(cand_nodes - base_nodes)}")
              print(f"LAS_DIFF_ONLY_BASE_EDGES={len(base_edges - cand_edges)}")
              print(f"LAS_DIFF_ONLY_CANDIDATE_EDGES={len(cand_edges - base_edges)}")
              raise SystemExit(1)
          PY
