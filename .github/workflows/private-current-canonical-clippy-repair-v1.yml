name: Verify and apply current canonical Clippy repair v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-canonical-clippy-repair-v1.yml"
      - ".github/private-patches/current-canonical-clippy-repair-v1.enc.b64"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 2df69cb8a4bb6483271cad9822de8a4a7f09b30ed6c591040398170e851c9305
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 65306c5200b96bbc17d1a85b0eb042196d3c1f2a1d1630542aaddfc8134ca854
  EXPECTED_PRIVATE_TREE_PROOF: a5bff9ef779be5f28fd84780411b1bbd36dbb3bcd729d76dc89cf4032013730d
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_DRIVER_SHA256: aac8cc459919aa3d2eedf2c0daaa927a712ca2eb219b75c669e2da1344aa6fdd

jobs:
  repair-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Recover exact frozen private candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/matched-ref"
          printf '%s' "$start_sha" >"$RUNNER_TEMP/start-sha"
          printf '%s' "$tree" >"$RUNNER_TEMP/start-tree"
          unset PRIVATE_READ_TOKEN PRIVATE_WRITE_TOKEN read_auth matched_ref start_sha tree sha ref
          echo "LAS_CURRENT_CLIPPY_REPAIR_RECOVERY=PASS"

      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$GPRBUILD_WRAPPER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >>"$GITHUB_ENV"
          echo "LAS_CURRENT_CLIPPY_REPAIR_TOOLCHAINS=PASS"

      - name: Decrypt repair and require complete verification before commit eligibility
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          start_tree="$(cat "$RUNNER_TEMP/start-tree")"
          echo "::add-mask::$start_sha"
          echo "::add-mask::$start_tree"

          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 -sS \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/current-canonical-clippy-repair-v1.enc.b64" \
            >"$RUNNER_TEMP/driver.b64"
          base64 -d "$RUNNER_TEMP/driver.b64" >"$RUNNER_TEMP/driver.enc"
          rm -f "$RUNNER_TEMP/driver.b64"
          test "$(sha256sum "$RUNNER_TEMP/driver.enc" | awk '{print $1}')" = "$EXPECTED_DRIVER_SHA256"

          driver_key="$(printf 'LAS_CURRENT_CANONICAL_CLIPPY_REPAIR_V1\n%s\n%s' "$start_sha" "$start_tree" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$driver_key"
          LAS_DRIVER_KEY="$driver_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:LAS_DRIVER_KEY -in "$RUNNER_TEMP/driver.enc" -out "$RUNNER_TEMP/driver.sh.gz"
          unset driver_key
          rm -f "$RUNNER_TEMP/driver.enc"
          gzip -dc "$RUNNER_TEMP/driver.sh.gz" >"$RUNNER_TEMP/driver.sh"
          rm -f "$RUNNER_TEMP/driver.sh.gz"
          chmod 0700 "$RUNNER_TEMP/driver.sh"

          cd target
          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          START_SHA="$start_sha" START_TREE="$start_tree" "$RUNNER_TEMP/driver.sh"
          rm -f "$RUNNER_TEMP/driver.sh"

          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"
          test "$(git rev-parse HEAD^)" = "$start_sha"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s' "$new_sha" >"$RUNNER_TEMP/new-sha"
          printf '%s' "$new_tree" >"$RUNNER_TEMP/new-tree"
          echo "LAS_CURRENT_CLIPPY_REPAIR_VERIFICATION=PASS"

      - name: Guarded fast-forward push and exact readback
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd target
          matched_ref="$(cat "$RUNNER_TEMP/matched-ref")"
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          new_sha="$(cat "$RUNNER_TEMP/new-sha")"
          new_tree="$(cat "$RUNNER_TEMP/new-tree")"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          echo "::add-mask::$write_auth"

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"

          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$post_sha"
          test "$post_sha" = "$new_sha"
          echo "LAS_CURRENT_CLIPPY_REPAIR_PUSH=PASS"
          echo "LAS_CURRENT_CLIPPY_REPAIR_NEW_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_CURRENT_CLIPPY_REPAIR_NEW_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
