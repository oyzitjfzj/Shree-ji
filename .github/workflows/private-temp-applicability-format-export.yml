name: Temporary private applicability format export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-temp-applicability-format-export.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 79bd231453eb80f391d2ce44a9267195e9b1dfaf4e37c6f424b80db51290642a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 550131befbe42aa3d4dcd8a22f5a674a167e2725d758fc6af40ef2e99f982ae2
  FORMAT_CERT_B64: 

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth

      - name: Format exact Rust and diagnose semantic RED
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          changed="$RUNNER_TEMP/changed"
          git diff --name-only > "$changed"
          test -s "$changed"
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) exit 2 ;;
            esac
          done < "$changed"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --no-run --message-format=json >"$RUNNER_TEMP/compile.jsonl" 2>&1
          rc=$?
          set -e
          echo "LAS_APP_FORMATTED_COMPILE_RC=$rc"
          python3 - "$RUNNER_TEMP/compile.jsonl" <<'PY'
          import json, sys
          codes = set()
          kinds = set()
          with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
              for raw in fh:
                  try:
                      obj = json.loads(raw)
                  except Exception:
                      continue
                  if obj.get("reason") != "compiler-message":
                      continue
                  msg = obj.get("message") or {}
                  if msg.get("level") != "error":
                      continue
                  code = (msg.get("code") or {}).get("code")
                  if code:
                      codes.add(code)
                  rendered = (msg.get("message") or "").lower()
                  if "unresolved import" in rendered:
                      kinds.add("UNRESOLVED_IMPORT")
                  if "cannot find" in rendered:
                      kinds.add("CANNOT_FIND")
                  if "no method named" in rendered:
                      kinds.add("NO_METHOD")
          for code in sorted(codes):
              print(f"LAS_APP_FORMATTED_RUST_CODE={code}")
          for kind in sorted(kinds):
              print(f"LAS_APP_FORMATTED_CATEGORY={kind}")
          PY
          tar -czf "$RUNNER_TEMP/formatted.tar.gz" -T "$changed"
          git diff --no-ext-diff --binary -- $(cat "$changed") > "$RUNNER_TEMP/formatted.patch"
          test -s "$RUNNER_TEMP/formatted.patch"
          printf '%s' "$FORMAT_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$RUNNER_TEMP/formatted.tar.gz" -out "$RUNNER_TEMP/formatted.cms" "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$RUNNER_TEMP/formatted.patch" -out "$RUNNER_TEMP/formatted.patch.cms" "$RUNNER_TEMP/cert.pem"
          echo "LAS_APP_FORMATTED_FILES=$(wc -l < "$changed" | tr -d ' ')"
          echo "LAS_APP_FORMATTED_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted.cms" | awk '{print $1}')"
          echo "LAS_APP_FORMATTED_PATCH_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/formatted.patch.cms" | awk '{print $1}')"

      - name: Upload encrypted formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-applicability-formatted
          path: ${{ runner.temp }}/formatted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted rustfmt patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-applicability-rustfmt-patch
          path: ${{ runner.temp }}/formatted.patch.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
