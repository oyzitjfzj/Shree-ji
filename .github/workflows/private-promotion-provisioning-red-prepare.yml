name: Private promotion Linux adapter committed closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-provisioning-red-prepare.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 632205e83e253786157de64f41b0c5080e88fc5992706bed2dfeaf556d9f4e34
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 14c97937002a714bb6f089c1501eea0ff34a64272cad19f1e74f5cb301f9e82d

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust executor and audit tool
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 install cargo-audit --version 0.22.2 --locked >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose
          cargo audit --version

      - name: Resolve exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=64 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_LINUX_PROVISION_ADAPTER_COMMITTED_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Exact committed format and lock gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          grep -A2 '^name = "rustix"$' Cargo.lock | grep -F 'version = "1.1.5"' >/dev/null
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_FORMAT=PASS'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_LOCK=PASS'

      - name: Strict compile and Clippy gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets >/dev/null
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >/dev/null
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_CHECK=PASS'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_CLIPPY=PASS'

      - name: Focused real Linux adapter gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/linux-provision-adapter-focused.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib promotion_transaction_linux_journal_provisioning_adapter_red_tests -- --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          digest="$(sha256sum "$log" | awk '{print $1}')"
          summary="$(grep '^test result:' "$log" | tail -n 1 || true)"
          passed="$(printf '%s' "$summary" | sed -nE 's/.* ([0-9]+) passed;.*/\1/p')"
          failed="$(printf '%s' "$summary" | sed -nE 's/.*; ([0-9]+) failed;.*/\1/p')"
          rm -f "$log"
          echo "LAS_LINUX_PROVISION_ADAPTER_COMMITTED_FOCUSED_LOG_SHA256=$digest"
          test "$rc" -eq 0
          test "$passed" = '5'
          test "$failed" = '0'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_FOCUSED_PASS_COUNT=5'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_FOCUSED_FAIL_COUNT=0'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_FOCUSED=PASS'

      - name: Serialized full library regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/linux-provision-adapter-library.log"
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$log" 2>&1
          digest="$(sha256sum "$log" | awk '{print $1}')"
          rm -f "$log"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_LINUX_PROVISION_ADAPTER_COMMITTED_LIBRARY_LOG_SHA256=$digest"
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_LIBRARY=PASS'

      - name: RustSec locked dependency audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/linux-provision-adapter-audit.log"
          set +e
          cargo audit --deny warnings --target-os linux --target-arch x86_64 --quiet >"$log" 2>&1
          rc=$?
          set -e
          digest="$(sha256sum "$log" | awk '{print $1}')"
          rm -f "$log"
          echo "LAS_LINUX_PROVISION_ADAPTER_COMMITTED_AUDIT_LOG_SHA256=$digest"
          if [[ "$rc" -ne 0 ]]; then
            echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_AUDIT=FAILED'
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_AUDIT=PASS'
          echo 'LAS_LINUX_PROVISION_ADAPTER_COMMITTED_BRIDGE=PASS'
