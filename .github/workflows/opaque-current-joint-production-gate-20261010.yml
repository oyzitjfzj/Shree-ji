name: Opaque current joint production gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-current-joint-production-gate-20261010.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 937e43eb7e37dbf1cd43ef2dbde987413754f7ff0d8629bf83d9c6d477cf455a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: f80bceee4d4f2813d06b3ad4fc652a65775a1a29a900d7e0b72aaea09c216b7a
  EXPECTED_PRIVATE_TREE_PROOF: 3a18f56d534e06557d00b81232280c467e2888009a69ff2413f2d440b49e88e4

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install pinned Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"
          export PATH="$prefix/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ws="$RUNNER_TEMP/alire-workspace"; mkdir -p "$ws"
          (cd "$ws" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ws"
          exec "$prefix/bin/alr" exec -- gprbuild "\$@"
          EOF
          chmod +x "$wrapper"; echo "GPRBUILD=$wrapper" >> "$GITHUB_ENV"
          echo "OPAQUE_CURRENT_TOOLCHAIN=PASS"

      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_CURRENT_RECOVERY=PASS"

      - name: Run exact formatting and joint production gates
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          run_gate() {
            name="$1"; shift
            log="$RUNNER_TEMP/${name}.private.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf 'OPAQUE_CURRENT_%s_LOG_SHA256=%s\n' "$name" "$(sha256sum "$log" | awk '{print $1}')"
            printf 'OPAQUE_CURRENT_%s_RC=%s\n' "$name" "$rc"
            rm -f "$log"
            return "$rc"
          }
          failures=0
          run_gate FORMAT cargo +1.98.1 fmt --all -- --check || failures=$((failures + 1))
          run_gate JOINT_CHECK env GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --all-targets --features root-ffi,linux-peer-credentials || failures=$((failures + 1))
          run_gate JOINT_CLIPPY env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --all-targets --features root-ffi,linux-peer-credentials -- -D warnings || failures=$((failures + 1))
          run_gate JOINT_TEST env GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --lib --features root-ffi,linux-peer-credentials -- --test-threads=1 || failures=$((failures + 1))
          echo "OPAQUE_CURRENT_FAILURE_COUNT=$failures"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$failures" -eq 0
          echo "OPAQUE_CURRENT_JOINT_PRODUCTION=PASS"
