name: Private assurance frontier quotient structure diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_FRONTIER_QUOTIENT_STRUCTURE_DIAGNOSTIC"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 467d8341e1ee4c86da8481f0f6423e4cd20cac245d048a7ee053a0a26f010758
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 539c4339bcb02a46c1c35df52c292e49ebdf3a24652b57925f4034e9fe09245e

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover exact private diagnostic revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=32 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=32 FETCH_HEAD)
          test -n "$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FRONTIER_QUOTIENT_STRUCTURE_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Run fail-closed frontier quotient structural verifier
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          python3 tools/verification/verify_candidate_assurance_frontier_quotient.py
          echo "LAS_FRONTIER_QUOTIENT_STRUCTURE_DIAGNOSTIC=PASS"
