name: Private promotion journal write planner RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-journal-write-plan-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 8ab68fe7f21c61e0d2bb0e45f6323b3d98031aed072bb0734c848e35a2652a44
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 5fe792d6d1821c14b161449aaa7ce05395afff3c85efd43ff41aefc1c80e323c
  EXPECTED_VERIFIER_BLOB: 09b80cf0f01b79316c344212defbc54ef2e99f07
  VERIFIER: tools/verify_promotion_journal_write_plan_red.sh

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object "$VERIFIER")" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_JOURNAL_WRITE_PLAN_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Observe exact private RED and publish only sanitized result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          out="$RUNNER_TEMP/promotion-journal-write-plan-red.out"
          set +e
          bash "$VERIFIER" >"$out" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            rm -f "$out"
            echo 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED_BRIDGE=FAILED'
            exit 1
          fi
          grep -Fxq 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED=OBSERVED' "$out"
          grep -Fxq 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED_ERROR_COUNT=1' "$out"
          rm -f "$out"
          echo 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED=OBSERVED'
          echo 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED_ERROR_COUNT=1'
          echo 'LAS_PROMOTION_JOURNAL_WRITE_PLAN_RED_BRIDGE=PASS'
