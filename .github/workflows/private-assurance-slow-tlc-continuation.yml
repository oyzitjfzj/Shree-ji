name: Private assurance slow TLC continuation

on:
  workflow_dispatch:
    inputs:
      index:
        description: Opaque canonical TLC profile index (profile 39 is intentionally rejected)
        required: true
        type: string
      segment:
        description: Continuation segment number
        required: true
        type: string
      resume_run_id:
        description: Prior workflow run containing encrypted checkpoint
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior encrypted checkpoint artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  continuation:
    uses: ./.github/workflows/_private-assurance-tlc-continuation-slice.yml
    with:
      index: ${{ fromJSON(inputs.index) }}
      segment: ${{ fromJSON(inputs.segment) }}
      resume_run_id: ${{ inputs.resume_run_id }}
      resume_artifact: ${{ inputs.resume_artifact }}
    secrets: inherit
