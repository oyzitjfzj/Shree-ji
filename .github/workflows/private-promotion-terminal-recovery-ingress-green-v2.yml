name: Private promotion terminal recovery ingress GREEN v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-terminal-recovery-ingress-green-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: c382c1b702b9f5450e6b7d77c322fe3ae6d2ada5d8f609c498c8187ff34d7fcd
  EXPECTED_HEAD_PROOF: ee91c1792fcbdf814c045a4e8c5805b2c79b6f3f5f08430b5c9c0cf68895e481
  EXPECTED_TREE_PROOF: ba4c08230c34c4af15fd9549f8bc155a2177c1eea639b40a963e004caf8bb628

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

      - name: Recover exact private candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          grep -q 'fn recover_promotion_transaction_after_process_loss' src/defence_evolution/promotion_transaction_state.rs
          unset PRIVATE_TOKEN auth matched_ref start_sha tree
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_V2_RECOVERY=PASS"

      - name: Apply remaining bounded recovery-authority patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          terminal = "src/effect_fabric/promotion_activation_guarded_terminal_durability.rs"
          replace_once(
              terminal,
              '''use crate::defence_evolution::promotion_transaction_state::{
              PromotionTransactionCoordinator, TrustedPromotionTransactionIngress,
          };
          ''',
              '''use crate::defence_evolution::promotion_transaction_state::{
              PromotionTransactionCoordinator, TrustedPromotionTransactionIngress,
              recover_promotion_transaction_after_process_loss,
          };
          ''',
          )
          replace_once(
              terminal,
              '''pub(super) fn recover_guarded_terminal_stable_acknowledgement<
              S,
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              ingress: &TrustedPromotionTransactionIngress,
              storage: &mut S,
          ) -> Result<
          ''',
              '''pub(super) fn recover_guarded_terminal_stable_acknowledgement<
              S,
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              storage: &mut S,
          ) -> Result<
          ''',
          )
          replace_once(
              terminal,
              '''    let recovered = recover_durable_guarded_terminal_snapshot::<RECOVERIES, CONSUMED>(
                  ingress,
                  PromotionTransactionDurableSnapshot::from_canonical_bytes(bytes),
              )
          ''',
              '''    let recovered =
                  recover_durable_guarded_terminal_snapshot_after_process_loss::<RECOVERIES, CONSUMED>(
                      PromotionTransactionDurableSnapshot::from_canonical_bytes(bytes),
                  )
          ''',
          )
          old_decl = '''pub(super) fn recover_durable_guarded_terminal_snapshot<
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              ingress: &TrustedPromotionTransactionIngress,
              snapshot: PromotionTransactionDurableSnapshot,
          ) -> Result<
              PromotionActivationGuardedTerminalDurableAcknowledgement<RECOVERIES, CONSUMED>,
              PromotionActivationGuardedTerminalDurabilityError,
          > {
          '''
          new_decl = '''pub(super) fn recover_durable_guarded_terminal_snapshot<
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              ingress: &TrustedPromotionTransactionIngress,
              snapshot: PromotionTransactionDurableSnapshot,
          ) -> Result<
              PromotionActivationGuardedTerminalDurableAcknowledgement<RECOVERIES, CONSUMED>,
              PromotionActivationGuardedTerminalDurabilityError,
          > {
              recover_durable_guarded_terminal_snapshot_with_recovery_source(
                  Some(ingress),
                  snapshot,
              )
          }

          fn recover_durable_guarded_terminal_snapshot_after_process_loss<
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              snapshot: PromotionTransactionDurableSnapshot,
          ) -> Result<
              PromotionActivationGuardedTerminalDurableAcknowledgement<RECOVERIES, CONSUMED>,
              PromotionActivationGuardedTerminalDurabilityError,
          > {
              recover_durable_guarded_terminal_snapshot_with_recovery_source(None, snapshot)
          }

          fn recover_durable_guarded_terminal_snapshot_with_recovery_source<
              const RECOVERIES: usize,
              const CONSUMED: usize,
          >(
              ingress: Option<&TrustedPromotionTransactionIngress>,
              snapshot: PromotionTransactionDurableSnapshot,
          ) -> Result<
              PromotionActivationGuardedTerminalDurableAcknowledgement<RECOVERIES, CONSUMED>,
              PromotionActivationGuardedTerminalDurabilityError,
          > {
          '''
          replace_once(terminal, old_decl, new_decl)
          replace_once(
              terminal,
              '''    let transaction =
                  PromotionTransactionCoordinator::<RECOVERIES, CONSUMED>::recover_from_durable_snapshot(
                      ingress,
                      PromotionTransactionDurableSnapshot::from_canonical_bytes(semantic_bytes),
                  )
                  .map_err(PromotionActivationGuardedTerminalDurabilityError::Transaction)?;
          ''',
              '''    let semantic_snapshot =
                  PromotionTransactionDurableSnapshot::from_canonical_bytes(semantic_bytes);
              let transaction = match ingress {
                  Some(live_ingress) => PromotionTransactionCoordinator::<RECOVERIES, CONSUMED>::
                      recover_from_durable_snapshot(live_ingress, semantic_snapshot),
                  None => recover_promotion_transaction_after_process_loss::<RECOVERIES, CONSUMED>(
                      semantic_snapshot,
                  ),
              }
              .map_err(PromotionActivationGuardedTerminalDurabilityError::Transaction)?;
          ''',
          )

          restart = "src/effect_fabric/root_supervisor_promotion_restart.rs"
          replace_once(
              restart,
              '''use crate::defence_evolution::promotion_transaction_journal_persist::PromotionTransactionJournalStorage;
          use crate::defence_evolution::promotion_transaction_state::TrustedPromotionTransactionIngress;
          ''',
              '''use crate::defence_evolution::promotion_transaction_journal_persist::PromotionTransactionJournalStorage;
          ''',
          )
          replace_once(
              restart,
              '''>(
              ingress: &TrustedPromotionTransactionIngress,
              promotion_storage: &mut P,
          ''',
              '''>(
              promotion_storage: &mut P,
          ''',
          )
          replace_once(
              restart,
              '''    >(ingress, promotion_storage)
          ''',
              '''    >(promotion_storage)
          ''',
          )
          PY

          cargo +1.98.1 fmt --all
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          required={
              'src/effect_fabric/promotion_activation_guarded_terminal_durability.rs',
              'src/effect_fabric/root_supervisor_promotion_restart.rs',
          }
          allowed=required | {'src/defence_evolution/promotion_transaction_state.rs'}
          if not required.issubset(changed) or not changed.issubset(allowed):
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_GREEN_V2_PATCH_SCOPE=PASS"

      - name: Verify exact GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 check --locked --lib --tests
          cargo +1.98.1 test --locked terminal_restart_recovery_surface_does_not_require_live_promotion_mutation_authority -- --nocapture
          echo "LAS_PROMOTION_TERMINAL_RECOVERY_WITHOUT_LIVE_INGRESS_GREEN=PASS"
