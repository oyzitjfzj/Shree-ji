name: Private slow TLC resumable verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_SLOW_TLC_CONTINUATION"
  workflow_dispatch:
    inputs:
      index:
        description: Opaque canonical TLC profile index
        required: true
        type: string
      segment:
        description: Continuation segment number
        required: true
        type: string
      resume_run_id:
        description: Prior workflow run containing encrypted checkpoint
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior encrypted checkpoint artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_private-tlc-continuation-slice.yml
    with:
      index: 27
      segment: 1
      resume_run_id: "35953628486"
      resume_artifact: "tlc-state-27-0"
    secrets: inherit

  continuation:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_private-tlc-continuation-slice.yml
    with:
      index: ${{ fromJSON(inputs.index) }}
      segment: ${{ fromJSON(inputs.segment) }}
      resume_run_id: ${{ inputs.resume_run_id }}
      resume_artifact: ${{ inputs.resume_artifact }}
    secrets: inherit
