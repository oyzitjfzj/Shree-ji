          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "7E:B3:01:3C:1F:34:6C:4B:33:9C:9B:BD:9B:22:9E:84:D1:10:22:A9:9D:E6:F4:15:C9:8A:0E:06:41:64:37:0C"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/pre-tlc-private.cms" "$RUNNER_TEMP/recipient-cert.pem"

          echo "LAS_PRE_TLC_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_PRE_TLC_STAGE_RESULT=PASS$' "$log"; then
            echo "LAS_PRE_TLC_STAGE_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PRE_TLC_STAGE_RESULT=FAIL"
          exit 1

      - name: Upload encrypted pre-TLC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-pre-tlc
          path: ${{ runner.temp }}/pre-tlc-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
