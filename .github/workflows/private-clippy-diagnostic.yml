name: Private Clippy diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_CLIPPY_DIAG"

permissions:
  contents: read

concurrency:
  group: private-clippy-diagnostic-current-ec6b2b5c
  cancel-in-progress: false

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: ec6b2b5c9230bc99be76624ee1de930731132b9c9be32b904bcd421b92fabac3

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_CLIPPY_SNAPSHOT_PROOF=$proof"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth

      - name: Run strict Clippy and encrypt diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy rustfmt >/dev/null

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-clippy"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_clippy_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"

          cd "$GITHUB_WORKSPACE/target"
          bundle="$RUNNER_TEMP/clippy-private"
          mkdir -p "$bundle"
          set +e
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >"$bundle/default.log" 2>&1
          default_rc=$?
          cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings >"$bundle/linux.log" 2>&1
          linux_rc=$?
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 clippy --locked --features root-ffi --all-targets -- -D warnings >"$bundle/root-ffi.log" 2>&1
          root_ffi_rc=$?
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 clippy --locked --all-features --all-targets -- -D warnings >"$bundle/all-features.log" 2>&1
          all_features_rc=$?

          cargo +1.98.1 fmt --all -- --check >"$bundle/fmt-check.log" 2>&1
          fmt_check_rc=$?
          cargo +1.98.1 fmt --all >"$bundle/fmt-apply.log" 2>&1
          fmt_apply_rc=$?
          git diff --binary -- '*.rs' >"$bundle/rustfmt.diff"
          git diff --name-only -- '*.rs' >"$bundle/rustfmt-paths.txt"
          tar -cf "$bundle/formatted-files.tar" -T "$bundle/rustfmt-paths.txt"

          RUSTFLAGS="-Dwarnings" GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 check --locked --all-features --all-targets >"$bundle/check-all-features.log" 2>&1
          check_all_rc=$?
          RUSTFLAGS="-Dwarnings" GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 test --locked --all-features --all-targets -- --test-threads=1 >"$bundle/tests-all-features.log" 2>&1
          tests_all_rc=$?
          set -e
          printf '%s\n' "$default_rc" > "$bundle/default.rc"
          printf '%s\n' "$linux_rc" > "$bundle/linux.rc"
          printf '%s\n' "$root_ffi_rc" > "$bundle/root-ffi.rc"
          printf '%s\n' "$all_features_rc" > "$bundle/all-features.rc"
          printf '%s\n' "$fmt_check_rc" > "$bundle/fmt-check.rc"
          printf '%s\n' "$fmt_apply_rc" > "$bundle/fmt-apply.rc"
          printf '%s\n' "$check_all_rc" > "$bundle/check-all-features.rc"
          printf '%s\n' "$tests_all_rc" > "$bundle/tests-all-features.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_CLIPPY_DEFAULT_RC=$default_rc"
          echo "LAS_CLIPPY_LINUX_RC=$linux_rc"
          echo "LAS_CLIPPY_ROOT_FFI_RC=$root_ffi_rc"
          echo "LAS_CLIPPY_ALL_FEATURES_RC=$all_features_rc"
          echo "LAS_FAST_FMT_CHECK_RC=$fmt_check_rc"
          echo "LAS_FAST_FMT_APPLY_RC=$fmt_apply_rc"
          echo "LAS_FAST_FMT_CHANGED_COUNT=$(wc -l <"$bundle/rustfmt-paths.txt" | tr -d ' ')"
          echo "LAS_FAST_CHECK_ALL_FEATURES_RC=$check_all_rc"
          echo "LAS_FAST_TESTS_ALL_FEATURES_RC=$tests_all_rc"
          echo "LAS_CLIPPY_DEFAULT_SHA256=$(sha256sum "$bundle/default.log" | awk '{print $1}')"
          echo "LAS_CLIPPY_LINUX_SHA256=$(sha256sum "$bundle/linux.log" | awk '{print $1}')"
          echo "LAS_CLIPPY_ROOT_FFI_SHA256=$(sha256sum "$bundle/root-ffi.log" | awk '{print $1}')"
          echo "LAS_CLIPPY_ALL_FEATURES_SHA256=$(sha256sum "$bundle/all-features.log" | awk '{print $1}')"

          tar -C "$bundle" -czf "$RUNNER_TEMP/clippy-private.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUPT0qPUiwTHFEESuOPcX2gevAHx8wDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkTEFTIGN1cnJlbnQgc291cmNlIGFsZXJ0IGRpYWdub3N0
          aWNzMB4XDTI2MDkyMTIwMzM1NVoXDTI2MDkyMzIwMzM1NVowLzEtMCsGA1UEAwwk
          TEFTIGN1cnJlbnQgc291cmNlIGFsZXJ0IGRpYWdub3N0aWNzMIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEAoHjbiRixRY+QvrnOZMvyh5PmhdxArmMGcplR
          B4qNA+H6NWL0GCzvwecwrH0tYqybMP+C5b8a/UOPTOkEO77Ylw5hzAGpfR2l5Jda
          YLWh0ICXCutTeob1B13PAIkoMNxE9BAsRJ6ZlAaPQn6jT6B9zxas36I0ya9utwyV
          81Bex4HmvRnjg1Ef8iB34mGDIeLic3jUMlBnmw/E7l1OmkNvhY2eJk975fae/5GH
          gei0QCW0TR/t9yE0gWk64g/sW8BBjnmh9cH9qaNiOXkxW9qp4WO4af2DC3Ab9Jun
          PlzoIlxLJg6anl7K7mJKuMOZtMqFF2oLLB7jB3k8BIeVoe+33EWayciCyRzX1VDB
          0ngQXivwLIlQhvjboRfmInoXpJQ+/cb5287MJifX6OrUWUVJEv0lrHjc0Lo4u12/
          W/5/fpFHhr0jwNBwlmv9OHpcAO3eglajkO/hshaw1IWn+wVN/v3NFxC16y+UtblY
          Pgx4rLqQX5w3e5XJoYUU3y1/rWLPAgMBAAGjUzBRMB0GA1UdDgQWBBSni9T6WjU4
          3pVAGKy3/i63QGvRzzAfBgNVHSMEGDAWgBSni9T6WjU43pVAGKy3/i63QGvRzzAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQBS6fil31zun5PC9ORa
          CtDuWTXNEEmJ2TRaWexoTjv7yoNqc8NTy3ROn8XlPegH7yGgPd6WiuVIogFeQ3FS
          W3D+BPypKz9HwxpGFfiW/mFHGMaoScos8kwmjFdKyUJ3Pelq8SCxWF7zqdpXcDpx
          lL8XzzStXaKXYkNEwlko3q2DLl1xhOd8QyvtvM4J2rGcX8uc2w7XMFOFpGmk8hGs
          UweZGjMWVB/hrvSqnAhjTu9AAQae6Vvhb7rklAAnzY17foguTvfZZN1grRF7KXdx
          ZxM7mOOfnY4Sjsufqzoph7lqbJl5OMyb2WwKfxwfxvG5hHuBTrNChmxIok1K1CEc
          qQY4r5+6eXRpzoGUgPOX513LGX3ie4fS1sytan2ZgUkj8fQA8P/5bVXrehPZHQSz
          7YR1F310oKf0BHezjy0VhF69qgyDLc6ERyjxw+kEfThwyDcuCVdYqyRMKWOg/fpf
          1LV1TE8GpO9n69BpZlm3zIJgd8fBuMnYHZe4Dh0hC95lE6k=
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "7E:B3:01:3C:1F:34:6C:4B:33:9C:9B:BD:9B:22:9E:84:D1:10:22:A9:9D:E6:F4:15:C9:8A:0E:06:41:64:37:0C"
          echo "LAS_CLIPPY_CERT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -in "$RUNNER_TEMP/clippy-private.tgz" \
            -out "$RUNNER_TEMP/clippy-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/clippy-private.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_CLIPPY_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-clippy-diagnostic
          path: ${{ runner.temp }}/clippy-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
