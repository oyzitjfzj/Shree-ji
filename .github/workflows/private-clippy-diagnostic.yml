name: Private Clippy diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_CLIPPY_DIAG"

permissions:
  contents: read

concurrency:
  group: private-clippy-diagnostic
  cancel-in-progress: false

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/clippy-closure-probe
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_CLIPPY_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run strict Clippy and encrypt diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy >/dev/null
          cd "$GITHUB_WORKSPACE/target"
          bundle="$RUNNER_TEMP/clippy-private"
          mkdir -p "$bundle"
          set +e
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >"$bundle/default.log" 2>&1
          default_rc=$?
          cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings >"$bundle/linux.log" 2>&1
          linux_rc=$?
          set -e
          printf '%s\n' "$default_rc" > "$bundle/default.rc"
          printf '%s\n' "$linux_rc" > "$bundle/linux.rc"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          echo "LAS_CLIPPY_DEFAULT_RC=$default_rc"
          echo "LAS_CLIPPY_LINUX_RC=$linux_rc"
          echo "LAS_CLIPPY_DEFAULT_SHA256=$(sha256sum "$bundle/default.log" | awk '{print $1}')"
          echo "LAS_CLIPPY_LINUX_SHA256=$(sha256sum "$bundle/linux.log" | awk '{print $1}')"

          tar -C "$bundle" -czf "$RUNNER_TEMP/clippy-private.tgz" .
          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUJ4HXtENG+q8D/Jvf4i2XwKepv2MwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkTEFTIGVwaGVtZXJhbCBDbGlwcHkgY3VycmVudCBzZXNz
          aW9uMB4XDTI2MDkyMDE2MzY0OVoXDTI2MDkyMjE2MzY0OVowLzEtMCsGA1UEAwwk
          TEFTIGVwaGVtZXJhbCBDbGlwcHkgY3VycmVudCBzZXNzaW9uMIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEAmw5tr0iuT1dHWEVm95blJxaL/MTp6vC8d0nY
          1xMApV4nB9YBYUJQ954bEMK7NAeKEgwHYeXcSQfD18pgor91OReNVXY0uIsQhyfH
          esLtGhdaf0TZXCaQjrVVvTMQKnqWxMcGtOrrYvVGnASJCUqoEwd7/y7tba8OloEC
          URRe8OtcWwrvGIb4GTMqE/55KURezE0XSoofj+gvWq6GOW1gZlwQe/LdsT4oqD9s
          q6lnIitrRuYXgiY8Vedaib/xaEPoXoUb/qqI9ijSGgarIefPOwbkIhJYD9Uls2nM
          5DwVLJHUvySyc0KzoBV8E3ULtzXSh0ATJqU9xj+5uZHeAkT8IsKgNgDYjDgSqIfM
          JSRp3z+wDB3Q6ooni00o/HPMsd6UYwKVzsN0qt9A1GYGa5ORi6IYDkRgTtrWEPZN
          Pf8dQw3uiar/8dJJfVqJoDfxuHl+o4GqOhFeQkWG7GphKcKKO17IuDqqD/uhTjjS
          WTZ9LUPyHHVEz5ORnG+mRauBYg+dAgMBAAGjUzBRMB0GA1UdDgQWBBSAfYaz/DCI
          2U7/dIHEyqS0/LnlJzAfBgNVHSMEGDAWgBSAfYaz/DCI2U7/dIHEyqS0/LnlJzAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQBTnarmBjdX4qbbGs/5
          pq2nw5gLCiNHtetrhzkBqOQCoKuYVOMPAtPaqIK/8xdWtj7Iwa/o1erzJz9BTG/t
