name: Seal private candidate after canonical pre-TLC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-exact-clippy-report-main.yml"

permissions:
  contents: read

concurrency:
  group: private-candidate-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PATCH_REF_HASH: 507ae9e2667c0e6622e45c683c8274d19fe200fd3c304c05fb6396013b8314a2
      PATCH_SNAPSHOT_PROOF: 5bac996624aa46702d7df8e5836526e6579414ae0bb730b4b634d9d58db14dd3
      PATCH_TREE_PROOF: c54afb29344360d05ca2ef37c55bd71af5ed6943491b2323ca63f632fa97c1fc
      TARGET_REF_HASH: 2df69cb8a4bb6483271cad9822de8a4a7f09b30ed6c591040398170e851c9305
      TARGET_SNAPSHOT_PROOF: 65306c5200b96bbc17d1a85b0eb042196d3c1f2a1d1630542aaddfc8134ca854
      TARGET_TREE_PROOF: a5bff9ef779be5f28fd84780411b1bbd36dbb3bcd729d76dc89cf4032013730d
    steps:
      - name: Recover private patch source and target opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          patch_ref=""; patch_sha=""; target_ref=""; target_sha=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" = "$PATCH_REF_HASH" ]]; then
              test -z "$patch_ref"; patch_ref="$ref"; patch_sha="$sha"
            fi
            if [[ "$ref_hash" = "$TARGET_REF_HASH" ]]; then
              test -z "$target_ref"; target_ref="$ref"; target_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$patch_ref"; test -n "$patch_sha"; test -n "$target_ref"; test -n "$target_sha"
          echo "::add-mask::$patch_ref"; echo "::add-mask::$patch_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          test "$(printf '%s' "$patch_sha" | sha256sum | awk '{print $1}')" = "$PATCH_SNAPSHOT_PROOF"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$TARGET_SNAPSHOT_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$patch_ref" "$target_ref"
          patch_tree="$(git rev-parse "$patch_sha^{tree}")"
          target_tree="$(git rev-parse "$target_sha^{tree}")"
          echo "::add-mask::$patch_tree"; echo "::add-mask::$target_tree"
          test "$(printf '%s' "$patch_tree" | sha256sum | awk '{print $1}')" = "$PATCH_TREE_PROOF"
          test "$(printf '%s' "$target_tree" | sha256sum | awk '{print $1}')" = "$TARGET_TREE_PROOF"
          test "$(git rev-parse "$patch_sha^")" = "$target_sha"

          printf '%s' "$patch_ref" > "$RUNNER_TEMP/private-patch-ref"
          printf '%s' "$patch_sha" > "$RUNNER_TEMP/private-patch-sha"
          printf '%s' "$target_ref" > "$RUNNER_TEMP/private-target-ref"
          printf '%s' "$target_sha" > "$RUNNER_TEMP/private-target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 \
            "$RUNNER_TEMP/private-patch-ref" \
            "$RUNNER_TEMP/private-patch-sha" \
            "$RUNNER_TEMP/private-target-ref" \
            "$RUNNER_TEMP/private-target-start-sha" \
            "$RUNNER_TEMP/private-auth"
          echo "LAS_SEAL_RECOVERY=PASS"

      - name: Materialize private patch without staging history
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          patch_sha="$(cat "$RUNNER_TEMP/private-patch-sha")"
          target_sha="$(cat "$RUNNER_TEMP/private-target-start-sha")"
          echo "::add-mask::$patch_sha"; echo "::add-mask::$target_sha"

          git checkout -q --detach "$patch_sha"
          test -f tools/tmp_private_patch.py
          python3 tools/tmp_private_patch.py >"$RUNNER_TEMP/patch.private.log" 2>&1
          rm tools/tmp_private_patch.py

          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all >>"$RUNNER_TEMP/patch.private.log" 2>&1
          git diff --check >>"$RUNNER_TEMP/patch.private.log" 2>&1

          paths="$RUNNER_TEMP/patch-paths.private"
          git diff --name-only "$target_sha" -- . > "$paths"
          test "$(wc -l < "$paths" | tr -d ' ')" -eq 3
          while IFS= read -r path; do
            [[ "$path" = src/*.rs ]]
          done < "$paths"

          patch_file="$RUNNER_TEMP/materialized.patch"
          git diff --binary "$target_sha" -- . > "$patch_file"
          test -s "$patch_file"

          git checkout -q -f -B verify-target "$target_sha"
          git apply --index "$patch_file"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 3

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git commit -q -m "Make promotion compile-time tests Clippy-clean"
          new_sha="$(git rev-parse HEAD)"; new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"; echo "::add-mask::$new_tree"
          printf '%s' "$new_sha" > "$RUNNER_TEMP/private-new-sha"
          chmod 600 "$RUNNER_TEMP/private-new-sha"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_SEAL_CHANGED_FILE_COUNT=3"
          echo "LAS_SEAL_PATCH_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_SEAL_PATCH_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/patch.private.log" "$RUNNER_TEMP/patch-paths.private" "$RUNNER_TEMP/materialized.patch"

      - name: Run canonical pre-TLC privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          new_sha="$(cat "$RUNNER_TEMP/private-new-sha")"; echo "::add-mask::$new_sha"
          awk '/^TLC_MAP=/{exit} {print}' tools/verify_codespaces_all.sh > "$RUNNER_TEMP/verify-pre-tlc.sh"
          chmod +x "$RUNNER_TEMP/verify-pre-tlc.sh"
          log="$RUNNER_TEMP/pre-tlc.private.log"
          set +e
          LAS_VERIFY_EXPECTED_BRANCH=verify-target bash "$RUNNER_TEMP/verify-pre-tlc.sh" >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_SEAL_PRE_TLC_RC=$rc"
          echo "LAS_SEAL_PRE_TLC_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          if [[ "$rc" -ne 0 ]]; then
            echo "LAS_SEAL_PRE_TLC=FAIL"
            exit "$rc"
          fi
          rm -f "$log"
          echo "LAS_SEAL_PRE_TLC=PASS"

      - name: Fast-forward only the verified private target
        shell: bash
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          target_ref="$(cat "$RUNNER_TEMP/private-target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/private-target-start-sha")"
          new_sha="$(cat "$RUNNER_TEMP/private-new-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          echo "::add-mask::$target_ref"; echo "::add-mask::$start_sha"; echo "::add-mask::$new_sha"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"; echo "::add-mask::$auth"

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_SEAL_PUBLISHED=PASS"
          echo "LAS_SEAL_PUBLISHED_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          rm -f \
            "$RUNNER_TEMP/private-patch-ref" \
            "$RUNNER_TEMP/private-patch-sha" \
            "$RUNNER_TEMP/private-target-ref" \
            "$RUNNER_TEMP/private-target-start-sha" \
            "$RUNNER_TEMP/private-new-sha" \
            "$RUNNER_TEMP/private-auth"
