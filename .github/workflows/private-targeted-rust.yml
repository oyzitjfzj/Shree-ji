name: Private targeted Rust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-targeted-rust.yml"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: ae00b56dcda25116dd3fd459a79d9412704e5b1d81c3daf845ca36a6198795f7

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private temporary head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=200 origin '+refs/heads/*:refs/remotes/origin/*'
          actual=""
          while IFS= read -r oid; do
            [[ -n "$oid" ]] || continue
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              actual="$oid"
              break
            fi
          done < <(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u)
          test -n "$actual"
          echo "::add-mask::$actual"
          git checkout -q --detach "$actual"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PRIVATE_TARGET_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

      - name: Diagnose private Rust gate opaquely
        shell: bash
        run: |
          set +e
          set -u
          cd "$GITHUB_WORKSPACE/target"
          fmt_log="$RUNNER_TEMP/fmt.log"
          compile_log="$RUNNER_TEMP/compile.jsonl"
          test_log="$RUNNER_TEMP/test.log"

          cargo +1.98.1 fmt --all -- --check >"$fmt_log" 2>&1
          fmt_rc=$?

          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --no-run --message-format=json >"$compile_log" 2>&1
          compile_rc=$?

          codes="$(python3 - "$compile_log" <<'PY'
          import json, sys
          codes=set()
          with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
              for line in f:
                  try:
                      obj=json.loads(line)
                  except Exception:
                      continue
                  if obj.get("reason")!="compiler-message":
                      continue
                  msg=obj.get("message") or {}
                  if msg.get("level")!="error":
                      continue
                  code=(msg.get("code") or {}).get("code")
                  codes.add(code or "NO_CODE")
          print(",".join(sorted(codes)) if codes else "NONE")
          PY
          )"

          test_rc=125
          if [[ "$compile_rc" -eq 0 ]]; then
            RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$test_log" 2>&1
            test_rc=$?
          fi

          echo "LAS_PRIVATE_TARGET_FMT_RC=$fmt_rc"
          echo "LAS_PRIVATE_TARGET_COMPILE_RC=$compile_rc"
          echo "LAS_PRIVATE_TARGET_COMPILE_ERROR_CODES=$codes"
          echo "LAS_PRIVATE_TARGET_TEST_RC=$test_rc"
          echo "LAS_PRIVATE_TARGET_FMT_LOG_SHA256=$(sha256sum "$fmt_log" | awk '{print $1}')"
          echo "LAS_PRIVATE_TARGET_COMPILE_LOG_SHA256=$(sha256sum "$compile_log" | awk '{print $1}')"
          if [[ -s "$test_log" ]]; then
            echo "LAS_PRIVATE_TARGET_TEST_LOG_SHA256=$(sha256sum "$test_log" | awk '{print $1}')"
          fi

          if [[ "$fmt_rc" -eq 0 && "$compile_rc" -eq 0 && "$test_rc" -eq 0 ]]; then
            echo "LAS_PRIVATE_TARGET_RUST_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PRIVATE_TARGET_RUST_RESULT=FAIL"
          exit 1
