name: Private targeted Rust

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-targeted-rust.yml"

permissions:
  contents: read

env:
  REQUEST_MARKER: final-intent-evidence-currentness
  TARGET_REF_HASH: e9a03e2b78968bace8bffb3fec4263ef49768b71148a8bf8b8f809842022b361
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4d255a8b7fa7def12a1c296ca28822dbb5bc0227a80794351660f5c9298a5572

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private temporary head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-target-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          actual=""
          while IFS= read -r oid; do
            [[ -n "$oid" ]] || continue
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$actual"
              actual="$oid"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$actual"
          git merge-base --is-ancestor "$actual" FETCH_HEAD
          echo "::add-mask::$actual"
          git checkout -q --detach "$actual"
          test -z "$(git status --porcelain --untracked-files=no)"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_TARGET_SNAPSHOT_PROOF=$proof"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref actual proof

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null

      - name: Check private rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/fmt.log"
          set +e
          cargo +1.98.1 fmt --all -- --check >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_PRIVATE_TARGET_FMT_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          exit "$rc"

      - name: Compile private Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/compile.jsonl"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --no-run --message-format=json >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_PRIVATE_TARGET_COMPILE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          grep -oE 'error\\[E[0-9]+\\]' "$log" | sort -u | sed -E 's/error\\[([^]]+)\\]/LAS_PRIVATE_TARGET_RUST_CODE=\\1/' || true
          python3 - "$log" "$GITHUB_WORKSPACE/target" <<'PY'
          import hashlib, json, os, sys
          log_path, root = sys.argv[1], os.path.realpath(sys.argv[2])
          seen = set()
          with open(log_path, encoding="utf-8", errors="replace") as fh:
              for raw in fh:
                  try:
                      obj = json.loads(raw)
                  except Exception:
                      continue
                  if obj.get("reason") != "compiler-message":
                      continue
                  msg = obj.get("message") or {}
                  if msg.get("level") != "error":
                      continue
                  code = (msg.get("code") or {}).get("code") or "NO_CODE"
                  spans = [s for s in (msg.get("spans") or []) if s.get("is_primary")]
                  if not spans:
                      key = (code, "NO_SPAN", 0, 0)
                      if key not in seen:
                          seen.add(key)
                          print(f"LAS_PRIVATE_TARGET_CARGO_ERROR={code}:NO_SPAN:0:0")
                      continue
                  for span in spans:
                      filename = str(span.get("file_name") or "")
                      absolute = os.path.realpath(os.path.join(root, filename)) if not os.path.isabs(filename) else os.path.realpath(filename)
                      rel = os.path.relpath(absolute, root).replace(os.sep, "/") if absolute == root or absolute.startswith(root + os.sep) else "<EXTERNAL>"
                      path_hash = hashlib.sha256(rel.encode()).hexdigest()
                      line = int(span.get("line_start") or 0)
                      col = int(span.get("column_start") or 0)
                      key = (code, path_hash, line, col)
                      if key not in seen:
                          seen.add(key)
                          print(f"LAS_PRIVATE_TARGET_CARGO_ERROR={code}:{path_hash}:{line}:{col}")
          PY
          if grep -Fqi 'unresolved import' "$log"; then echo "LAS_PRIVATE_TARGET_CATEGORY_UNRESOLVED_IMPORT=YES"; fi
          if grep -Fqi 'no method named' "$log"; then echo "LAS_PRIVATE_TARGET_CATEGORY_NO_METHOD=YES"; fi
          if grep -Fqi 'cannot find' "$log"; then echo "LAS_PRIVATE_TARGET_CATEGORY_CANNOT_FIND=YES"; fi
          if grep -Fqi 'could not compile' "$log"; then echo "LAS_PRIVATE_TARGET_CATEGORY_COULD_NOT_COMPILE=YES"; fi
          exit "$rc"

      - name: Run private Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/test.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_PRIVATE_TARGET_TEST_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          failed_count=0
          while IFS= read -r test_name; do
            [[ -n "$test_name" ]] || continue
            echo "LAS_PRIVATE_TARGET_FAILED_TEST_SHA256=$(printf '%s' "$test_name" | sha256sum | awk '{print $1}')"
            failed_count=$((failed_count + 1))
          done < <(sed -n -E 's/^test (.*) \.\.\. FAILED$/\1/p' "$log")
          echo "LAS_PRIVATE_TARGET_FAILED_TEST_COUNT=$failed_count"
          if (( rc != 0 )); then
            panic_line="$(grep -oE 'formal_proof_evidence_tests\.rs:[0-9]+:[0-9]+' "$log" | tail -n 1 | sed -E 's/.*:([0-9]+):[0-9]+/\1/' || true)"
            [[ -z "$panic_line" ]] || echo "LAS_PRIVATE_TARGET_PANIC_LINE=$panic_line"
          fi
          if (( rc != 0 )); then
            set +e
            RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib common_cause_admission_binds_exact_census_owner_and_rejects_reconstruction -- --test-threads=1 >/dev/null 2>&1
            common_rc=$?
            RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib separation_admission_is_canonical_and_binds_exact_census_owner -- --test-threads=1 >/dev/null 2>&1
            separation_rc=$?
            set -e
            echo "LAS_EDC_COMMON_CAUSE_FILTER_RC=$common_rc"
            echo "LAS_EDC_SEPARATION_FILTER_RC=$separation_rc"
          fi
          exit "$rc"
