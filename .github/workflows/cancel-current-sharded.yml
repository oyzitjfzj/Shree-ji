name: Cancel doomed current sharded verification

on:
  push:
    branches: [main]
    paths:
      - "CANCEL_CURRENT_SHARDED"

permissions:
  contents: read

concurrency:
  group: current-sharded-verify-ec8549d8
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Retire doomed run
        run: echo "Retiring exact-head sharded run while a current-revision TLC failure is independently rechecked."
