name: Private rustfmt fingerprint

on:
  push:
    branches: [main]
    paths:
      - RUN_PRIVATE_FMT_FINGERPRINT

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load opaque request
        shell: bash
        run: |
          set -euo pipefail
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_PRIVATE_FMT_FINGERPRINT)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_PRIVATE_FMT_FINGERPRINT)"
          path_hash="$(awk -F= '$1=="TARGET_PATH_HASH"{print $2}' RUN_PRIVATE_FMT_FINGERPRINT)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          [[ "$path_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"
          echo "TARGET_PATH_HASH=$path_hash" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          actual_proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$actual_proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_sha matched_ref actual

      - name: Fingerprint exact pinned formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt
          cargo +1.98.1 fmt --all

          match=""
          while IFS= read -r path; do
            h="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_PATH_HASH" ]]; then
              test -z "$match"
              match="$path"
            fi
          done < <(git ls-files)
          test -n "$match"
          echo "LAS_FMT_CONTENT_SHA256=$(sha256sum "$match" | awk '{print $1}')"
          echo "LAS_FMT_CHANGED=$([[ -n "$(git diff -- "$match")" ]] && echo YES || echo NO)"
          awk 'NR>=145 && NR<=160 { printf "LAS_FMT_LINE=%d:%d:", NR, length($0); print $0 | "sha256sum"; close("sha256sum") }' "$match" | sed -E 's/[[:space:]]+-[[:space:]]*$//'
          echo "LAS_FMT_FINGERPRINT_RESULT=PASS"
