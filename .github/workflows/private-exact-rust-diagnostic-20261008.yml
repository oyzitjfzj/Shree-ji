name: Private exact Rust diagnostic 20261008

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-exact-rust-diagnostic-20261008.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: aa719861f7785caff32c5544e61840d86bb48e6ea07b3120be87e429a1f5ed45
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 8cab105f7ffc27917b7b05a418520094638b34daaecd0f618e41460be9315c58
  EXPECTED_PRIVATE_TREE_PROOF: 4c1b5be38685053a2b26e1ba1b811d6a28fb0b69dc0231a4359db715b538e536

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach "$matched_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          echo "LAS_DIAG_RECOVERY=PASS"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null 2>&1
          echo "LAS_DIAG_TOOLCHAIN=PASS"

      - name: Classify Linux-enabled test compilation
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set +e
          cd target
          log="$RUNNER_TEMP/test.log"
          cargo +1.98.1 test --locked --lib --features linux-peer-credentials --no-run >"$log" 2>&1
          rc=$?
          echo "LAS_DIAG_RC=$rc"
          echo "LAS_DIAG_LOG_LINES=$(wc -l <"$log")"
          codes="$(grep -oE 'error\[E[0-9]{4}\]' "$log" | sed -E 's/error\[(E[0-9]{4})\]/\1/' | sort | uniq -c | awk '{printf "%s:%s;", $2, $1}')"
          echo "LAS_DIAG_ERROR_CODES=${codes:-NONE}"
          echo "LAS_DIAG_ERROR_MARKERS=$(grep -Ec '(^|[^[:alpha:]])error([^[:alpha:]]|$)' "$log" || true)"
          echo "LAS_DIAG_WARNING_MARKERS=$(grep -Ec '(^|[^[:alpha:]])warning([^[:alpha:]]|$)' "$log" || true)"
          echo "LAS_DIAG_COULD_NOT_COMPILE=$(grep -Ec '^error: could not compile' "$log" || true)"
          echo "LAS_DIAG_LINKER_FAILURES=$(grep -Ec 'linking with .* failed' "$log" || true)"
          echo "LAS_DIAG_PANIC_MARKERS=$(grep -Ec 'panicked at|stack overflow' "$log" || true)"
          exit "$rc"
