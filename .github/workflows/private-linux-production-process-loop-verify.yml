name: Private Linux production process-loop verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-production-process-loop-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 937e43eb7e37dbf1cd43ef2dbde987413754f7ff0d8629bf83d9c6d477cf455a
  BASE_REF_HASH: 67605dc33fc06e23bd4feae6f3f959b0689250029ae6dd667555113291ab090b
  EXPECTED_HEAD_PROOF: b0a914744f085356550a98b00cb0fd2a5d613bb8b468a3df0e1814ee6147d4d1
  EXPECTED_TREE_PROOF: ad5b532fdea7d0265b74281c7a2e1d6fe409d90d4d639272f1779116d4efa1cf
  EXPECTED_BASE_PROOF: 3f0e208a51fc28feb2c837cbe8cb96f8469310fef7748c8dba662800210409de

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Install checksum-pinned Ada toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify exact private branch and production surface
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          alr_bin="$(command -v alr)"
          workspace="$RUNNER_TEMP/root-production-toolchain"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$gpr_wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_bin" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$gpr_wrapper"
          "$gpr_wrapper" --version >/dev/null
          export GPRBUILD="$gpr_wrapper"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_base_ref=""
          start_sha=""
          base_sha=""
          while read -r candidate_sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
            if [[ "$ref_hash" == "$BASE_REF_HASH" ]]; then
              test -z "$matched_base_ref"
              matched_base_ref="$ref"
              base_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_base_ref"
          test -n "$start_sha"
          test -n "$base_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_base_ref"
          echo "::add-mask::$start_sha"
          echo "::add-mask::$base_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_BASE_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=16 origin "$matched_ref" "$matched_base_ref"
          git checkout -q --detach "$start_sha"
          test "$(git rev-parse HEAD)" = "$start_sha"
          start_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$start_tree"
          test "$(printf '%s' "$start_tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          git merge-base --is-ancestor "$base_sha" "$start_sha"
          test -z "$(git status --porcelain)"
          echo 'LAS_PROCESS_LOOP_IDENTITY=PASS'

          git diff --check "$base_sha"..HEAD
          git diff --no-renames --name-only "$base_sha"..HEAD | sort -u >"$RUNNER_TEMP/actual-paths"
          cat >"$RUNNER_TEMP/allowed-paths" <<'EOF_PATHS'
          .github/workflows/tmp-linux-production-process-loop-root-ffi.yml
          src/effect_fabric/root_supervisor_linux_process_loop.rs
          src/lib.rs
          EOF_PATHS
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/actual-paths"
          echo 'LAS_PROCESS_LOOP_SCOPE=PASS'

          python3 tools/verification/root_trust_input_contract.py
          cargo +1.98.1 fmt --all -- --check
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --lib --features "root-ffi linux-peer-credentials"
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials"
          cargo +1.98.1 clippy --locked --all-targets --features "root-ffi linux-peer-credentials" -- -D warnings
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features "root-ffi linux-peer-credentials" --tests -- --test-threads=1
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features "root-ffi linux-peer-credentials"
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          test -z "$(git status --porcelain)"
          echo 'LAS_PROCESS_LOOP_EXACT_PRODUCTION_GATE=PASS'
