name: Private Linux control poll channel apply 20261009

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-control-poll-channel-apply-20261009.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 864566cf743ac9a5561b7994d5b07ddf99beaab990f3ba52730800cd400b2e5e
  EXPECTED_HEAD_PROOF: b7267aeb9eb4425306a9529948f5897e79bd11ed9ca5a1c7f88730e3aae13ff6
  EXPECTED_TREE_PROOF: ff75945d4f0d7f25a98c522cbd910e899b4380694fe24a5f8073842830e5d28c
  EXPECTED_RED_HELPER_BLOB: a148aef06929b095ebe011b7615c7f4fe077e1c6
  EXPECTED_GREEN_HELPER_BLOB: d6a62fdc2ca05e3437d0026f5e58bc90e75e9382

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Apply verify and commit control channel state machine
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          echo "::add-mask::$write_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:tools/tmp_add_linux_control_poll_red.py)" = "$EXPECTED_RED_HELPER_BLOB"
          test "$(git rev-parse HEAD:tools/tmp_apply_linux_control_poll_channel.py)" = "$EXPECTED_GREEN_HELPER_BLOB"

          run_helper() {
            local stage="$1"; local path="$2"
            local log="$RUNNER_TEMP/${stage}.private.log"
            set +e
            python3 "$path" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_CONTROL_CHANNEL_STAGE=${stage}"
              echo "LAS_CONTROL_CHANNEL_RC=${rc}"
              echo "LAS_CONTROL_CHANNEL_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              safe_diag="$(grep -E 'expected exactly one .* found [0-9]+' "$log" | tail -n 1 || true)"
              if [[ -n "$safe_diag" ]]; then echo "LAS_CONTROL_CHANNEL_SAFE_DIAG=$safe_diag"; fi
              exit "$rc"
            fi
            echo "LAS_CONTROL_CHANNEL_${stage}=PASS"
            echo "LAS_CONTROL_CHANNEL_${stage}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            rm -f "$log"
          }

          run_helper red_tests tools/tmp_add_linux_control_poll_red.py
          run_helper channel_impl tools/tmp_apply_linux_control_poll_channel.py
          test ! -e tools/tmp_add_linux_control_poll_red.py
          test ! -e tools/tmp_apply_linux_control_poll_channel.py

          cargo +1.98.1 fmt --all >"$RUNNER_TEMP/fmt-apply.private.log" 2>&1
          git diff --check >>"$RUNNER_TEMP/fmt-apply.private.log" 2>&1
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u >"$RUNNER_TEMP/actual-paths"
          cat >"$RUNNER_TEMP/allowed-paths" <<'EOF'
          src/effect_fabric/root_supervisor_linux_control_channel.rs
          tools/tmp_add_linux_control_poll_red.py
          tools/tmp_apply_linux_control_poll_channel.py
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/actual-paths" >/dev/null
          echo 'LAS_CONTROL_CHANNEL_SCOPE=PASS'
          echo "LAS_CONTROL_CHANNEL_FMT_APPLY_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/fmt-apply.private.log" | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/fmt-apply.private.log"

          run_stage() {
            local stage="$1"; shift
            local log="$RUNNER_TEMP/${stage}.private.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_CONTROL_CHANNEL_STAGE=${stage}"
              echo "LAS_CONTROL_CHANNEL_RC=${rc}"
              echo "LAS_CONTROL_CHANNEL_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              exit "$rc"
            fi
            echo "LAS_CONTROL_CHANNEL_${stage}=PASS"
            echo "LAS_CONTROL_CHANNEL_${stage}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            rm -f "$log"
          }

          run_stage fmt_check cargo +1.98.1 fmt --all -- --check
          run_stage check_default env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_stage check_linux env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_stage clippy_linux cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          run_stage test_default env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets -- --test-threads=1
          run_stage test_linux env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials -- --test-threads=1
          run_stage release_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features linux-peer-credentials
          run_stage release_test env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --all-targets --features linux-peer-credentials -- --test-threads=1

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git add -A -- \
            src/effect_fabric/root_supervisor_linux_control_channel.rs \
            tools/tmp_add_linux_control_poll_red.py \
            tools/tmp_apply_linux_control_poll_channel.py
          git diff --cached --check
          git diff --cached --name-only | sort >"$RUNNER_TEMP/staged-paths"
          diff -u "$RUNNER_TEMP/actual-paths" "$RUNNER_TEMP/staged-paths" >/dev/null
          git commit -q -m "Make control channel transport fully pollable"
          test "$(git rev-parse HEAD^)" = "$start_sha"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"
          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$post_sha" = "$new_sha"
          echo 'LAS_CONTROL_CHANNEL_PRIVATE_COMMIT=PASS'
          echo "LAS_CONTROL_CHANNEL_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_CONTROL_CHANNEL_PRIVATE_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
