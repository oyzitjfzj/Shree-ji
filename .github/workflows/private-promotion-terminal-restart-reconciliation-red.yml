name: Private promotion terminal restart reconciliation RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-terminal-restart-reconciliation-red.yml"

permissions:
  contents: read

env:
  # SHA-256 of the exact private branch-head OID. The private ref/name and OID never enter logs.
  EXPECTED_HEAD_PROOF: 93d5da57eb778ba088d779d1a8f893771eefd25b8ffe411672582261fb6ced3e

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin '+refs/heads/*:refs/remotes/origin/*'
          resolved=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_HEAD_PROOF" ]]; then
              test -z "$resolved"
              resolved="$oid"
            fi
          done < <(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth resolved
          echo "LAS_PROMOTION_RESTART_RED_RECOVERY=PASS"

      - name: Require exact missing recovery-boundary RED
        shell: bash
        run: |
          set -euo pipefail
          cd target
          log="$RUNNER_TEMP/promotion-restart-red.private.log"
          set +e
          cargo test --lib --no-run >"$log" 2>&1
          rc=$?
          set -e

          digest="$(sha256sum "$log" | awk '{print $1}')"
          exact_symbol_marker=0
          grep -q 'recover_epoch_after_stable_promotion_terminal_ack' "$log" && exact_symbol_marker=1
          unresolved_import_marker=0
          grep -Eq 'error\[E0432\]|unresolved import' "$log" && unresolved_import_marker=1
          compile_marker=0
          grep -q 'could not compile' "$log" && compile_marker=1
          resource_marker=0
          grep -Eiq 'OutOfMemoryError|Killed|Cannot allocate memory|signal: 9|exit code 137' "$log" && resource_marker=1
          network_marker=0
          grep -Eiq 'failed to get|network failure|Could not resolve host|timed out.*download' "$log" && network_marker=1
          error_codes="$(grep -Eo 'error\[E[0-9]{4}\]' "$log" | sort -u | tr '\n' ',' | sed 's/,$//' || true)"
          unexpected_codes="$(awk 'match($0,/error\[E[0-9]{4}\]/){code=substr($0,RSTART+6,5); if(code!="E0432") seen[code]=1} END{print length(seen)}' "$log")"

          echo "LAS_PROMOTION_RESTART_RED_LOG_SHA256=$digest"
          echo "LAS_PROMOTION_RESTART_RED_ERROR_CODES=$error_codes"
          echo "LAS_PROMOTION_RESTART_RED_EXACT_SYMBOL_MARKER=$exact_symbol_marker"
          echo "LAS_PROMOTION_RESTART_RED_UNRESOLVED_IMPORT_MARKER=$unresolved_import_marker"
          echo "LAS_PROMOTION_RESTART_RED_COMPILE_MARKER=$compile_marker"
          echo "LAS_PROMOTION_RESTART_RED_UNEXPECTED_CODE_COUNT=$unexpected_codes"
          echo "LAS_PROMOTION_RESTART_RED_RESOURCE_MARKER=$resource_marker"
          echo "LAS_PROMOTION_RESTART_RED_NETWORK_MARKER=$network_marker"

          if [[ "$rc" -ne 0 \
             && "$exact_symbol_marker" -eq 1 \
             && "$unresolved_import_marker" -eq 1 \
             && "$compile_marker" -eq 1 \
             && "$unexpected_codes" -eq 0 \
             && "$resource_marker" -eq 0 \
             && "$network_marker" -eq 0 ]]; then
            echo "LAS_PROMOTION_RESTART_RED_RESULT=EXPECTED_RED"
            exit 0
          fi

          echo "LAS_PROMOTION_RESTART_RED_RESULT=UNEXPECTED"
          exit 1
