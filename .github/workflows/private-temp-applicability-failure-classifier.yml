name: Temporary applicability failure classifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-temp-applicability-failure-classifier.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 79bd231453eb80f391d2ce44a9267195e9b1dfaf4e37c6f424b80db51290642a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: b9347334e8c0cc50336f44dd5eb11d8c698d01a1b50e5e5f30db0756eab25925

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact hidden private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          actual=""
          while IFS= read -r oid; do
            proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
            if [[ "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$actual"
              actual="$oid"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$actual"
          git checkout -q --detach "$actual"
          unset PRIVATE_TOKEN auth matched_ref actual proof

      - name: Classify one failing test without source disclosure
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          cd target
          log="$RUNNER_TEMP/test.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib             applicability_currentness_rejects_reconstructed_sources_and_registry_substitution             -- --exact --nocapture --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_CLASSIFIER_RC=$rc"
          line="$(grep -oE 'formal_proof_evidence_tests\.rs:[0-9]+:[0-9]+' "$log" | tail -n1 | sed -E 's/.*:([0-9]+):[0-9]+/\1/' || true)"
          if [[ "$line" =~ ^[0-9]+$ ]]; then
            echo "LAS_CLASSIFIER_FAIL_LINE=$line"
          else
            echo "LAS_CLASSIFIER_FAIL_LINE=UNKNOWN"
          fi
          left="$(sed -n -E 's/^  left: (.*)$/\1/p' "$log" | tail -n1 || true)"
          right="$(sed -n -E 's/^ right: (.*)$/\1/p' "$log" | tail -n1 || true)"
          [[ -z "$left" ]] || echo "LAS_CLASSIFIER_LEFT_SHA256=$(printf '%s' "$left" | sha256sum | awk '{print $1}')"
          [[ -z "$right" ]] || echo "LAS_CLASSIFIER_RIGHT_SHA256=$(printf '%s' "$right" | sha256sum | awk '{print $1}')"
          rm -f "$log"
          exit 0
