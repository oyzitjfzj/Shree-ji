name: Profile39 source-pin hardening bridge

on:
  push:
    branches:
      - verify/profile39-source-pin-hardening-df76fbaf
    paths:
      - ".github/workflows/profile39-source-pin-hardening-bridge.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 13015cceb3c8a5898a9c264c0e12015201046e0734622a015531487ebca1ef88
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 0b1fa256f70c7df159a33331a8c19a172a8d1a41635b55852c2f320ba8f09519
  EXPECTED_PRIVATE_TREE_PROOF: 5b8926493e4cdede87beace4adba9c391983f04ece8ee324e2dc2e548e2f5e4d
  EXPECTED_QUOTIENT_BLOB: 02e95cb6a5a41f40c05a800fd483ee663288b2c6
  EXPECTED_SOURCE_PIN_CHECKER_BLOB: ec4a9b01aceac85be659c2ab1edd7f52600bb216
  EXPECTED_PROFILE39_RUNNER_BLOB: d4fb4da631767669ba28ff5dde381949453bedf4
  EXPECTED_PRIVATE_STRUCTURE_CI_BLOB: 6a83dde1914c333f055526273aaf293a7e28b437
  EXPECTED_QUOTIENT_CHECKER_BLOB: 0cdf683516f05383d97228f315f2da34fd038aa0
  EXPECTED_CONTRACT_CHECKER_BLOB: 6c6b781b6109470cffaf3e080aece82e547176b2
  EXPECTED_DEPENDENCY_CHECKER_BLOB: 4d38410507f1c0c3829976e9b8e9a9aa772deb69
  EXPECTED_PROFILE_CHECKER_BLOB: 5b6aada4cf6a22ed1f7d1a8740521ee7fcc3da82
  EXPECTED_PREFIX_CHECKER_BLOB: ecdccd48cd9a893033ad2c6a76e4ff38e51160a7
  EXPECTED_SUFFIX_CHECKER_BLOB: 0e496590ee97e92863201179d814a9a22057916d

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover exact private hardening candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q; git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; refs="$RUNNER_TEMP/heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched=""
          while read -r sha ref; do
            [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" != "$TARGET_REF_HASH" ]] || {
              test -z "$matched"
              matched="$ref"
            }
          done <"$refs"
          rm -f "$refs"; test -n "$matched"; echo "::add-mask::$matched"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth matched actual tree
          echo "LAS_PROFILE39_SOURCE_PIN_RECOVERY=PASS"

      - name: Verify exact proof-harness blob binding
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git hash-object spec/defence_evolution/CandidateAssuranceEvidenceCaseFrontierQuotient.tla)" = "$EXPECTED_QUOTIENT_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_profile39_source_pin.py)" = "$EXPECTED_SOURCE_PIN_CHECKER_BLOB"
          test "$(git hash-object tools/verification/run_candidate_assurance_profile39_compositional.sh)" = "$EXPECTED_PROFILE39_RUNNER_BLOB"
          test "$(git hash-object .github/workflows/candidate-assurance-frontier-quotient-structure.yml)" = "$EXPECTED_PRIVATE_STRUCTURE_CI_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_quotient.py)" = "$EXPECTED_QUOTIENT_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_contract.py)" = "$EXPECTED_CONTRACT_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_dependencies.py)" = "$EXPECTED_DEPENDENCY_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_profile39_contract.py)" = "$EXPECTED_PROFILE_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_safety_prefix_closure.py)" = "$EXPECTED_PREFIX_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_terminal_suffix_closure.py)" = "$EXPECTED_SUFFIX_CHECKER_BLOB"
          echo "LAS_PROFILE39_SOURCE_PIN_BLOBS=PASS"

      - name: Execute static profile39 hardening checks
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bash -n tools/verification/run_candidate_assurance_profile39_compositional.sh
          python3 tools/verification/verify_candidate_assurance_profile39_source_pin.py
          python3 tools/verification/verify_candidate_assurance_frontier_quotient.py
          python3 tools/verification/verify_candidate_assurance_frontier_contract.py
          python3 tools/verification/verify_candidate_assurance_frontier_dependencies.py
          python3 tools/verification/verify_candidate_assurance_profile39_contract.py
          python3 tools/verification/verify_candidate_assurance_safety_prefix_closure.py
          python3 tools/verification/verify_candidate_assurance_terminal_suffix_closure.py
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROFILE39_SOURCE_PIN_STATIC_CLOSURE=PASS"

      - name: Prove one-byte-equivalent semantic drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd target
          path=spec/defence_evolution/CandidateAssuranceEvidenceCaseFrontierQuotient.tla
          cp "$path" "$RUNNER_TEMP/quotient.original"
          printf '\n\\* negative drift probe\n' >>"$path"
          if python3 tools/verification/verify_candidate_assurance_profile39_source_pin.py; then
            echo "ERROR: source-pin checker accepted modified quotient source" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/quotient.original" "$path"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 tools/verification/verify_candidate_assurance_profile39_source_pin.py
          echo "LAS_PROFILE39_SOURCE_PIN_NEGATIVE_PROBE=PASS"
