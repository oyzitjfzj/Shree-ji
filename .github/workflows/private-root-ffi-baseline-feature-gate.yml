name: Private Root FFI baseline feature gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-root-ffi-baseline-feature-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust and Ada build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Check exact baseline feature shape
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          echo "::add-mask::$auth"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin 83e1bf88b3a908a011d54399f5c0cd0d2738db4f
          test "$(git rev-parse FETCH_HEAD)" = "83e1bf88b3a908a011d54399f5c0cd0d2738db4f"
          git checkout -q --detach FETCH_HEAD
          json="$RUNNER_TEMP/baseline.jsonl"
          set +e
          RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --lib --features root-ffi --message-format=json >"$json" 2>/dev/null
          rc=$?
          set -e
          echo "LAS_ROOT_FFI_BASELINE_RC=$rc"
          python3 - "$json" <<'PY'
          import json, sys
          codes=[]
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try: obj=json.loads(raw)
              except Exception: continue
              if obj.get("reason")!="compiler-message": continue
              msg=obj.get("message") or {}
              if msg.get("level")!="error": continue
              codes.append((msg.get("code") or {}).get("code") or "NO_CODE")
          print(f"LAS_ROOT_FFI_BASELINE_ERROR_COUNT={len(codes)}")
          print(f"LAS_ROOT_FFI_BASELINE_ERROR_CODES={sorted(set(codes))}")
          PY
          rm -f "$json"
