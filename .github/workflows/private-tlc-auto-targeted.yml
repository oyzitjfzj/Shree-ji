name: Private indexed exact TLC diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_CURRENT_TLC_AUTO"

permissions:
  contents: read

concurrency:
  group: private-indexed-tlc-root108-cc4d09f8
  cancel-in-progress: false

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: cc4d09f83f8087f57331827f3894eff083834ad6b01f9daba215c57734af87cb
  EXPECTED_TLC_PROFILE_COUNT: "129"

jobs:
  tlc:
    strategy:
      fail-fast: false
      matrix:
        index: [108]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth"             fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TLC_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run canonical TLC profile by opaque index
        shell: bash
        env:
          TARGET_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.2/tla2tools.jar" >/dev/null 2>&1
          echo "7f21faa2cdae3189e7d5fadb4488f0dfcc658407  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" "$RUNNER_TEMP/run-fn.sh" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          map_match = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not map_match:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(map_match.group(1) + "\n", encoding="utf-8")
          fn_match = re.search(
              r'(run_tlc_profile\(\) \{.*?\n\})\n\nwhile IFS=\$\'\\t\' read -r cfg tla deadlock expectation; do',
              src, re.S)
          if not fn_match:
              raise SystemExit("canonical TLC runner not found")
          Path(sys.argv[3]).write_text(fn_match.group(1) + "\n", encoding="utf-8")
          PY

          TLC_MAP="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$TLC_MAP"
          count="$(wc -l < "$TLC_MAP" | tr -d ' ')"
          test "$count" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$TARGET_INDEX" -ge 0
          test "$TARGET_INDEX" -lt "$count"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$TLC_MAP")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -n "$cfg"
          test -n "$tla"

          log="$RUNNER_TEMP/private-tlc.log"
          set +e
          (
            set -euo pipefail
            ROOT="$ROOT"
            TMP="$RUNNER_TEMP/tlc-private"
            TLA_JAR="$TLA_JAR"
            PASS=0
            FAIL=0
            FAILED=()
            mkdir -p "$TMP"
            source "$RUNNER_TEMP/run-fn.sh"
            run_tlc_profile "$cfg" "$tla" "$deadlock" "$expectation"
            test "$FAIL" -eq 0
            test -z "$(git status --porcelain --untracked-files=no)"
          ) >"$log" 2>&1
          rc=$?
          set -e

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEMTCCApmgAwIBAgIUb+axIJTp0EaDKsLEp65D57c53+QwDQYJKoZIhvcNAQEL
          BQAwKDEmMCQGA1UEAwwdTEFTIGN1cnJlbnQgZXhhY3QgYWxlcnQgYXVkaXQwHhcN
          MjYwOTIxMjEzOTQzWhcNMjYwOTIzMjEzOTQzWjAoMSYwJAYDVQQDDB1MQVMgY3Vy
          cmVudCBleGFjdCBhbGVydCBhdWRpdDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCC
          AYoCggGBAOEkoJDxfIPQ1jAEulqVHNQRcVumdiuEq7H0hd8Jluq1jeaqAR4jB3ru
          VlB7gnnf/Vgw0+1zzW8TI4fS2PKcFqY1jmzK0qvTmpmKF6c4y5yzqMqoqdQin/qf
          Nz1mHByGFOFRhlaKMhnrtJ5gNDAxXPROQHZDk47kId1cRmvDyxsQ/OttZWMrheLE
          CIDF3QN7sZx04cKKv+VDQm89P5oz4KKx+0hSdIXuJPZKAeCeqTC41UWiNd7Wayng
          cEXlenFZI+5FC1rVLkMUU9zPeVGLn3xbmxn4iplCyLeMr0HcBw6dzPbVbELFA3Gk
          KuDpbwRhCkxadSIxcC6MtR6Yk05SXmlS8BmFmJ/AhwLPQ8SRSuD8yLExUb2Mi6ni
          /ZM6drlFeStYilMR4IsBecwUBNxnX2vfqT41xLj4KZbT5Clt+cPr8mT5/ER3uuxT
          74wm3g7KSBpP6q8MsyS5MLsXmdIsfqo2CRXgYC3HCZFdfNbNU9VcQlZJjA65pW1i
          9PZS1hU1AQIDAQABo1MwUTAdBgNVHQ4EFgQUgmN42CIigr6Mv2gmCzdTCk3HnCUw
          HwYDVR0jBBgwFoAUgmN42CIigr6Mv2gmCzdTCk3HnCUwDwYDVR0TAQH/BAUwAwEB
          /zANBgkqhkiG9w0BAQsFAAOCAYEAiJb/eksE3udM2VoQZyLOoItXGvwiNpV8468S
          PPWsv6Et7230sF70TTksHy4sAoMyrwOV1gFeSKD3IPlnBUt+ggA0q2PMWYWQ3hYd
          BXjkbrfOPHiVEDb5x2ubljS5KDIDKJbwEH9TIZIIdQdHii7CpNzabv3A6A0vk9PZ
          oV/7ojWgyPtiJt84txLrzVuDQijXBuxb2Ylt8X5qjYl5xUErHat/mJ1ldJRwNOMB
          E8XnNJ6CDJvd8PdxMfiScGmVBpQtxQE1/T552u1MQ5uMU/6QKxmuHSyW1qAlbbPK
          MRs6K1QzY/YaAWxfuvBqlRIefHFPC2jOkbtPEYtyFjSlIF4jezGPsl6gMrILh+kJ
          4vGx7zo29o0QTmAPPrxbxLG1Y1H6YQmAOVRLuwkwFSn2VPWApFI5oAvVM2qtBwge
          nfW64tk/D6/BFdggCxISziw/oAMWHYmx5F1MAszpxOZRggQKNJyK5l//2OaTiEKP
          FMpQdECSlw/zhs0apnPlLS+qJlPU
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "12:58:C7:EC:B1:8C:FF:FA:00:F9:DC:22:84:0C:DF:7B:EF:7E:3B:0B:D4:CA:E2:78:70:CF:6E:83:B6:3F:78:D9"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$log" -out "$RUNNER_TEMP/private-tlc.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_TLC_INDEX=$TARGET_INDEX"
          echo "LAS_TLC_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_TLC_RESULT=PASS"
            exit 0
          fi
          echo "LAS_TLC_RESULT=FAIL"
          exit 1

      - name: Upload encrypted TLC diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tlc-index-${{ matrix.index }}
          path: ${{ runner.temp }}/private-tlc.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0