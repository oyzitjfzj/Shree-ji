name: Private indexed exact TLC diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_CURRENT_TLC_AUTO"

permissions:
  contents: read

concurrency:
  group: private-current-tlc-auto-targeted
  cancel-in-progress: false

env:
  DIAG_RSA_PUB_B64: 
  DIAG_RSA_PUB_SHA256: 09dd314ef0de438c41b3e841274ef58e71f2acc658c0ad58294fce668ed3feba

jobs:
  tlc:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4
        with:
          path: control

      - name: Load opaque TLC request
        shell: bash
        run: |
          set -euo pipefail
          file="$GITHUB_WORKSPACE/control/RUN_CURRENT_TLC_AUTO"
          test -s "$file"
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' "$file")"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' "$file")"
          index="$(awk -F= '$1=="TARGET_INDEX"{print $2}' "$file")"
          request="$(awk -F= '$1=="REQUEST"{print $2}' "$file")"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          [[ "$index" =~ ^[0-9]+$ ]]
          [[ -n "$request" ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"
          echo "TARGET_INDEX=$index" >> "$GITHUB_ENV"
          echo "LAS_REQUEST=$request" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          fetched_head="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$matched_sha"
          echo "::add-mask::$fetched_head"

          resolved_sha=""
          while read -r candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved_sha"
              resolved_sha="$candidate"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)

          test -n "$resolved_sha"
          echo "::add-mask::$resolved_sha"
          git merge-base --is-ancestor "$resolved_sha" FETCH_HEAD
          git checkout -q --detach "$resolved_sha"
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$resolved_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_TLC_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth matched_sha matched_ref fetched_head resolved_sha actual candidate candidate_proof

      - name: Run canonical TLC profile by opaque index
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" "$RUNNER_TEMP/run-fn.sh" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          map_match = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not map_match:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(map_match.group(1) + "\n", encoding="utf-8")
          fn_match = re.search(
              r'(run_tlc_profile\(\) \{.*?\n\})\n\nwhile IFS=\$\'\\t\' read -r cfg tla deadlock expectation; do',
              src, re.S)
          if not fn_match:
              raise SystemExit("canonical TLC runner not found")
          runner = fn_match.group(1)
          Path(sys.argv[3]).write_text(runner + "\n", encoding="utf-8")
          PY
          grep -Fx '  local args=(-workers auto -lncheck final -fp 0)' "$RUNNER_TEMP/run-fn.sh" >/dev/null

          TLC_MAP="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$TLC_MAP"
          count="$(wc -l < "$TLC_MAP" | tr -d ' ')"
          echo "LAS_TLC_PROFILE_COUNT=$count"
          test "$count" -gt 0
          test "$TARGET_INDEX" -ge 0
          test "$TARGET_INDEX" -lt "$count"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$TLC_MAP")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -n "$cfg"
          test -n "$tla"

          log="$RUNNER_TEMP/private-tlc.log"
          set +e
          (
            set -euo pipefail
            ROOT="$ROOT"
            TMP="$RUNNER_TEMP/tlc-private"
            TLA_JAR="$TLA_JAR"
            PASS=0
            FAIL=0
            FAILED=()
            mkdir -p "$TMP"
            printf '%s\n' \
              'set -euo pipefail' \
              'ROOT="$1"' \
              'RUNNER_TEMP="$2"' \
              'cfg="$3"' \
              'tla="$4"' \
              'deadlock="$5"' \
              'expectation="$6"' \
              'cd "$ROOT"' \
              'TMP="$RUNNER_TEMP/tlc-private"' \
              'TLA_JAR="$RUNNER_TEMP/tla2tools.jar"' \
              'PASS=0' \
              'FAIL=0' \
              'FAILED=()' \
              'mkdir -p "$TMP"' \
              'source "$RUNNER_TEMP/run-fn.sh"' \
              'run_tlc_profile "$cfg" "$tla" "$deadlock" "$expectation"' \
              'test "$FAIL" -eq 0' \
              > "$RUNNER_TEMP/probe-run.sh"
            bash "$RUNNER_TEMP/probe-run.sh" \
              "$ROOT" "$RUNNER_TEMP" "$cfg" "$tla" "$deadlock" "$expectation"
          ) >"$log" 2>&1
          rc=$?
          set -e

          printf '%s' "$DIAG_RSA_PUB_B64" | base64 -d > "$RUNNER_TEMP/diag-public.pem"
          test "$(sha256sum "$RUNNER_TEMP/diag-public.pem" | awk '{print $1}')" = "$DIAG_RSA_PUB_SHA256"

          key_hex="$(openssl rand -hex 32)"
          iv_hex="$(openssl rand -hex 16)"
          printf '%s' "$key_hex" | xxd -r -p > "$RUNNER_TEMP/aes.key"
          openssl enc -aes-256-cbc -K "$key_hex" -iv "$iv_hex" \
            -in "$log" -out "$RUNNER_TEMP/tlc-log.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/diag-public.pem" \
            -in "$RUNNER_TEMP/aes.key" -out "$RUNNER_TEMP/aes.key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          printf '%s\n' "$iv_hex" > "$RUNNER_TEMP/iv.hex"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/private-tlc-bundle.tgz" \
            tlc-log.enc aes.key.enc iv.hex
          rm -f "$RUNNER_TEMP/aes.key" "$RUNNER_TEMP/diag-public.pem"
          echo "LAS_TLC_INDEX=$TARGET_INDEX"
          echo "LAS_TLC_BUNDLE_SHA256=$(sha256sum "$RUNNER_TEMP/private-tlc-bundle.tgz" | awk '{print $1}')"
          python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches = re.findall(
              r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue',
              text)
          if matches:
              generated, distinct, queue = matches[-1]
              print(f"LAS_TLC_GENERATED={generated.replace(',', '')}")
              print(f"LAS_TLC_DISTINCT={distinct.replace(',', '')}")
              print(f"LAS_TLC_QUEUE={queue.replace(',', '')}")
          depth = re.findall(r'Search depth of complete state graph is ([0-9]+)', text)
          if depth:
              print(f"LAS_TLC_SEARCH_DEPTH={depth[-1]}")
          PY
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_TLC_RESULT=PASS"
            exit 0
          fi
          echo "LAS_TLC_RESULT=FAIL"
          exit 1

      - name: Upload encrypted TLC diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tlc-targeted
          path: ${{ runner.temp }}/private-tlc-bundle.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0