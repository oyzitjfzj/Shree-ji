name: Private promotion durable activation arm GREEN candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-activation-arm-green-candidate.yml"
      - ".github/private-patches/promotion-activation-arm-green-v1.b64"
      - ".github/private-patches/promotion-activation-arm-protection-v1.b64"
      - ".github/private-patches/promotion-activation-arm-clippy-v1.b64"
      - ".github/private-patches/promotion-activation-arm-origin-v1.b64"
      - ".github/private-patches/promotion-activation-arm-origin-clippy-v1.b64"
      - ".github/private-patches/promotion-activation-arm-hardening-v1.b64"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: bd27b45610c9cce75c72e9601883a2314ffe4d912d441e615f9b530018787859
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4e3e9cb6d88769933f74df2e8beccd7168aa17fc58c2bd97ba88ef4fdc509d24
  EXPECTED_PRIVATE_HEAD_PROOF: 9cd1fdc2091e6ca154f907ba9091b65a8e48db1f2fc8d23e8616f6cdddb84e38
  EXPECTED_PATCH_CIPHERTEXT_SHA256: 671774406e8ed1f27bf97bdf6b27ae1a6dc5d70f99813d4acdbaea0010751a16
  EXPECTED_PROTECTION_PATCH_SHA256: f4f5a46d16449745bbeec11f541d3df89dd9b3a08f5bccf6f004d7a80dd8c3c9
  EXPECTED_CLIPPY_PATCH_SHA256: 2d20e489a06d2f53fe2354000a2bed5c94b4d21244b1e6a98c5003087d69fa97
  EXPECTED_ORIGIN_PATCH_SHA256: b8e0c3b66a3a5b8a310290dfbfa4e8fae797559d91e0b46716323e1b97390bac
  EXPECTED_ORIGIN_CLIPPY_PATCH_SHA256: 52044dba1ee3c151783f3cf75aeb7a5e14dd380a35962b7b578972a1b9b47358
  EXPECTED_HARDENING_PATCH_SHA256: 99dd226a42a62037800447ada3cfc7b5cd0db9cb660906fc2d3796a1ef0498ea

jobs:
  verify-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version

      - name: Resolve exact private snapshot and encrypted candidates
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          core_b64="$RUNNER_TEMP/activation-arm-green-patch.b64"
          core_enc="$RUNNER_TEMP/activation-arm-green-patch.enc"
          protection_b64="$RUNNER_TEMP/activation-arm-protection.b64"
          protection_enc="$RUNNER_TEMP/activation-arm-protection.enc"
          clippy_b64="$RUNNER_TEMP/activation-arm-clippy.b64"
          clippy_enc="$RUNNER_TEMP/activation-arm-clippy.enc"
          origin_b64="$RUNNER_TEMP/activation-arm-origin.b64"
          origin_enc="$RUNNER_TEMP/activation-arm-origin.enc"
          origin_clippy_b64="$RUNNER_TEMP/activation-arm-origin-clippy.b64"
          origin_clippy_enc="$RUNNER_TEMP/activation-arm-origin-clippy.enc"
          hardening_b64="$RUNNER_TEMP/activation-arm-hardening.b64"
          hardening_enc="$RUNNER_TEMP/activation-arm-hardening.enc"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-green-v1.b64" -o "$core_b64"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-protection-v1.b64" -o "$protection_b64"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-clippy-v1.b64" -o "$clippy_b64"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-origin-v1.b64" -o "$origin_b64"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-origin-clippy-v1.b64" -o "$origin_clippy_b64"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-activation-arm-hardening-v1.b64" -o "$hardening_b64"
          base64 -d "$core_b64" > "$core_enc"
          base64 -d "$protection_b64" > "$protection_enc"
          base64 -d "$clippy_b64" > "$clippy_enc"
          base64 -d "$origin_b64" > "$origin_enc"
          base64 -d "$origin_clippy_b64" > "$origin_clippy_enc"
          base64 -d "$hardening_b64" > "$hardening_enc"
          test "$(sha256sum "$core_enc" | awk '{print $1}')" = "$EXPECTED_PATCH_CIPHERTEXT_SHA256"
          test "$(sha256sum "$protection_enc" | awk '{print $1}')" = "$EXPECTED_PROTECTION_PATCH_SHA256"
          test "$(sha256sum "$clippy_enc" | awk '{print $1}')" = "$EXPECTED_CLIPPY_PATCH_SHA256"
          test "$(sha256sum "$origin_enc" | awk '{print $1}')" = "$EXPECTED_ORIGIN_PATCH_SHA256"
          test "$(sha256sum "$origin_clippy_enc" | awk '{print $1}')" = "$EXPECTED_ORIGIN_CLIPPY_PATCH_SHA256"
          test "$(sha256sum "$hardening_enc" | awk '{print $1}')" = "$EXPECTED_HARDENING_PATCH_SHA256"
          rm -f "$core_b64" "$protection_b64" "$clippy_b64" "$origin_b64" "$origin_clippy_b64" "$hardening_b64"

          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r candidate_sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=64 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"

          core_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          protection_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_PROTECTION_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          clippy_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_CLIPPY_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          origin_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_ORIGIN_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          origin_clippy_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_ORIGIN_CLIPPY_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          hardening_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_HARDENING_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          export_key="$(printf 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_EXPORT_V5\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$core_key"
          echo "::add-mask::$protection_key"
          echo "::add-mask::$clippy_key"
          echo "::add-mask::$origin_key"
          echo "::add-mask::$origin_clippy_key"
          echo "::add-mask::$hardening_key"
          echo "::add-mask::$export_key"
          printf '%s' "$export_key" > "$RUNNER_TEMP/export-key"
          chmod 600 "$RUNNER_TEMP/export-key"

          export LAS_PATCH_KEY="$core_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$core_enc" -out "$RUNNER_TEMP/core.py.gz"
          unset LAS_PATCH_KEY core_key
          gzip -dc "$RUNNER_TEMP/core.py.gz" > "$RUNNER_TEMP/core.py"
          chmod 600 "$RUNNER_TEMP/core.py"

          export LAS_PATCH_KEY="$protection_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$protection_enc" -out "$RUNNER_TEMP/protection.py.gz"
          unset LAS_PATCH_KEY protection_key
          gzip -dc "$RUNNER_TEMP/protection.py.gz" > "$RUNNER_TEMP/protection.py"
          chmod 600 "$RUNNER_TEMP/protection.py"

          export LAS_PATCH_KEY="$clippy_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$clippy_enc" -out "$RUNNER_TEMP/clippy.py.gz"
          unset LAS_PATCH_KEY clippy_key
          gzip -dc "$RUNNER_TEMP/clippy.py.gz" > "$RUNNER_TEMP/clippy.py"
          chmod 600 "$RUNNER_TEMP/clippy.py"

          export LAS_PATCH_KEY="$origin_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$origin_enc" -out "$RUNNER_TEMP/origin.py.gz"
          unset LAS_PATCH_KEY origin_key
          gzip -dc "$RUNNER_TEMP/origin.py.gz" > "$RUNNER_TEMP/origin.py"
          chmod 600 "$RUNNER_TEMP/origin.py"

          export LAS_PATCH_KEY="$origin_clippy_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$origin_clippy_enc" -out "$RUNNER_TEMP/origin_clippy.py.gz"
          unset LAS_PATCH_KEY origin_clippy_key
          gzip -dc "$RUNNER_TEMP/origin_clippy.py.gz" > "$RUNNER_TEMP/origin_clippy.py"
          chmod 600 "$RUNNER_TEMP/origin_clippy.py"

          export LAS_PATCH_KEY="$hardening_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$hardening_enc" -out "$RUNNER_TEMP/hardening.py.gz"
          unset LAS_PATCH_KEY hardening_key
          gzip -dc "$RUNNER_TEMP/hardening.py.gz" > "$RUNNER_TEMP/hardening.py"
          chmod 600 "$RUNNER_TEMP/hardening.py"

          rm -f "$core_enc" "$protection_enc" "$clippy_enc" "$origin_enc" "$origin_clippy_enc" "$hardening_enc" "$RUNNER_TEMP/core.py.gz" "$RUNNER_TEMP/protection.py.gz" "$RUNNER_TEMP/clippy.py.gz" "$RUNNER_TEMP/origin.py.gz" "$RUNNER_TEMP/origin_clippy.py.gz" "$RUNNER_TEMP/hardening.py.gz"
          echo "LAS_PROMOTION_ACTIVATION_ARM_GREEN_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"

      - name: Apply deterministic private candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          for patch in core protection clippy origin origin_clippy hardening; do
            log="$RUNNER_TEMP/${patch}-patch.log"
            if ! python3 "$RUNNER_TEMP/${patch}.py" >"$log" 2>&1; then
              echo "LAS_ACTIVATION_ARM_${patch^^}_PATCH_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              exit 1
            fi
            rm -f "$RUNNER_TEMP/${patch}.py" "$log"
          done
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo 'LAS_ACTIVATION_ARM_PATCH_SCOPE=PASS'

      - name: Format candidate and preserve scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/fmt.log"
          if ! cargo +1.98.1 fmt --all >"$log" 2>&1; then
            echo "LAS_ACTIVATION_ARM_FMT_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          if ! cargo +1.98.1 fmt --all -- --check >>"$log" 2>&1; then
            echo "LAS_ACTIVATION_ARM_FMT_CHECK_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          rm -f "$log"
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          echo 'LAS_ACTIVATION_ARM_FORMAT_SCOPE=PASS'

      - name: Export formatted candidate before strict gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          paths=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          tar -czf "$RUNNER_TEMP/activation-arm-formatted-candidate.tar.gz" "${paths[@]}"
          export LAS_EXPORT_KEY="$(cat "$RUNNER_TEMP/export-key")"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass env:LAS_EXPORT_KEY -in "$RUNNER_TEMP/activation-arm-formatted-candidate.tar.gz" \
            -out "$RUNNER_TEMP/activation-arm-formatted-candidate.tar.gz.enc"
          unset LAS_EXPORT_KEY
          rm -f "$RUNNER_TEMP/activation-arm-formatted-candidate.tar.gz"
          echo "LAS_PROMOTION_ACTIVATION_ARM_FORMATTED_EXPORT_SHA256=$(sha256sum "$RUNNER_TEMP/activation-arm-formatted-candidate.tar.gz.enc" | awk '{print $1}')"

      - name: Upload encrypted formatted candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-promotion-activation-arm-formatted-candidate
          path: ${{ runner.temp }}/activation-arm-formatted-candidate.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Prove strict compile and focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          run_private() {
            local label="$1"; shift
            local log="$RUNNER_TEMP/${label}.log"
            if ! "$@" >"$log" 2>&1; then
              echo "LAS_${label^^}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              exit 1
            fi
            rm -f "$log"
          }
          run_private activation_arm_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_private activation_arm_clippy env RUSTFLAGS=-Dwarnings cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          run_private activation_arm_focused cargo +1.98.1 test --locked --lib promotion_activation_durable_arm_red_tests -- --test-threads=1
          run_private activation_arm_bridge cargo +1.98.1 test --locked --lib promotion_root_effect_bridge -- --test-threads=1
          run_private activation_arm_durability cargo +1.98.1 test --locked --lib promotion_transaction_durability_red_tests -- --test-threads=1
          run_private activation_arm_protection cargo +1.98.1 test --locked --lib promotion_artifact_protection_tests -- --test-threads=1
          echo 'LAS_PROMOTION_ACTIVATION_ARM_STRICT=PASS'
          echo 'LAS_PROMOTION_ACTIVATION_ARM_FOCUSED_GREEN=PASS'

      - name: Prove full serialized library regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/full-lib.log"
          if ! cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$log" 2>&1; then
            echo "LAS_ACTIVATION_ARM_FULL_LIB_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          tests="$(grep -E '^test result: ok\.' "$log" | tail -1 | sed -E 's/.* ([0-9]+) passed.*/\1/')"
          test -n "$tests"
          echo "LAS_PROMOTION_ACTIVATION_ARM_FULL_LIB_TEST_COUNT=$tests"
          rm -f "$log"
          echo 'LAS_PROMOTION_ACTIVATION_ARM_FULL_LIB=PASS'

      - name: Export exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          paths=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          tar -czf "$RUNNER_TEMP/activation-arm-green-candidate.tar.gz" "${paths[@]}"
          export LAS_EXPORT_KEY="$(cat "$RUNNER_TEMP/export-key")"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:LAS_EXPORT_KEY -in "$RUNNER_TEMP/activation-arm-green-candidate.tar.gz" -out "$RUNNER_TEMP/activation-arm-green-candidate.tar.gz.enc"
          unset LAS_EXPORT_KEY
          rm -f "$RUNNER_TEMP/activation-arm-green-candidate.tar.gz" "$RUNNER_TEMP/export-key"
          echo "LAS_PROMOTION_ACTIVATION_ARM_GREEN_EXPORT_SHA256=$(sha256sum "$RUNNER_TEMP/activation-arm-green-candidate.tar.gz.enc" | awk '{print $1}')"
          echo 'LAS_PROMOTION_ACTIVATION_ARM_GREEN_CANDIDATE=PASS'

      - name: Revalidate and atomically commit exact candidate to current private head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          cd "$GITHUB_WORKSPACE/target"

          paths=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          tar -czf "$RUNNER_TEMP/verified-activation-arm-files.tar.gz" "${paths[@]}"

          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads-write"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git reset -q --hard "$start_sha"
          tar -xzf "$RUNNER_TEMP/verified-activation-arm-files.tar.gz"
          rm -f "$RUNNER_TEMP/verified-activation-arm-files.tar.gz"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/defence_evolution/promotion_activation_proposal.rs"
            "src/defence_evolution/promotion_artifact_protection.rs"
            "src/defence_evolution/promotion_artifact_protection_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/defence_evolution/promotion_transaction_journal.rs"
            "src/defence_evolution/promotion_transaction_journal_genesis_red_tests.rs"
            "src/defence_evolution/promotion_transaction_state.rs"
            "src/effect_fabric/dispatch_commit.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --check

          cargo +1.98.1 fmt --all -- --check
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          cargo +1.98.1 test --locked --lib promotion_activation_durable_arm_red_tests -- --test-threads=1
          cargo +1.98.1 test --locked --lib promotion_root_effect_bridge -- --test-threads=1
          cargo +1.98.1 test --locked --lib promotion_transaction_durability_red_tests -- --test-threads=1
          cargo +1.98.1 test --locked --lib promotion_artifact_protection_tests -- --test-threads=1
          cargo +1.98.1 test --locked --lib -- --test-threads=1

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git add -- "${expected[@]}"
          git commit -q -m "Implement durable activation arm with origin-bound effect evidence"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$matched_ref"
          echo "LAS_PROMOTION_ACTIVATION_ARM_PRIVATE_COMMIT=PASS"
          echo "LAS_PROMOTION_ACTIVATION_ARM_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

      - name: Encrypt private failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/export-key"
          test -s "$key_file" || exit 0
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/*.log)
          ((${#logs[@]} > 0)) || exit 0
          tar -czf "$RUNNER_TEMP/activation-arm-green-diagnostics.tar.gz" "${logs[@]}"
          export LAS_EXPORT_KEY="$(cat "$key_file")"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:LAS_EXPORT_KEY -in "$RUNNER_TEMP/activation-arm-green-diagnostics.tar.gz" -out "$RUNNER_TEMP/activation-arm-green-diagnostics.tar.gz.enc"
          unset LAS_EXPORT_KEY
          rm -f "$RUNNER_TEMP/activation-arm-green-diagnostics.tar.gz" "${logs[@]}" "$key_file"
          echo "LAS_PROMOTION_ACTIVATION_ARM_DIAGNOSTICS_SHA256=$(sha256sum "$RUNNER_TEMP/activation-arm-green-diagnostics.tar.gz.enc" | awk '{print $1}')"

      - name: Upload encrypted verified candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-promotion-activation-arm-green-candidate
          path: ${{ runner.temp }}/activation-arm-green-candidate.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload encrypted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-promotion-activation-arm-green-diagnostics
          path: ${{ runner.temp }}/activation-arm-green-diagnostics.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0