name: Sanitized private cargo diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_CARGO_DIAGNOSTIC"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Load opaque request
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_CARGO_DIAGNOSTIC
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_CARGO_DIAGNOSTIC)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_CARGO_DIAGNOSTIC)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved_sha=""
          while read -r candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved_sha"
              resolved_sha="$candidate"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved_sha"
          git merge-base --is-ancestor "$resolved_sha" FETCH_HEAD
          git checkout -q --detach "$resolved_sha"
          test "$(printf '%s' "$(git rev-parse HEAD)" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved_sha candidate candidate_proof

      - name: Classify cargo diagnostics without source disclosure
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal
          json="$RUNNER_TEMP/cargo.jsonl"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --message-format=json >"$json" 2>/dev/null
          rc=$?
          set -e
          echo "LAS_DIAG_CARGO_RC=$rc"
          python3 - "$json" "$RUNNER_TEMP/private-target" <<'PY'
          import hashlib, json, os, re, sys
          path, root = sys.argv[1], os.path.realpath(sys.argv[2])
          categories = [
              ("INNER_ATTRIBUTE", r"inner attribute|crate-level attribute|attribute.*not permitted"),
              ("UNUSED_ATTRIBUTE", r"unused attribute|attribute.*ignored"),
              ("UNSAFE_LINT", r"unsafe_code|unsafe code|forbid.*unsafe|deny.*unsafe"),
              ("MISSING_FIELD", r"missing field"),
              ("METHOD_NOT_FOUND", r"no method named|method .* not found"),
              ("UNUSED_IMPORT", r"unused import"),
              ("UNUSED_VARIABLE", r"unused variable"),
              ("DEAD_CODE", r"never used|never read|dead code"),
              ("MISMATCHED_TYPES", r"mismatched types"),
              ("BORROW", r"cannot borrow|borrowed|borrow checker"),
              ("MOVE", r"use of moved value|cannot move|moved here"),
              ("TRAIT_BOUND", r"trait bound .* is not satisfied"),
              ("NON_EXHAUSTIVE", r"non-exhaustive patterns"),
              ("UNREACHABLE", r"unreachable pattern|unreachable code"),
              ("VISIBILITY", r"private|visibility"),
              ("CONST_EVAL", r"constant evaluation|evaluation of constant"),
              ("MACRO", r"macro"),
              ("OTHER", r".*"),
          ]
          fingerprints = {
              "ATTR": r"attribute",
              "FORBID": r"forbid",
              "DENY": r"deny",
              "UNSAFE": r"unsafe",
              "MODULE": r"module",
              "CRATE": r"crate",
              "TEST": r"test",
              "WARNING": r"warning",
              "LINT": r"lint",
              "DOC": r"documentation|doc comment|docs",
              "EXPECTED": r"expected",
              "FOUND": r"found",
          }
          seen=set()
          for raw in open(path, encoding="utf-8", errors="replace"):
              try: obj=json.loads(raw)
              except Exception: continue
              if obj.get("reason") != "compiler-message": continue
              msg=obj.get("message") or {}
              if msg.get("level") != "error": continue
              text=str(msg.get("message") or "")
              if text.startswith("could not compile"): continue
              code=(msg.get("code") or {}).get("code") or "NO_CODE"
              category="OTHER"
              for name, pat in categories:
                  if re.search(pat, text, re.I):
                      category=name; break
              keys="+".join(k for k,p in fingerprints.items() if re.search(p, text, re.I)) or "NONE"
              spans=[s for s in (msg.get("spans") or []) if s.get("is_primary")]
              if not spans:
                  key=(category,code,"NO_SPAN",0,0,keys)
                  if key not in seen:
                      seen.add(key); print(f"LAS_DIAG={category}:{code}:NO_SPAN:0:0:{keys}")
                  continue
              for span in spans:
                  filename=str(span.get("file_name") or "")
                  absolute=os.path.realpath(os.path.join(root, filename)) if not os.path.isabs(filename) else os.path.realpath(filename)
                  rel=os.path.relpath(absolute, root).replace(os.sep,"/") if absolute==root or absolute.startswith(root+os.sep) else "<EXTERNAL>"
                  ph=hashlib.sha256(rel.encode()).hexdigest()
                  line=int(span.get("line_start") or 0); col=int(span.get("column_start") or 0)
                  key=(category,code,ph,line,col,keys)
                  if key not in seen:
                      seen.add(key); print(f"LAS_DIAG={category}:{code}:{ph}:{line}:{col}:{keys}")
          PY
          rm -f "$json"
          exit 0
