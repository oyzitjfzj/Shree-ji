name: Private Linux control poll RED 20261009

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-control-poll-red-20261009.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 864566cf743ac9a5561b7994d5b07ddf99beaab990f3ba52730800cd400b2e5e
  EXPECTED_HEAD_PROOF: 1f3a1530a2cfa2992ca1362a5567976893ec8fa1fdd8787452c04174045eabca
  EXPECTED_TREE_PROOF: cdc562c83ac0154279ac73b4f36c4cb5fe53bfb5caee18e2eb4d32ae3ff24bae
  EXPECTED_HELPER_BLOB: a148aef06929b095ebe011b7615c7f4fe077e1c6

jobs:
  prove-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Verify baseline then prove intended RED
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          target_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              target_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$target_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$target_sha"
          git checkout -q --detach "$target_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:tools/tmp_add_linux_control_poll_red.py)" = "$EXPECTED_HELPER_BLOB"

          baseline="$RUNNER_TEMP/baseline.private.log"
          cargo +1.98.1 test --locked --lib --features linux-peer-credentials -- --test-threads=1 >"$baseline" 2>&1
          echo 'LAS_CONTROL_POLL_BASELINE=PASS'
          echo "LAS_CONTROL_POLL_BASELINE_LOG_SHA256=$(sha256sum "$baseline" | awk '{print $1}')"
          rm -f "$baseline"

          python3 tools/tmp_add_linux_control_poll_red.py >"$RUNNER_TEMP/helper.private.log" 2>&1
          test ! -e tools/tmp_add_linux_control_poll_red.py
          cargo +1.98.1 fmt --all >"$RUNNER_TEMP/fmt.private.log" 2>&1
          git diff --check >>"$RUNNER_TEMP/fmt.private.log" 2>&1
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/effect_fabric/root_supervisor_linux_control_channel.rs tools/tmp_add_linux_control_poll_red.py "
          rm -f "$RUNNER_TEMP/helper.private.log" "$RUNNER_TEMP/fmt.private.log"

          red="$RUNNER_TEMP/red.private.log"
          set +e
          cargo +1.98.1 test --locked --lib --features linux-peer-credentials -- --test-threads=1 >"$red" 2>&1
          red_rc=$?
          set -e
          test "$red_rc" -ne 0
          grep -q 'authenticate_nonblocking' "$red"
          grep -q 'poll_receive' "$red"
          grep -q 'LinuxControlChannelReceivePoll' "$red"
          grep -q 'poll_send_reply' "$red"
          echo 'LAS_CONTROL_POLL_RED=PASS'
          echo "LAS_CONTROL_POLL_RED_RC=$red_rc"
          echo "LAS_CONTROL_POLL_RED_LOG_SHA256=$(sha256sum "$red" | awk '{print $1}')"
          rm -f "$red"
