name: Private assurance hardened candidate pre-TLC

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_HARDENED_PRE_TLC"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 31078e494efe33c36fd3a716ddc8d79278617b1c3ce84f89392e36bc2067510a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: a249d40448ad30229273b7d26ecb4978b4e6ae983bf3f5f982fe24dfcb3be6fb
  EXPECTED_PRIVATE_TREE_PROOF: 907e13b426777498acd854538e189648259dba477d03ca9ec44c7d097f7da93e
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590

jobs:
  pre_tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Recover exact hardened private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          git checkout -q -B verify-target "$actual"
          echo "LAS_HARDENED_PRE_TLC_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Run complete canonical pre-TLC stage
        shell: bash
        run: |
          set -euo pipefail
          cd target
          staged="$RUNNER_TEMP/verify-pre-tlc.sh"
          python3 - tools/verify_codespaces_all.sh "$staged" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text(encoding="utf-8")
          needle='TLC_MAP="$TMP/tlc-map.tsv"'
          if src.count(needle) != 1: raise SystemExit("canonical TLC boundary not unique")
          insertion='''\nrecord "tracked tree unchanged after pre-TLC verification" bash -c '\n  test -z "$(git status --porcelain --untracked-files=no)"\n'\necho "LAS_HARDENED_PRE_TLC_INTERNAL=PASS"\nexit 0\n\n'''
          Path(sys.argv[2]).write_text(src.replace(needle,insertion+needle,1),encoding="utf-8")
          PY
          chmod 0700 "$staged"
          private_log="$RUNNER_TEMP/pre-tlc.private.log"
          set +e
          LAS_VERIFY_EXPECTED_BRANCH=verify-target bash "$staged" >"$private_log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_HARDENED_PRE_TLC_INTERNAL=PASS$' "$private_log"; then
            grep -q '^LAS_CANDIDATE_ASSURANCE_FRONTIER_QUOTIENT_STRUCTURE=PASS$' "$private_log"
            grep -q '^LAS_CANDIDATE_ASSURANCE_FRONTIER_CHECKER_SELFTEST=PASS$' "$private_log"
            grep -q '^LAS_PROFILE39_CONTRACT=PASS$' "$private_log"
            rm -f "$private_log"
            echo "LAS_HARDENED_PRE_TLC_RESULT=PASS"
            exit 0
          fi
          echo "LAS_HARDENED_PRE_TLC_RC=$rc"
          echo "LAS_HARDENED_PRE_TLC_LOG_SHA256=$(sha256sum "$private_log" | awk '{print $1}')"
          fail_count="$(sed -n 's/^FAIL=//p' "$private_log" | tail -n 1 || true)"
          [[ -z "$fail_count" ]] || echo "LAS_HARDENED_PRE_TLC_FAIL_COUNT=$fail_count"
          echo "LAS_HARDENED_PRE_TLC_RESULT=FAIL"
          exit 1
