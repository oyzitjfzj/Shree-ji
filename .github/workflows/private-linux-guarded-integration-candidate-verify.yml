name: Private Linux guarded integration candidate verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-guarded-integration-candidate-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 932ea302f2670ef09cc7fb08906649fc7eda80be4a248e18aca79cd178f6ab26
  EXPECTED_HEAD_PROOF: 4721e7b2dc2455d272848f5d12c83aec39dc78eac7a5eccb1189c5def020b579
  EXPECTED_TREE_PROOF: c0005e529e8b5dac9c32abd79a2139312694920c28edecb969d793de0782b8a7

jobs:
  verify-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Verify exact private integration candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          target_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              target_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$target_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$target_sha"
          git checkout -q --detach "$target_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo 'LAS_GUARDED_INTEGRATION_IDENTITY=PASS'

          run_gate() {
            local stage="$1"
            shift
            local log="$RUNNER_TEMP/${stage}.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_GUARDED_INTEGRATION_STAGE=${stage}"
              echo "LAS_GUARDED_INTEGRATION_RC=${rc}"
              echo "LAS_GUARDED_INTEGRATION_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              exit "$rc"
            fi
            rm -f "$log"
            echo "LAS_GUARDED_INTEGRATION_${stage}=PASS"
          }

          run_gate fmt_check cargo +1.98.1 fmt --all -- --check
          run_gate base_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_gate linux_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_gate linux_clippy cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          run_gate linux_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --features linux-peer-credentials -- --test-threads=1
          run_gate linux_release_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features linux-peer-credentials
          run_gate linux_release_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --lib --features linux-peer-credentials -- --test-threads=1

          echo 'LAS_GUARDED_INTEGRATION_CANDIDATE=PASS'
          echo "LAS_GUARDED_INTEGRATION_HEAD_PROOF=$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_GUARDED_INTEGRATION_TREE_PROOF=$(printf '%s' "$tree" | sha256sum | awk '{print $1}')"
