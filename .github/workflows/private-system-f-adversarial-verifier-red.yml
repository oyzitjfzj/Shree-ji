name: Private System-F adversarial verifier RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-system-f-adversarial-verifier-red.yml"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: fd3e9f4c0aaec7b9fa8717e0fb725bbba0487696c21b3cb984cb14bb27fde55c

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private temporary head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/tmp/selector-execution-20260924
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_SYSTEM_F_RED_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Observe expected verifier RED without exposing private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/system-f-red-private.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib             defence_evolution::evidence_verifier::tests::             -- --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_SYSTEM_F_RED_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          if [[ "$rc" -ne 0 ]]             && grep -q 'AdversarialScenarioAdmissionVerifier' "$log"             && grep -q 'DefenceEvolutionEvidenceVerificationError' "$log"             && grep -q 'DefenceEvolutionEvidenceVerifierInitError' "$log"; then
            echo "LAS_SYSTEM_F_ADVERSARIAL_VERIFIER_RED=PASS"
            exit 0
          fi
          echo "LAS_SYSTEM_F_ADVERSARIAL_VERIFIER_RED=UNEXPECTED_FAILURE"
          exit 1
