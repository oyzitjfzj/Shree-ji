          kLQR3V2+Bx/18U1caaohfzruJsjpFiLbXNF+E8JgIfkmuqf9XqN8NVm9j7UzY4/G
          8zlgCONxjVK9ZrcuQTsHNzN+F8SSg3ogxhdE0WTGTsB0zEAm0nEH9lUSF9n8sbv4
          S9fA0WvpAgBYVV1MEq/MwCTsXUtEjhzxsb3f
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "6C:A4:00:21:2D:D5:D9:51:69:3B:AE:01:73:B5:95:5A:C3:77:CB:20:5B:2B:0E:3A:35:74:C8:FA:27:44:D8:43"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$log" -out "$RUNNER_TEMP/panic-hygiene-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_PANIC_HYGIENE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_PANIC_HYGIENE_RC=$rc"
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_PANIC_HYGIENE_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PANIC_HYGIENE_RESULT=FAIL"
          exit 1

      - name: Upload encrypted restriction-lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-production-panic-hygiene
          path: ${{ runner.temp }}/panic-hygiene-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
