name: Private production panic hygiene

on:
  push:
    branches: [main]
    paths:
      - "RUN_PRODUCTION_PANIC_HYGIENE"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 602d22ffbbb839f8fdce6bf9977890e82daf32e6b9edaff5c34059276bc2e80e

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_PANIC_HYGIENE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run production-only restriction lints privately
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy >/dev/null

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-panic-hygiene"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_panic_hygiene >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"

          cd "$GITHUB_WORKSPACE/target"
          # Build scripts intentionally fail the build by panicking on missing Cargo
          # invariants/toolchain failures. Suppress restriction lints only in the
          # runner copy of build.rs so the production library can be audited.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.rs")
          src = p.read_text(encoding="utf-8")
          p.write_text("#![allow(clippy::expect_used, clippy::panic)]\n" + src, encoding="utf-8")
          PY
          log="$RUNNER_TEMP/panic-hygiene-private.log"
          set +e
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 clippy --locked --all-features --lib --             -D warnings             -D clippy::unwrap_used             -D clippy::expect_used             -D clippy::panic             -D clippy::todo             -D clippy::unimplemented >"$log" 2>&1
          rc=$?
          set -e

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEQTCCAqmgAwIBAgIUCklbYvzL88BGimEcsotDIvFWI5IwDQYJKoZIhvcNAQEL
          BQAwMDEuMCwGA1UEAwwlTEFTIGN1cnJlbnQgcGFuaWMgaHlnaWVuZSBkaWFnbm9z
          dGljczAeFw0yNjA5MjExOTQxNDRaFw0yNjA5MjMxOTQxNDRaMDAxLjAsBgNVBAMM
          JUxBUyBjdXJyZW50IHBhbmljIGh5Z2llbmUgZGlhZ25vc3RpY3MwggGiMA0GCSqG
          SIb3DQEBAQUAA4IBjwAwggGKAoIBgQCsFp14AADRm285ZYGKwEFQIUfiiWyjkPxa
          G2YZ5E0PkWfRduq5qXJK+O96Vbea6rd2xnn4kEiSvNoMOOrU3Vq0nUGy0Wbj52En
          quzxNDluLSlr2uknYCXFWp+jSsSUiUdBINZ+dvAKXZOOQXTYSJIHknfhnJTcyMoF
          ycgksxoVuEC74tuR+AD8PZcxoH9RVzDyYNe68QkMZUsFvfADbSybt+tsK8za7gmH
          bqTpm+yJqq5hIOGljqjeqL93pByYIJ5oUehBuMuOmOmUJNkZme4XFnUeM7N/hYT+
          pBMJvDWVnSClTezxPVx1TbxsTqK+4C0rBjG5d/VibfxkXWLXilBswfsLETZoDhk2
