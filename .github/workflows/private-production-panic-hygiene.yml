          rljR+9vQyLTgU2TNIigmxALkOrz31S9HUIZQ9n31IIoArQmezIZtC/CgCDNbkfqg
          vzd8izT9QesGvxQbcLZWMG8nwntYOOUbvUZGJioIUxuiyAb1cBvvQWW5xsjpBs5i
          GZ73yhbnu0DR30uVHTwe6vE+OWTC9glRzMz7fVuDDTLx/rgRPG7nAFgTfHiCOd2z
          hXi3L69wFVo+UTHx1zN8PgXvPBgItE9Abf57C1pAInoZ2laqFV2BIeb89CTSO4pU
          HnEl3c3f0VdiLWZyy7pKHpp5T+w3C3PfsssWBLfSBTSERONs9A==
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "CE:31:79:4D:14:09:57:E0:51:1C:01:04:39:DD:3D:1F:40:E3:1E:F3:2D:BB:26:84:2B:04:7B:F2:AA:0B:A5:D3"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$log" -out "$RUNNER_TEMP/panic-hygiene-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_PANIC_HYGIENE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_PANIC_HYGIENE_RC=$rc"
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_PANIC_HYGIENE_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PANIC_HYGIENE_RESULT=FAIL"
          exit 1

      - name: Upload encrypted restriction-lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-production-panic-hygiene
          path: ${{ runner.temp }}/panic-hygiene-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
