name: Private production panic hygiene

on:
  push:
    branches: [main]
    paths:
      - "RUN_PRODUCTION_PANIC_HYGIENE"

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: ea6eb2444c6431c8d6c5e1ea4b3518331431332e4090cb560f45d8032151710e

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private active head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_PANIC_HYGIENE_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run production-only restriction lints privately
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy >/dev/null

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-panic-hygiene"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_panic_hygiene >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$GPRBUILD_WRAPPER"

          cd "$GITHUB_WORKSPACE/target"
          # Build scripts intentionally fail the build by panicking on missing Cargo
          # invariants/toolchain failures. Suppress restriction lints only in the
          # runner copy of build.rs so the production library can be audited.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.rs")
          src = p.read_text(encoding="utf-8")
          p.write_text("#![allow(clippy::expect_used, clippy::panic)]\n" + src, encoding="utf-8")
          PY
          log="$RUNNER_TEMP/panic-hygiene-private.log"
          set +e
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 clippy --locked --all-features --lib --             -D warnings             -D clippy::unwrap_used             -D clippy::expect_used             -D clippy::panic             -D clippy::todo             -D clippy::unimplemented >"$log" 2>&1
          rc=$?
          set -e

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIENzCCAp+gAwIBAgIUMZoJyq5ThJ44Qra8QzQWKSdCI7kwDQYJKoZIhvcNAQEL
          BQAwKzEpMCcGA1UEAwwgTEFTIGN1cnJlbnQgVExDIGV4YWN0IGRpYWdub3N0aWMw
          HhcNMjYwOTIxMjIyMzMwWhcNMjYwOTIzMjIyMzMwWjArMSkwJwYDVQQDDCBMQVMg
          Y3VycmVudCBUTEMgZXhhY3QgZGlhZ25vc3RpYzCCAaIwDQYJKoZIhvcNAQEBBQAD
          ggGPADCCAYoCggGBANLDvNf2mVNjyxr0AHyKmAQ4e21Pbqb7ckHdATjHlE7DiOpR
          Lb+thbXVVweHFBZPObQvXuTQRO5rld8C38wOop6WYUfFpvJOUlIntvE3+nAHk7iZ
          zHUjjFFi6eaRtY3X6LiECDyQbX6caos7SY4O4TL+UUbRpVgQAXCDZwSmKECaYkHe
          9tfATWULXnQAbNEUXDZnMK/jAMfWvuFT4F/luyOu9XgWXMOp7AmiJyabecPSNnaD
          qkjXjXxW87jR8l3/8xTx12/maWifkuV47/JD7hNSrlYj9TIN1tnpLqWwOSGy1zSo
          uaMZ3jDub1pv5lTa4dtOnghzFcj71dPG3rMxG6usZeOpaJ3GNJEIwge+iea8GlKS
          t+YtddN2ZP4+lf/L6FwFVYji+mnTpyArcjJB/3xJKU8FU/EypQQPcl1ymy5URV6c
          k9eMejHXCNNPdaTYgY3Qp8qNSZSKpwn+DfNOyMJJG98mbug2hBtqP2D+iiOtLeVp
          rwTVo078annsxz9WTwIDAQABo1MwUTAdBgNVHQ4EFgQUJTWHDdH0Ey70im8dUCz0
          8KrRsrMwHwYDVR0jBBgwFoAUJTWHDdH0Ey70im8dUCz08KrRsrMwDwYDVR0TAQH/
          BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEAmtuHXlvVMAcSqXDqEUxijMsix0aJ
