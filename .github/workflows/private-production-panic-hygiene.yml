          tQyJmnM/XXiJmxxcDMzsFDmtQILOo6oioRGGuDUEUdJ6/eQgoflFEDf0n85UKYbv
          ZkT1ogt4/n6PnWG7VT4YPz6GrHPPJN3KA9V5bJPAnj5mNkG2aQt0uD+NjCLVhSLb
          /5ZWT/TZVPzRyaaYiy4HhaYT+C2GPT+AG0kZ2TDPFTiVTkFl0xC3I2P6SNcZ4873
          Og1KVwuMY4TixKMpc14pqeAXInVNRVSy1FD/jkE5SgS9oVjkdE+gzO2r6BvKQFcz
          D79OTxNmk7U8yuBScPa6pkffG6V1rGFgYSjtH5+duFXMqiBdLw==
          -----END CERTIFICATE-----
          EOF_CERT
          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "30:58:66:B1:A9:D9:C3:D5:13:75:64:0A:ED:C4:FD:9D:10:54:C2:78:0A:F5:8C:31:88:32:C8:23:ED:41:3C:48"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$log" -out "$RUNNER_TEMP/panic-hygiene-private.cms" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_PANIC_HYGIENE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_PANIC_HYGIENE_RC=$rc"
          if [[ "$rc" -eq 0 ]]; then
            echo "LAS_PANIC_HYGIENE_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PANIC_HYGIENE_RESULT=FAIL"
          exit 1

      - name: Upload encrypted restriction-lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-production-panic-hygiene
          path: ${{ runner.temp }}/panic-hygiene-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
