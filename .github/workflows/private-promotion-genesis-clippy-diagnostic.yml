name: Private promotion genesis Clippy diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-genesis-clippy-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 36e21d1f34a51e92cdfdfce07e673abea6ea954f6e181312fce4ffe2858018a9
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 416c44c77a26671b77cfb906f769a6c52c266076e7eb71443761ec45f7c338b3

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Resolve exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_GENESIS_CLIPPY_DIAG_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Emit sanitized Clippy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          out="$RUNNER_TEMP/clippy.jsonl"
          err="$RUNNER_TEMP/clippy.stderr"
          set +e
          cargo +1.98.1 clippy --locked --all-targets --message-format=json -- -D warnings >"$out" 2>"$err"
          rc=$?
          set -e
          echo "LAS_PROMOTION_GENESIS_CLIPPY_DIAG_RC=$rc"
          echo "LAS_PROMOTION_GENESIS_CLIPPY_DIAG_STDERR_SHA256=$(sha256sum "$err" | awk '{print $1}')"
          python3 - "$out" "$GITHUB_WORKSPACE/target" <<'PY'
          import hashlib, json, os, sys
          path, root = sys.argv[1], os.path.realpath(sys.argv[2])
          seen = set()
          count = 0
          with open(path, encoding='utf-8', errors='replace') as fh:
              for raw in fh:
                  try:
                      obj = json.loads(raw)
                  except Exception:
                      continue
                  if obj.get('reason') != 'compiler-message':
                      continue
                  msg = obj.get('message') or {}
                  if msg.get('level') != 'error':
                      continue
                  code = (msg.get('code') or {}).get('code') or 'NO_CODE'
                  target = obj.get('target') or {}
                  kinds = ','.join(target.get('kind') or []) or 'UNKNOWN'
                  name = str(target.get('name') or '')
                  name_hash = hashlib.sha256(name.encode()).hexdigest()
                  spans = [s for s in (msg.get('spans') or []) if s.get('is_primary')]
                  if not spans:
                      key = (code, 'NO_SPAN', 0, 0, kinds, name_hash)
                      if key not in seen:
                          seen.add(key); count += 1
                          print(f'LAS_PROMOTION_GENESIS_CLIPPY_ERROR={code}:NO_SPAN:0:0:{kinds}:{name_hash}')
                      continue
                  for span in spans:
                      filename = str(span.get('file_name') or '')
                      absolute = os.path.realpath(os.path.join(root, filename)) if not os.path.isabs(filename) else os.path.realpath(filename)
                      if absolute == root or absolute.startswith(root + os.sep):
                          rel = os.path.relpath(absolute, root).replace(os.sep, '/')
                      else:
                          rel = '<EXTERNAL>'
                      path_hash = hashlib.sha256(rel.encode()).hexdigest()
                      line = int(span.get('line_start') or 0)
                      col = int(span.get('column_start') or 0)
                      key = (code, path_hash, line, col, kinds, name_hash)
                      if key in seen:
                          continue
                      seen.add(key); count += 1
                      print(f'LAS_PROMOTION_GENESIS_CLIPPY_ERROR={code}:{path_hash}:{line}:{col}:{kinds}:{name_hash}')
          print(f'LAS_PROMOTION_GENESIS_CLIPPY_ERROR_COUNT={count}')
          PY
          rm -f "$out" "$err"
          if [[ "$rc" -eq 0 ]]; then
            echo 'LAS_PROMOTION_GENESIS_CLIPPY_DIAG=UNEXPECTED_PASS'
            exit 1
          fi
          echo 'LAS_PROMOTION_GENESIS_CLIPPY_DIAG=PASS'
