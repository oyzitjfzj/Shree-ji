name: Private assurance frontier refinement closure

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_FRONTIER_REFINEMENT_CLOSURE"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 467d8341e1ee4c86da8481f0f6423e4cd20cac245d048a7ee053a0a26f010758
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: ce0bcc5ffdcfca8bf6ffe169f1361a9112e4019148ce96825729d5fd5f56add0
  EXPECTED_PRIVATE_TREE_PROOF: 0406ada589e0fb13c29af664563072211b9845548d2ee1b7088ad8123d93598c
  EXPECTED_CHECKER_BLOB: 0cdf683516f05383d97228f315f2da34fd038aa0
  EXPECTED_CONTRACT_BLOB: 6c6b781b6109470cffaf3e080aece82e547176b2
  EXPECTED_PROFILE_CONTRACT_BLOB: 42d676b3226d1836d8791341a8fbfa2ace57e195
  TLA_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104

jobs:
  structural_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recover exact refinement candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q; git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; refs="$RUNNER_TEMP/heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched=""
          while read -r sha ref; do [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" != "$TARGET_REF_HASH" ]] || { test -z "$matched"; matched="$ref"; }; done <"$refs"
          rm -f "$refs"; test -n "$matched"; echo "::add-mask::$matched"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"; tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_quotient.py)" = "$EXPECTED_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_contract.py)" = "$EXPECTED_CONTRACT_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_profile39_contract.py)" = "$EXPECTED_PROFILE_CONTRACT_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FRONTIER_REFINEMENT_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched actual tree

      - name: Execute fail-closed refinement checkers
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 tools/verification/verify_candidate_assurance_frontier_quotient.py
          python3 tools/verification/verify_candidate_assurance_frontier_contract.py
          python3 tools/verification/verify_candidate_assurance_profile39_contract.py
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_FRONTIER_REFINEMENT_STRUCTURE=PASS"
          echo "LAS_FRONTIER_REFINEMENT_NONVACUITY=PASS"
          echo "LAS_FRONTIER_REFINEMENT_PROFILE39_CONTRACT=PASS"

      - name: Fetch pinned TLA tools
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "$TLA_SHA1  $RUNNER_TEMP/tla2tools.jar" | sha1sum --check --strict

      - name: Parse quotient and abstraction probe
        shell: bash
        run: |
          set -euo pipefail
          cd target/spec/defence_evolution
          for module in \
            CandidateAssuranceEvidenceCaseFrontierQuotient.tla \
            CandidateAssuranceEvidenceCaseModel.tla \
            CandidateAssuranceEvidenceCaseFrontierAbstractionProbe.tla; do
            log="$RUNNER_TEMP/${module%.tla}.sany.log"
            java -cp "$RUNNER_TEMP/tla2tools.jar" tla2sany.SANY "$module" 2>&1 | tee "$log"
            if grep -Eiq '(^|[^A-Za-z])(error|parse error|semantic error)([^A-Za-z]|$)' "$log"; then
              echo "SANY error in $module" >&2; exit 1
            fi
          done
          echo "LAS_FRONTIER_REFINEMENT_SANY=PASS"

      - name: Exhaustively check one-dimensional abstraction relation
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx2g
        run: |
          set -euo pipefail
          cd target/spec/defence_evolution
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -workers auto -lncheck final -fp 0 \
            -config CandidateAssuranceEvidenceCaseFrontierAbstractionProbe.cfg \
            CandidateAssuranceEvidenceCaseFrontierAbstractionProbe.tla
          echo "LAS_FRONTIER_REFINEMENT_ABSTRACTION_PROBE=PASS"

  canonical_quotient_tlc:
    needs: structural_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Recover exact refinement candidate opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q; git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; refs="$RUNNER_TEMP/heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched=""
          while read -r sha ref; do [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" != "$TARGET_REF_HASH" ]] || { test -z "$matched"; matched="$ref"; }; done <"$refs"
          rm -f "$refs"; test -n "$matched"; echo "::add-mask::$matched"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"; tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_quotient.py)" = "$EXPECTED_CHECKER_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_frontier_contract.py)" = "$EXPECTED_CONTRACT_BLOB"
          test "$(git hash-object tools/verification/verify_candidate_assurance_profile39_contract.py)" = "$EXPECTED_PROFILE_CONTRACT_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CANONICAL_QUOTIENT_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched actual tree

      - name: Fetch pinned TLA tools
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "$TLA_SHA1  $RUNNER_TEMP/tla2tools.jar" | sha1sum --check --strict

      - name: Exhaustively check canonical profile-39 quotient
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          set -euo pipefail
          cd target/spec/defence_evolution
          meta="$RUNNER_TEMP/tlc-meta"
          mkdir -p "$meta"
          timeout --signal=TERM --kill-after=30s 105m \
            java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
              -workers auto -lncheck final -fp 0 -metadir "$meta" \
              -config CandidateAssuranceEvidenceCase.cfg \
              CandidateAssuranceEvidenceCaseModel.tla
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CANONICAL_PROFILE39_QUOTIENT_TLC=PASS"
