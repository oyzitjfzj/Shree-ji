name: Temporary private applicability verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-temp-applicability-verify.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 79bd231453eb80f391d2ce44a9267195e9b1dfaf4e37c6f424b80db51290642a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 550131befbe42aa3d4dcd8a22f5a674a167e2725d758fc6af40ef2e99f982ae2

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          echo "LAS_APP_VERIFY_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

      - name: Format working copy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          echo "LAS_APP_VERIFY_FORMATTED=YES"

      - name: Run library tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/tests.log"
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_APP_VERIFY_TEST_RC=$rc"
          echo "LAS_APP_VERIFY_TEST_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          failed_count="$(sed -n -E 's/^test (.*) ... FAILED$/x/p' "$log" | wc -l | tr -d ' ')"
          echo "LAS_APP_VERIFY_FAILED_TEST_COUNT=$failed_count"
          exit "$rc"

      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          log="$RUNNER_TEMP/clippy.log"
          set +e
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_APP_VERIFY_CLIPPY_RC=$rc"
          echo "LAS_APP_VERIFY_CLIPPY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          grep -oE 'error\[E[0-9]+\]' "$log" | sort -u | sed -E 's/error\[([^]]+)\]/LAS_APP_VERIFY_RUST_CODE=\1/' || true
          exit "$rc"
