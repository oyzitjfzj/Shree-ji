name: Private narrow diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RUN_DIAG"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          checkout_log="$RUNNER_TEMP/las-private-checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin refs/heads/work/assurance-core >"$checkout_log" 2>&1
          fetch_rc=$?
          set -e
          if [[ "$fetch_rc" -ne 0 ]]; then
            echo "LAS_PRIVATE_CHECKOUT=FAIL"
            echo "Private checkout diagnostics intentionally suppressed."
            exit 1
          fi

          git checkout -q --detach FETCH_HEAD >"$checkout_log" 2>&1
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_PRIVATE_SNAPSHOT_PROOF=$proof"
          git checkout -q -B verify-target "$actual"
          unset PRIVATE_TOKEN auth
          echo "LAS_PRIVATE_CHECKOUT_EXACT=YES"

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt clippy

      - name: Diagnose formatting privately
        shell: bash
        run: |
          set -euo pipefail
          cd target
          fmt_log="$RUNNER_TEMP/fmt.log"

          set +e
          cargo +1.98.1 fmt --all -- --check >"$fmt_log" 2>&1
          fmt_rc=$?
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          fmt_apply_rc=$?
          set -e

          echo "LAS_DIAG_FMT_RC=$fmt_rc"
          echo "LAS_DIAG_FMT_APPLY_RC=$fmt_apply_rc"

          python3 - "$fmt_log" <<'PY'
          import hashlib, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          paths = set()
          for raw in re.findall(r'(?:(?:[A-Za-z]:)?[^\s:()]+)?[A-Za-z0-9_.-]+\.rs', text):
              p = raw.replace("\\", "/")
              if "/target/" in p:
                  p = p.split("/target/", 1)[1]
              p = p.lstrip("./")
              if p.endswith(".rs"):
                  paths.add(p)
          for p in sorted(paths):
              print("LAS_DIAG_FMT_LOG_PATH_HASH=" + hashlib.sha256(p.encode()).hexdigest())
          PY

          if [[ "$fmt_apply_rc" -eq 0 ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              hash="$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
              echo "LAS_DIAG_FMT_DIFF_PATH_HASH=$hash"
            done < <(git diff --name-only)
            git reset --hard -q HEAD
          fi

          exit 0

      - name: Diagnose default compile privately
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd target
          check_log="$RUNNER_TEMP/check.log"

          set +e
          cargo +1.98.1 check --locked --all-targets >"$check_log" 2>&1
          check_rc=$?
          set -e
          echo "LAS_DIAG_CHECK_RC=$check_rc"

          grep -oE 'error\[E[0-9]+\]' "$check_log"             | sort -u             | sed -E 's/error\[([^]]+)\]/LAS_DIAG_RUST_ERROR_CODE=\1/' || true

          for pair in             'UNRESOLVED_IMPORT:unresolved import'             'MISSING_FILE:No such file or directory'             'CUSTOM_BUILD:failed to run custom build command'             'VERSION_SELECT:failed to select a version'             'RUST_VERSION:requires rustc'             'DUPLICATE:defined multiple times'             'LINKER:linking with'             'COULD_NOT_COMPILE:could not compile'; do
            key="${pair%%:*}"
            pattern="${pair#*:}"
            if grep -Fqi "$pattern" "$check_log"; then
              echo "LAS_DIAG_CATEGORY_$key=YES"
            fi
          done

          first_error="$(grep -m1 -E '^error(\[[^]]+\])?:' "$check_log" || true)"
          if [[ -n "$first_error" ]]; then
            normalized="$(printf '%s' "$first_error" | sed -E 's#(/[^ ]+)+#<PATH>#g')"
            hash="$(printf '%s' "$normalized" | sha256sum | awk '{print $1}')"
            echo "LAS_DIAG_FIRST_ERROR_HASH=$hash"
          fi

          exit 0
