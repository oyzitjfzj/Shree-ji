name: Private encrypted TLC recovery proof

on:
  push:
    branches: [main]
    paths:
      - "RUN_TLC_RECOVERY_PROOF"

permissions:
  contents: read

concurrency:
  group: private-encrypted-tlc-recovery-proof
  cancel-in-progress: false

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1f0ff8762cb0a5a6acd64fef6be848c7fdb8dd982636074515fe27c7543584c8
  EXPECTED_TLC_PROFILE_COUNT: "129"
  TARGET_INDEX: "2"
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private head and derive relay key
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          key="$(PRIVATE_TOKEN="$PRIVATE_TOKEN" SNAPSHOT_PROOF="$proof" python3 - <<'PY'
          import hashlib, hmac, os
          ctx = ("LAS/TLC-CHECKPOINT-RELAY/v1/" + os.environ["SNAPSHOT_PROOF"]).encode()
          print(hmac.new(os.environ["PRIVATE_TOKEN"].encode(), ctx, hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$key"
          printf '%s' "$key" > "$RUNNER_TEMP/relay-key"
          chmod 0600 "$RUNNER_TEMP/relay-key"
          echo "LAS_RECOVERY_PROOF_SNAPSHOT=$proof"
          unset PRIVATE_TOKEN auth key

      - name: Create real TLC checkpoint and encrypt it
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          test "$(wc -l < "$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -n "$cfg"
          test -n "$tla"
          test -z "$expectation"

          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          meta="$RUNNER_TEMP/tlc-meta"
          mkdir -p "$meta"
          args=(-workers auto -lncheck final -fp 0 -checkpoint 1 -metadir "$meta")
          if [[ "$deadlock" == "1" ]]; then args+=(-deadlock); fi
          args+=(-config "$cfg_base" "$tla_base")

          log="$RUNNER_TEMP/checkpoint-private.log"
          set +e
          (
            cd "$cfg_dir"
            timeout --signal=TERM --kill-after=20s 190s               java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"
          ) >"$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 124 && "$rc" -ne 143 ]]; then
            echo "LAS_CHECKPOINT_STAGE_RESULT=FAIL"
            exit "$rc"
          fi
          grep -Eqi 'checkpoint' "$log"
          find "$meta" -type f | grep -q .

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/tlc-checkpoint.tar.gz" tlc-meta
          key="$(cat "$RUNNER_TEMP/relay-key")"
          openssl cms -EncryptedData_encrypt -binary -aes-256-cbc             -secretkey "$key"             -in "$RUNNER_TEMP/tlc-checkpoint.tar.gz"             -outform DER -out "$RUNNER_TEMP/tlc-checkpoint.cms"
          shred -u "$RUNNER_TEMP/tlc-checkpoint.tar.gz" 2>/dev/null || rm -f "$RUNNER_TEMP/tlc-checkpoint.tar.gz"
          rm -rf "$meta"
          rm -f "$RUNNER_TEMP/relay-key"
          echo "LAS_CHECKPOINT_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/tlc-checkpoint.cms" | awk '{print $1}')"
          echo "LAS_CHECKPOINT_STAGE_RESULT=PASS"

      - name: Upload encrypted checkpoint only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tlc-recovery-proof
          path: ${{ runner.temp }}/tlc-checkpoint.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  recover:
    needs: checkpoint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout same exact private head and derive relay key
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/assurance-core
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          key="$(PRIVATE_TOKEN="$PRIVATE_TOKEN" SNAPSHOT_PROOF="$proof" python3 - <<'PY'
          import hashlib, hmac, os
          ctx = ("LAS/TLC-CHECKPOINT-RELAY/v1/" + os.environ["SNAPSHOT_PROOF"]).encode()
          print(hmac.new(os.environ["PRIVATE_TOKEN"].encode(), ctx, hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$key"
          printf '%s' "$key" > "$RUNNER_TEMP/relay-key"
          chmod 0600 "$RUNNER_TEMP/relay-key"
          echo "LAS_RECOVERY_PROOF_SNAPSHOT=$proof"
          unset PRIVATE_TOKEN auth key

      - name: Download encrypted checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: encrypted-tlc-recovery-proof
          path: ${{ runner.temp }}/relay

      - name: Decrypt and prove TLC recovery path
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          key="$(cat "$RUNNER_TEMP/relay-key")"
          openssl cms -EncryptedData_decrypt -binary             -secretkey "$key"             -inform DER -in "$RUNNER_TEMP/relay/tlc-checkpoint.cms"             -out "$RUNNER_TEMP/tlc-checkpoint.tar.gz"
          mkdir -p "$RUNNER_TEMP/restored"
          tar -C "$RUNNER_TEMP/restored" -xzf "$RUNNER_TEMP/tlc-checkpoint.tar.gz"
          shred -u "$RUNNER_TEMP/tlc-checkpoint.tar.gz" 2>/dev/null || rm -f "$RUNNER_TEMP/tlc-checkpoint.tar.gz"
          rm -f "$RUNNER_TEMP/relay-key"
          meta="$RUNNER_TEMP/restored/tlc-meta"
          test -d "$meta"
          find "$meta" -type f | grep -q .

          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$TLA_JAR"             "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          m = re.search(
              r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',
              src, re.S)
          if not m:
              raise SystemExit("canonical TLC map generator not found")
          Path(sys.argv[2]).write_text(m.group(1) + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<< "$line"
          test -n "$cfg"
          test -n "$tla"
          test -z "$expectation"
          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          args=(-workers auto -lncheck final -fp 0 -checkpoint 1 -metadir "$meta" -recover "$meta")
          if [[ "$deadlock" == "1" ]]; then args+=(-deadlock); fi
          args+=(-config "$cfg_base" "$tla_base")

          log="$RUNNER_TEMP/recover-private.log"
          set +e
          (
            cd "$cfg_dir"
            timeout --signal=TERM --kill-after=20s 150s               java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"
          ) >"$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 124 && "$rc" -ne 143 ]]; then
            echo "LAS_RECOVERY_STAGE_RESULT=FAIL"
            exit "$rc"
          fi
          if ! grep -Eqi 'recover(ing|ed)? .*checkpoint|checkpoint.*recover' "$log"; then
            echo "LAS_RECOVERY_MARKER=FAIL"
            exit 1
          fi
          echo "LAS_RECOVERY_MARKER=PASS"
          echo "LAS_RECOVERY_STAGE_RESULT=PASS"
