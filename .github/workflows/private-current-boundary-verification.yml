name: Private current-boundary verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_CURRENT_BOUNDARY"

permissions:
  contents: read

concurrency:
  group: private-current-boundary-verification
  cancel-in-progress: true

env:
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: cb30cf6e21838fafb27975d966c7c0214fada518070656bdf0d883032b1426e0
  DIAG_CERT_PEM_B64: 

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact private engineering head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/tmp/selector-execution-20260924
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CURRENT_BOUNDARY_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Run exact current-boundary verifier
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/current-boundary-private.log"
          set +e
          bash tools/verify_current_boundary.sh >"$log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >"$RUNNER_TEMP/current-boundary.rc"
          echo "LAS_CURRENT_BOUNDARY_RC=$rc"
          if [[ "$rc" -eq 0 ]] && grep -q '^LAS_CURRENT_BOUNDARY_RESULT=PASS$' "$log"; then
            echo "LAS_CURRENT_BOUNDARY_RESULT=PASS"
          else
            echo "LAS_CURRENT_BOUNDARY_RESULT=FAIL"
          fi

      - name: Encrypt private diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/current-boundary-private.log"
          test -s "$log"
          printf '%s' "$DIAG_CERT_PEM_B64" | base64 -d >"$RUNNER_TEMP/recipient-cert.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$log" -out "$RUNNER_TEMP/current-boundary-private.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_CURRENT_BOUNDARY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"

      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-boundary
          path: ${{ runner.temp }}/current-boundary-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/current-boundary.rc"
          test "$(cat "$RUNNER_TEMP/current-boundary.rc")" -eq 0
