name: SOL GNAT body group bisect

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_SOL_GROUP_BISECT"

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: public
            branch: work/root-a654-body-public-probe
          - label: formal
            branch: work/root-a654-body-formal-probe
          - label: query
            branch: work/root-a654-body-query-probe
          - label: proc
            branch: work/root-a654-body-proc-probe
    steps:
      - name: Checkout exact private probe
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "refs/heads/${{ matrix.branch }}"
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_BISECT_${{ matrix.label }}_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Compile isolated body group
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-bisect"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_bisect >/dev/null)
          probe="$RUNNER_TEMP/root-core-bisect"
          mkdir -p "$probe/obj"
          cat > "$probe/root_authority_core_probe.ads" <<'EOF_PROBE'
          with Root_Authority;
          package Root_Authority_Core_Probe is
             package Core is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Core_Probe;
          EOF_PROBE
          cat > "$probe/core_probe.gpr" <<EOF_GPR
          project Core_Probe is
             for Source_Dirs use ("$GITHUB_WORKSPACE/target/src/root_authority", "$probe");
             for Object_Dir use "$probe/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Core_Probe;
          EOF_GPR
          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -f -p -P"$probe/core_probe.gpr"
          ) >"$RUNNER_TEMP/bisect.log" 2>&1
          rc=$?
          set -e
          echo "LAS_BISECT_${{ matrix.label }}_RC=$rc"
          if grep -q "GNAT BUG DETECTED" "$RUNNER_TEMP/bisect.log"; then
            echo "LAS_BISECT_${{ matrix.label }}_ICE=YES"
          else
            echo "LAS_BISECT_${{ matrix.label }}_ICE=NO"
          fi
