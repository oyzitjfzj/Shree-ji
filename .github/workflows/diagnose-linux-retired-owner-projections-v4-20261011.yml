name: Encrypted Linux retired-owner projection diagnostic v4

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-linux-retired-owner-projections-v4-20261011.yml"
      - "verification-requests/diagnose-linux-retired-owner-projections-v4-20261011.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 1fac30945223ebc9f0cc8e1bbadc2bffd24839393c448896663afd60ae943539
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 5097792041cfdcc5ef4cd368b49c91188d7f79606dd347f6ad927e029a96d967
  EXPECTED_PRIVATE_TREE_PROOF: d6232af599a26f118bcc077a3fdcfb712654382bd1b74e2b30e08f54cfa8d894

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_OWNER_PROJECTION_DIAG_RECOVERY=PASS"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"

      - name: Produce encrypted diagnostics
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          fmt="$RUNNER_TEMP/fmt.txt"
          json="$RUNNER_TEMP/check.json"
          stderr="$RUNNER_TEMP/check.stderr"
          compact="$RUNNER_TEMP/diagnostic.json"

          set +e
          cargo +1.98.1 fmt --all -- --check >"$fmt" 2>&1
          fmt_rc=$?
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials --message-format=json >"$json" 2>"$stderr"
          check_rc=$?
          set -e

          python3 - "$fmt" "$json" "$stderr" "$compact" "$fmt_rc" "$check_rc" <<'PY'
          import json,sys
          fmt_path,json_path,stderr_path,out_path,fmt_rc,check_rc=sys.argv[1:]
          messages=[]
          for line in open(json_path,encoding='utf-8',errors='replace'):
              try: item=json.loads(line)
              except Exception: continue
              if item.get('reason')!='compiler-message': continue
              msg=item.get('message') or {}
              if msg.get('level') not in {'error','warning'}: continue
              spans=[]
              for s in msg.get('spans') or []:
                  if s.get('is_primary'):
                      spans.append({
                          'file':s.get('file_name'),
                          'line':s.get('line_start'),
                          'column':s.get('column_start'),
                          'label':s.get('label'),
                      })
              messages.append({
                  'level':msg.get('level'),
                  'code':(msg.get('code') or {}).get('code'),
                  'message':msg.get('message'),
                  'spans':spans,
                  'children':[{'level':c.get('level'),'message':c.get('message')} for c in (msg.get('children') or []) if c.get('level') in {'help','note'}],
              })
          data={
              'fmt_rc':int(fmt_rc),
              'check_rc':int(check_rc),
              'fmt_output':open(fmt_path,encoding='utf-8',errors='replace').read(),
              'compiler_messages':messages,
              'cargo_stderr':open(stderr_path,encoding='utf-8',errors='replace').read(),
          }
          with open(out_path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          PY

          echo "OPAQUE_OWNER_PROJECTION_DIAG_SHA256=$(sha256sum "$compact" | awk '{print $1}')"
          key="$RUNNER_TEMP/diag.key"
          openssl rand -hex 32 >"$key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass file:"$key" -in "$compact" -out "$RUNNER_TEMP/diagnostic.enc"
          cat >"$RUNNER_TEMP/public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAp+2F/SvFXf+OLMMGbiQ2
          Y1S14x+t6kyxSOHbQXvdyBfz7oGe/n379c1Y3ZJr0hB5TfZWk+pe1EOTbJeK9akX
          OwJ1LcBPk3+eZYy1nApdB0hkyQbsLJolWFvtTXjZ9AuS21TBJOaNtjFHK0bAfd+z
          xyuFCqzZQN8RIYHD/lxX2lp/Ts1LiY7wUrgcFgKBRuUGoUqzaB1T7oGc83YPRyc1
          BEzaO+PTHEE1V8qAfEIUbm/O/gcquK0MgDFmyxTSng3GOntq88DY2sWnwa2QR8Jj
          ZbfxZXGs3YZiNVre+ANlv3VHNOylh2bs9q+x/Ri3+VCGR8l+ZbKlELO7Kj7/h8hD
          o087bW8LtgJQaaRk3jeOd8+AWNpSKrC+SCJ34jPR2pBLzzgcbY8p2a0b9BC+IKHJ
          UFg7Fhiisyf8whh8pQshrjtp2lq1o4gpv/vi49OgxZ26gyQ5/hjLIs04E22CZxW2
          +OSkPRh90sUek5AerLfT6E2s2INf3ri6+Z18KIq8dlzxAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" -in "$key" -out "$RUNNER_TEMP/key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "OPAQUE_OWNER_PROJECTION_DIAG_KEY_B64=$(base64 -w0 "$RUNNER_TEMP/key.enc")"
          echo "OPAQUE_OWNER_PROJECTION_DIAG_DATA_B64=$(base64 -w0 "$RUNNER_TEMP/diagnostic.enc")"
          rm -f "$fmt" "$json" "$stderr" "$compact" "$key" "$RUNNER_TEMP/public.pem" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/diagnostic.enc"
