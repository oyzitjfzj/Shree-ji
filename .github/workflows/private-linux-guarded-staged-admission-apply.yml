name: Private Linux guarded staged admission apply

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-guarded-staged-admission-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 9170c8fd0669ab388b2863758b03aa79e4dd6e4e18057bd7a7def8615201dbc4
  EXPECTED_HEAD_PROOF: 38063aec9b599fc5eecdf161a8aa7061c952df03d6436498016259aa0aa3d4b6
  EXPECTED_TREE_PROOF: 65ee73acf4ebd880eb186798949219466f737896a0c655ffb21f561a48c14e46

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Apply verify and commit exact private guarded staged admission
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          echo "::add-mask::$write_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"

          python3 tools/tmp_apply_linux_guarded_staged_admission.py >"$RUNNER_TEMP/patch.log" 2>&1
          cargo +1.98.1 fmt --all >>"$RUNNER_TEMP/patch.log" 2>&1
          git diff --check >>"$RUNNER_TEMP/patch.log" 2>&1

          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u >"$RUNNER_TEMP/actual-paths"
          cat >"$RUNNER_TEMP/allowed-paths" <<'EOF'
          src/effect_fabric/root_control_channel_authority.rs
          src/effect_fabric/root_supervisor_linux_deployment.rs
          src/effect_fabric/root_supervisor_linux_guarded_session.rs
          src/effect_fabric/root_supervisor_linux_process_ingress.rs
          src/effect_fabric/root_supervisor_linux_service.rs
          tools/tmp_apply_linux_guarded_staged_admission.py
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/actual-paths" >/dev/null
          echo 'LAS_GUARDED_STAGED_ADMISSION_SCOPE=PASS'

          run_stage() {
            local stage="$1"
            shift
            local log="$RUNNER_TEMP/${stage}.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_GUARDED_STAGED_ADMISSION_STAGE=${stage}"
              echo "LAS_GUARDED_STAGED_ADMISSION_RC=${rc}"
              echo "LAS_GUARDED_STAGED_ADMISSION_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              tail -n 120 "$log"
              exit "$rc"
            fi
            rm -f "$log"
            echo "LAS_GUARDED_STAGED_ADMISSION_${stage}=PASS"
          }

          run_stage fmt_check cargo +1.98.1 fmt --all -- --check
          run_stage base_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_stage linux_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_stage linux_clippy cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          run_stage linux_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --features linux-peer-credentials -- --test-threads=1
          run_stage linux_release_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features linux-peer-credentials
          run_stage linux_release_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --lib --features linux-peer-credentials -- --test-threads=1

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git add -A -- \
            src/effect_fabric/root_control_channel_authority.rs \
            src/effect_fabric/root_supervisor_linux_deployment.rs \
            src/effect_fabric/root_supervisor_linux_guarded_session.rs \
            src/effect_fabric/root_supervisor_linux_process_ingress.rs \
            src/effect_fabric/root_supervisor_linux_service.rs \
            tools/tmp_apply_linux_guarded_staged_admission.py
          git diff --cached --check
          git diff --cached --name-only | sort >"$RUNNER_TEMP/staged-paths"
          diff -u "$RUNNER_TEMP/actual-paths" "$RUNNER_TEMP/staged-paths" >/dev/null
          git commit -q -m "Stage guarded admission without blocking control ingress"
          test "$(git rev-parse HEAD^)" = "$start_sha"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"

          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$post_sha" = "$new_sha"
          echo 'LAS_GUARDED_STAGED_ADMISSION_PRIVATE_COMMIT=PASS'
          echo "LAS_GUARDED_STAGED_ADMISSION_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_GUARDED_STAGED_ADMISSION_PRIVATE_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
