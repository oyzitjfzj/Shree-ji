name: Private opaque assurance panic hygiene

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-opaque-assurance-panic-hygiene.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: cafdfbc746e97cce57341d45c91c8e3bb5be0de854d76bf1ea03ab6c4e135800
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: a896d0382ad2cbd212711f614f034dd7708d24a3aeb484b6eb5fa34ee338ce3a

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$resolved"
          git checkout -q --detach "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "::add-mask::$resolved"
          echo "LAS_PANIC_HYGIENE_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Audit production Rust panic surfaces
        shell: bash
        run: |
          set -euo pipefail
          rustup component add clippy --toolchain 1.98.1 >/dev/null
          cd target

          # Build-script failure paths intentionally terminate the build; this local
          # runner-only allowance keeps the audit scoped to production library code.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build.rs")
          src=p.read_text(encoding="utf-8")
          p.write_text("#![allow(clippy::expect_used, clippy::panic)]\n"+src,encoding="utf-8")
          PY

          log="$RUNNER_TEMP/panic-hygiene.private.log"
          set +e
          cargo +1.98.1 clippy --locked --lib --message-format=json -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented >"$log" 2>&1
          rc=$?
          set -e

          echo "LAS_PANIC_HYGIENE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          echo "LAS_PANIC_HYGIENE_RC=$rc"
          python3 - "$log" "$RUNNER_TEMP/hygiene-counts" <<'PY'
          import hashlib, json, sys
          target_hashes={
              "ad2f6a85482c2ee47aaeb79488ad40eee52c841aedc87ecb965d18572ccfaf4b",
              "d43428a49aa4e388473c68788b43a3d04fcb6c0d6a2a9cae66382b3b0c7ead27",
          }
          wanted={
              "clippy::unwrap_used",
              "clippy::expect_used",
              "clippy::panic",
              "clippy::todo",
              "clippy::unimplemented",
          }
          all_restriction=set()
          target_restriction=set()
          unexpected_errors=set()
          with open(sys.argv[1],encoding="utf-8",errors="replace") as fh:
              for raw in fh:
                  try:
                      obj=json.loads(raw)
                  except Exception:
                      continue
                  if obj.get("reason")!="compiler-message":
                      continue
                  msg=obj.get("message") or {}
                  if msg.get("level")!="error":
                      continue
                  code=(msg.get("code") or {}).get("code") or "NONE"
                  spans=msg.get("spans") or []
                  primary=[s for s in spans if s.get("is_primary")]
                  ordered=primary+spans
                  if ordered:
                      span=ordered[0]
                      path=str(span.get("file_name") or "")
                      line=int(span.get("line_start") or 0)
                      path_hash=hashlib.sha256(path.encode()).hexdigest() if path else "NONE"
                  else:
                      path_hash="NONE"
                      line=0
                  item=(code,path_hash,line)
                  if code in wanted:
                      all_restriction.add(item)
                      if path_hash in target_hashes:
                          target_restriction.add(item)
                  else:
                      unexpected_errors.add(item)
          print(f"LAS_PANIC_HYGIENE_PROJECT_RESTRICTION_COUNT={len(all_restriction)}")
          print(f"LAS_PANIC_HYGIENE_SLICE_DIAG_COUNT={len(target_restriction)}")
          print(f"LAS_PANIC_HYGIENE_UNEXPECTED_ERROR_COUNT={len(unexpected_errors)}")
          for lint,path_hash,line in sorted(target_restriction):
              print(f"LAS_PANIC_HYGIENE_SLICE_DIAG={lint}:{path_hash}:{line}")
          for code,path_hash,line in sorted(unexpected_errors):
              print(f"LAS_PANIC_HYGIENE_UNEXPECTED_DIAG={code}:{path_hash}:{line}")
          with open(sys.argv[2],"w",encoding="utf-8") as out:
              out.write(f"{len(target_restriction)} {len(unexpected_errors)}\n")
          PY
          read -r slice_count unexpected_count < "$RUNNER_TEMP/hygiene-counts"
          rm -f build.rs
          git checkout -q -- build.rs
          test -z "$(git status --porcelain --untracked-files=no)"
          if [[ "$slice_count" -eq 0 && "$unexpected_count" -eq 0 ]]; then
            echo "LAS_PANIC_HYGIENE_RESULT=PASS"
            exit 0
          fi
          echo "LAS_PANIC_HYGIENE_RESULT=FAIL"
          exit 1
