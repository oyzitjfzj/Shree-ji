name: Private promotion guarded-request correlation GREEN candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-guarded-request-correlation-green-candidate.yml"
      - ".github/private-patches/promotion-guarded-request-correlation-v1.b64"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: b773b1e8c6c1cbdfd3733d3029c1bf79473040b81131ffd4ac1ae055812ed196
  EXPECTED_PRIVATE_HEAD_PROOF: 5777048e713789410c1ee699ce22be1b0fead4f93849afa2d1835cbace545ef4
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 5777048e713789410c1ee699ce22be1b0fead4f93849afa2d1835cbace545ef4
  EXPECTED_PATCH_CIPHERTEXT_SHA256: 5c8f1c4fc4c034c52de1c8646591b6ba73e8c9558700584163085a0033a9e9d0

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version

      - name: Resolve exact private head and decrypt deterministic candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          patch_b64="$RUNNER_TEMP/correlation-patch.b64"
          patch_enc="$RUNNER_TEMP/correlation-patch.enc"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/private-patches/promotion-guarded-request-correlation-v1.b64" -o "$patch_b64"
          base64 -d "$patch_b64" > "$patch_enc"
          rm -f "$patch_b64"
          test "$(sha256sum "$patch_enc" | awk '{print $1}')" = "$EXPECTED_PATCH_CIPHERTEXT_SHA256"

          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          resolved="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$resolved"
          test "$resolved" = "$start_sha"
          test "$(printf '%s' "$resolved" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$resolved"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"

          patch_key="$(printf 'LAS_PROMOTION_GUARDED_REQUEST_CORRELATION_PATCH_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$patch_key"
          export LAS_PATCH_KEY="$patch_key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_PATCH_KEY -in "$patch_enc" -out "$RUNNER_TEMP/correlation.py.gz"
          unset LAS_PATCH_KEY patch_key
          gzip -dc "$RUNNER_TEMP/correlation.py.gz" > "$RUNNER_TEMP/correlation.py"
          chmod 600 "$RUNNER_TEMP/correlation.py"
          rm -f "$patch_enc" "$RUNNER_TEMP/correlation.py.gz"

          printf '%s' "$matched_ref" > "$RUNNER_TEMP/private-ref"
          printf '%s' "$start_sha" > "$RUNNER_TEMP/private-start-sha"
          chmod 600 "$RUNNER_TEMP/private-ref" "$RUNNER_TEMP/private-start-sha"
          echo "LAS_PROMOTION_CORRELATION_PRIVATE_HEAD_PROOF=$EXPECTED_PRIVATE_HEAD_PROOF"

      - name: Apply exact private candidate and prove scope
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/correlation-patch.log"
          if ! python3 "$RUNNER_TEMP/correlation.py" >"$log" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_PATCH_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            rm -f "$RUNNER_TEMP/correlation.py" "$log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/correlation.py" "$log"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/defence_evolution/promotion_activation_durable_arm_red_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          python3 - <<'PY'
          from pathlib import Path
          import re
          zero_arg = 0
          constructor_sites = 0
          for p in Path('src').rglob('*.rs'):
              text = p.read_text()
              zero_arg += len(re.findall(r'\.activation_durable_binding\s*\(\s*\)', text))
              constructor_sites += text.count('PromotionActivationDurableBinding::from_test_parts(')
          if zero_arg:
              raise SystemExit(f'zero-argument activation durable binding callsites remain: {zero_arg}')
          if constructor_sites < 4:
              raise SystemExit(f'unexpectedly low durable binding constructor coverage: {constructor_sites}')
          print(f'LAS_PROMOTION_CORRELATION_CONSTRUCTOR_SITES={constructor_sites}')
          PY

          git diff --check
          if git diff -- src | grep -E '^\+.*unsafe[[:space:]]*\{' >/dev/null; then
            echo 'new unsafe block detected' >&2
            exit 1
          fi
          echo 'LAS_PROMOTION_CORRELATION_PATCH_SCOPE=PASS'

      - name: Format and preserve lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          log="$RUNNER_TEMP/fmt.log"
          if ! cargo +1.98.1 fmt --all >"$log" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_FMT_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          if ! cargo +1.98.1 fmt --all -- --check >>"$log" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_FMT_CHECK_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          rm -f "$log"
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          git diff --check

      - name: Compile and strict Clippy
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/compile.log"
          if ! cargo +1.98.1 check --locked --all-targets >"$log" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_CHECK_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          if ! cargo +1.98.1 clippy --locked --all-targets -- -D warnings >>"$log" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_CLIPPY_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            exit 1
          fi
          rm -f "$log"
          echo 'LAS_PROMOTION_CORRELATION_STRICT_COMPILE=PASS'

      - name: Run focused non-vacuous regressions
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          run_filter() {
            local label="$1"
            local filter="$2"
            local out="$RUNNER_TEMP/${label}.txt"
            if ! cargo +1.98.1 test --locked --lib "$filter" -- --test-threads=1 >"$out" 2>&1; then
              echo "LAS_PROMOTION_CORRELATION_${label^^}_LOG_SHA256=$(sha256sum "$out" | awk '{print $1}')"
              exit 1
            fi
            python3 - "$out" "$label" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          counts = [int(x) for x in re.findall(r'test result: ok\. (\d+) passed;', text)]
          if not counts or max(counts) <= 0:
              raise SystemExit(f'{sys.argv[2]} filter executed zero tests')
          print(f'LAS_PROMOTION_CORRELATION_{sys.argv[2].upper()}_COUNT={max(counts)}')
          PY
            rm -f "$out"
          }
          run_filter arm promotion_activation_durable_arm_red_tests::
          run_filter bridge effect_fabric::dispatch_commit::promotion_root_effect_bridge::tests::
          run_filter durability promotion_transaction_durability_red_tests::
          run_filter journal promotion_transaction_journal_
          run_filter linux_journal promotion_transaction_linux_journal_

      - name: Run full serialized library regression
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          out="$RUNNER_TEMP/full-lib-tests.txt"
          if ! cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$out" 2>&1; then
            echo "LAS_PROMOTION_CORRELATION_FULL_LOG_SHA256=$(sha256sum "$out" | awk '{print $1}')"
            exit 1
          fi
          python3 - "$out" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          counts = [int(x) for x in re.findall(r'test result: ok\. (\d+) passed;', text)]
          if not counts or max(counts) < 1264:
              raise SystemExit(f'unexpected full library pass count: {counts}')
          print(f'LAS_PROMOTION_CORRELATION_FULL_COUNT={max(counts)}')
          PY
          rm -f "$out"

      - name: Revalidate and atomically commit exact candidate to current private head
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          cd "$GITHUB_WORKSPACE/target"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "src/defence_evolution/promotion_activation_durable_arm_red_tests.rs"
            "src/defence_evolution/promotion_transaction_durability.rs"
            "src/effect_fabric/dispatch_commit/promotion_root_effect_bridge.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --check

          matched_ref="$(cat "$RUNNER_TEMP/private-ref")"
          start_sha="$(cat "$RUNNER_TEMP/private-start-sha")"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test -n "$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"

          git config user.name 'LAS Verification Committer'
          git config user.email 'las-verification@users.noreply.github.com'
          git add -- "${expected[@]}"
          git diff --cached --check
          git commit -q -m 'Bind promotion activation arm to guarded RequestId'
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$matched_ref"
          echo 'LAS_PROMOTION_CORRELATION_PRIVATE_COMMIT=PASS'
          echo "LAS_PROMOTION_CORRELATION_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
