name: Verify resumable acceptance-chain verifier

on:
  push:
    branches:
      - verify/current-exact-resumable-v2-24244fc8
    paths:
      - "tools/verification/verify_resumable_acceptance_chain.py"
      - "tools/verification/verify_resumable_acceptance_chain_v2.py"
      - "tools/verification/verify_current_203_mixed_acceptance.py"
      - ".github/workflows/verify-resumable-acceptance-chain.yml"

permissions:
  contents: read

jobs:
  self_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover exact public verifier revision
        shell: bash
        run: |
          set -euo pipefail
          git init -q target
          cd target
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_RESUMABLE_CHAIN_VERIFIER_RECOVERY=PASS"

      - name: Compile and adversarially self-test verifier
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 -m py_compile \
            tools/verification/verify_resumable_acceptance_chain.py \
            tools/verification/verify_resumable_acceptance_chain_v2.py \
            tools/verification/verify_current_203_mixed_acceptance.py
          base="$(python3 tools/verification/verify_resumable_acceptance_chain.py --self-test)"
          test "$base" = "LAS_RESUMABLE_CHAIN_SELF_TEST=PASS"
          hardened="$(python3 tools/verification/verify_resumable_acceptance_chain_v2.py --self-test)"
          test "$hardened" = "LAS_RESUMABLE_CHAIN_V2_SELF_TEST=PASS"
          mixed="$(python3 tools/verification/verify_current_203_mixed_acceptance.py --self-test)"
          test "$mixed" = "LAS_CURRENT_203_MIXED_SELF_TEST=PASS"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_RESUMABLE_CHAIN_VERIFIER_SELF_TEST=PASS"
          echo "LAS_CURRENT_203_MIXED_VERIFIER_SELF_TEST=PASS"