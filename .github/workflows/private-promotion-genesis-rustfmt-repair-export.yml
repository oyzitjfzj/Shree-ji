name: Private promotion genesis rustfmt repair export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-genesis-rustfmt-repair-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-promotion-genesis-rustfmt-repair-export
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 36e21d1f34a51e92cdfdfce07e673abea6ea954f6e181312fce4ffe2858018a9
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 9ae08471dd3fa9d0d6bc06ac42408d09b159376d9e654932fcd03e8a61b3a58b

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add rustfmt --toolchain 1.98.1 >/dev/null
          cargo +1.98.1 --version
          rustfmt +1.98.1 --version

      - name: Resolve exact hidden private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test -z "$(git status --porcelain --untracked-files=no)"

          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          repair_key="$(printf 'LAS_PRIVATE_RUSTFMT_REPAIR_V1\n%s\n%s' "$resolved" "$tree" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$repair_key"
          printf '%s' "$repair_key" >"$RUNNER_TEMP/repair-key"
          chmod 600 "$RUNNER_TEMP/repair-key"
          echo "LAS_PRIVATE_GENESIS_RUSTFMT_REPAIR_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth resolved candidate proof ref_hash tree repair_key

      - name: Format and prove exact oracle result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          git diff --check

          changed="$RUNNER_TEMP/changed-paths"
          git diff --name-only >"$changed"
          test "$(wc -l <"$changed" | tr -d ' ')" = "4"
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) exit 1 ;;
            esac
          done <"$changed"

          actual="$RUNNER_TEMP/formatted-blobs"
          while IFS= read -r path; do
            git hash-object "$path"
          done <"$changed" | sort >"$actual"
          cat >"$RUNNER_TEMP/expected-blobs" <<'EOF'
          187c395ae305e0d64f09efffd2273711013dab50
          28e0d121fba222659c1ee0cff005b7472e8ab262
          67ed11e0b2c4b355427e3c8faf426735bbc13929
          fb81ceee7e32467213f0839cba7c30138377c0ed
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/expected-blobs"
          diff -u "$RUNNER_TEMP/expected-blobs" "$actual" >/dev/null

          plain="$RUNNER_TEMP/genesis-rustfmt-repair.tar.gz"
          tr '\n' '\0' <"$changed" | tar --null -T - -czf "$plain"
          export LAS_REPAIR_KEY="$(cat "$RUNNER_TEMP/repair-key")"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass env:LAS_REPAIR_KEY \
            -in "$plain" \
            -out "$RUNNER_TEMP/genesis-rustfmt-repair.enc"
          unset LAS_REPAIR_KEY
          rm -f "$plain" "$changed" "$actual" "$RUNNER_TEMP/expected-blobs" "$RUNNER_TEMP/repair-key"

          echo 'LAS_PRIVATE_GENESIS_RUSTFMT_REPAIR_ORACLE=PASS'
          echo 'LAS_PRIVATE_GENESIS_RUSTFMT_REPAIR_CHANGED_FILES=4'
          echo "LAS_PRIVATE_GENESIS_RUSTFMT_REPAIR_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/genesis-rustfmt-repair.enc" | awk '{print $1}')"

      - name: Upload encrypted repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-genesis-rustfmt-repair
          path: ${{ runner.temp }}/genesis-rustfmt-repair.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
