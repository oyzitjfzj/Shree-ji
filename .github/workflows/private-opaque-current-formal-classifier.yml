name: Opaque current changed-formal classifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-opaque-current-formal-classifier.yml"

permissions:
  contents: read

env:
  EXPECTED_BASE_PROOF: 4e25d40ec879c70cef9851fa8888a1cccab2de6761c80e502953ff7344abe746
  EXPECTED_HEAD_PROOF: a6bfa3187effa6ee9290af3e15245c7e3d836af6a91e958c4a3f92244bcee484
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Recover exact private revisions opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1024 origin '+refs/heads/*:refs/remotes/origin/*'

          find_by_proof() {
            local expected="$1"
            local found=""
            while IFS= read -r oid; do
              [[ -n "$oid" ]] || continue
              proof="$(printf '%s' "$oid" | sha256sum | awk '{print $1}')"
              if [[ "$proof" = "$expected" ]]; then found="$oid"; break; fi
            done < <(git rev-list --all --max-count=8192 | sort -u)
            test -n "$found"
            printf '%s' "$found"
          }

          base="$(find_by_proof "$EXPECTED_BASE_PROOF")"
          head="$(find_by_proof "$EXPECTED_HEAD_PROOF")"
          echo "::add-mask::$base"; echo "::add-mask::$head"
          git merge-base --is-ancestor "$base" "$head"
          git checkout -q --detach "$head"
          printf '%s' "$base" > "$RUNNER_TEMP/base"
          printf '%s' "$head" > "$RUNNER_TEMP/head"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth
          echo "LAS_OPAQUE_RECOVERY=PASS"

      - name: Classify exact changed formal failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          base="$(cat "$RUNNER_TEMP/base")"
          head="$(cat "$RUNNER_TEMP/head")"

          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null

          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" "$RUNNER_TEMP/run-fn.sh" <<'PY'
          from pathlib import Path
          import re, sys
          src=Path(sys.argv[1]).read_text(encoding="utf-8")
          mm=re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',src,re.S)
          if not mm: raise SystemExit("map extraction unavailable")
          Path(sys.argv[2]).write_text(mm.group(1)+"\n",encoding="utf-8")
          fm=re.search(r'(run_tlc_profile\(\) \{.*?\n\})\n\nwhile IFS=\$\'\\t\' read -r cfg tla deadlock expectation; do',src,re.S)
          if not fm: raise SystemExit("runner extraction unavailable")
          Path(sys.argv[3]).write_text(fm.group(1)+"\n",encoding="utf-8")
          PY

          map="$RUNNER_TEMP/map.tsv"
          python3 "$RUNNER_TEMP/map.py" "$ROOT" > "$map"
          changed="$RUNNER_TEMP/changed"
          git diff --name-only "$base" "$head" -- ':(glob)spec/**/*.cfg' ':(glob)spec/**/*.tla' | sort -u > "$changed"
          selected="$RUNNER_TEMP/selected.tsv"
          python3 - "$map" "$changed" > "$selected" <<'PY'
          import sys
          changed={line.strip() for line in open(sys.argv[2],encoding="utf-8") if line.strip()}
          for raw in open(sys.argv[1],encoding="utf-8"):
              row=raw.rstrip("\n").split("\t")
              if len(row)<4: row += [""]*(4-len(row))
              cfg,tla,deadlock,expectation=row[:4]
              if cfg in changed or tla in changed:
                  print("\t".join((cfg,tla,deadlock,expectation)))
          PY
          test "$(wc -l < "$selected" | tr -d ' ')" = "1"
          IFS=$'\t' read -r cfg tla deadlock expectation < "$selected"
          test -n "$cfg"; test -n "$tla"

          TMP="$RUNNER_TEMP/tlc-private"
          mkdir -p "$TMP"
          PASS=0; FAIL=0; FAILED=()
          source "$RUNNER_TEMP/run-fn.sh"
          outer="$RUNNER_TEMP/outer.private.log"
          set +e
          run_tlc_profile "$cfg" "$tla" "$deadlock" "$expectation" >"$outer" 2>&1
          runner_rc=$?
          set -e
          profile_log="$TMP/tlc-$(echo "$cfg" | tr '/.' '__').log"
          test -s "$profile_log"

          CFG_PATH="$cfg" LOG_PATH="$profile_log" RUNNER_RC="$runner_rc" python3 - <<'PY'
          from pathlib import Path
          import os,re
          log=Path(os.environ["LOG_PATH"]).read_text(encoding="utf-8",errors="replace")
          cfg=Path(os.environ["CFG_PATH"]).read_text(encoding="utf-8",errors="replace")
          rc=int(os.environ["RUNNER_RC"])

          def checks(kind):
              target={"inv":{"INVARIANT","INVARIANTS"},"prop":{"PROPERTY","PROPERTIES"}}[kind]
              blockers={"SPECIFICATION","CONSTANT","CONSTANTS","CONSTRAINT","CONSTRAINTS",
                        "ACTION_CONSTRAINT","ACTION_CONSTRAINTS","INVARIANT","INVARIANTS",
                        "PROPERTY","PROPERTIES","SYMMETRY","VIEW","CHECK_DEADLOCK",
                        "ALIAS","POSTCONDITION"}
              names=[]; active=False
              for raw in cfg.splitlines():
                  s=raw.strip()
                  if not s or s.startswith("\\*"): continue
                  parts=s.split(); head=parts[0]
                  if head in target:
                      active=True; parts=parts[1:]
                  elif head in blockers:
                      active=False; continue
                  if active:
                      names += [x for x in parts if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*",x)]
              return names

          inv=checks("inv"); prop=checks("prop")
          klass="OTHER"; ordinal=0
          m=re.search(r"(?i)invariant\s+([A-Za-z_][A-Za-z0-9_]*)\s+is\s+violated",log)
          if m:
              klass="INVARIANT"; ordinal=(inv.index(m.group(1))+1) if m.group(1) in inv else 0
          else:
              m=re.search(r"(?i)(?:property|temporal property)\s+([A-Za-z_][A-Za-z0-9_]*)\s+is\s+violated",log)
              if m:
                  klass="TEMPORAL"; ordinal=(prop.index(m.group(1))+1) if m.group(1) in prop else 0
              elif re.search(r"(?i)parse error|parsing error",log): klass="PARSE"
              elif re.search(r"(?i)Semantic errors:|semantic error|Parsing or semantic analysis failed|SANY.*error",log): klass="SEMANTIC"
              elif re.search(r"(?i)Attempted to evaluate|evaluation error|undefined operator",log): klass="EVALUATION"
              elif "OutOfMemoryError" in log or "Java heap space" in log or re.search(r"(?m)^Killed\s*$",log): klass="RESOURCE"
              elif re.search(r"(?i)TLC threw an unexpected exception|Exception in thread|RuntimeException|StackOverflowError",log): klass="ENGINE"
              elif rc==0: klass="PASS"

          loc="0:0"
          lm=re.search(r"(?i)line\s+([0-9]+)\s*,\s*(?:col|column)\s+([0-9]+)",log)
          if lm: loc=f"{lm.group(1)}:{lm.group(2)}"

          progress=re.findall(r"([0-9][0-9,]*) states generated, ([0-9][0-9,]*) distinct states found(?:, ([0-9][0-9,]*) states left on queue)?",log)
          generated=distinct=queue=0
          if progress:
              g,d,q=progress[-1]
              generated=int(g.replace(",","")); distinct=int(d.replace(",","")); queue=int((q or "0").replace(",",""))

          print(f"LAS_OPAQUE_FORMAL_CLASS={klass}")
          print(f"LAS_OPAQUE_FORMAL_CHECK_ORDINAL={ordinal}")
          print(f"LAS_OPAQUE_FORMAL_LOCATION={loc}")
          print(f"LAS_OPAQUE_FORMAL_GENERATED={generated}")
          print(f"LAS_OPAQUE_FORMAL_DISTINCT={distinct}")
          print(f"LAS_OPAQUE_FORMAL_QUEUE={queue}")
          print(f"LAS_OPAQUE_FORMAL_LOG_SHA256={__import__('hashlib').sha256(log.encode()).hexdigest()}")
          PY

          rm -f "$outer" "$profile_log" "$selected" "$changed" "$map" "$RUNNER_TEMP/map.py" "$RUNNER_TEMP/run-fn.sh"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_OPAQUE_CLASSIFIER=PASS"
