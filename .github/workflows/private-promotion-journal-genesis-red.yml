name: Private promotion journal genesis RED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-journal-genesis-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: f3ac2ff3a5cb0ddce21e9dc471f54892c0e5f294415f552b513f911930f1675a
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 95405707fa74d791a991bb9b90fed7bf532c5daef54cde266811e85040ae4c88
  EXPECTED_VERIFIER_BLOB: 28fdc2538e7b1d59b17b322a85660fda1f27ad2c
  VERIFIER: tools/verify_promotion_journal_genesis_red.sh

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact private snapshot without disclosing private identifiers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=128 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object "$VERIFIER")" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PROMOTION_JOURNAL_GENESIS_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Observe exact private RED and publish only sanitized result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          out="$RUNNER_TEMP/promotion-journal-genesis-red.out"
          set +e
          bash "$VERIFIER" >"$out" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            rm -f "$out"
            echo 'LAS_PROMOTION_JOURNAL_GENESIS_RED_BRIDGE=FAILED'
            exit 1
          fi
          grep -Fxq 'LAS_PROMOTION_JOURNAL_GENESIS_RED=OBSERVED' "$out"
          count_line="$(grep -E '^LAS_PROMOTION_JOURNAL_GENESIS_RED_TEST_COUNT=[1-9][0-9]*$' "$out" | head -n 1 || true)"
          test -n "$count_line"
          rm -f "$out"
          echo 'LAS_PROMOTION_JOURNAL_GENESIS_RED=OBSERVED'
          echo "$count_line"
          echo 'LAS_PROMOTION_JOURNAL_GENESIS_RED_BRIDGE=PASS'
