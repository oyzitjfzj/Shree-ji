name: Frozen current exact resumable bootstrap v2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [2, 28, 29, 36, 110, 115, 133, 145, 156, 157, 168, 172]
    uses: ./.github/workflows/_private-assurance-tlc-continuation-slice-v2.yml
    with:
      index: ${{ matrix.index }}
      segment: 1
      resume_run_id: ""
      resume_artifact: ""
      expected_workflow_sha: ""
    secrets: inherit
