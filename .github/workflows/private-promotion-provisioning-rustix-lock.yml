name: Private promotion provisioning committed rustix verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-promotion-provisioning-rustix-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 50b65b0205ad09dfe3065c40fd9c4d8b9112a6f243e0412720df9697d94f75e0
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 24a3088489cd53246f2f442cfb8b4a4b63a49b0ec3240e7153f1d4e1a8cbd165
  EXPECTED_CARGO_TOML_BLOB: 99b66f1797c8c9822c15b5cd2b3f16b5bdf2571d
  EXPECTED_CARGO_LOCK_BLOB: ef78a3ad9b3d90ca6bd51bc99dddd64fdc8e1bd9
  EXPECTED_LOCK_SHA256: 6471928369cda9c89fcaa71acc54f7dc0e0c84b16efa76cea9b61ce880977802

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust executor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Resolve exact committed private snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          resolved=""
          while read -r candidate; do
            proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$proof" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then
              test -z "$resolved"
              resolved="$candidate"
            fi
          done < <(git rev-list --max-count=64 FETCH_HEAD)
          test -n "$resolved"
          echo "::add-mask::$resolved"
          git checkout -q --detach "$resolved"
          test "$(git rev-parse HEAD)" = "$resolved"
          test "$(git hash-object Cargo.toml)" = "$EXPECTED_CARGO_TOML_BLOB"
          test "$(git hash-object Cargo.lock)" = "$EXPECTED_CARGO_LOCK_BLOB"
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_RUSTIX_COMMITTED_PRIVATE_SNAPSHOT_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          unset PRIVATE_TOKEN auth matched_ref resolved candidate proof ref_hash

      - name: Audit committed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 metadata --locked --format-version 1 >"$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          root = next(p for p in data['packages'] if p['name'] == 'living-assurance-system')
          direct = sorted((d['name'], d['req'], tuple(sorted(d['features'])), d['uses_default_features'], d.get('target')) for d in root['dependencies'])
          expected = [('rustix', '=1.1.5', ('fs', 'std'), False, 'cfg(target_os = "linux")')]
          if direct != expected:
              raise SystemExit(f'unexpected direct dependency graph: {direct!r}')
          third = sorted((p['name'], p['version'], p['source']) for p in data['packages'] if p['name'] != 'living-assurance-system')
          expected_pkgs = [('bitflags','2.13.2'),('errno','0.3.14'),('libc','0.2.190'),('linux-raw-sys','0.12.1'),('rustix','1.1.5'),('windows-link','0.2.1'),('windows-sys','0.61.2')]
          if [(n,v) for n,v,_ in third] != expected_pkgs:
              raise SystemExit(f'unexpected third-party graph: {third!r}')
          if any(source is None or not source.startswith('registry+') for _, _, source in third):
              raise SystemExit(f'non-registry dependency present: {third!r}')
          print('LAS_RUSTIX_COMMITTED_GRAPH=PASS')
          print('LAS_RUSTIX_COMMITTED_THIRD_PARTY_PACKAGE_COUNT=7')
          PY
          rm -f "$RUNNER_TEMP/metadata.json"

      - name: Strict committed snapshot gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_RUSTIX_COMMITTED_FORMAT=PASS'
          echo 'LAS_RUSTIX_COMMITTED_CHECK=PASS'
          echo 'LAS_RUSTIX_COMMITTED_CLIPPY=PASS'
          echo 'LAS_RUSTIX_COMMITTED_TESTS=PASS'
          echo 'LAS_RUSTIX_COMMITTED_BRIDGE=PASS'
