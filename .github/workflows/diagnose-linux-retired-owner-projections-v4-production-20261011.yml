name: Encrypted retired-owner projection production diagnostic v4

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-linux-retired-owner-projections-v4-production-20261011.yml"
      - "verification-requests/diagnose-linux-retired-owner-projections-v4-production-20261011.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 1fac30945223ebc9f0cc8e1bbadc2bffd24839393c448896663afd60ae943539
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 3e1858a0de2e48a7fa51968f00caa228b02cccce6c74c9d8b377b0b104f75bba
  EXPECTED_PRIVATE_TREE_PROOF: 5731bdeaab63de672f84f2133d3fed753dd6aa2a781078c6e716779b59aee004

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "OPAQUE_OWNER_PROJECTION_PROD_DIAG_RECOVERY=PASS"

      - name: Install exact production toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Select pinned Ada build tools
        shell: bash
        run: |
          set -euo pipefail
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          alr_bin="$(command -v alr)"; workspace="$RUNNER_TEMP/root-production-toolchain"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$gpr_wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_bin" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$gpr_wrapper"; "$gpr_wrapper" --version >/dev/null
          echo "GPRBUILD=$gpr_wrapper" >> "$GITHUB_ENV"

      - name: Emit only encrypted production compiler diagnostic
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          json="$RUNNER_TEMP/check.json"; stderr="$RUNNER_TEMP/check.stderr"; compact="$RUNNER_TEMP/diagnostic.json"
          set +e
          cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials" --message-format=json >"$json" 2>"$stderr"
          check_rc=$?
          set -e
          python3 - "$json" "$stderr" "$compact" "$check_rc" <<'PY'
          import json,sys
          json_path,stderr_path,out_path,check_rc=sys.argv[1:]
          messages=[]
          for line in open(json_path,encoding='utf-8',errors='replace'):
              try: item=json.loads(line)
              except Exception: continue
              if item.get('reason')!='compiler-message': continue
              msg=item.get('message') or {}
              if msg.get('level') not in {'error','warning'}: continue
              spans=[]
              for s in msg.get('spans') or []:
                  if s.get('is_primary'):
                      spans.append({'file':s.get('file_name'),'line':s.get('line_start'),'column':s.get('column_start'),'label':s.get('label')})
              messages.append({'level':msg.get('level'),'code':(msg.get('code') or {}).get('code'),'message':msg.get('message'),'spans':spans,'children':[{'level':c.get('level'),'message':c.get('message')} for c in (msg.get('children') or []) if c.get('level') in {'help','note'}]})
          with open(out_path,'w',encoding='utf-8') as f:
              json.dump({'check_rc':int(check_rc),'compiler_messages':messages,'cargo_stderr':open(stderr_path,encoding='utf-8',errors='replace').read()},f,ensure_ascii=False,separators=(',',':'))
          PY
          echo "OPAQUE_OWNER_PROJECTION_PROD_DIAG_SHA256=$(sha256sum "$compact" | awk '{print $1}')"
          key="$RUNNER_TEMP/diag.key"; openssl rand -hex 32 >"$key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass file:"$key" -in "$compact" -out "$RUNNER_TEMP/diagnostic.enc"
          cat >"$RUNNER_TEMP/public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAp+2F/SvFXf+OLMMGbiQ2
          Y1S14x+t6kyxSOHbQXvdyBfz7oGe/n379c1Y3ZJr0hB5TfZWk+pe1EOTbJeK9akX
          OwJ1LcBPk3+eZYy1nApdB0hkyQbsLJolWFvtTXjZ9AuS21TBJOaNtjFHK0bAfd+z
          xyuFCqzZQN8RIYHD/lxX2lp/Ts1LiY7wUrgcFgKBRuUGoUqzaB1T7oGc83YPRyc1
          BEzaO+PTHEE1V8qAfEIUbm/O/gcquK0MgDFmyxTSng3GOntq88DY2sWnwa2QR8Jj
          ZbfxZXGs3YZiNVre+ANlv3VHNOylh2bs9q+x/Ri3+VCGR8l+ZbKlELO7Kj7/h8hD
          o087bW8LtgJQaaRk3jeOd8+AWNpSKrC+SCJ34jPR2pBLzzgcbY8p2a0b9BC+IKHJ
          UFg7Fhiisyf8whh8pQshrjtp2lq1o4gpv/vi49OgxZ26gyQ5/hjLIs04E22CZxW2
          +OSkPRh90sUek5AerLfT6E2s2INf3ri6+Z18KIq8dlzxAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" -in "$key" -out "$RUNNER_TEMP/key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "OPAQUE_OWNER_PROJECTION_PROD_DIAG_KEY_B64=$(base64 -w0 "$RUNNER_TEMP/key.enc")"
          echo "OPAQUE_OWNER_PROJECTION_PROD_DIAG_DATA_B64=$(base64 -w0 "$RUNNER_TEMP/diagnostic.enc")"
          rm -f "$json" "$stderr" "$compact" "$key" "$RUNNER_TEMP/public.pem" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/diagnostic.enc"
