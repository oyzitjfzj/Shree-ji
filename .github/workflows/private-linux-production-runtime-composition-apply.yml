name: Private Linux production runtime composition apply

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-production-runtime-composition-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 1e1d58dc4adf26133cb4de7c8e2dffd04637ea011540d3dd71c8a5a4b0969311
  EXPECTED_HEAD_PROOF: 581a6fabd7705eaf8ab353ea07c8fb65bba5c8efe866f865bc4b62f0c0bab2ce
  EXPECTED_TREE_PROOF: 9d29f79235db9136f3c29ece35cf51ec50041e1510559fde8a4d1cd0b381e478

jobs:
  verify-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Install checksum-pinned Ada toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" \
            | sha256sum --check --strict
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Apply verify and commit exact private runtime composition
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          alr_bin="$(command -v alr)"
          test -x "$alr_bin"
          workspace="$RUNNER_TEMP/root-production-toolchain"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$gpr_wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_bin" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$gpr_wrapper"
          "$gpr_wrapper" --version >/dev/null
          export GPRBUILD="$gpr_wrapper"
          echo "GPRBUILD=$gpr_wrapper" >> "$GITHUB_ENV"
          echo 'LAS_PRODUCTION_RUNTIME_TOOLCHAIN=PASS'

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          echo "::add-mask::$write_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$start_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          start_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$start_tree"
          test "$(printf '%s' "$start_tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo 'LAS_PRODUCTION_RUNTIME_IDENTITY=PASS'

          patch_log="$RUNNER_TEMP/private-patch.log"
          set +e
          {
            python3 tools/tmp_apply_linux_production_runtime_composition.py
            python3 tools/tmp_refine_linux_production_runtime_composition.py
          } >"$patch_log" 2>&1
          patch_rc=$?
          set -e
          if [[ $patch_rc -ne 0 ]]; then
            echo 'LAS_PRODUCTION_RUNTIME_STAGE=private_patch'
            echo "LAS_PRODUCTION_RUNTIME_RC=$patch_rc"
            echo "LAS_PRODUCTION_RUNTIME_LOG_SHA256=$(sha256sum "$patch_log" | awk '{print $1}')"
            exit "$patch_rc"
          fi
          rm -f "$patch_log"
          echo 'LAS_PRODUCTION_RUNTIME_private_patch=PASS'

          fmt_apply_log="$RUNNER_TEMP/fmt-apply.log"
          set +e
          cargo +1.98.1 fmt --all >"$fmt_apply_log" 2>&1
          fmt_apply_rc=$?
          set -e
          if [[ $fmt_apply_rc -ne 0 ]]; then
            echo 'LAS_PRODUCTION_RUNTIME_STAGE=fmt_apply'
            echo "LAS_PRODUCTION_RUNTIME_RC=$fmt_apply_rc"
            echo "LAS_PRODUCTION_RUNTIME_LOG_SHA256=$(sha256sum "$fmt_apply_log" | awk '{print $1}')"
            exit "$fmt_apply_rc"
          fi
          rm -f "$fmt_apply_log"

          diff_log="$RUNNER_TEMP/diff-check.log"
          set +e
          git diff --check >"$diff_log" 2>&1
          diff_rc=$?
          set -e
          if [[ $diff_rc -ne 0 ]]; then
            echo 'LAS_PRODUCTION_RUNTIME_STAGE=diff_check'
            echo "LAS_PRODUCTION_RUNTIME_RC=$diff_rc"
            echo "LAS_PRODUCTION_RUNTIME_LOG_SHA256=$(sha256sum "$diff_log" | awk '{print $1}')"
            exit "$diff_rc"
          fi
          rm -f "$diff_log"

          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u >"$RUNNER_TEMP/actual-paths"
          cat >"$RUNNER_TEMP/allowed-paths" <<'EOF'
          src/effect_fabric/root_guarded_effect_service.rs
          src/effect_fabric/root_supervisor_linux_production_bootstrap.rs
          src/lib.rs
          tools/tmp_apply_linux_production_runtime_composition.py
          tools/tmp_refine_linux_production_runtime_composition.py
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/allowed-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/actual-paths" >/dev/null
          echo 'LAS_PRODUCTION_RUNTIME_SCOPE=PASS'

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"

          capture_private_failure() {
            local stage="$1"
            local log="$2"
            local diag_path="tools/tmp_production_runtime_${stage}_${GITHUB_RUN_ID}.log"
            cp "$log" "$diag_path"
            git add -- "$diag_path"
            git commit -q -m "Capture private Linux production runtime ${stage} diagnostic"
            local diag_ref="refs/heads/tmp/production-runtime-diagnostic-${GITHUB_RUN_ID}"
            git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$diag_ref"
            echo 'LAS_PRODUCTION_RUNTIME_PRIVATE_DIAGNOSTIC=CAPTURED'
          }

          run_gate() {
            local stage="$1"
            shift
            local log="$RUNNER_TEMP/${stage}.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_PRODUCTION_RUNTIME_STAGE=${stage}"
              echo "LAS_PRODUCTION_RUNTIME_RC=${rc}"
              echo "LAS_PRODUCTION_RUNTIME_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              capture_private_failure "$stage" "$log"
              exit "$rc"
            fi
            rm -f "$log"
            echo "LAS_PRODUCTION_RUNTIME_${stage}=PASS"
          }

          run_gate trust_contract python3 tools/verification/root_trust_input_contract.py
          run_gate fmt_check cargo +1.98.1 fmt --all -- --check
          run_gate base_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_gate production_lib_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --lib --features "root-ffi linux-peer-credentials"
          run_gate production_all_targets_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate production_clippy cargo +1.98.1 clippy --locked --all-targets --features "root-ffi linux-peer-credentials" -- -D warnings
          run_gate production_lib_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          run_gate production_integration_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features "root-ffi linux-peer-credentials" --tests -- --test-threads=1
          run_gate production_release_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate production_release_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=add'
          git add -A
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_ADD=PASS'

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=cached_diff_check'
          git diff --cached --check
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_CACHED_DIFF_CHECK=PASS'

          git diff --cached --name-only | sort >"$RUNNER_TEMP/staged-paths"
          if ! diff -u "$RUNNER_TEMP/actual-paths" "$RUNNER_TEMP/staged-paths" >/dev/null; then
            echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=staged_scope'
            echo "LAS_PRODUCTION_RUNTIME_EXPECTED_PATH_COUNT=$(wc -l < "$RUNNER_TEMP/allowed-paths")"
            echo "LAS_PRODUCTION_RUNTIME_ACTUAL_PATH_COUNT=$(wc -l < "$RUNNER_TEMP/actual-paths")"
            echo "LAS_PRODUCTION_RUNTIME_STAGED_PATH_COUNT=$(wc -l < "$RUNNER_TEMP/staged-paths")"
            echo "LAS_PRODUCTION_RUNTIME_ACTUAL_PATHS_SHA256=$(sha256sum "$RUNNER_TEMP/actual-paths" | awk '{print $1}')"
            echo "LAS_PRODUCTION_RUNTIME_STAGED_PATHS_SHA256=$(sha256sum "$RUNNER_TEMP/staged-paths" | awk '{print $1}')"
            exit 1
          fi
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGED_SCOPE=PASS'

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=local_commit'
          git commit -q -m "Compose concrete Linux production Root runtime"
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_LOCAL=PASS'

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=parent_check'
          test "$(git rev-parse HEAD^)" = "$start_sha"
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_PARENT=PASS'

          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$new_tree"

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=remote_compare'
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_REMOTE_COMPARE=PASS'

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=push'
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_PUSH=PASS'

          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_STAGE=post_read'
          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$post_sha" = "$new_sha"
          echo 'LAS_PRODUCTION_RUNTIME_COMMIT_POST_READ=PASS'
          echo 'LAS_PRODUCTION_RUNTIME_PRIVATE_COMMIT=PASS'
          echo "LAS_PRODUCTION_RUNTIME_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_PRODUCTION_RUNTIME_PRIVATE_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"
