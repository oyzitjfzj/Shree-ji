name: Encrypted current GNAT core diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_CURRENT_ENCRYPTED"

permissions:
  contents: read

concurrency:
  group: encrypted-current-gnat-core
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/root-a654-all-visible-probe
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_CURRENT_GNAT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Compile current Root core and encrypt diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd target

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-current-gnat"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_current_gnat >/dev/null
          )

          probe="$RUNNER_TEMP/root-core-current"
          mkdir -p "$probe/obj"
          cat > "$probe/root_authority_core_probe.ads" <<'EOF_PROBE'
          with Root_Authority;
          package Root_Authority_Core_Probe is
             package Core is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Core_Probe;
          EOF_PROBE
          cat > "$probe/core_probe.gpr" <<EOF_GPR
          project Core_Probe is
             for Source_Dirs use ("$GITHUB_WORKSPACE/target/src/root_authority", "$probe");
             for Object_Dir use "$probe/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Core_Probe;
          EOF_GPR

          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -f -p -P"$probe/core_probe.gpr" -cargs:Ada -gnatG -gnatd.n
          ) >"$RUNNER_TEMP/current-core-debug.log" 2>&1
          rc=$?
          set -e

          echo "LAS_CURRENT_GNAT_CORE_RC=$rc"
          if grep -q "GNAT BUG DETECTED" "$RUNNER_TEMP/current-core-debug.log"; then
            echo "LAS_CURRENT_GNAT_CORE_ICE=YES"
          else
            echo "LAS_CURRENT_GNAT_CORE_ICE=NO"
          fi
          echo "LAS_CURRENT_GNAT_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/current-core-debug.log" | awk '{print $1}')"

          bundle="$RUNNER_TEMP/current-gnat-private"
          mkdir -p "$bundle"
          cp "$RUNNER_TEMP/current-core-debug.log" "$bundle/core-debug.log"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          printf '%s\n' "$rc" > "$bundle/core.rc"
          tar -C "$bundle" -czf "$RUNNER_TEMP/current-gnat-private.tgz" .

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEOzCCAqOgAwIBAgIUDBZasai+Ovtq1ILg6TyIudQmRe4wDQYJKoZIhvcNAQEL
          BQAwLTErMCkGA1UEAwwiTEFTIGVwaGVtZXJhbCBHTkFUIGN1cnJlbnQgc2Vzc2lv
          bjAeFw0yNjA5MjAxNTAwNTdaFw0yNjA5MjIxNTAwNTdaMC0xKzApBgNVBAMMIkxB
          UyBlcGhlbWVyYWwgR05BVCBjdXJyZW50IHNlc3Npb24wggGiMA0GCSqGSIb3DQEB
          AQUAA4IBjwAwggGKAoIBgQDOhIl47xdFw2KivT30XRSlyaIP6nACSC0xFJQAZ/cM
          TyynbRt8/SSOEPXUX/JZ+PcUOQWMJuJHrw//DgoGTmr8/+a/6WNG0KZUKXCAVPdc
          LMUXGCn1fJ8zkKjs5lpcVGT/NAmgdY5C/euKjT4spWaTPc+YWyZLVubgvxpjz55S
          1YP7dIuD0o41Y1chFRxa0iBuyMcEifFEeIuF/DUFr7Bwb282hNwJOZXGcaMSgvU5
          CYRzQnKs96YQaynOFFXswrMRx8P1CC7uWpg8AVwyhXwnay4VjjzSudPHpEG1/eY9
          t/M2jXwDkL/mbR4Nc2/CCVJW6171RmEzhZMU05Yo2HOg3dqn+JGHNXJd/rxftWgp
          Onw1J7o478JFnk9xT38rXqnuchCTm30Txdb1O7Q7vgqAZh5cXUhJ2ppI7QkpoaVC
          ODtntb5HLXJZOl60L8pPvidsCR40/AOlw1xsvnotA5qyU9JY/u8z1yB5O8ZkGivL
          ZcvvqYzSTwarTsLUe3GbvdECAwEAAaNTMFEwHQYDVR0OBBYEFGVtm5uLBGMymlF4
          JlRUwfShrPfdMB8GA1UdIwQYMBaAFGVtm5uLBGMymlF4JlRUwfShrPfdMA8GA1Ud
          EwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAJqFgOcow36RtZM0WXk95kvT
          I2urUCEDzCS/9d9rGlY92wlqYTSBHvRbVdo2UWqnfXV7d6pwvnt5MXiIPCe31oPN
          5DErZqif0vQRe0CCCbQQGfE1oRl1ZiXgT9uvwceWLWz8lLtdRZsdRFMbve38ZQE4
          0arMaqIAuPwHEfIFAemLZ3fH06gzNMuoWVrfXIjs7V6Qd46MgDVzJT2hfKhy0EFa
          OFW58r832Iion+988aGiFTn9QSE1bUbkVv+LGMRc6qIX4hyqx1lz191Rx7f7tj9V
          bp2XVGrX32GmYmYltAt1sh3XcBAQLqvzvU6a49O7RI99Sb8gFI6AcY2nY1eos4Uh
          zEKPNICwmpOl14xm2daqZHpI0st7FNmNnvrnZnHaXvMTnv5CDikl4EN2MBOEYLkK
          RPGWTp7K6QtKlQW5H+wD+DP6Zf6okkyTzxKKE9rVbs6+SM5Aa5CvpCsZH35Xa5US
          rcvKmc+S0mHgUmPqPlVSTQkFD7Nf9mQGCsofXI/+ZA==
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "59:7C:77:6C:A9:10:5C:E1:2C:3B:73:CE:A0:1E:12:2A:D3:88:E3:30:BF:FB:E8:45:18:19:C8:F5:DF:79:89:9A"
          echo "LAS_CURRENT_GNAT_CERT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc             -outform DER             -in "$RUNNER_TEMP/current-gnat-private.tgz"             -out "$RUNNER_TEMP/current-gnat-private.cms"             "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/current-gnat-private.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_CURRENT_GNAT_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-gnat-core
          path: ${{ runner.temp }}/current-gnat-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
