name: Encrypted current GNAT core diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_GNAT_CURRENT_ENCRYPTED"

permissions:
  contents: read

concurrency:
  group: encrypted-current-gnat-core
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact private work snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin refs/heads/work/root-limited-handle-probe
          git checkout -q --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "LAS_CURRENT_GNAT_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Compile current Root core and encrypt diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd target

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3             --output "$ALR_ZIP"             "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-current-gnat"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_current_gnat >/dev/null
          )

          probe="$RUNNER_TEMP/root-core-current"
          mkdir -p "$probe/obj"
          cat > "$probe/root_authority_core_probe.ads" <<'EOF_PROBE'
          with Root_Authority;
          package Root_Authority_Core_Probe is
             package Core is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Core_Probe;
          EOF_PROBE
          cat > "$probe/core_probe.gpr" <<EOF_GPR
          project Core_Probe is
             for Source_Dirs use ("$GITHUB_WORKSPACE/target/src/root_authority", "$probe");
             for Object_Dir use "$probe/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Core_Probe;
          EOF_GPR

          set +e
          (
            cd "$ALR_WS"
            alr exec -- gprbuild -f -p -P"$probe/core_probe.gpr" -cargs:Ada -gnatG -gnatd.n
          ) >"$RUNNER_TEMP/current-core-debug.log" 2>&1
          rc=$?
          set -e

          echo "LAS_CURRENT_GNAT_CORE_RC=$rc"
          if grep -q "GNAT BUG DETECTED" "$RUNNER_TEMP/current-core-debug.log"; then
            echo "LAS_CURRENT_GNAT_CORE_ICE=YES"
          else
            echo "LAS_CURRENT_GNAT_CORE_ICE=NO"
          fi
          echo "LAS_CURRENT_GNAT_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/current-core-debug.log" | awk '{print $1}')"

          bundle="$RUNNER_TEMP/current-gnat-private"
          mkdir -p "$bundle"
          cp "$RUNNER_TEMP/current-core-debug.log" "$bundle/core-debug.log"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"
          printf '%s\n' "$rc" > "$bundle/core.rc"
          tar -C "$bundle" -czf "$RUNNER_TEMP/current-gnat-private.tgz" .

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEOzCCAqOgAwIBAgIUHwecJhMmRhS/Kkb96fbXCWFsElIwDQYJKoZIhvcNAQEL
          BQAwLTErMCkGA1UEAwwiTEFTIGVwaGVtZXJhbCBHTkFUIGN1cnJlbnQgc2Vzc2lv
          bjAeFw0yNjA5MjAxNDQ2MDJaFw0yNjA5MjIxNDQ2MDJaMC0xKzApBgNVBAMMIkxB
          UyBlcGhlbWVyYWwgR05BVCBjdXJyZW50IHNlc3Npb24wggGiMA0GCSqGSIb3DQEB
          AQUAA4IBjwAwggGKAoIBgQCxwOkhgAep06vnSX+8rrjB7Ed+TPhOtae8S8EsOP7l
          GdfCILfnjsWgmHKfLJgkJzj+1r3/seouN8Np7B5xzJVh0EglklCx9qMjmuBL4AfF
          N/asqIGGkL4dAtw0l/VW/Yg35l8r6OP8pc7JJF02t3ARiO+8Qcy2edvD+BdJ3IM5
          sNbZGOZ0X9F0dE/SacA6D28pt2kbducvMRTCfeT/hvXj8Enb4t/zBVqn3eWtXLGG
          Dr0/AyzDq8TDxMmsPJxgMGjabhCiwmyI6ssj5pQbkINMJRaHZoIq6QFp3UKPJWEZ
          4Fpd5CT3MuJwUJjuEdy08liHrXpQIe3f7b+zbp7kBYnXlpLvelHVI5BMrvw/S2SN
          /6wwyQjPmdt6YpgcoC1gLS4cJWabyquP509xk7z1cF644BoKC/z9PupjGq6um8IU
          HET2TKX/9+ZXexW6gLnvzx2Atvg3fzF9FRyBBJ9/f71oZ5o2xp4MJovmGKF9EHR+
          /m0RRq4G55mQCax6B6fD0f0CAwEAAaNTMFEwHQYDVR0OBBYEFIz1/tN75MjIyeuY
          8VifVowRZ69bMB8GA1UdIwQYMBaAFIz1/tN75MjIyeuY8VifVowRZ69bMA8GA1Ud
          EwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAJ0ImREg++R6wAQSU+/LNmqP
          2eEQnqkDQFfIx6ogPdzdLTtRpeS8cbfhFY+ms9umBevZm6nbnH3NGaZaXXUsXYLa
          vPWsrM8aKmCKDKSZgt4AB7ttXiPiJ7x1zwFGFGAHiL4kCxfUrr3s9t7jsMm+W8Q2
          lLUyuJYG5Itn+NY99gw7R55inkZqA+mVA7a9yBG9lWw0QiKt5U9OHKexW0UywXyg
          mSllkeLuQF+UX2ufJe2juE/r6uJE+zV8ds2wrxi10F/yDWe8W8jm3xVHPZC9C2i/
          U/ZZfvD3UB6v1PGqHezl42O99S1NRfnTuKHkOnnaJaUM6Zv3Z30fBAeUzufNtcLX
          jJ2wr4h38y+WzkrHkNckq3Tfqa03zX+jpBppN1kHiE9sUefFJbR3GN3tZi25xmpP
          ReiyMmqCRsNCZLTTvztjhLjDU+m/PTDvCLQzbK+rXM75G3pX64n2547rJj8YRrKm
          ZtsxYi8rIiePeYvzEQLMZc9oE5vKZtvRRYRWujPpHg==
          -----END CERTIFICATE-----
          EOF_CERT
          cert_fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$cert_fp" = "B8:05:13:32:87:44:BC:69:22:4B:3C:F2:35:7B:35:0C:85:73:AD:36:6D:43:C8:16:23:44:82:E9:94:80:51:98"
          echo "LAS_CURRENT_GNAT_CERT_OK=YES"
          openssl cms -encrypt -binary -aes-256-cbc             -outform DER             -in "$RUNNER_TEMP/current-gnat-private.tgz"             -out "$RUNNER_TEMP/current-gnat-private.cms"             "$RUNNER_TEMP/recipient-cert.pem"
          rm -rf "$bundle" "$RUNNER_TEMP/current-gnat-private.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "LAS_CURRENT_GNAT_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-current-gnat-core
          path: ${{ runner.temp }}/current-gnat-private.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
