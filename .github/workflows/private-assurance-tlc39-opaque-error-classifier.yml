name: Private assurance TLC39 opaque error classifier

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_OPAQUE_ERROR_CLASSIFIER"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  TARGET_REF_HASH: cfea257f56be059e1f6565654924f01a5dfec581efba0bb7672a59c550ca03c1
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4d3899116e8d3d3e18e8d32f7e5b7aa64e450a7260dc4ead84a4fdb7304c18c8
  EXPECTED_TLC_PROFILE_COUNT: "203"
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  PROFILE_CFG_HASH: 186ddf4cbea68ae055b349ed7bb808aad5ed0146b3618b99754efa46c735e092

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$matched"; matched="$ref"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched"; echo "::add-mask::$matched"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=32 origin "$matched"
          resolved=""
          while read -r c; do
            if [[ "$(printf '%s' "$c" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" ]]; then test -z "$resolved"; resolved="$c"; fi
          done < <(git rev-list --max-count=32 FETCH_HEAD)
          test -n "$resolved"; git checkout -q --detach "$resolved"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          echo "LAS_TLC39_CLASSIFIER_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched resolved c

      - name: Reproduce and classify canonical TLC runtime result
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"; cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $TLA_JAR" | sha1sum --check --strict >/dev/null
          python3 - tools/verify_codespaces_all.sh "$RUNNER_TEMP/map.py" <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r'python3 - "\$ROOT" > "\$TLC_MAP" <<\'PY\'\n(.*?)\nPY\n\nrun_tlc_profile\(\) \{',src,re.S)
          if not m: raise SystemExit(2)
          Path(sys.argv[2]).write_text(m.group(1)+'\n',encoding='utf-8')
          PY
          map="$RUNNER_TEMP/map.tsv"; python3 "$RUNNER_TEMP/map.py" "$ROOT" >"$map"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          line_no="$(python3 - "$map" "$PROFILE_CFG_HASH" <<'PY'
          import hashlib,pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(); h=sys.argv[2]; hits=[]
          for i,line in enumerate(lines):
              cfg=line.split('\t',1)[0]
              if hashlib.sha256(cfg.encode()).hexdigest()==h: hits.append(i+1)
          if len(hits)!=1: raise SystemExit(3)
          print(hits[0])
          PY
          )"
          line="$(sed -n "${line_no}p" "$map")"; IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -z "$expectation"
          cfg_dir="$(dirname "$cfg")"; cfg_base="$(basename "$cfg")"; tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/tlc.log"; args=(-workers auto -lncheck final -fp 0); [[ "$deadlock" == "1" ]] && args+=(-deadlock); args+=(-config "$cfg_base" "$tla_base")
          set +e
          (cd "$cfg_dir"; java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_TLC39_CLASSIFIER_RC=$rc"
          echo "LAS_TLC39_CLASSIFIER_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          python3 - "$log" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          codes=sorted(set(re.findall(r'@!@!@STARTMSG\s+([0-9]+):',t)),key=int)
          print('LAS_TLC39_CLASSIFIER_MSG_CODES=' + (','.join(codes) if codes else 'NONE'))
          classes=sorted(set(re.findall(r'\b((?:java|javax|tlc2|tla2sany|util)\.[A-Za-z0-9_.$]*(?:Exception|Error))\b',t)))
          safe=[]
          for c in classes:
              if len(c)<=160 and all(ch.isalnum() or ch in '._$' for ch in c): safe.append(c)
          print('LAS_TLC39_CLASSIFIER_EXCEPTION_CLASSES=' + (','.join(safe[:12]) if safe else 'NONE'))
          flags={
            'CONFIG':'configuration file', 'EVAL':'evaluat', 'INVARIANT':'Invariant ', 'PROPERTY':'Property ',
            'DEADLOCK':'Deadlock reached', 'INTERNAL':'unexpected exception', 'ASSERT':'AssertionError',
            'IO':'IOException', 'SPACE':'No space left on device', 'METADIR':'metadir',
            'LIVENESS':'liveness', 'TEMPORAL':'temporal', 'INITIAL':'initial state', 'SUCCESS':'Model checking completed'
          }
          for k,s in flags.items(): print(f'LAS_TLC39_CLASSIFIER_{k}=' + ('1' if s.lower() in t.lower() else '0'))
          print('LAS_TLC39_CLASSIFIER_LINE_COUNT='+str(t.count('\n')+1))
          print('LAS_TLC39_CLASSIFIER_BYTE_COUNT='+str(len(t.encode('utf-8',errors='replace'))))
          PY
          test "$rc" -ne 0
          echo "LAS_TLC39_CLASSIFIER_RESULT=CAPTURED"
