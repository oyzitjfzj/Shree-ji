name: Canonical exact current profile-39

on:
  push:
    branches: [verify/canonical-profile39-current-20261008]
    paths:
      - ".verification/canonical-profile39-current.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF_HASH: c9f987ee30c9e07dda494c4e53606bc62571c604bf2e786200c0f32f871f88c4
      EXPECTED_PRIVATE_SNAPSHOT_PROOF: d893f63ec5c6e07f1541691204a7e701ea7e435df45c3877ba4ffe1fbebb994f
      EXPECTED_PRIVATE_TREE_PROOF: 217826cd728dfe665a6aa3b3f53d961c7a56963ad44e9b1f5a966e1bc9975b1b
      EXPECTED_PROFILE39_RUNNER_BLOB: 5dace5ea82581f820a69f7df46d65ac1a7d34021
      EXPECTED_TLA_TOOLS_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
      EXPECTED_TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      EXPECTED_PREFIX_GENERATED_STATES: "16789249"
      EXPECTED_PREFIX_DISTINCT_STATES: "7063296"
    steps:
      - name: Recover exact current private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$RUNNER_TEMP/private-profile39-current"
          mkdir -p "$ROOT"; cd "$ROOT"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-profile39-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" == "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verification/run_candidate_assurance_profile39_compositional.sh)" == "$EXPECTED_PROFILE39_RUNNER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_PROFILE39_EXACT_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Fetch and authenticate TLA toolchain
        shell: bash
        run: |
          set -euo pipefail
          TLA_JAR="$RUNNER_TEMP/tla2tools-profile39-current.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
            --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          test "$(sha1sum "$TLA_JAR" | awk '{print $1}')" == "$EXPECTED_TLA_TOOLS_SHA1"
          test "$(sha256sum "$TLA_JAR" | awk '{print $1}')" == "$EXPECTED_TLA_TOOLS_SHA256"
          echo "LAS_CURRENT_PROFILE39_TOOLCHAIN=PASS"

      - name: Prove tampered toolchain fails closed
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-profile39-current"; cd "$ROOT"
          runner="tools/verification/run_candidate_assurance_profile39_compositional.sh"
          tampered="$RUNNER_TEMP/tla2tools-profile39-tampered.jar"
          cp "$RUNNER_TEMP/tla2tools-profile39-current.jar" "$tampered"
          printf 'tamper' >>"$tampered"
          log="$RUNNER_TEMP/profile39-negative-toolchain.log"
          set +e
          bash "$runner" "$tampered" "$RUNNER_TEMP/profile39-negative-toolchain" >"$log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'ERROR: unexpected TLA+ tools jar digest:' "$log"
          rm -f "$log" "$tampered"
          echo "LAS_CURRENT_PROFILE39_NEGATIVE_TOOLCHAIN=PASS"

      - name: Prove audited input drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-profile39-current"; cd "$ROOT"
          runner="tools/verification/run_candidate_assurance_profile39_compositional.sh"
          base="$(git rev-parse HEAD)"
          printf '\n\\* current-profile39-validation-only-drift\n' >> spec/defence_evolution/CandidateAssuranceEvidenceCase.cfg
          git add spec/defence_evolution/CandidateAssuranceEvidenceCase.cfg
          git -c user.name='Profile39 Validator' -c user.email='validator@invalid' commit -qm 'validation-only profile39 drift'
          log="$RUNNER_TEMP/profile39-negative-input.log"
          set +e
          bash "$runner" "$RUNNER_TEMP/tla2tools-profile39-current.jar" "$RUNNER_TEMP/profile39-negative-input" >"$log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'ERROR: audited profile-39 input drift:' "$log"
          git reset --hard -q "$base"
          rm -f "$log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_PROFILE39_NEGATIVE_INPUT_DRIFT=PASS"

      - name: Run full current triple-fingerprint compositional closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-profile39-current"; cd "$ROOT"
          runner="tools/verification/run_candidate_assurance_profile39_compositional.sh"
          log="$RUNNER_TEMP/profile39-current-full.log"
          bash -n "$runner"
          bash "$runner" "$RUNNER_TEMP/tla2tools-profile39-current.jar" "$RUNNER_TEMP/profile39-current-scratch" 2>&1 | tee "$log"
          grep -qx 'LAS_PROFILE39_TLA_TOOLS_PIN=PASS' "$log"
          grep -qx 'LAS_PROFILE39_AUDITED_INPUT_BLOBS=PASS' "$log"
          grep -qx 'LAS_PROFILE39_AUDITED_INPUT_SHA256=PASS' "$log"
          grep -qx 'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP0=PASS' "$log"
          grep -qx 'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP1=PASS' "$log"
          grep -qx 'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP130=PASS' "$log"
          grep -qx "LAS_PROFILE39_SAFETY_PREFIX_GENERATED_STATES=$EXPECTED_PREFIX_GENERATED_STATES" "$log"
          grep -qx "LAS_PROFILE39_SAFETY_PREFIX_DISTINCT_STATES=$EXPECTED_PREFIX_DISTINCT_STATES" "$log"
          grep -qx 'LAS_PROFILE39_SAFETY_PREFIX_TRIPLE_FP_CONSISTENCY=PASS' "$log"
          grep -qx 'LAS_PROFILE39_SAFETY_PREFIX_TLC=PASS' "$log"
          grep -qx 'LAS_PROFILE39_COMPOSITIONAL_CLOSURE=PASS' "$log"
          python3 - "$log" "$EXPECTED_PREFIX_GENERATED_STATES" "$EXPECTED_PREFIX_DISTINCT_STATES" <<'PY'
          import re, sys
          text=open(sys.argv[1],encoding='utf-8').read()
          expected=(int(sys.argv[2]),int(sys.argv[3]))
          counts={}
          markers={0:'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP0=PASS',1:'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP1=PASS',130:'LAS_PROFILE39_SAFETY_PREFIX_TLC_FP130=PASS'}
          for fp in (0,1,130):
              start=f"========== TLC profile-39 exhaustive safety prefix (fp={fp}) =========="
              if text.count(start)!=1: raise SystemExit(f"missing/duplicate fp={fp} section")
              section=text.split(start,1)[1].split(markers[fp],1)[0]
              matches=re.findall(r"([0-9,]+) states generated, ([0-9,]+) distinct states found, 0 states left on queue\.",section)
              if len(matches)!=1: raise SystemExit(f"ambiguous state counts fp={fp}")
              counts[fp]=tuple(int(x.replace(',','')) for x in matches[0])
              if counts[fp]!=expected: raise SystemExit(f"unexpected state counts fp={fp}: {counts[fp]}")
          if len(set(counts.values()))!=1: raise SystemExit(f"fingerprint count mismatch: {counts}")
          print(f"LAS_CURRENT_PROFILE39_TRIPLE_FP_STATE_COUNTS={expected[0]},{expected[1]}")
          print("LAS_CURRENT_PROFILE39_TRIPLE_FP_STATESET_CONSISTENCY=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -f "$log"
          echo "LAS_CURRENT_PROFILE39_FULL_VALIDATION=PASS"
